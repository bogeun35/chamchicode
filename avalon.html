<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참스코드 아발론</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --cream: #fff3d6; --ink: #2a2118; --wood: #8a5a2b; --wood-dark: #4a2f6b; --gold: #ffd36b; --good: #3b82f6; --good-dark: #1f4fa8; --evil: #e5484d; --evil-dark: #9c2329; --night: #1b1440; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: #fff; -webkit-user-select: none; user-select: none; min-height: 100vh; overflow-x: hidden;
  background: radial-gradient(ellipse at 50% 0%, #4b3a8c 0%, #2a1f5c 45%, var(--night) 100%) fixed; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background:
  radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.55), transparent), radial-gradient(1.5px 1.5px at 78% 12%, rgba(255,255,255,.45), transparent),
  radial-gradient(2px 2px at 64% 38%, rgba(255,255,255,.35), transparent), radial-gradient(1.5px 1.5px at 30% 62%, rgba(255,255,255,.3), transparent),
  radial-gradient(2px 2px at 88% 70%, rgba(255,255,255,.35), transparent); }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px); z-index: 95; background: var(--cream); color: var(--ink); padding: 10px 22px; border-radius: 999px; font-size: 15px; box-shadow: 0 6px 0 var(--wood-dark), 0 10px 20px rgba(0,0,0,.3); opacity: 0; transition: all .25s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.screen { display: none; max-width: 560px; margin: 0 auto; padding: 14px 12px 60px; position: relative; }
.screen.active { display: block; }
.title { text-align: center; margin: 24px 0 4px; font-size: 38px; text-shadow: 3px 3px 0 #120b30; }
.sub { text-align: center; opacity: .9; font-size: 15px; margin-bottom: 18px; }
.card { background: var(--cream); color: var(--ink); border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 4px solid #fff; box-shadow: 0 6px 0 var(--wood-dark), 0 12px 24px rgba(0,0,0,.3); }
.card h3 { font-size: 15px; color: #6a4a8a; margin-bottom: 10px; }
.input { width: 100%; padding: 12px 14px; border: 3px solid #e6c58f; border-radius: 12px; font-size: 18px; font-family: inherit; color: var(--ink); background: #fff; outline: none; }
.input:focus { border-color: #8a6ab8; }
.row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { padding: 11px 18px; border: 3px solid #fff; border-radius: 999px; font-family: inherit; font-size: 16px; cursor: pointer; background: #ff7b5e; color: #fff; box-shadow: 0 4px 0 #c9502e; transition: transform .08s; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9502e; }
.btn.green { background: #5cb85c; box-shadow: 0 4px 0 #3a7f3a; } .btn.green:active { box-shadow: 0 1px 0 #3a7f3a; }
.btn.blue { background: #4a8fdf; box-shadow: 0 4px 0 #2b5f9e; } .btn.blue:active { box-shadow: 0 1px 0 #2b5f9e; }
.btn.purple { background: #8a6ab8; box-shadow: 0 4px 0 #5a3f85; } .btn.purple:active { box-shadow: 0 1px 0 #5a3f85; }
.btn.red { background: var(--evil); box-shadow: 0 4px 0 var(--evil-dark); } .btn.red:active { box-shadow: 0 1px 0 var(--evil-dark); }
.btn.ghost { background: rgba(255,255,255,.15); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); font-size: 14px; padding: 8px 14px; } .btn.ghost:active { box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.light { background: #fff; color: #6a4a8a; box-shadow: 0 4px 0 #b8a0d8; font-size: 14px; padding: 8px 14px; } .btn.light:active { box-shadow: 0 1px 0 #b8a0d8; }
.btn.wide { width: 100%; } .btn:disabled { opacity: .45; cursor: default; transform: none; }
.code-big { font-family: monospace; font-size: 34px; letter-spacing: .25em; text-align: center; color: #4a2f6b; margin: 6px 0; font-weight: bold; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 7px 12px; border-radius: 999px; background: #fff; border: 2px solid #e6c58f; font-size: 14px; cursor: pointer; color: var(--ink); min-height: 36px; display: inline-flex; align-items: center; gap: 4px; }
.chip.on { background: #6a4a8a; color: #fff; border-color: #fff; }
.chip.lock { cursor: default; }
.setnote { font-size: 13px; color: #6a4a8a; margin-top: 8px; line-height: 1.5; }

/* 게임 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
.pill { background: rgba(0,0,0,.3); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
.tracks { display: flex; align-items: center; gap: 6px; justify-content: center; margin: 4px 0 8px; }
.qd { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.35); }
.qd small { position: absolute; bottom: -6px; right: -6px; background: var(--gold); color: var(--ink); border-radius: 999px; font-size: 10px; padding: 1px 5px; border: 2px solid #fff; }
.qd.now { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255,211,107,.35); animation: pulse 1.4s ease-in-out infinite alternate; }
@keyframes pulse { to { box-shadow: 0 0 0 8px rgba(255,211,107,.12); } }
.qd.s { background: var(--good); border-color: #cfe0fb; } .qd.f { background: var(--evil); border-color: #f6c7c9; }
.rej { display: flex; gap: 4px; justify-content: center; align-items: center; font-size: 12.5px; opacity: .9; margin-bottom: 6px; }
.rej i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.2); display: inline-block; }
.rej i.on { background: var(--evil); box-shadow: 0 0 0 2px rgba(255,255,255,.6); }
.banner { text-align: center; font-size: 16px; padding: 9px 12px; border-radius: 14px; margin: 2px 0 8px; background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.15); }
.banner.hot { background: var(--gold); color: var(--ink); border-color: #fff; animation: glow 1.2s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 0 3px rgba(255,211,107,.25); } to { box-shadow: 0 0 0 8px rgba(255,211,107,.5); } }
.round { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1 / .86; margin: 0 auto 6px; }
.round::before { content: ''; position: absolute; left: 14%; right: 14%; top: 15%; bottom: 15%; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #6b4a2b, #3e2a18); box-shadow: inset 0 0 0 6px #8a6238, 0 10px 30px rgba(0,0,0,.4); }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 52%; pointer-events: none; }
.center b { display: block; font-size: 22px; color: var(--gold); text-shadow: 2px 2px 0 #2a1808; }
.center span { font-size: 13px; opacity: .9; }
.seat { position: absolute; width: 70px; transform: translate(-50%, -50%); text-align: center; cursor: default; }
.seat .av { position: relative; width: 48px; height: 48px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: #ffe6bf; border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.3); transition: transform .12s; }
.seat .nm { font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 0 rgba(0,0,0,.5); }
.seat.me .nm { color: var(--gold); }
.seat.pickable { cursor: pointer; }
.seat.pickable .av { box-shadow: 0 0 0 3px rgba(255,211,107,.55), 0 3px 0 rgba(0,0,0,.3); }
.seat.picked .av { background: #fff3a8; border-color: var(--gold); transform: scale(1.08); }
.seat .crown { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 17px; filter: drop-shadow(0 1px 0 #fff); }
.seat .sword { position: absolute; bottom: -6px; right: -8px; font-size: 16px; background: #fff; border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.seat .done { position: absolute; top: -4px; right: -6px; font-size: 11px; background: #5cb85c; color: #fff; border-radius: 999px; padding: 1px 5px; border: 2px solid #fff; }
.seat .vt { position: absolute; top: -4px; left: -8px; font-size: 16px; }
.seat .know { position: absolute; bottom: -4px; left: -10px; font-size: 10.5px; border-radius: 999px; padding: 1px 5px; border: 2px solid #fff; color: #fff; background: var(--evil); white-space: nowrap; }
.seat .know.mer { background: #8a6ab8; }
.seat.off .av { filter: grayscale(.7); opacity: .6; }
.panel { background: var(--cream); color: var(--ink); border-radius: 20px; padding: 14px; border: 4px solid #fff; box-shadow: 0 6px 0 var(--wood-dark), 0 12px 24px rgba(0,0,0,.3); margin-bottom: 10px; }
.panel h3 { font-size: 16px; color: #4a2f6b; margin-bottom: 8px; text-align: center; }
.panel p { font-size: 14px; line-height: 1.5; color: #5a4a3a; text-align: center; }
.panel .row { justify-content: center; }
.panel .names { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 8px 0; }
.panel .names span { background: #fff; border: 2px solid #e6c58f; border-radius: 999px; padding: 4px 10px; font-size: 14px; }
.big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.big2 .btn { font-size: 20px; padding: 16px 8px; border-radius: 18px; }
.big2 .btn.sel { outline: 4px solid var(--gold); outline-offset: 2px; }
.qcard { font-size: 20px; padding: 18px 8px; }
.log { background: rgba(0,0,0,.28); border-radius: 12px; padding: 6px 12px; font-size: 13px; line-height: 1.5; opacity: .95; }
.log div:first-child { color: var(--gold); }
.mybar { display: flex; justify-content: center; margin: 4px 0 10px; }
.peek { border: 3px dashed rgba(255,255,255,.5); border-radius: 999px; padding: 9px 18px; background: rgba(0,0,0,.25); color: #fff; font-family: inherit; font-size: 15px; cursor: pointer; touch-action: none; }

/* 역할 카드 */
.rolecard { position: relative; border-radius: 18px; padding: 16px 14px; text-align: center; min-height: 170px; overflow: hidden; }
.rolecard.good { background: linear-gradient(180deg, #e8f0ff, #cfe0fb); border: 3px solid var(--good); }
.rolecard.evil { background: linear-gradient(180deg, #ffe8e8, #f6c7c9); border: 3px solid var(--evil); }
.rolecard .ic { font-size: 54px; line-height: 1.1; }
.rolecard .rn { font-size: 24px; margin: 4px 0 2px; }
.rolecard .side { font-size: 14px; margin-bottom: 6px; }
.rolecard.good .side { color: var(--good-dark); } .rolecard.evil .side { color: var(--evil-dark); }
.rolecard .ds { font-size: 13.5px; color: #5a4a3a; line-height: 1.5; }
.rolecard .kn { margin-top: 8px; font-size: 14px; background: rgba(255,255,255,.7); border-radius: 12px; padding: 8px; line-height: 1.6; }
.veil { position: absolute; inset: 0; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #fff; font-size: 19px; cursor: pointer; touch-action: none;
  background: repeating-linear-gradient(45deg, #5a3f85, #5a3f85 14px, #6a4a95 14px, #6a4a95 28px); }
.veil small { font-size: 12.5px; opacity: .85; }
.peekov { position: fixed; inset: 0; z-index: 85; pointer-events: none; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(10,6,30,.75); }
.peekov.show { display: flex; }
.peekov .rolecard { width: 100%; max-width: 360px; }

/* 결과 연출 */
.ov { position: fixed; inset: 0; z-index: 88; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(10,6,30,.82); }
.ov.show { display: flex; }
.ov .box { width: 100%; max-width: 420px; background: var(--cream); color: var(--ink); border-radius: 22px; border: 4px solid #fff; padding: 18px 14px; text-align: center; box-shadow: 0 8px 0 var(--wood-dark); animation: pop .25s ease; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.ov h2 { font-size: 26px; margin-bottom: 10px; }
.ov .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.ov .vgrid div { background: #fff; border-radius: 12px; padding: 6px 4px; font-size: 13px; border: 2px solid #eadcc0; }
.ov .vgrid div.y { border-color: #5cb85c; } .ov .vgrid div.n { border-color: var(--evil); }
.ov .vgrid b { display: block; font-size: 20px; }
.ov .cards { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 6px 0 10px; perspective: 600px; }
.ov .qc { width: 62px; height: 86px; border-radius: 12px; display: grid; place-items: center; font-size: 30px; background: repeating-linear-gradient(45deg, #5a3f85, #5a3f85 8px, #6a4a95 8px, #6a4a95 16px); border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); transition: transform .35s; }
.ov .qc.s { background: linear-gradient(180deg, #e8f0ff, #9cc3ff); } .ov .qc.f { background: linear-gradient(180deg, #ffe8e8, #ff9a9d); }
.ov .qc.flip { animation: flipc .45s ease; }
@keyframes flipc { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
.ov .tap { font-size: 12.5px; color: #8a6ab8; margin-top: 10px; }

/* 결과 화면 */
.winbox { text-align: center; padding: 22px 10px; }
.winbox h1 { font-size: 34px; margin-bottom: 8px; }
.winbox .reason { font-size: 16px; color: #5a4a3a; line-height: 1.5; }
.rolelist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.rolelist div { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 12px; padding: 7px 8px; font-size: 14px; border: 2px solid #cfe0fb; min-width: 0; }
.rolelist div.evil { border-color: #f6c7c9; background: #fff6f6; }
.rolelist div span:last-child { margin-left: auto; font-size: 12.5px; white-space: nowrap; }
.rolelist .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #ffe6bf; flex: none; }
.rolelist .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 규칙 */
.howto { display: flex; flex-direction: column; gap: 12px; }
.step { background: #fff; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.step .no { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #4a2f6b; color: #fff; display: grid; place-items: center; font-size: 16px; }
.step h4 { font-size: 16px; color: #4a2f6b; margin-bottom: 4px; }
.step p { font-size: 13.5px; line-height: 1.55; color: #5a4a3a; } .step p b { color: #c0392b; } .step p b.g { color: var(--good-dark); }
.rtab { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; color: #5a4a3a; }
.rtab td, .rtab th { border: 1px solid #eadcc0; padding: 4px; text-align: center; }
.rtab th { background: #f4ecdc; font-weight: normal; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 80; padding: 14px; }
.modal.show { display: flex; }
.modal .card { width: 100%; max-width: 460px; margin: 0; max-height: 88vh; overflow-y: auto; }
.confetti { position: fixed; top: -20px; font-size: 22px; animation: fall linear forwards; pointer-events: none; z-index: 89; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }

#joinCode::placeholder, #nick::placeholder { font-family: 'Jua', 'Malgun Gothic', sans-serif; letter-spacing: normal; text-transform: none; color: #b8a58a; }
#joinCode { font-family: monospace; letter-spacing: .2em; text-transform: uppercase; }
@media (max-width: 480px) {
  .title { font-size: 32px; }
  .qd { width: 40px; height: 40px; font-size: 16px; }
  .seat { width: 62px; }
  .seat .av { width: 42px; height: 42px; font-size: 22px; }
  .seat .nm { font-size: 11.5px; }
  .center b { font-size: 19px; }
  .big2 .btn { font-size: 18px; padding: 14px 6px; }
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- 홈 -->
<section class="screen active" id="home">
  <div class="title">🏰 아발론</div>
  <div class="sub">숨은 악당을 찾아라 · 5~10명 · 원정대 정체 추리</div>
  <div class="card"><h3>닉네임</h3><input class="input" id="nick" placeholder="닉네임 (2~8자)" maxlength="8"><div class="row"><button class="btn green wide" id="btnCreate">방 만들기</button></div></div>
  <div class="card"><h3>코드로 참가</h3><input class="input" id="joinCode" placeholder="6자리 코드" maxlength="6"><div class="row"><button class="btn blue wide" id="btnJoin">참가하기</button></div></div>
  <div class="card"><h3>❓ 어떻게 하나요? — 5분이면 배워요</h3><div class="howto" id="howtoHome"></div></div>
</section>

<!-- 대기실 -->
<section class="screen" id="lobby">
  <div class="title" style="font-size:28px;margin-top:10px">대기실</div>
  <div class="card" style="text-align:center"><h3>방 코드 — 친구에게 알려주세요</h3><div class="code-big" id="lobbyCode">------</div>
    <div class="row" style="justify-content:center"><button class="btn blue" id="btnCopyLink">🔗 링크 복사</button><button class="btn light" id="btnCopyCode">코드 복사</button></div></div>
  <div class="card"><h3>🎭 역할 설정 <span style="opacity:.6;font-size:12px" id="setWho"></span></h3><div class="chips" id="roleChips"></div><div class="setnote" id="setNote"></div></div>
  <div id="lobbyBox"></div>
  <div class="row"><button class="btn ghost wide" id="btnLeaveLobby">나가기</button></div>
</section>

<!-- 게임 -->
<section class="screen" id="game">
  <div class="top">
    <div class="pill">방 <b id="gameCode"></b></div>
    <div class="pill" id="qPill">원정 1</div>
    <button class="btn ghost" id="btnRules">❓ 규칙</button>
    <button class="btn ghost" id="btnLeaveGame">⏸ 메뉴</button>
  </div>
  <div class="tracks" id="tracks"></div>
  <div class="rej" id="rej"></div>
  <div class="banner" id="banner"></div>
  <div class="round" id="round"></div>
  <div class="mybar"><button class="peek" id="btnPeek">🎭 내 역할 — 꾹 누르기</button></div>
  <div class="panel" id="panel"></div>
  <div class="log" id="log"></div>
</section>

<!-- 결과 -->
<section class="screen" id="end">
  <div class="card winbox"><h1 id="winTitle">🏆</h1><p class="reason" id="winText"></p></div>
  <div class="card"><h3>🎭 모두의 정체</h3><div class="rolelist" id="roleList"></div></div>
  <div class="row" id="endHost"><button class="btn green wide" id="btnAgain">🔁 같은 멤버로 다시</button><button class="btn purple wide" id="btnToLobby">🪑 대기실로</button></div>
  <div style="text-align:center;font-size:14px;margin-top:10px;opacity:.9" id="endHint"></div>
  <div class="row"><button class="btn ghost wide" id="btnLeaveEnd">나가기</button></div>
</section>

<div class="modal" id="rulesModal"><div class="card"><h3>❓ 어떻게 하나요?</h3><div class="howto" id="howtoModal"></div><button class="btn green wide" style="margin-top:12px" id="rulesClose">알겠어요!</button></div></div>
<div class="peekov" id="peekov"><div class="rolecard" id="peekCard"></div></div>
<div class="ov" id="ov"><div class="box" id="ovBox"></div></div>

<script src="party-ux.js"></script>
<script src="party-lobby.js"></script>
<script src="party-sound.js"></script><script>Sound.theme('mystery')</script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>

const db = firebase.database();
const rpath = c => `games/av_${c}`;   // 규칙상 열린 경로(games/) 아래 av_ 접두

// ── 유틸 ──
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const sanitizeKey = s => s.replace(/[.#$/\[\]]/g, '_');

// ── 규칙 데이터 (레지스탕스: 아발론 공식 인원표) ──

const sideOf = r => ROLES[r] ? ROLES[r].side : 'good';
function specialEvil(set) { return (set.merlin ? 1 : 0) + (set.morgana ? 1 : 0) + (set.mordred ? 1 : 0) + (set.oberon ? 1 : 0); }

function knowledge(g, me) {

  if (r === 'percival') return kn.length ? `👁 멀린 후보: <b>${kn.map(x => nm(x.k)).join(', ')}</b>${kn.length > 1 ? '<br><small>둘 중 하나는 모르가나예요</small>' : ''}` : '👁 멀린이 없는 판이에요';

// ── 방 구독 ──

// ── 게임 시작 ──
// 자리 순서 (대기실과 같은 기준: 자리 섞기 번호 → 들어온 순서). 대기실을 안 거쳐도 쓸 수 있게 방 데이터에서 직접
function seatList() { return Object.entries(room.players || {}).map(([k, p]) => Object.assign({ k }, p)).sort((a, b) => ((a.seat == null ? 1e15 : a.seat) - (b.seat == null ? 1e15 : b.seat)) || ((a.joinedAt || 0) - (b.joinedAt || 0))); }
function startGame() {
  const ps = seatList(), n = ps.length;
  if (n < 5 || n > 10) return toast('5~10명이 필요해요');
  const set = Object.assign({}, DEF_SET, room.settings), ne = EVIL_N[n], ng = n - ne;
  if (specialEvil(set) > ne) return toast(`악당이 ${ne}명뿐이라 악역을 줄여 주세요`);
  const evil = [], good = [];
  if (set.merlin) { evil.push('assassin'); good.push('merlin'); }
  if (set.morgana) evil.push('morgana'); if (set.mordred) evil.push('mordred'); if (set.oberon) evil.push('oberon');
  if (set.percival) good.push('percival');
  while (evil.length < ne) evil.push('minion');
  while (good.length < ng) good.push('loyal');

  order.forEach((k, i) => roles[k] = deck[i]);
  const li = order.findIndex(k => room.players[k] && room.players[k].lead);
  const game = { round: ((G() && G().round) || 0) + 1, order, roles, set, seen: {}, phase: 'roles', quest: 0, results: [], leader: li >= 0 ? li : Math.floor(Math.random() * n),
    rejects: 0, pick: [], votes: {}, qcards: {}, winner: null, log: [`🏰 ${n}명 · 선 ${ng} vs 악 ${ne} — 역할을 확인하세요`] };
  roomRef().update({ status: 'playing', game, expiresAt: Date.now() + 3 * 3600e3 });
}
$('btnAgain').onclick = () => { if (!isHost) return toast('방장만 다시 시작할 수 있어요'); startGame(); };
$('btnToLobby').onclick = () => LB.toLobby();

// ── 진행 (모든 전환은 트랜잭션: 마지막으로 행동한 사람이 다음 단계로 넘김 — 방장이 없어도 굴러감) ──

function addLog(g, t) { g.log = [t, ...(g.log || [])].slice(0, 12); }
const leaderKey = g => g.order[g.leader % g.order.length];
const qsize = g => QSIZE[g.order.length][g.quest];

function nextLeader(g) { g.leader = (g.leader + 1) % g.order.length; g.pick = []; g.votes = {}; g.phase = 'propose'; }
function confirmRole() { act(g => { if (g.phase !== 'roles') return false; g.seen[myKey] = true; if (g.order.every(k => g.seen[k])) { g.phase = 'propose'; addLog(g, `👑 ${nickOf(leaderKey(g))} 님이 첫 원정대장이에요`); } }); Sound.play('correct'); }
function forceStart() { act(g => { if (g.phase !== 'roles') return false; g.phase = 'propose'; addLog(g, `👑 ${nickOf(leaderKey(g))} 님이 첫 원정대장이에요`); }); }
function togglePick(k) {
  const g = G(); if (!g || g.phase !== 'propose' || leaderKey(g) !== myKey) return;
  const pick = [...(g.pick || [])], i = pick.indexOf(k);
  if (i >= 0) pick.splice(i, 1); else { if (pick.length >= qsize(g)) return toast(`이번 원정은 ${qsize(g)}명이에요 — 먼저 한 명을 빼 주세요`); pick.push(k); }
  roomRef().child('game/pick').set(pick); Sound.play('tap');
}
function propose() {
  act(g => { if (g.phase !== 'propose' || leaderKey(g) !== myKey || g.pick.length !== qsize(g)) return false; g.phase = 'vote'; g.votes = {}; addLog(g, `⚔️ ${nickOf(myKey)}: ${g.pick.map(nickOf).join(', ')} 원정대 제안`); });
  Sound.play('submit');
}
function vote(yes) {
  const g = G(); if (!g || g.phase !== 'vote') return;
  roomRef().child('game/votes/' + myKey).set(!!yes).then(resolveVote); Sound.play('vote');
}
function resolveVote() {
  act(g => {
    if (g.phase !== 'vote' || !g.order.every(k => k in g.votes)) return false;
    const yes = g.order.filter(k => g.votes[k]).length, ok = yes * 2 > g.order.length;
    g.lastVote = { id: Date.now() + '' + Math.random().toString(36).slice(2, 6), votes: g.votes, ok, pick: g.pick, leader: leaderKey(g), yes, no: g.order.length - yes, rejects: ok ? g.rejects : g.rejects + 1 };
    if (ok) { g.phase = 'quest'; g.qcards = {}; g.rejects = 0; addLog(g, `✅ 가결 (${yes}:${g.order.length - yes}) — 원정 출발!`); }
    else {
      g.rejects++; addLog(g, `❌ 부결 (${yes}:${g.order.length - yes}) — 부결 ${g.rejects}/5`);
      if (g.rejects >= 5) { g.winner = 'evil'; g.reason = '원정대 제안이 5번 연속 부결됐어요 — 혼란 속에 악의 승리!'; }
      else nextLeader(g);
    }
  });
}
function playCard(c) {
  const g = G(); if (!g || g.phase !== 'quest' || !g.pick.includes(myKey)) return;
  if (c === 'f' && sideOf(g.roles[myKey]) === 'good') return toast('선의 세력은 성공 카드만 낼 수 있어요');
  roomRef().child('game/qcards/' + myKey).set(c).then(resolveQuest); Sound.play('flip');
}
function resolveQuest() {
  act(g => {
    if (g.phase !== 'quest' || !g.pick.every(k => g.qcards[k])) return false;

  <div class="step"><div class="no">1</div><div><h4>몰래 받는 역할</h4><p><b class="g">선의 세력</b>과 <b>악의 세력</b>으로 나뉘어요. 악당끼리는 서로 알아요. 선 중 <b class="g">멀린</b>🧙은 악당을 알지만 들키면 안 돼요.</p></div></div>
  <div class="step"><div class="no">2</div><div><h4>원정대장이 원정대를 제안</h4><p>👑 원정대장이 정해진 인원을 골라요. 모두 <b>찬성/반대</b> 투표 → 과반 찬성이면 출발, 부결이면 원정대장이 다음 사람에게. <b>5번 연속 부결</b>되면 악의 승리.</p></div></div>
  <div class="step"><div class="no">3</div><div><h4>원정 — 카드를 몰래</h4><p>원정대만 <b class="g">✨ 성공</b> / <b>💀 실패</b> 카드를 내요. 선은 성공만 낼 수 있어요. 실패가 1장이라도 섞이면 원정 실패! (7명 이상의 4번째 원정은 2장)</p></div></div>
  <div class="step"><div class="no">4</div><div><h4>먼저 3번</h4><p>원정 3번 성공 → <b class="g">선 승리</b>… 단, 마지막에 <b>🗡️ 암살자</b>가 멀린을 찍어 맞히면 악의 역전승! 원정 3번 실패 → <b>악 승리</b>.</p></div></div>
  <div class="step"><div class="no">🎭</div><div><h4>추가 역할 (대기실에서 켜기)</h4><p>🛡️ <b class="g">퍼시벌</b>: 멀린 후보 둘이 보임 · 🔮 <b>모르가나</b>: 퍼시벌에게 멀린처럼 보임 · 👿 <b>모드레드</b>: 멀린에게 안 보임 · 🌑 <b>오베론</b>: 악끼리도 모름</p></div></div>
  <div class="step"><div class="no">👥</div><div style="flex:1"><h4>인원표</h4><table class="rtab"><tr><th>인원</th><th>선:악</th><th>원정 인원</th></tr>${[5, 6, 7, 8, 9, 10].map(n => `<tr><td>${n}</td><td>${n - EVIL_N[n]}:${EVIL_N[n]}</td><td>${QSIZE[n].join('·')}</td></tr>`).join('')}</table></div></div>`;
}
$('btnRules').onclick = () => $('rulesModal').classList.add('show');
$('rulesClose').onclick = () => $('rulesModal').classList.remove('show');
$('rulesModal').onclick = e => { if (e.target === $('rulesModal')) $('rulesModal').classList.remove('show'); };
window.avalon = { get room() { return room; }, get me() { return myKey; }, roomRef: () => roomRef(), ROLES, QSIZE, EVIL_N, knowledge };
</script>
</body>
</html>
