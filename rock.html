<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 스페이스 록 브레이커</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --bg: #0a0e24; --bg2: #141a3e; --panel: #171d42; --line: #2b3470; --ink: #e8ecff; --dim: #9aa4d8; --cyan: #5ce1ff; --green: #6cf09a; --gold: #ffd36b; --red: #ff6b8a; --purple: #b58cff; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; }
button { font-family: inherit; }
.screen { position: fixed; inset: 0; display: none; }
.screen.active { display: block; }
.toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-24px); z-index: 90; background: var(--panel); color: var(--ink); border: 2px solid var(--cyan); padding: 9px 18px; border-radius: 10px; font-size: 15px; box-shadow: 0 0 20px rgba(92,225,255,.35); opacity: 0; transition: all .25s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 기지 ── */
#base { background: radial-gradient(ellipse at 50% 0%, #1b2454 0%, var(--bg) 60%); }
.stars { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(circle at 10% 20%, #fff 0 1.2px, transparent 2px), radial-gradient(circle at 70% 12%, #fff 0 1px, transparent 2px), radial-gradient(circle at 42% 30%, #fff 0 1.4px, transparent 2px), radial-gradient(circle at 88% 44%, #fff 0 1px, transparent 2px), radial-gradient(circle at 24% 62%, #fff 0 1.1px, transparent 2px), radial-gradient(circle at 60% 78%, #fff 0 1.2px, transparent 2px); opacity: .55; }
.top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 9px 10px; }
.tl { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.money { display: flex; gap: 6px; flex-wrap: wrap; }
.cur { background: rgba(23,29,66,.9); border: 2px solid var(--line); border-radius: 10px; padding: 4px 13px; font-size: 14px; color: var(--dim); white-space: nowrap; }

.cur.key { border-color: var(--cyan); } .cur.key b { color: var(--cyan); font-size: 22px; }
.cur.bump { animation: bump .35s ease; }
@keyframes bump { 45% { transform: scale(1.12); } }
.sec { background: rgba(23,29,66,.9); border: 2px solid var(--purple); border-radius: 10px; padding: 4px 12px; font-size: 13px; color: var(--dim); }
.sec b { font-size: 19px; color: var(--purple); }
.menu { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.mb { width: 46px; height: 46px; border: 2px solid var(--line); border-radius: 12px; background: rgba(23,29,66,.9); color: var(--ink); font-size: 21px; cursor: pointer; position: relative; padding: 0; }
.mb.on { border-color: var(--cyan); background: #1d2a5e; box-shadow: 0 0 12px rgba(92,225,255,.4); }
.mb .dot { position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); display: none; }
.mb.alert .dot { display: block; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.panel { position: absolute; top: var(--topH, 108px); left: 8px; right: 8px; bottom: 76px; background: rgba(20,26,62,.82); border: 2px solid var(--line); border-radius: 14px; overflow: auto; padding: 12px 12px 64px; }
.sheet { position: absolute; left: 8px; right: 8px; bottom: 78px; background: var(--panel); border: 2px solid var(--cyan); border-radius: 12px; padding: 9px 12px; display: none; align-items: center; gap: 10px; z-index: 7; box-shadow: 0 0 24px rgba(0,0,0,.6); }
.sheet.show { display: flex; }
.sheet .ic { font-size: 28px; } .sheet .t { flex: 1; min-width: 0; } .sheet .nm { font-size: 16px; } .sheet .ds { font-size: 12px; color: var(--dim); }
.sheet .pz { text-align: right; font-size: 15px; white-space: nowrap; color: var(--gold); }
.sheet .pz small { display: block; font-size: 11px; color: var(--dim); }

@keyframes glow { to { box-shadow: 0 0 0 12px rgba(92,225,255,0); } }
.launch:active { transform: translateY(2px); animation: none; }
.cfg { position: absolute; left: 10px; bottom: 14px; z-index: 6; width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); font-size: 19px; cursor: pointer; }
h3 { font-size: 15px; color: var(--cyan); margin: 4px 0 10px; display: flex; align-items: center; gap: 6px; }
h3 small { margin-left: auto; font-weight: normal; font-size: 12px; color: var(--dim); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 9px; }
.cd { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; position: relative; }
.cd .ic { font-size: 26px; } .cd .nm { font-size: 15px; } .cd .ds { font-size: 12px; color: var(--dim); flex: 1; } .cd .cost { font-size: 13px; color: var(--dim); }
.cd.ok { border-color: var(--green); box-shadow: 0 0 10px rgba(108,240,154,.25); } .cd.ok .cost { color: var(--green); }
.cd.ok::after { content: '👆👆'; position: absolute; right: 7px; bottom: 7px; font-size: 11px; }
.cd.max { border-color: var(--purple); } .cd.lock { opacity: .5; }
.shake { animation: shk .3s; } @keyframes shk { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
/* 기술 트리 */
.treewrap { position: relative; overflow: auto; height: 100%; margin: -12px; border-radius: 12px; background: radial-gradient(ellipse at 50% 50%, #17225a, #0a0e24 75%); }
.tree { position: relative; }
.tree svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.tn { position: absolute; width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; cursor: pointer; border: 2px solid var(--line); background: #1a2252; }
.tn.key { width: 60px; height: 60px; font-size: 26px; }
.tn.own { background: #1d5a3a; border-color: var(--green); box-shadow: 0 0 12px rgba(108,240,154,.4); }
.tn.avail { border-color: var(--cyan); }

.tn .pr { position: absolute; left: 50%; transform: translateX(-50%); bottom: -15px; font-size: 10px; background: rgba(0,0,0,.65); color: var(--gold); border-radius: 6px; padding: 1px 5px; white-space: nowrap; }

.binrow { display: flex; gap: 3px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }

.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 14px; line-height: 1.55; }

#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.ws i { position: absolute; bottom: 2px; right: 3px; font-style: normal; font-size: 10px; color: var(--cyan); }
.eback { position: absolute; right: 10px; bottom: 12px; z-index: 3; border: 2px solid var(--line); border-radius: 10px; background: rgba(23,29,66,.9); color: var(--ink); font-size: 14px; padding: 9px 14px; cursor: pointer; }
/* 모달 */
.modal { position: fixed; inset: 0; background: rgba(2,4,14,.82); display: none; align-items: center; justify-content: center; z-index: 95; padding: 14px; }
.modal.show { display: flex; }
.modal .box { background: var(--panel); border: 2px solid var(--cyan); border-radius: 16px; padding: 18px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 0 40px rgba(92,225,255,.25); max-height: 92vh; overflow: auto; }
.modal h2 { font-size: 21px; margin-bottom: 8px; color: var(--cyan); }
.modal p { font-size: 14px; color: var(--dim); line-height: 1.55; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
.res div { background: #10153a; border-radius: 8px; padding: 8px; font-size: 13px; color: var(--dim); } .res b { display: block; font-size: 19px; color: var(--ink); }
.orelist { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 8px 0; }
.ol { font-size: 12px; background: #10153a; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
@media (max-width: 620px) {
  #base .top { flex-direction: column; align-items: stretch; gap: 6px; }
  #base .menu { justify-content: space-between; flex-wrap: nowrap; }
  #base .mb { width: 44px; height: 44px; font-size: 19px; }
  .cur b { font-size: 23px; }
  .launch { font-size: 18px; padding: 11px 18px; }
}
</style>
</head>
<body>

<script>

const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구'];
function fmt(n) {
  if (!isFinite(n)) return '∞'; if (n < 0) return '-' + fmt(-n);
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString();
  const u = Math.floor(Math.log10(n) / 4); if (u >= UNITS.length) return n.toExponential(2).replace('+', '');

  showModal(`<h2>🎰 플링코 가공</h2>
    <div class="orelist">${list.map(x => `<span class="ol" style="color:${x.o.c}">${x.o.n} ×${fmt(x.q)}</span>`).join('')}</div>
    <p>광석 가치 <b style="color:var(--gold)">${fmt(total)}</b> 를 공 <b>${balls}</b>개로 나눠 떨어뜨려요</p>

    <div class="row" style="justify-content:center"><b id="plinkoSum" style="font-size:26px;color:var(--gold)">0</b></div>
