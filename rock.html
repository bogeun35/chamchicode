<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 스페이스 록 브레이커</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --bg: #05081c; --panel: #131a3c; --panel2: #1b2450; --line: #2b3470; --ink: #e8ecff; --dim: #93a0d8; --cyan: #5ce1ff; --green: #6cf09a; --gold: #ffd36b; --red: #ff6b8a; --purple: #b58cff; --orange: #ffa94d; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; }
button { font-family: inherit; }
.toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%) translateY(-24px); z-index: 90; background: var(--panel); border: 2px solid var(--cyan); padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all .22s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.screen { position: fixed; inset: 0; display: none; }
.screen.active { display: block; }

/* ══ 기지 ══ */
#base { background: radial-gradient(ellipse at 50% -10%, #1a2352 0%, var(--bg) 62%); }
.stars { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(circle at 10% 20%, #fff 0 1.2px, transparent 2px), radial-gradient(circle at 70% 12%, #fff 0 1px, transparent 2px), radial-gradient(circle at 42% 30%, #fff 0 1.3px, transparent 2px), radial-gradient(circle at 88% 44%, #fff 0 1px, transparent 2px), radial-gradient(circle at 24% 62%, #fff 0 1.1px, transparent 2px), radial-gradient(circle at 60% 78%, #fff 0 1.2px, transparent 2px), radial-gradient(circle at 33% 88%, #fff 0 1px, transparent 2px); opacity: .5; }
.top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 10px; }
.money { display: flex; gap: 6px; flex-wrap: wrap; }
.cur { background: rgba(19,26,60,.94); border: 2px solid var(--line); border-radius: 9px; padding: 3px 12px; font-size: 13px; color: var(--dim); white-space: nowrap; }
.cur b { font-size: 26px; letter-spacing: -.5px; }
.cur.cred { border-color: var(--gold); } .cur.cred b { color: var(--gold); }
.cur.key { border-color: var(--cyan); } .cur.key b { color: var(--cyan); font-size: 21px; }
.cur.ess { border-color: var(--purple); } .cur.ess b { color: var(--purple); font-size: 21px; }
.cur.bump { animation: bump .32s ease; } @keyframes bump { 45% { transform: scale(1.12); } }
.sub { font-size: 12px; color: var(--dim); background: rgba(19,26,60,.8); border-radius: 7px; padding: 2px 9px; }
.menu { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.mb { width: 44px; height: 44px; border: 2px solid var(--line); border-radius: 11px; background: rgba(19,26,60,.94); color: var(--ink); font-size: 20px; cursor: pointer; position: relative; padding: 0; }
.mb.on { border-color: var(--cyan); background: #1d2a5e; }
.mb .dot { position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); display: none; }
.mb.alert .dot { display: block; animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .25; } }
.panel { position: absolute; top: var(--topH, 104px); left: 7px; right: 7px; bottom: 72px; background: rgba(19,26,60,.9); border: 2px solid var(--line); border-radius: 13px; overflow: auto; padding: 11px 11px 60px; }
.sheet { position: absolute; left: 7px; right: 7px; bottom: 74px; background: var(--panel2); border: 2px solid var(--cyan); border-radius: 11px; padding: 8px 11px; display: none; align-items: center; gap: 9px; z-index: 8; }
.sheet.show { display: flex; }
.sheet .ic { font-size: 25px; } .sheet .t { flex: 1; min-width: 0; } .sheet .nm { font-size: 15px; } .sheet .ds { font-size: 12px; color: var(--dim); }
.sheet .pz { text-align: right; font-size: 14px; color: var(--gold); white-space: nowrap; } .sheet .pz.no { color: var(--red); } .sheet .pz small { display: block; font-size: 10.5px; color: var(--dim); }
.launch { position: absolute; right: 10px; bottom: 11px; z-index: 6; border: 2px solid var(--cyan); border-radius: 11px; background: linear-gradient(180deg, #1d6fa8, #123f6e); color: #eaffff; font-size: 20px; padding: 12px 24px; cursor: pointer; animation: glow 1.5s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 0 0 rgba(92,225,255,.65); } to { box-shadow: 0 0 0 12px rgba(92,225,255,0); } }
.launch:active { transform: translateY(2px); animation: none; }
h3 { font-size: 14px; color: var(--cyan); margin: 3px 0 9px; display: flex; gap: 6px; align-items: center; }
h3 small { margin-left: auto; font-weight: normal; font-size: 11.5px; color: var(--dim); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; }
.cd { background: var(--panel2); border: 2px solid var(--line); border-radius: 11px; padding: 9px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; position: relative; }
.cd .ic { font-size: 24px; } .cd .nm { font-size: 14.5px; line-height: 1.2; } .cd .ds { font-size: 12px; color: var(--dim); flex: 1; } .cd .cost { font-size: 12.5px; color: var(--dim); }
.cd.ok { border-color: var(--green); } .cd.ok .cost { color: var(--green); }
.cd.ok::after { content: '👆👆'; position: absolute; right: 6px; bottom: 5px; font-size: 10px; }
.cd.max { border-color: var(--purple); } .cd.lock { opacity: .45; }
.shake { animation: shk .3s; } @keyframes shk { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.treewrap { position: relative; overflow: auto; height: 100%; margin: -11px -11px -60px; background: radial-gradient(ellipse at 50% 50%, #17225a, #05081c 78%); }
.tree { position: relative; }
.tree svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.tn { position: absolute; width: 50px; height: 50px; border-radius: 10px; background: #1a2252; border: 2px solid var(--line); display: grid; place-items: center; font-size: 21px; cursor: pointer; }
.tn.key { width: 58px; height: 58px; font-size: 25px; }
.tn.own { background: #1d5a3a; border-color: var(--green); }
.tn.avail { border-color: var(--cyan); }
.tn.ok { animation: pulse 1s ease-in-out infinite alternate; } @keyframes pulse { to { transform: scale(1.07); } }
.tn .pr { position: absolute; left: 50%; transform: translateX(-50%); bottom: -14px; font-size: 10px; background: rgba(0,0,0,.7); color: var(--gold); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.tn .lvb { position: absolute; top: -7px; right: -7px; font-size: 9px; background: var(--green); color: #05230f; border-radius: 6px; padding: 0 4px; }
.tn.own .pr { display: none; } .tn.sel { outline: 2px solid #fff; }
.btn { border: 2px solid var(--line); border-radius: 9px; padding: 8px 14px; font-size: 14px; min-height: 40px; cursor: pointer; background: var(--panel2); color: var(--ink); }
.btn.go { border-color: var(--green); color: var(--green); } .btn.hot { border-color: var(--gold); color: var(--gold); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; align-items: center; }
.card { background: var(--panel2); border: 2px solid var(--line); border-radius: 11px; padding: 11px; margin-bottom: 9px; font-size: 13.5px; line-height: 1.55; }
.stat { display: flex; justify-content: space-between; font-size: 13.5px; padding: 3px 0; border-bottom: 1px dashed var(--line); } .stat:last-child { border-bottom: none; }
.step { display: flex; gap: 9px; background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 9px; margin-bottom: 7px; }
.step .no { flex: none; width: 23px; height: 23px; border-radius: 50%; background: var(--cyan); color: #06204a; display: grid; place-items: center; font-size: 12px; }
.step p { font-size: 13px; line-height: 1.5; }

/* ══ 원정 ══ */
#exp { background: #03050f; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ehud { position: absolute; top: 7px; left: 7px; right: 7px; z-index: 3; display: flex; gap: 7px; align-items: flex-start; pointer-events: none; flex-wrap: wrap; }
.fuel { flex: 1; min-width: 150px; max-width: 330px; }
.fuel .bar { height: 19px; background: rgba(0,0,0,.6); border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
.fuel .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff6b8a, #ffd36b, #6cf09a); transition: width .1s; }
.fuel .lb { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.shield { display: flex; gap: 3px; margin-top: 3px; }
.shield i { width: 14px; height: 14px; border-radius: 3px; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
.shield i.off { background: #2b3470; box-shadow: none; }
.quota { background: rgba(19,26,60,.9); border: 2px solid var(--purple); border-radius: 9px; padding: 3px 11px; font-size: 12px; color: var(--dim); text-align: center; }
.quota b { display: block; font-size: 16px; color: var(--purple); }
.ecur { background: rgba(19,26,60,.9); border: 2px solid var(--gold); border-radius: 9px; padding: 3px 11px; font-size: 12px; color: var(--dim); margin-left: auto; text-align: right; }
.ecur b { display: block; font-size: 21px; color: var(--gold); }
.warpbtn { position: absolute; left: 50%; transform: translateX(-50%); bottom: 58px; z-index: 4; border: 2px solid var(--purple); border-radius: 11px; background: linear-gradient(180deg, #46308a, #251858); color: #f0e6ff; font-size: 17px; padding: 11px 22px; cursor: pointer; display: none; animation: glow2 1.2s ease-in-out infinite alternate; }
@keyframes glow2 { from { box-shadow: 0 0 0 0 rgba(181,140,255,.7); } to { box-shadow: 0 0 0 14px rgba(181,140,255,0); } }
.warpbtn.show { display: block; }
.ammo { position: absolute; left: 56px; bottom: 11px; display: flex; gap: 6px; z-index: 3; }
.am { border: 2px solid var(--orange); border-radius: 9px; background: rgba(0,0,0,.55); padding: 4px 9px; font-size: 12px; color: var(--orange); }
.eback { position: absolute; right: 10px; bottom: 11px; z-index: 3; border: 2px solid var(--line); border-radius: 9px; background: rgba(19,26,60,.9); color: var(--ink); font-size: 13px; padding: 8px 12px; cursor: pointer; min-height: 40px; }
.eback.mini { width: 44px; height: 44px; padding: 0; font-size: 18px; } .eback.mini .lbl { display: none; }   /* 레터박스 안으로 옮길 때 (resize 가 위치 지정) */
.eback .cf { display: none; position: absolute; right: 0; bottom: calc(100% + 6px); white-space: nowrap; pointer-events: none; background: rgba(19,26,60,.96); border: 2px solid var(--orange); border-radius: 8px; padding: 4px 9px; font-size: 13px; color: var(--orange); }
.eback.arm { border-color: var(--orange); color: var(--orange); } .eback.arm .cf { display: block; }
.eback { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.eback::after { content: ''; position: absolute; left: 3px; right: 3px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--orange); transform: scaleX(0); transform-origin: left; pointer-events: none; }
.eback.hold::after { transform: scaleX(1); transition: transform .7s linear; }   /* 길게 누르는 동안 채워짐 */
.modal { position: fixed; inset: 0; background: rgba(2,4,14,.86); display: none; align-items: center; justify-content: center; z-index: 95; padding: 12px; }
.modal.show { display: flex; }
.modal .box { background: var(--panel); border: 2px solid var(--cyan); border-radius: 15px; padding: 16px; max-width: 470px; width: 100%; text-align: center; max-height: 93vh; overflow: auto; }
.modal h2 { font-size: 20px; margin-bottom: 7px; color: var(--cyan); }
.modal p { font-size: 13.5px; color: var(--dim); line-height: 1.55; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 9px 0; }
.res div { background: #0e1434; border-radius: 8px; padding: 7px; font-size: 12.5px; color: var(--dim); } .res b { display: block; font-size: 18px; color: var(--ink); }
.orelist { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 7px 0; }
.ol { font-size: 12px; background: #0e1434; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
#plinko { display: block; margin: 0 auto; background: #080c26; border: 2px solid var(--line); border-radius: 10px; max-width: 100%; width: auto; height: auto; max-height: max(200px, calc(100dvh - var(--topH, 104px) - 130px)); }   /* 가로 폰에서 점수 구역까지 한 화면 (내부 해상도 390×470 그대로) */
.cargo { position: absolute; right: 12px; bottom: 70px; z-index: 6; background: rgba(19,26,60,.94); border: 2px solid var(--gold); border-radius: 9px; padding: 4px 10px; font-size: 13px; color: var(--gold); }
.secsel { position: absolute; right: 190px; bottom: 16px; z-index: 6; display: flex; align-items: center; gap: 6px; background: rgba(19,26,60,.94); border: 2px solid var(--line); border-radius: 10px; padding: 3px 6px; font-size: 13px; color: var(--dim); }
.secsel b { color: var(--ink); font-size: 16px; } .secsel button { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel2); color: var(--ink); cursor: pointer; }
@media (max-width: 620px) {
  #base .top { flex-direction: column; align-items: stretch; gap: 6px; }
  #base .menu { justify-content: space-between; flex-wrap: nowrap; }
  .cur b { font-size: 22px; }
  .launch { font-size: 17px; padding: 10px 16px; }
  .secsel { right: auto; left: 56px; }   /* 사운드 버튼(좌하단 10~48) 오른쪽 · 원정 시작 버튼 왼쪽 */
}
/* 폰: 원정 HUD 압축 — 세로는 위아래 레터박스 안에, 가로는 월드 가림 최소 (스폰 영역은 그대로) */
@media (max-height: 500px), (max-width: 620px) {
  .ehud { top: 4px; gap: 5px; }
  .fuel { max-width: 200px; } .fuel .bar { height: 12px; } .fuel .lb { font-size: 10.5px; margin-top: 1px; }
  .shield { margin-top: 2px; } .shield i { width: 11px; height: 11px; }
  .quota, .ecur { white-space: nowrap; padding: 2px 8px; font-size: 11.5px; }
  .quota b, .ecur b { display: inline; font-size: 15px; } .quota br { display: none; } #eRar { margin-right: 5px; } .ecur b { margin-left: 4px; }
  .eback { width: 44px; height: 44px; padding: 0; font-size: 18px; } .eback .lbl { display: none; }
  .warpbtn { font-size: 14px; padding: 8px 16px; min-height: 40px; white-space: nowrap; }
}
/* 가로 폰: 기지 상단·메뉴·원정 시작 버튼 압축 → 패널 높이 확보 */
@media (max-height: 500px) {
  #base .top { padding: 4px 8px; }
  .cur { padding: 1px 10px; } .cur b { font-size: 20px; } .cur.key b, .cur.ess b { font-size: 17px; } .sub { font-size: 11px; }
  .mb { width: 40px; height: 40px; font-size: 18px; }
  .panel { bottom: 64px; } .sheet { bottom: 66px; }
  .launch { font-size: 16px; padding: 9px 16px; bottom: 10px; }
  .secsel { bottom: 10px; }
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="screen active" id="base">
  <div class="stars"></div>
  <div class="top">
    <div style="display:flex;flex-direction:column;gap:5px">
      <div class="money">
        <div class="cur cred" id="curCred">💰 <b id="cred">0</b></div>
        <div class="cur key" id="curKey">🔑 <b id="keys">0</b></div>
        <div class="cur ess" id="curEss" style="display:none">✨ <b id="ess">0</b></div>
      </div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="menu">
      <button class="mb on" data-tab="tree" title="스킬 트리">🌳<span class="dot"></span></button>
      <button class="mb" data-tab="loot" title="전리품 상자">📦<span class="dot"></span></button>
      <button class="mb" data-tab="plinko" title="플링코 기계">🎰<span class="dot"></span></button>
      <button class="mb" data-tab="arti" title="유물">🏺<span class="dot"></span></button>
      <button class="mb" data-tab="ore" title="광석">💎<span class="dot"></span></button>
      <button class="mb" data-tab="prestige" title="명성">✨<span class="dot"></span></button>
      <button class="mb" data-tab="cfg" id="btnCfg" title="설정">⚙️<span class="dot"></span></button>
    </div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="sheet" id="sheet"></div>
  <div class="cargo" id="cargoBox" style="display:none"></div>
  <div class="secsel" id="secSel" style="display:none"><button id="secDn">◀</button><span>시작 <b id="secNum">0</b>구역</span><button id="secUp">▶</button></div>
  <button class="launch" id="btnLaunch">🚀 원정 시작</button>
</div>

<div class="screen" id="exp">
  <canvas id="cv"></canvas>
  <div class="ehud">
    <div class="fuel">
      <div class="bar"><i id="fuelFill"></i></div>
      <div class="lb" id="fuelTxt"></div>
      <div class="shield" id="shieldBox"></div>
    </div>
    <div class="quota">구역 <b id="eSec">0</b><span id="eRar" style="font-size:11px"></span><br>할당량<span id="eQuota"></span></div>
    <div class="ecur">광석<b id="eOre">0</b></div>
  </div>
  <div class="ammo" id="ammoBox"></div>
  <button class="warpbtn" id="btnWarp">🌀 다음 구역으로 워프</button>
  <button class="eback" id="btnAbort" title="원정 중단">⏹<span class="lbl"> 원정 중단</span><span class="cf">꾹 누르고 있으면 귀환</span></button>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script src="party-sound.js"></script>
<script>
'use strict';
Sound.theme('spy'); Sound.scene('game');
const $ = id => document.getElementById(id);
const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구'];
// 디버그: 콘솔에서 rock.speed(4) — 게임 시간만 배속 (테스트용)
let __spd = 1, __spReal = performance.now(), __spGame = __spReal;
const __now = () => { const t = performance.now(); return __spGame + (t - __spReal) * __spd; };
function setSpeed(n) {
  __spGame = __now(); __spReal = performance.now(); __spd = Math.max(.25, Math.min(30, +n || 1));
  let b = document.getElementById('spdBadge');
  if (!b) { b = document.createElement('div'); b.id = 'spdBadge'; b.style.cssText = 'position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9999;padding:3px 11px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font:15px sans-serif;pointer-events:none'; document.body.appendChild(b); }
  b.textContent = '⏩ ×' + __spd + '  ( [ ] 키 )'; b.style.display = __spd === 1 ? 'none' : '';
  return '⏩ 배속 ×' + __spd;
}
function stepSpeed(dir) { const L = [1, 2, 4, 8, 16]; let i = L.indexOf(__spd); if (i < 0) i = 0; return setSpeed(L[Math.max(0, Math.min(L.length - 1, i + dir))]); }
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test((e.target && e.target.tagName) || '')) return;
  if (e.code === 'BracketRight') stepSpeed(1); else if (e.code === 'BracketLeft') stepSpeed(-1);
});
window.__gameSpeed = { set: setSpeed, step: stepSpeed, get: () => __spd };
function fmt(n) {
  n = Math.floor(n); if (n < 0) return '-' + fmt(-n);
  if (n < 10000) return n.toLocaleString('ko-KR');
  let u = 0; while (n >= 1e4 && u < UNITS.length - 1) { u++; n /= 1e4; }
  const big = Math.floor(n), rest = Math.floor((n - big) * 1e4);
  return big.toLocaleString('ko-KR') + UNITS[u] + (rest && big < 1000 ? ' ' + rest.toLocaleString('ko-KR') + UNITS[u - 1] : '');
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2300); }
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

      <div class="cards">${LOOT_TYPES.map(lt => { const on = lt.lootID <= 1 || pool.includes(lt) || S.lootCnt[lt.lootID] > 0; return `<div class="cd ${on ? '' : 'lock'}"><div class="ic">${on ? LOOT_IC[lt.lootID] : '❔'}</div><div class="nm">${on ? LOOT_N[lt.lootID] : '???'}</div><div class="ds">${on ? `${LRN[lt.minRarity]} ~ ${LRN[lt.maxRarity]}${S.lootCnt[lt.lootID] ? ' · ' + S.lootCnt[lt.lootID] + '장' : ''}` : lt.lootID >= 3 && lt.lootID <= 5 ? '특별한 때만' : `상자 ${lt.unlockedAt}개 열면 등장`}</div></div>`; }).join('')}</div>
      <div class="card" style="font-size:12.5px">누적 효과 — 총 피해 +${S.boost.dmg} · 연료 +${S.boost.fuel} · 발사 간격 ×${S.boost.rate.toFixed(2)} · 미사일 +${S.boost.missile} · 레이저 +${S.boost.lazer} · 플링코 간격 ×${S.boost.pmul.toFixed(2)}</div>`;
    const b = $('btnOpen'); if (b) b.onclick = openLoot;
  } else if (t === 'plinko') {
    Pn.innerHTML = `<h3>🎰 플링코 기계<small id="plinkoInfo"></small></h3>
      <canvas id="plinko" width="${PB.W}" height="${PB.H}"></canvas>
      <div class="card" style="margin-top:8px;font-size:12.5px;line-height:1.6">바닥 점수 구역 13칸: <b>광석 가치 × 구역 배수</b>(처음엔 모두 ×1). 📦 카드 <b>점수 구역+</b>로 올려요.<br>
      색깔 핀(등급 1~5)은 닿을 때마다 <b>광석 가치 × 등급</b>을 따로 줘요 (핀마다 0.5초 쿨다운) · <span style="color:var(--green)">듀플리페그</span>는 광석 복제 · <span style="color:var(--purple)">정제기</span>는 다음 광석으로 · 🕳️ 웜홀 구역은 확률로 다시 떨어짐<br>
      한 번에 <b>${intake()}</b>개 · 투하 간격 <b>${plinkoInt().toFixed(2)}초</b>${efl('Autonomy') ? ' · 🤖 원정 중에도 처리' : ''}</div>`;
    drawPlinko();
  } else if (t === 'arti') {
    const n = ARTI.filter(a => S.arti[a.id]).length;
    Pn.innerHTML = `<h3>🏺 유물 ${n} / ${ARTI.length}<small>종류마다 한 번 · 해당 구역부터 🏺 유물 소행성으로 등장 (소행성 ${G.artiInt}개마다)</small></h3><div class="cards">` +
      ARTI.map(a => { const c = S.arti[a.id]; return `<div class="cd ${c ? '' : 'lock'}"><div class="ic">${c ? a.ic : '❔'}</div><div class="nm">${c ? a.n : '???'}</div><div class="ds">${c ? a.ds + (pl('p13') ? ' (×2)' : '') : `${a.min}구역부터`}</div></div>`; }).join('') + '</div>';
  } else if (t === 'ore') {
    Pn.innerHTML = `<h3>💎 광석<small>스킬 트리의 ⬢ 칸을 사고, 그 구역에 도달하면 등장 (원작 기본 가치)</small></h3><div class="cards">` +
      ORES.map((o, i) => { const un = oreOwned(i), got = S.ores[o.id] || 0;
        return `<div class="cd ${un ? '' : 'lock'}"><div class="ic" style="color:${o.c}">⬢</div><div class="nm" style="color:${un ? o.c : ''}">${un ? o.n : '???'}</div><div class="ds">${un ? `${o.min}구역부터 · 기본 가치 $${fmt(o.v)}` : `${o.min}구역 광석 (미해금)`}</div><div class="cost">${got ? fmt(got) + '개 수집' : ''}</div></div>`; }).join('') + '</div>';
  } else if (t === 'prestige') {
    Pn.innerHTML = `<div class="card" style="margin-bottom:8px">보유 <b style="color:var(--purple);font-size:20px">✨ ${S.ess}</b> 우주의 정수 · 보스 격파 ${S.bosses}회
      <div style="font-size:12.5px;color:var(--dim);margin-top:4px">4·9·14…구역에서 할당량을 채우면 보스가 나오고, 부수면 정수 1개를 얻고 원정이 끝나요(구역마다 한 번). 스킬 트리의 ✨ 명성 칸을 사면 크레딧·스킬·플링코가 초기화되고 정수는 남아요.</div>
      <div class="row"><button class="btn hot" id="btnPres" ${hasPres() ? '' : 'disabled'}>✨ 명성 얻기 (${S.prestiges}회)</button></div></div>
      <div style="height:300px;position:relative">${treeHTML(PT.T, PT.BY, PT.W, PT.H, pVis, pl, pCost, pCanBuy, pMaxed, 'ess')}</div>`;
    const b = $('btnPres'); if (b) b.onclick = doPrestige;
    Pn.querySelectorAll('.tn').forEach(el => { const n = PT.BY[el.dataset.id];
      const info = () => showSheet(n.ic, n.n + (n.max !== 1 ? ` ${pl(n.id)}${n.max ? '/' + n.max : ''}` : ''), n.d, pMaxed(n) ? null : pCost(n), pMaxed(n) ? '<span style="color:var(--green)">✅ 보유</span>' : pVis(n) ? '' : '🔒', 'ess');
      bindBuy(el, () => pCanBuy(n), () => { S.ess -= pCost(n); S.pl[n.id] = pl(n.id) + 1; recompute(); Sound.play('meld'); toast(`✨ ${n.n}`); renderBase(); save(); }, info); });
  } else if (t === 'cfg') {
    const stats = efl('UnlockStats') ? `<h3>📊 통계</h3><div class="card">${[['💾 마지막 저장', S.savedAt ? new Date(S.savedAt).toLocaleTimeString('ko') : '-'], ['시작한 탐험', S.runs], ['최고 구역', S.maxSector], ['파괴한 소행성', fmt(S.destroyed)], ['추락한 우주선', S.crashes], ['연 상자', S.boxes], ['명성', S.prestiges], ['번 돈', fmt(Math.floor(S.totalCred))], ['총 플레이 시간', Math.floor(S.playTime / 60) + '분']].map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div>` : `<div class="card" style="color:var(--dim)">📊 통계는 스킬 트리의 "누가 세는지"로 열려요.</div>`;
    Pn.innerHTML = stats + `<h3>💾 저장</h3><div class="card"><div class="row"><button class="btn" id="btnExport">📤 내보내기</button><button class="btn" id="btnImport">📥 가져오기</button><button class="btn" id="btnReset" style="margin-left:auto;color:var(--red)">🗑 초기화</button></div></div>
      <h3>❓ 어떻게 하나요? (원작 규칙)</h3>
      <div class="step"><div class="no">1</div><p><b>연료는 시간이 지나면 닳고</b> 3초마다 소모가 빨라져요(30초·90초 넘게 버티면 더 빨리). 0구역은 쏴도 연료가 안 들지만 1구역부터는 한 발마다 연료를 씁니다.</p></div>
      <div class="step"><div class="no">2</div><p>우주선은 마우스를 따라가고 가까운 소행성을 자동으로 쏩니다. 부서진 소행성의 광석은 <b>수집 원</b> 안에 들어와야 빨려와요.</p></div>
      <div class="step"><div class="no">3</div><p>소행성에 부딪히면 선체 −1. 0이 되면 끝. 🛡️ 방어막 업그레이드로 버텨요.</p></div>
      <div class="step"><div class="no">4</div><p>구역마다 <b>소행성 할당량</b>을 부수면 🌀 워프 — 스페이스/워프 버튼/화면을 <b>누르고 있으면</b> 충전(충전 중엔 연료 절반). 소행성 하나에서 광석이 1~(구역+1)개. 4·9·14…구역은 보스.</p></div>
      <div class="step"><div class="no">5</div><p>가져온 광석은 <b>🎰 플링코</b>에서 초당 1개씩 크레딧이 됩니다. 점수 구역 배수는 처음엔 모두 ×1 — 📦 전리품으로 올려요.</p></div>
      <div class="step"><div class="no">6</div><p><b>📦 전리품 상자</b>는 구역이 시작될 때 <b>구역 희귀도</b>만큼 나와요(고급 1 · 희귀 2 …). 부수면 🔑 열쇠 + 광석. <b>🧰 무기 상자</b>는 소행성 200개마다, 몇 초간 특수 탄약.</p></div>
      <div class="step"><div class="no">7</div><p>크레딧은 <b>🌳 스킬 트리</b>에. 산 칸 옆만 보여요. 보스가 준 ✨ 정수는 <b>명성</b> 뒤 명성 트리에 씁니다.</p></div>`;
    $('btnExport').onclick = () => { save(); const x = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(x).then(() => toast('저장 코드를 복사했어요')).catch(() => prompt('복사해 주세요', x)); };
    $('btnImport').onclick = () => { const x = prompt('저장 코드'); if (!x) return; try { const v = JSON.parse(decodeURIComponent(escape(atob(x.trim())))); if (!v || typeof v.cred !== 'number') throw 0; S = Object.assign(fresh(), v); save(); location.reload(); } catch (e) { toast('코드가 올바르지 않아요'); } };
    $('btnReset').onclick = () => { if (confirm('정말 처음부터?') && confirm('진짜로요?')) { localStorage.removeItem(SAVE_KEY); S = fresh(); location.reload(); } };
  }
}
function selNode(id) {
  const n = TREE_BY[id]; if (!n) return; sel = id;
  document.querySelectorAll('.tn').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  const l = lv(n.id);
  showSheet(n.ore ? `<span style="color:${ORES[n.ore].c}">⬢</span>` : n.ic, n.n + (n.max !== 1 ? ` <small>${l}${n.max ? '/' + n.max : ''}</small>` : ''), nodeDesc(n, l), maxed(n) || !vis(n) ? null : nodeCost(n), maxed(n) ? '<span style="color:var(--green)">✅ 최대</span>' : vis(n) ? '' : '🔒');
}
function buyNode(id) {
  const n = TREE_BY[id]; if (!n || !canBuy(n)) return Sound.play('error');
  S.cred -= nodeCost(n); S.lv[id] = lv(id) + 1; recompute(); Sound.play('correct');
  if (n.cls === 'ScorezonePlus') { const z = Math.floor(Math.random() * 13); S.zm[z] += n.f.scorezonesToUpgrade || 1; toast(`🎰 점수 구역 ${z + 1}번 ×${S.zm[z]}`); }
  if (n.ore) toast(`⛏️ ${ORES[n.ore].n} 해금 — ${ORES[n.ore].min}구역부터`);
  if (n.cls === 'GoldRush') { S.grInit = S.prestiges ? 0 : 1; S.grCtr = 0; S.grMax = irnd(17, 19) + 3; }                    // 원작 UD_GoldRush
  if (n.cls === 'UnlockWeaponsCrate') S.cntW = weaponInt();                                                            // 첫 무기 상자는 바로
  if (n.cls === 'UnlockBonusAmmo') S.cntW = Math.max(S.cntW, weaponInt() - irnd(0, 19));
  if (n.id === 'uP') setTimeout(doPrestige, 200);
  const wrap = $('treewrap'), sl = wrap ? wrap.scrollLeft : 0, st = wrap ? wrap.scrollTop : 0;
  renderBase(); if ($('treewrap')) { $('treewrap').scrollLeft = sl; $('treewrap').scrollTop = st; }
  selNode(id); save();
}
function showModal(h) { $('modalBox').innerHTML = h; $('modal').classList.add('show'); }
function hideModal() { $('modal').classList.remove('show'); }

// ═══ 시작 ═══
load();
if (!localStorage.getItem('srb_v4_notice') && localStorage.getItem('srb_save_v3')) { try { localStorage.setItem('srb_v4_notice', '1'); } catch (e) {} setTimeout(() => toast('🛰️ 원작 규칙으로 다시 맞췄어요 — 진행은 이어집니다 (구역은 이제 0부터)'), 700); }
recompute(); setTab(S.tab || 'tree');
setInterval(save, 5000);
addEventListener('beforeunload', save); addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.rock = { speed: setSpeed, get S() { return S; }, get R() { return R; }, get PL() { return PL; }, TREE, TREE_BY, PT, ORES, ARTI, LOOT_TYPES, PEGS, ef, efl, lv, pl, launch, endRun, warp, vis, canBuy, nodeCost, buyNode, recompute, renderBase, setTab, save, plinkoTick, hpStart, quotaFor, maxFuel, gunDmg, fireInt, plinkoInt, cargoN, openLoot, drawCard, doPrestige, spawnInt, shipSpd, hasWarp,
  view: () => ({ W, H, CW, CH, VS, OX: VX, OY: VY, DPR, portrait: H > W }), toWorld, resize,
  sim: dt => { if (R) update(dt); }, cheat: (c, k, e) => { S.cred += c || 0; S.keys += k || 0; S.ess += e || 0; renderBase(); } };

</script>
