<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 스페이스 록 브레이커</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --bg: #05081c; --panel: #131a3c; --panel2: #1b2450; --line: #2b3470; --ink: #e8ecff; --dim: #93a0d8; --cyan: #5ce1ff; --green: #6cf09a; --gold: #ffd36b; --red: #ff6b8a; --purple: #b58cff; --orange: #ffa94d; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; }
button { font-family: inherit; }
.toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%) translateY(-24px); z-index: 90; background: var(--panel); border: 2px solid var(--cyan); padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all .22s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.screen { position: fixed; inset: 0; display: none; }
.screen.active { display: block; }

/* ══ 기지 ══ */
#base { background: radial-gradient(ellipse at 50% -10%, #1a2352 0%, var(--bg) 62%); }
.stars { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(circle at 10% 20%, #fff 0 1.2px, transparent 2px), radial-gradient(circle at 70% 12%, #fff 0 1px, transparent 2px), radial-gradient(circle at 42% 30%, #fff 0 1.3px, transparent 2px), radial-gradient(circle at 88% 44%, #fff 0 1px, transparent 2px), radial-gradient(circle at 24% 62%, #fff 0 1.1px, transparent 2px), radial-gradient(circle at 60% 78%, #fff 0 1.2px, transparent 2px), radial-gradient(circle at 33% 88%, #fff 0 1px, transparent 2px); opacity: .5; }
.top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 10px; }
.money { display: flex; gap: 6px; flex-wrap: wrap; }
.cur { background: rgba(19,26,60,.94); border: 2px solid var(--line); border-radius: 9px; padding: 3px 12px; font-size: 13px; color: var(--dim); white-space: nowrap; }
.cur b { font-size: 26px; letter-spacing: -.5px; }
.cur.cred { border-color: var(--gold); } .cur.cred b { color: var(--gold); }
.cur.key { border-color: var(--cyan); } .cur.key b { color: var(--cyan); font-size: 21px; }
.cur.ess { border-color: var(--purple); } .cur.ess b { color: var(--purple); font-size: 21px; }
.cur.bump { animation: bump .32s ease; } @keyframes bump { 45% { transform: scale(1.12); } }
.sub { font-size: 12px; color: var(--dim); background: rgba(19,26,60,.8); border-radius: 7px; padding: 2px 9px; }
.menu { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.mb { width: 44px; height: 44px; border: 2px solid var(--line); border-radius: 11px; background: rgba(19,26,60,.94); color: var(--ink); font-size: 20px; cursor: pointer; position: relative; padding: 0; }
.mb.on { border-color: var(--cyan); background: #1d2a5e; }
.mb .dot { position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); display: none; }
.mb.alert .dot { display: block; animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .25; } }
.panel { position: absolute; top: var(--topH, 104px); left: 7px; right: 7px; bottom: 72px; background: rgba(19,26,60,.9); border: 2px solid var(--line); border-radius: 13px; overflow: auto; padding: 11px 11px 60px; }
.sheet { position: absolute; left: 7px; right: 7px; bottom: 74px; background: var(--panel2); border: 2px solid var(--cyan); border-radius: 11px; padding: 8px 11px; display: none; align-items: center; gap: 9px; z-index: 8; }
.sheet.show { display: flex; }
.sheet .ic { font-size: 25px; } .sheet .t { flex: 1; min-width: 0; } .sheet .nm { font-size: 15px; } .sheet .ds { font-size: 12px; color: var(--dim); }
.sheet .pz { text-align: right; font-size: 14px; color: var(--gold); white-space: nowrap; } .sheet .pz.no { color: var(--red); } .sheet .pz small { display: block; font-size: 10.5px; color: var(--dim); }
.launch { position: absolute; right: 10px; bottom: 11px; z-index: 6; border: 2px solid var(--cyan); border-radius: 11px; background: linear-gradient(180deg, #1d6fa8, #123f6e); color: #eaffff; font-size: 20px; padding: 12px 24px; cursor: pointer; animation: glow 1.5s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 0 0 rgba(92,225,255,.65); } to { box-shadow: 0 0 0 12px rgba(92,225,255,0); } }
.launch:active { transform: translateY(2px); animation: none; }
.cfg { position: absolute; left: 10px; bottom: 13px; z-index: 6; width: 42px; height: 42px; border-radius: 11px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); font-size: 18px; cursor: pointer; }
h3 { font-size: 14px; color: var(--cyan); margin: 3px 0 9px; display: flex; gap: 6px; align-items: center; }
h3 small { margin-left: auto; font-weight: normal; font-size: 11.5px; color: var(--dim); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; }
.cd { background: var(--panel2); border: 2px solid var(--line); border-radius: 11px; padding: 9px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; position: relative; }
.cd .ic { font-size: 24px; } .cd .nm { font-size: 14.5px; line-height: 1.2; } .cd .ds { font-size: 12px; color: var(--dim); flex: 1; } .cd .cost { font-size: 12.5px; color: var(--dim); }
.cd.ok { border-color: var(--green); } .cd.ok .cost { color: var(--green); }
.cd.ok::after { content: '👆👆'; position: absolute; right: 6px; bottom: 5px; font-size: 10px; }
.cd.max { border-color: var(--purple); } .cd.lock { opacity: .45; }
.shake { animation: shk .3s; } @keyframes shk { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.treewrap { position: relative; overflow: auto; height: 100%; margin: -11px -11px -60px; background: radial-gradient(ellipse at 50% 50%, #17225a, #05081c 78%); }
.tree { position: relative; }
.tree svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.tn { position: absolute; width: 50px; height: 50px; border-radius: 10px; background: #1a2252; border: 2px solid var(--line); display: grid; place-items: center; font-size: 21px; cursor: pointer; }
.tn.key { width: 58px; height: 58px; font-size: 25px; }
.tn.own { background: #1d5a3a; border-color: var(--green); }
.tn.avail { border-color: var(--cyan); }
.tn.ok { animation: pulse 1s ease-in-out infinite alternate; } @keyframes pulse { to { transform: scale(1.07); } }
.tn .pr { position: absolute; left: 50%; transform: translateX(-50%); bottom: -14px; font-size: 10px; background: rgba(0,0,0,.7); color: var(--gold); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.tn .lvb { position: absolute; top: -7px; right: -7px; font-size: 9px; background: var(--green); color: #05230f; border-radius: 6px; padding: 0 4px; }
.tn.own .pr { display: none; } .tn.sel { outline: 2px solid #fff; }
.btn { border: 2px solid var(--line); border-radius: 9px; padding: 8px 14px; font-size: 14px; cursor: pointer; background: var(--panel2); color: var(--ink); }
.btn.go { border-color: var(--green); color: var(--green); } .btn.hot { border-color: var(--gold); color: var(--gold); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; align-items: center; }
.card { background: var(--panel2); border: 2px solid var(--line); border-radius: 11px; padding: 11px; margin-bottom: 9px; font-size: 13.5px; line-height: 1.55; }
.stat { display: flex; justify-content: space-between; font-size: 13.5px; padding: 3px 0; border-bottom: 1px dashed var(--line); } .stat:last-child { border-bottom: none; }
.step { display: flex; gap: 9px; background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 9px; margin-bottom: 7px; }
.step .no { flex: none; width: 23px; height: 23px; border-radius: 50%; background: var(--cyan); color: #06204a; display: grid; place-items: center; font-size: 12px; }
.step p { font-size: 13px; line-height: 1.5; }

/* ══ 원정 ══ */
#exp { background: #03050f; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ehud { position: absolute; top: 7px; left: 7px; right: 7px; z-index: 3; display: flex; gap: 7px; align-items: flex-start; pointer-events: none; flex-wrap: wrap; }
.fuel { flex: 1; min-width: 150px; max-width: 330px; }
.fuel .bar { height: 19px; background: rgba(0,0,0,.6); border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
.fuel .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff6b8a, #ffd36b, #6cf09a); transition: width .1s; }
.fuel .lb { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.shield { display: flex; gap: 3px; margin-top: 3px; }
.shield i { width: 14px; height: 14px; border-radius: 3px; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
.shield i.off { background: #2b3470; box-shadow: none; }
.quota { background: rgba(19,26,60,.9); border: 2px solid var(--purple); border-radius: 9px; padding: 3px 11px; font-size: 12px; color: var(--dim); text-align: center; }
.quota b { display: block; font-size: 16px; color: var(--purple); }
.ecur { background: rgba(19,26,60,.9); border: 2px solid var(--gold); border-radius: 9px; padding: 3px 11px; font-size: 12px; color: var(--dim); margin-left: auto; text-align: right; }
.ecur b { display: block; font-size: 21px; color: var(--gold); }
.warpbtn { position: absolute; left: 50%; transform: translateX(-50%); bottom: 58px; z-index: 4; border: 2px solid var(--purple); border-radius: 11px; background: linear-gradient(180deg, #46308a, #251858); color: #f0e6ff; font-size: 17px; padding: 11px 22px; cursor: pointer; display: none; animation: glow2 1.2s ease-in-out infinite alternate; }
@keyframes glow2 { from { box-shadow: 0 0 0 0 rgba(181,140,255,.7); } to { box-shadow: 0 0 0 14px rgba(181,140,255,0); } }
.warpbtn.show { display: block; }
.ammo { position: absolute; left: 10px; bottom: 11px; display: flex; gap: 6px; z-index: 3; }
.am { border: 2px solid var(--orange); border-radius: 9px; background: rgba(0,0,0,.55); padding: 4px 9px; font-size: 12px; color: var(--orange); }
.eback { position: absolute; right: 10px; bottom: 11px; z-index: 3; border: 2px solid var(--line); border-radius: 9px; background: rgba(19,26,60,.9); color: var(--ink); font-size: 13px; padding: 8px 12px; cursor: pointer; }
.modal { position: fixed; inset: 0; background: rgba(2,4,14,.86); display: none; align-items: center; justify-content: center; z-index: 95; padding: 12px; }
.modal.show { display: flex; }
.modal .box { background: var(--panel); border: 2px solid var(--cyan); border-radius: 15px; padding: 16px; max-width: 470px; width: 100%; text-align: center; max-height: 93vh; overflow: auto; }
.modal h2 { font-size: 20px; margin-bottom: 7px; color: var(--cyan); }
.modal p { font-size: 13.5px; color: var(--dim); line-height: 1.55; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 9px 0; }
.res div { background: #0e1434; border-radius: 8px; padding: 7px; font-size: 12.5px; color: var(--dim); } .res b { display: block; font-size: 18px; color: var(--ink); }
.orelist { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 7px 0; }
.ol { font-size: 12px; background: #0e1434; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
#plinko { display: block; margin: 0 auto; background: #080c26; border: 2px solid var(--line); border-radius: 10px; max-width: 100%; }
@media (max-width: 620px) {
  #base .top { flex-direction: column; align-items: stretch; gap: 6px; }
  #base .menu { justify-content: space-between; flex-wrap: nowrap; }
  .cur b { font-size: 22px; }
  .launch { font-size: 17px; padding: 10px 16px; }
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="screen active" id="base">
  <div class="stars"></div>
  <div class="top">
    <div style="display:flex;flex-direction:column;gap:5px">
      <div class="money">
        <div class="cur cred" id="curCred">💰 <b id="cred">0</b></div>
        <div class="cur key" id="curKey">🔑 <b id="keys">0</b></div>
        <div class="cur ess" id="curEss" style="display:none">✨ <b id="ess">0</b></div>
      </div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="menu">
      <button class="mb on" data-tab="tree" title="스킬 트리">🌳<span class="dot"></span></button>
      <button class="mb" data-tab="loot" title="전리품 상자">📦<span class="dot"></span></button>
      <button class="mb" data-tab="plinko" title="플링코 기계">🎰<span class="dot"></span></button>
      <button class="mb" data-tab="arti" title="유물">🏺<span class="dot"></span></button>
      <button class="mb" data-tab="ore" title="광석">💎<span class="dot"></span></button>
      <button class="mb" data-tab="prestige" title="명성">✨<span class="dot"></span></button>
    </div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="sheet" id="sheet"></div>
  <button class="cfg" id="btnCfg">⚙️</button>
  <button class="launch" id="btnLaunch">🚀 원정 시작</button>
</div>

<div class="screen" id="exp">
  <canvas id="cv"></canvas>
  <div class="ehud">
    <div class="fuel">
      <div class="bar"><i id="fuelFill"></i></div>
      <div class="lb" id="fuelTxt"></div>
      <div class="shield" id="shieldBox"></div>
    </div>
    <div class="quota">구역 <b id="eSec">1</b><span id="eQuota"></span></div>
    <div class="ecur">광석<b id="eOre">0</b></div>
  </div>
  <div class="ammo" id="ammoBox"></div>
  <button class="warpbtn" id="btnWarp">🌀 다음 구역으로 워프</button>
  <button class="eback" id="btnAbort">⏹ 원정 중단</button>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script src="party-sound.js"></script>
<script>
'use strict';
Sound.theme('spy'); Sound.scene('game');
const $ = id => document.getElementById(id);
const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구'];
// 디버그: 콘솔에서 rock.speed(4) — 게임 시간만 배속 (테스트용)
let __spd = 1, __spReal = performance.now(), __spGame = __spReal;
const __now = () => { const t = performance.now(); return __spGame + (t - __spReal) * __spd; };
function setSpeed(n) { __spGame = __now(); __spReal = performance.now(); __spd = Math.max(.25, Math.min(30, +n || 1)); return '⏩ 배속 ×' + __spd; }
function fmt(n) {
  if (!isFinite(n)) return '∞'; if (n < 0) return '-' + fmt(-n);
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString();
  const u = Math.floor(Math.log10(n) / 4); if (u >= UNITS.length) return n.toExponential(2).replace('+', '');
  const p = Math.pow(10, u * 4), head = Math.floor(n / p), rest = Math.floor((n % p) / Math.pow(10, (u - 1) * 4));
  if (head >= 1000 || rest === 0) return head.toLocaleString() + UNITS[u];
  return head + UNITS[u] + ' ' + rest.toLocaleString() + (u >= 2 ? UNITS[u - 1] : '');
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2300); }
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ═══ 광석: 구역별 등장 · 기본 가치 (원작 수치) ═══
const ORES = [
  { id: 'iron', n: '철', c: '#b8b8c4', v: 1, sec: 1 },
  { id: 'copper', n: '구리', c: '#e08a4a', v: 5, sec: 2 },
  { id: 'silver', n: '은', c: '#e6edf8', v: 25, sec: 3 },
  { id: 'gold', n: '금', c: '#ffd36b', v: 125, sec: 4 },
  { id: 'plat', n: '백금', c: '#c9f0ff', v: 625, sec: 7 },
  { id: 'cobalt', n: '코발트', c: '#6b8fff', v: 3000, sec: 8 },
  { id: 'emerald', n: '에메랄드', c: '#6cf09a', v: 15000, sec: 10 },
  { id: 'ruby', n: '루비', c: '#ff5c7a', v: 75000, sec: 15 },
  { id: 'diamond', n: '다이아몬드', c: '#9fe9ff', v: 300000, sec: 18 },
  { id: 'unob', n: '운옵테이늄', c: '#b58cff', v: 1000000, sec: 20 },
];
const oreById = Object.fromEntries(ORES.map(o => [o.id, o]));
// 보너스 탄약 (무기 상자에서 드랍 · 일정 시간 지속)
const AMMO = {
  explosive: { n: '폭발 탄약', ic: '💥', d: 8 },
  piercing: { n: '관통 탄약', ic: '🗡️', d: 8 },
  plasma: { n: '플라즈마 탄약', ic: '⚡', d: 8 },
  missile: { n: '미사일 탄약', ic: '🚀', d: 8 },
  laser: { n: '레이저 탄약', ic: '🔆', d: 8 },
  drill: { n: '채광 드릴', ic: '🛠️', d: 6 },
};
// ═══ 스킬 트리 (원작 업그레이드 이름) ═══
const B = (n, ic, k, v, max, ds) => ({ n, ic, k, v, max: max || 1, ds });
const BRANCH = [
  { id: 'gun', d: [0, -1], nodes: [
    B('더 나은 총알', '🔩', 'gdmg', 1, 5, '모든 총기의 피해 +1'),
    B('발사 속도', '⚡', 'grate', .2, 5, '모든 무기 공격 속도 +20%'),
    B('쌍열 포', '🔫', 'guns', 1, 1, '포를 하나 더 장착 (발사마다 연료 소모)'),
    B('고급 무기', '🔩', 'gdmg', 2, 5, '모든 총기의 피해 +2'),
    B('치명타', '🎯', 'crit', .1, 5, '치명타 확률 +10%'),
    B('트리플 포탑', '🔫', 'guns', 1, 1, '포를 하나 더 장착'),
    B('보정기', '🔩', 'gdmg', 5, 5, '모든 총기의 피해 +5'),
    B('친환경 총기', '🌿', 'gcost', .1, 5, '총기가 쓰는 연료 −10%'),
    B('디자이너 총알', '🔩', 'gdmg', 10, 5, '모든 총기의 피해 +10'),
    B('강철 포격', '🔫', 'guns', 1, 1, '포를 하나 더 장착'),
    B('마법의 총알', '✨', 'gdmg', 100, 5, '모든 총기의 피해 +100'),
  ] },
  { id: 'fuel', d: [0, 1], nodes: [
    B('연료 용량', '⛽', 'fuel', 1, 10, '연료 용량 +1'),
    B('소행성 재활용', '♻️', 'fkill', 1, 5, '소행성을 파괴할 때마다 연료 +1'),
    B('예비 연료 탱크', '🛢️', 'fuel', 5, 5, '연료 용량 +5'),
    B('연료 변환', '🔁', 'fore', .1, 10, '수집한 광석당 연료 +0.1'),
    B('유선형 엔진', '🪶', 'fburn', .05, 5, '연료 소모 −5%'),
    B('할당량 연료 보급', '📦', 'fquota', .05, 5, '할당량 완료 시 총 연료의 +5% 보급'),
    B('원자로', '☢️', 'fuel', 10, 10, '연료 용량 +10'),
    B('나노봇', '🤖', 'fregen', .01, 5, '매초 최대 연료의 +1% 회복'),
    B('생명력 흡수', '🩸', 'fdmg', .01, 5, '준 피해의 +1%를 연료로'),
    B('연료 비축', '🛢️', 'fuel', 100, 5, '연료 용량 +100'),
  ] },
  { id: 'ore', d: [-1, 0], nodes: [

// ═══ 플링코 기계 ═══
const PIN_ROWS = 9;
function zones() {
  const n = PIN_ROWS + 1, out = [];
  for (let i = 0; i < n; i++) { const d = Math.abs(i - (n - 1) / 2) / ((n - 1) / 2); out.push({ m: Math.round((1 + Math.pow(d, 2.2) * 5) * 10) / 10, worm: false }); }
  let seed = 11;
  const nx = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let k = 0; k < (S.loot.zone || 0) + E('pzone'); k++) out[Math.floor(nx() * n)].m += 1;
  for (let k = 0; k < (S.loot.worm || 0); k++) out[Math.floor(nx() * n)].worm = true;
  return out;
}
function pinData() {
  const total = (PIN_ROWS * (PIN_ROWS + 3)) / 2, kinds = new Array(total).fill(0), rank = new Array(total).fill(0);
  let seed = 7; const nx = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let k = 0; k < (S.loot.pin || 0); k++) rank[Math.floor(nx() * total)]++;
  for (let k = 0; k < (S.loot.dupli || 0); k++) kinds[Math.floor(nx() * total)] = 1;
  for (let k = 0; k < (S.loot.refine || 0); k++) kinds[Math.floor(nx() * total)] = 2;
  return { kinds, rank };
}
function plinkoRun(r, reason) {
  const list = Object.entries(r.ore).map(([id, q]) => ({ o: oreById[id], q })).filter(x => x.o);
  for (let i = 0; i < (S.loot.oreplus || 0); i++) { const av = oreUnlocked(); if (av.length) { const o = pick(av); const f = list.find(x => x.o === o); if (f) f.q++; else list.push({ o, q: 1 }); } }
  const totalOre = list.reduce((a, x) => a + x.q, 0);
  if (!totalOre) { showModal(`<h2>${reason}</h2><p>광석을 하나도 못 가져왔어요.<br>🌳 스킬 트리에서 연료·화력부터 올려 보세요.</p><div class="row" style="justify-content:center"><button class="btn go" onclick="hideModal()">확인</button></div>`); return; }
  showModal(`<h2>${reason}</h2>
    <div class="res"><div>구역<b>${r.sector}</b></div><div>파괴한 소행성<b>${r.killed}</b></div><div>수집 광석<b>${fmt(totalOre)}</b></div><div>열쇠<b>🔑 ${r.keys}</b></div></div>
    <div class="orelist">${list.map(x => `<span class="ol" style="color:${x.o.c}">${x.o.n} ×${fmt(x.q)}</span>`).join('')}</div>
    <canvas id="plinko" width="360" height="330"></canvas>
    <div style="font-size:22px;color:var(--gold);margin-top:5px">💰 <b id="psum">0</b></div>
    <div class="row" style="justify-content:center"><button class="btn go" id="pdone" disabled>처리 중…</button></div>`);
  runPlinko(list, r);
}
function runPlinko(list, r) {
  const cvp = $('plinko'); if (!cvp) return;
  const c = cvp.getContext('2d'), Wp = cvp.width, Hp = cvp.height;
  const Z = zones(), PD = pinData();
  const top = 30, gapY = (Hp - top - 52) / PIN_ROWS, pegs = [];
  let idx = 0;
  for (let row = 0; row < PIN_ROWS; row++) { const n = row + 2, gx = Wp / (n + 1); for (let i = 0; i < n; i++) { pegs.push({ x: gx * (i + 1), y: top + row * gapY, kind: PD.kinds[idx] || 0, rank: PD.rank[idx] || 0, i: idx }); idx++; } }
  const queue = [];
  for (const x of list) { const cap = Math.min(x.q, 240), mul = x.q > 240 ? x.q / 240 : 1; for (let i = 0; i < cap; i++) queue.push({ o: x.o, mul }); }
  const balls = []; let sum = 0, dropT = 0;
  const dropIv = Math.max(.03, .12 * Math.pow(.93, S.loot.speed || 0) * (1 - Math.min(.5, E('pspeed') + artiB('skull'))));
  const perDrop = 1 + E('pdrop'), cash = (S.loot.cash || 0) * 25;
  const up = oreUnlocked();
  function step() {
    for (let k = 0; k < (window.__fastPlinko || Math.round(3 * __spd)); k++) {
      dropT -= 1 / 180;
      if (queue.length && dropT <= 0) { dropT = dropIv; for (let d = 0; d < perDrop && queue.length; d++) { const q = queue.shift(); balls.push({ x: Wp / 2 + rnd(-8, 8), y: 5, vx: rnd(-25, 25), vy: 0, o: q.o, mul: q.mul, bonus: 0, hits: {}, age: 0 }); } }
      for (const b of balls) {
        if (b.done) continue;
        b.age = (b.age || 0) + 1 / 180;
        if (b.age > 6) { b.y = Hp - 27; }   // 핀 사이에 끼면 강제로 떨어뜨림
        b.vy += 640 / 180; b.x += b.vx / 180; b.y += b.vy / 180;
        for (const p of pegs) {
          if (Math.hypot(b.x - p.x, b.y - p.y) >= 9) continue;
          const a = Math.atan2(b.y - p.y, b.x - p.x);
          b.x = p.x + Math.cos(a) * 9; b.y = p.y + Math.sin(a) * 9;
          b.vx = Math.cos(a) * 155 + rnd(-35, 35); b.vy = Math.abs(Math.sin(a)) * 95 + 45;
          if (p.rank && !b.hits[p.i]) { b.hits[p.i] = 1; b.bonus += p.rank; }
          if (p.kind === 1 && !b.duped) { b.duped = 1; balls.push({ x: b.x + 6, y: b.y, vx: -b.vx, vy: b.vy, o: b.o, mul: b.mul, bonus: b.bonus, hits: {}, age: 0 }); }
          if (p.kind === 2) { const i2 = up.indexOf(b.o); if (i2 >= 0 && i2 < up.length - 1) b.o = up[i2 + 1]; }
        }
        if (b.x < 5) { b.x = 5; b.vx = Math.abs(b.vx); } if (b.x > Wp - 5) { b.x = Wp - 5; b.vx = -Math.abs(b.vx); }
        if (b.y > Hp - 28) {
          const zi = clamp(Math.floor(b.x / (Wp / Z.length)), 0, Z.length - 1), z = Z[zi];
          if (z.worm && Math.random() < .5) { b.y = 5; b.vy = 0; b.vx = rnd(-25, 25); continue; }
          b.done = 1;
          const val = (b.o.v + b.bonus) * z.m * b.mul * (hasP('prospect') && b.o.v >= 125 ? 2 : 1);
          sum += val; S.cred += val; S.totalCred += val;
          const el = $('psum'); if (el) el.textContent = fmt(sum);
        }
      }
    }
    c.fillStyle = '#080c26'; c.fillRect(0, 0, Wp, Hp);
    for (const p of pegs) { c.fillStyle = p.kind === 1 ? '#6cf09a' : p.kind === 2 ? '#b58cff' : p.rank ? '#ffd36b' : '#3f4a80'; c.beginPath(); c.arc(p.x, p.y, p.kind || p.rank ? 5 : 4, 0, 6.28); c.fill(); }
    const bw = Wp / Z.length;
    for (let i = 0; i < Z.length; i++) { const z = Z[i];
      c.fillStyle = z.worm ? 'rgba(181,140,255,.35)' : z.m >= 4 ? 'rgba(255,211,107,.28)' : z.m >= 2 ? 'rgba(108,240,154,.2)' : 'rgba(70,80,140,.2)';
      c.fillRect(i * bw + 1, Hp - 26, bw - 2, 24);
      c.fillStyle = z.worm ? '#d9c6ff' : z.m >= 4 ? '#ffd36b' : '#93a0d8'; c.font = '10px Jua'; c.textAlign = 'center';
      c.fillText(z.worm ? '🕳️' : '×' + z.m, i * bw + bw / 2, Hp - 9); }
    for (const b of balls) { if (b.done) continue; c.fillStyle = b.o.c; c.beginPath(); c.arc(b.x, b.y, 4.5, 0, 6.28); c.fill(); }
    if (!queue.length && balls.every(b => b.done)) {
      if (cash) { sum += cash; S.cred += cash; S.totalCred += cash; }
      sum += r.cred;
      const el = $('psum'); if (el) el.textContent = fmt(sum);
      const btn = $('pdone'); if (btn) { btn.disabled = false; btn.textContent = `💰 ${fmt(sum)} 받기`; btn.onclick = () => { hideModal(); if (sum > S.bestRun) S.bestRun = sum; save(); renderBase(); }; }
      return;
    }
    requestAnimationFrame(step);
  }
  step();
}

      <div class="step"><div class="no">5</div><p>귀환하면 광석이 <b>🎰 플링코</b>로 떨어져 크레딧이 됩니다. 핀에 맞을수록 가치가 붙고, 점수 구역 배수로 곱해져요.</p></div>
      <div class="step"><div class="no">6</div><p><b>📦 전리품 상자</b>를 부수면 🔑 열쇠 — 열쇠로 <b>플링코를 개조</b>합니다(핀 희귀도·듀플리페그·정제기·웜홀). <b>🧰 무기 상자</b>는 폭발·관통·플라즈마 같은 임시 탄약을 줍니다.</p></div>
      <div class="step"><div class="no">7</div><p>크레딧은 <b>🌳 스킬 트리</b>에. 안 가본 갈래는 보이지 않아요. 깊이 가면 <b>✨ 명성</b>으로 영구 강화까지.</p></div>`;
    $('btnExport').onclick = () => { save(); const x = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(x).then(() => toast('저장 코드를 복사했어요')).catch(() => prompt('복사해 주세요', x)); };
    $('btnImport').onclick = () => { const x = prompt('저장 코드'); if (!x) return; try { const v = JSON.parse(decodeURIComponent(escape(atob(x.trim())))); if (!v || typeof v.cred !== 'number') throw 0; S = Object.assign(fresh(), v); save(); location.reload(); } catch (e) { toast('코드가 올바르지 않아요'); } };
    $('btnReset').onclick = () => { if (confirm('정말 처음부터?') && confirm('진짜로요?')) { localStorage.removeItem(SAVE_KEY); S = fresh(); location.reload(); } };
  }
}
function selNode(id) {
  const n = TREE_BY[id]; if (!n) return; sel = id;
  document.querySelectorAll('.tn').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  const l = lv(n.id);
  showSheet(n.ic, n.n + (n.max > 1 ? ` ${l}/${n.max}` : ''), n.ds || '', n.root || l >= n.max ? null : nodeCost(n), n.root ? '' : l >= n.max ? '<span style="color:var(--green)">✅ 최대</span>' : '');
}
function buyNode(id) {
  const n = TREE_BY[id]; if (!n || n.root) return;
  const c = nodeCost(n); if (lv(id) >= n.max || S.cred < c) return Sound.play('error');
  S.cred -= c; S.lv[id] = lv(id) + 1; Sound.play('correct');
  if (n.k && n.k.indexOf('am_') === 0) S.stash[n.k] = 1;
  const wrap = $('treewrap'), sl = wrap ? wrap.scrollLeft : 0, st = wrap ? wrap.scrollTop : 0;
  renderBase(); if ($('treewrap')) { $('treewrap').scrollLeft = sl; $('treewrap').scrollTop = st; }
  selNode(id); save();
}
function openLoot() {
  const n = Math.min(S.keys, 1 + E('multibox'));
  if (n < 1) return Sound.play('error');
  S.keys -= n;
  const got = [];
  for (let i = 0; i < n; i++) {
    const av = LOOT.filter(l => (S.loot[l.id] || 0) < l.max);
    if (!av.length) { S.cred += 10000; got.push({ n: '크레딧 +10,000', ic: '💰' }); continue; }
    const g = pick(av); S.loot[g.id] = (S.loot[g.id] || 0) + 1; got.push({ n: g.n + ' Lv.' + S.loot[g.id], ic: g.ic, ds: g.ds });
  }
  if (Math.random() < .1) { const av = ARTI.filter(a => !S.arti[a.id]); if (av.length) { const a = pick(av); S.arti[a.id] = 1; got.push({ n: '🏺 ' + a.n, ic: a.ic, ds: a.ds }); } }
  Sound.play('meld'); save();
  showModal(`<h2>📦 전리품 상자</h2>${got.map(g => `<div class="card" style="text-align:left;display:flex;gap:10px;align-items:center"><div style="font-size:28px">${g.ic}</div><div><b>${g.n}</b>${g.ds ? `<div style="font-size:12px;color:var(--dim)">${g.ds}</div>` : ''}</div></div>`).join('')}
    <div class="row" style="justify-content:center"><button class="btn go" onclick="hideModal(); renderBase();">좋아</button>${S.keys ? `<button class="btn hot" onclick="hideModal(); openLoot();">🔑 더 열기 (${S.keys})</button>` : ''}</div>`);
}
function essGain() { return Math.max(0, Math.floor(Math.pow(Math.max(0, S.maxSector - 8) / 3, 1.4))); }
function doPrestige() {
  const g = essGain(); if (g < 1) return;
  if (!confirm(`명성을 얻을까요?\n✨ +${g} 우주 정수를 받고 업그레이드가 초기화됩니다.`)) return;
  const keep = { ess: S.ess + g, pres: S.pres, arti: hasP('indiana') ? S.arti : {}, loot: hasP('plinkomem') ? S.loot : {}, lv: hasP('persist') ? S.lv : {}, stash: hasP('armory') ? S.stash : {},
    maxSector: S.maxSector, runs: S.runs, totalCred: S.totalCred, bestRun: S.bestRun, destroyed: S.destroyed, crashes: S.crashes, playTime: S.playTime, started: S.started, ores: S.ores, tab: 'prestige' };
  S = fresh(keep); save(); Sound.play('win');
  showModal(`<h2>✨ 명성</h2><div style="font-size:44px">✨</div><p>우주 정수 <b style="color:var(--purple)">+${g}</b><br>이제 영구 업그레이드를 살 수 있어요.</p><div class="row" style="justify-content:center"><button class="btn go" onclick="hideModal(); setTab('prestige');">보러 가기</button></div>`);
}
function showModal(h) { $('modalBox').innerHTML = h; $('modal').classList.add('show'); }
function hideModal() { $('modal').classList.remove('show'); }

// ═══ 시작 ═══
load(); setTab(S.tab || 'tree');
setInterval(() => { save(); if (!R) renderTop(); }, 5000);
addEventListener('beforeunload', save); addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.rock = { speed: setSpeed, get S() { return S; }, get R() { return R; }, TREE, TREE_BY, ORES, LOOT, ARTI, E, lv, zones, launch, endRun, warp, unlocked, nodeCost, buyNode, renderBase, setTab, save, cheat: (c, k, e) => { S.cred += c || 0; S.keys += k || 0; S.ess += e || 0; renderBase(); } };
</script>
