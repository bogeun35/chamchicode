<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참스코드 웨이브렝스</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --cream: #fff3d6; --ink: #2a2118; --a: #0ea5c6; --a-dark: #0b7590; --b: #f2771a; --b-dark: #b8520a; --gold: #ffd36b; --deep: #123a4a; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: #fff; -webkit-user-select: none; user-select: none; min-height: 100vh; overflow-x: hidden;
  background: linear-gradient(180deg, #1d6f86 0%, #17506a 45%, var(--deep) 100%) fixed; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .18; background:
  repeating-radial-gradient(circle at 50% 120%, rgba(255,255,255,.5) 0 2px, transparent 2px 46px); }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px); z-index: 95; background: var(--cream); color: var(--ink); padding: 10px 22px; border-radius: 999px; font-size: 15px; box-shadow: 0 6px 0 #0d3442, 0 10px 20px rgba(0,0,0,.3); opacity: 0; transition: all .25s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.screen { display: none; max-width: 560px; margin: 0 auto; padding: 14px 12px 60px; position: relative; }
.screen.active { display: block; }
.title { text-align: center; margin: 24px 0 4px; font-size: 36px; text-shadow: 3px 3px 0 #0d3442; }
.sub { text-align: center; opacity: .92; font-size: 15px; margin-bottom: 18px; }
.card { background: var(--cream); color: var(--ink); border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 4px solid #fff; box-shadow: 0 6px 0 #0d3442, 0 12px 24px rgba(0,0,0,.25); }
.card h3 { font-size: 15px; color: #0b7590; margin-bottom: 10px; }
.input { width: 100%; padding: 12px 14px; border: 3px solid #e6c58f; border-radius: 12px; font-size: 18px; font-family: inherit; color: var(--ink); background: #fff; outline: none; }
.input:focus { border-color: var(--a); }
.row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { padding: 11px 18px; border: 3px solid #fff; border-radius: 999px; font-family: inherit; font-size: 16px; cursor: pointer; background: #ff7b5e; color: #fff; box-shadow: 0 4px 0 #c9502e; transition: transform .08s; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9502e; }
.btn.green { background: #5cb85c; box-shadow: 0 4px 0 #3a7f3a; } .btn.green:active { box-shadow: 0 1px 0 #3a7f3a; }
.btn.blue { background: #2f9fd0; box-shadow: 0 4px 0 #1b6f94; } .btn.blue:active { box-shadow: 0 1px 0 #1b6f94; }
.btn.ta { background: var(--a); box-shadow: 0 4px 0 var(--a-dark); } .btn.ta:active { box-shadow: 0 1px 0 var(--a-dark); }
.btn.tb { background: var(--b); box-shadow: 0 4px 0 var(--b-dark); } .btn.tb:active { box-shadow: 0 1px 0 var(--b-dark); }
.btn.ghost { background: rgba(255,255,255,.15); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); font-size: 14px; padding: 8px 14px; } .btn.ghost:active { box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.light { background: #fff; color: #0b7590; box-shadow: 0 4px 0 #9fd3e2; font-size: 14px; padding: 8px 14px; } .btn.light:active { box-shadow: 0 1px 0 #9fd3e2; }
.btn.wide { width: 100%; } .btn:disabled { opacity: .45; cursor: default; transform: none; }
.code-big { font-family: monospace; font-size: 34px; letter-spacing: .25em; text-align: center; color: #0b4f63; margin: 6px 0; font-weight: bold; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 7px 14px; border-radius: 999px; background: #fff; border: 2px solid #e6c58f; font-size: 14px; cursor: pointer; color: var(--ink); min-height: 36px; display: inline-flex; align-items: center; }
.chip.on { background: var(--a); color: #fff; border-color: #fff; }
.chip.lock { cursor: default; }

/* 게임 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
.pill { background: rgba(0,0,0,.28); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.sc { border-radius: 16px; padding: 8px 10px; text-align: center; border: 3px solid rgba(255,255,255,.35); position: relative; }
.sc.a { background: linear-gradient(180deg, #2bc0dd, var(--a-dark)); } .sc.b { background: linear-gradient(180deg, #ff9a4d, var(--b-dark)); }
.sc.turn { border-color: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.35); }
.sc b { display: block; font-size: 30px; line-height: 1; text-shadow: 2px 2px 0 rgba(0,0,0,.25); }
.sc span { font-size: 13px; opacity: .95; }
.sc .bar { height: 6px; border-radius: 999px; background: rgba(0,0,0,.25); margin-top: 5px; overflow: hidden; }
.sc .bar i { display: block; height: 100%; background: #fff; border-radius: 999px; transition: width .4s; }
.sc .now { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: #fff; color: var(--ink); font-size: 11px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.banner { text-align: center; font-size: 16px; padding: 9px 12px; border-radius: 14px; margin: 2px 0 8px; background: rgba(0,0,0,.28); border: 2px solid rgba(255,255,255,.15); }
.banner.hot { background: var(--gold); color: var(--ink); border-color: #fff; animation: glow 1.2s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 0 3px rgba(255,211,107,.25); } to { box-shadow: 0 0 0 8px rgba(255,211,107,.5); } }
.dialbox { background: var(--cream); border-radius: 22px; border: 4px solid #fff; box-shadow: 0 6px 0 #0d3442, 0 12px 24px rgba(0,0,0,.25); padding: 10px 10px 12px; margin-bottom: 10px; color: var(--ink); }
.clue { text-align: center; min-height: 40px; margin-bottom: 4px; }
.clue b { display: inline-block; font-size: 26px; padding: 2px 14px; border-radius: 12px; background: #fff; border: 3px solid #e6c58f; max-width: 100%; word-break: keep-all; }
.clue span { font-size: 14px; color: #8a7a6a; }
.dial { position: relative; touch-action: none; }
.dial svg { display: block; width: 100%; height: auto; overflow: visible; }
.dial.drag { cursor: grab; }
.ends { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.ends div { border-radius: 12px; padding: 7px 8px; font-size: 16px; line-height: 1.2; word-break: keep-all; }
.ends .l { background: #d9f3fa; color: #0b5f75; text-align: left; border: 2px solid #9fd8e8; }
.ends .r { background: #ffe6d1; color: #8a3f08; text-align: right; border: 2px solid #ffc499; }
.panel { background: var(--cream); color: var(--ink); border-radius: 20px; padding: 14px; border: 4px solid #fff; box-shadow: 0 6px 0 #0d3442, 0 12px 24px rgba(0,0,0,.25); margin-bottom: 10px; text-align: center; }
.panel h3 { font-size: 16px; color: #0b5f75; margin-bottom: 6px; }
.panel p { font-size: 14px; line-height: 1.5; color: #5a4a3a; }
.big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.big2 .btn { font-size: 20px; padding: 16px 8px; border-radius: 18px; }
.big2 .btn.sel { outline: 4px solid var(--gold); outline-offset: 2px; }
.pts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 6px 0; }
.pts div { border-radius: 14px; padding: 8px 14px; font-size: 18px; color: #fff; }
.pts .a { background: var(--a); } .pts .b { background: var(--b); } .pts .z { background: #b8a58a; }
.log { background: rgba(0,0,0,.25); border-radius: 12px; padding: 6px 12px; font-size: 13px; line-height: 1.5; }
.log div:first-child { color: var(--gold); }
.who { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 8px; }
.who span { font-size: 12.5px; border-radius: 999px; padding: 3px 9px; background: rgba(0,0,0,.25); }
.who span.psy { background: var(--gold); color: var(--ink); }
.who span.me { outline: 2px solid #fff; }
.pop { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 70; font-size: 44px; text-shadow: 3px 3px 0 rgba(0,0,0,.3); pointer-events: none; animation: popup 1.6s ease-out forwards; white-space: nowrap; }
@keyframes popup { 0% { transform: translate(-50%, -30%) scale(.6); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -90%) scale(1); opacity: 0; } }

/* 결과 */
.winbox { text-align: center; padding: 22px 10px; }
.winbox h1 { font-size: 34px; margin-bottom: 8px; }
.final { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
.final div { border-radius: 14px; padding: 10px 16px; color: #fff; font-size: 18px; }
.final .a { background: var(--a); } .final .b { background: var(--b); }
.hist { display: flex; flex-direction: column; gap: 6px; }
.hist div { background: #fff; border-radius: 12px; padding: 7px 10px; font-size: 13.5px; text-align: left; border-left: 6px solid var(--a); line-height: 1.4; }
.hist div.b { border-left-color: var(--b); }
.hist small { color: #8a7a6a; }

/* 규칙 */
.howto { display: flex; flex-direction: column; gap: 12px; }
.step { background: #fff; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.step .no { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--a-dark); color: #fff; display: grid; place-items: center; font-size: 16px; }
.step h4 { font-size: 16px; color: #0b5f75; margin-bottom: 4px; }
.step p { font-size: 13.5px; line-height: 1.55; color: #5a4a3a; } .step p b { color: #c0392b; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 80; padding: 14px; }
.modal.show { display: flex; }
.modal .card { width: 100%; max-width: 460px; margin: 0; max-height: 88vh; overflow-y: auto; }
.confetti { position: fixed; top: -20px; font-size: 22px; animation: fall linear forwards; pointer-events: none; z-index: 89; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }
#joinCode::placeholder, #nick::placeholder, #clueIn::placeholder { font-family: 'Jua', 'Malgun Gothic', sans-serif; letter-spacing: normal; text-transform: none; color: #b8a58a; }
#joinCode { font-family: monospace; letter-spacing: .2em; text-transform: uppercase; }
@media (max-width: 480px) {
  .title { font-size: 31px; }
  .sc b { font-size: 26px; }
  .clue b { font-size: 22px; }
  .ends div { font-size: 14.5px; }
  .big2 .btn { font-size: 18px; padding: 14px 6px; }
}
</style>
</head>

<div class="toast" id="toast"></div>

<section class="screen active" id="home">

  <div class="card"><h3>코드로 참가</h3><input class="input" id="joinCode" placeholder="6자리 코드" maxlength="6"><div class="row"><button class="btn blue wide" id="btnJoin">참가하기</button></div></div>
  <div class="card"><h3>❓ 어떻게 하나요? — 2분이면 배워요</h3><div class="howto" id="howtoHome"></div></div>
</section>

<section class="screen" id="lobby">

    <div class="row" style="justify-content:center"><button class="btn blue" id="btnCopyLink">🔗 링크 복사</button><button class="btn light" id="btnCopyCode">코드 복사</button></div></div>
  <div class="card"><h3>🏁 목표 점수 <span style="opacity:.6;font-size:12px" id="setWho"></span></h3><div class="chips" id="goalChips"></div></div>
  <div id="lobbyBox"></div>
  <div class="row"><button class="btn ghost wide" id="btnLeaveLobby">나가기</button></div>
</section>

<section class="screen" id="game">

    <button class="btn ghost" id="btnLeaveGame">나가기</button>
  </div>
  <div class="scores" id="scores"></div>
  <div class="banner" id="banner"></div>
  <div class="dialbox">

    <div class="dial" id="dial"></div>
    <div class="ends"><div class="l" id="endL"></div><div class="r" id="endR"></div></div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="log" id="log"></div>
</section>

<section class="screen" id="end">
  <div class="card winbox"><h1 id="winTitle">🏆</h1><div class="final" id="finalScore"></div></div>
  <div class="card"><h3>📜 지난 차례들</h3><div class="hist" id="hist"></div></div>
  <div class="row" id="endHost"><button class="btn green wide" id="btnAgain">🔁 같은 팀으로 다시</button><button class="btn blue wide" id="btnToLobby">🪑 대기실로</button></div>
  <div style="text-align:center;font-size:14px;margin-top:10px;opacity:.9" id="endHint"></div>
  <div class="row"><button class="btn ghost wide" id="btnLeaveEnd">나가기</button></div>
</section>

<div class="modal" id="rulesModal"><div class="card"><h3>❓ 어떻게 하나요?</h3><div class="howto" id="howtoModal"></div><button class="btn green wide" style="margin-top:12px" id="rulesClose">알겠어요!</button></div></div>

  const active = myT === g.turn, amPsy = psy === me;
  if (g.phase === 'clue') { hot = amPsy; text = amPsy ? '🔮 내가 사이킥! 빨간 목표를 보고 단서를 주세요' : `🔮 ${nickOf(psy)}(${TN[g.turn]})이 단서를 생각 중…`; }
  else if (g.phase === 'guess') { hot = active && !amPsy; text = amPsy ? '🤐 포커페이스! 팀이 바늘을 맞추는 중' : active ? '🎯 단서를 보고 바늘을 끌어서 맞추세요!' : `👀 ${TN[g.turn]}가 바늘을 맞추는 중`; }
  else if (g.phase === 'counter') { hot = myT === other(g.turn); text = hot ? '⚖️ 목표는 바늘보다 왼쪽? 오른쪽? (맞히면 +1)' : `⚖️ ${TN[other(g.turn)]}가 왼쪽/오른쪽을 고르는 중`; }
  else if (g.phase === 'reveal') text = '🎉 공개!';
  b.className = 'banner' + (hot ? ' hot' : ''); b.textContent = text;
  const hk = g.phase + g.turnNo;
  if (hot && renderGame._hot !== hk) UX.notify('turn');
  renderGame._hot = hot ? hk : null;
  // 단서 + 다이얼 + 양 끝
  $('clue').innerHTML = g.clue ? `<b>"${esc(g.clue)}"</b>` : `<span>${g.phase === 'clue' ? '단서를 기다리는 중…' : ''}</span>`;
  $('endL').textContent = '◀ ' + card[0]; $('endR').textContent = card[1] + ' ▶';
  drawDial();
  renderPanel(g);
  $('log').innerHTML = g.log.slice(0, 3).map(l => `<div>${esc(l)}</div>`).join('');
  Sound.log(g.log[0]);
  if (g.last && g.last.id !== lastTurnSeen) {
    const first = lastTurnSeen === null; lastTurnSeen = g.last.id;
    if (!first && g.phase === 'reveal') { pop(g.last.pts === 4 ? '🎯 정중앙! +4' : g.last.pts ? `+${g.last.pts}점!` : '😵 0점'); Sound.play(g.last.pts >= 3 ? 'win' : g.last.pts ? 'correct' : 'wrong'); }
  }
}
function whoHtml(g) {
  return ['a', 'b'].map(t => `<div class="who">${g.order[t].map(k => `<span class="${k === psyOf(g) && t === g.turn ? 'psy' : ''} ${k === myKey ? 'me' : ''}" style="${t === 'a' ? 'border-left:4px solid #0ea5c6' : 'border-left:4px solid #f2771a'}">${avatarOf(k)} ${esc(nickOf(k))}${k === psyOf(g) && t === g.turn ? ' 🔮' : ''}</span>`).join('')}</div>`).join('');
}
function renderPanel(g) {
  const P = $('panel'), me = myKey, myT = teamOfKey(me), psy = psyOf(g), amPsy = psy === me;
  if (g.phase === 'clue') {
    if (amPsy) {
      const keep = $('clueIn') ? $('clueIn').value : '';
      P.innerHTML = `<h3>🔮 단서 주기</h3><p>빨간 칸(4점)이 <b>${esc(CARDS[g.card][0])}</b> ↔ <b>${esc(CARDS[g.card][1])}</b> 사이 어디쯤인지 떠올리게 하는 말 하나!</p>
        <div class="row"><input class="input" id="clueIn" maxlength="24" placeholder="예: 라면, 월요일 아침, 첫사랑" enterkeyhint="done"></div>
        <div class="row"><button class="btn green wide" id="btnClue">📨 단서 보내기</button></div>`;
      $('clueIn').value = keep; $('btnClue').onclick = giveClue; $('clueIn').onkeydown = e => { if (e.key === 'Enter') giveClue(); };
    } else P.innerHTML = `<h3>${myT === g.turn ? '곧 우리 팀이 맞혀요!' : '상대 팀 차례예요'}</h3><p>사이킥 <b>${esc(nickOf(psy))}</b> 님만 목표 위치를 볼 수 있어요.</p>${isHost ? '<div class="row" style="justify-content:center"><button class="btn light" id="btnSkipPsy" style="font-size:13px">⏩ 사이킥 다음 사람에게</button></div>' : ''}${whoHtml(g)}`;
    if ($('btnSkipPsy')) $('btnSkipPsy').onclick = skipPsy;
    return;
  }
  if (g.phase === 'guess') {
    if (myT === g.turn && !amPsy) {
      P.innerHTML = `<h3>🎯 바늘을 끌어서 맞추세요</h3><p>다이얼 아무 데나 누르고 끌면 바늘이 움직여요. 팀원과 의논해서 확정!</p><div class="row"><button class="btn green wide" id="btnLock">🎯 여기로 확정</button></div>`;
      $('btnLock').onclick = lockDial;
    } else P.innerHTML = amPsy ? `<h3>🤐 말하면 안 돼요!</h3><p>팀이 바늘을 맞추는 동안 표정 관리…</p>${whoHtml(g)}` : `<h3>👀 상대 팀이 맞추는 중</h3><p>바늘이 멈추면 우리 팀이 <b>왼쪽/오른쪽</b>을 골라 1점을 노려요.</p>${whoHtml(g)}`;
    return;
  }
  if (g.phase === 'counter') {
    if (myT === other(g.turn)) {
      P.innerHTML = `<h3>⚖️ 목표는 바늘보다…</h3><p>맞히면 우리 팀 +1점 (상대가 정중앙 4점을 내면 무효)</p><div class="big2"><button class="btn ta" id="cL">◀ 왼쪽</button><button class="btn tb" id="cR">오른쪽 ▶</button></div>`;
      $('cL').onclick = () => confirm('왼쪽으로 할까요?') && counterGuess('L'); $('cR').onclick = () => confirm('오른쪽으로 할까요?') && counterGuess('R');
    } else P.innerHTML = `<h3>⚖️ 상대 팀이 고르는 중</h3><p>${TN[other(g.turn)]}가 목표가 바늘의 왼쪽인지 오른쪽인지 맞혀요.</p>`;
    return;
  }
  if (g.phase === 'reveal') {
    const L = g.last || {}, opp = other(L.team || g.turn);
    P.innerHTML = `<h3>${L.pts === 4 ? '🎯 정중앙!' : L.pts ? '👍 근처!' : '😵 아깝다!'}</h3>
      <div class="pts"><div class="${L.pts ? (L.team || g.turn) : 'z'}">${TN[L.team || g.turn]} +${L.pts || 0}</div><div class="${L.oppPt ? opp : 'z'}">${TN[opp]} ${L.oppPt ? '+1 방향 적중' : '+0'}</div></div>
      <p>${g.winner ? `🏆 ${TN[g.winner]}가 ${g.goal}점을 넘겼어요!` : L.again ? '🔥 정중앙을 냈는데 아직 뒤지고 있어서 같은 팀이 한 번 더!' : '다음은 상대 팀 차례예요.'}</p>
      <div class="row"><button class="btn green wide" id="btnNext">${g.winner ? '🏆 결과 보기' : '다음 차례 ▶'}</button></div>`;
    $('btnNext').onclick = nextTurn;
  }
}
// 승패가 난 공개 화면에서 '결과 보기'를 누르면 결과 화면으로
function renderEnd() {
  const g = norm(G());
  if (g.phase === 'reveal' && renderEnd._seen !== g.round) { renderGame(); $('btnNext').onclick = () => { renderEnd._seen = g.round; renderEnd(); }; return; }
  const was = show._last; show('end');
  const mine = teamOfKey(myKey);
  $('winTitle').textContent = `${TN[g.winner]} 승리! 🏆`;
  $('finalScore').innerHTML = `<div class="a">${TN.a} ${g.score.a}</div><div class="b">${TN.b} ${g.score.b}</div>`;
  $('hist').innerHTML = g.history.slice().reverse().map(h => `<div class="${h.team}"><b>${TN[h.team]} +${h.pts}</b>${h.oppPt ? ` <small>(상대 +1)</small>` : ''} · 🔮 ${esc(nickOf(h.psy))}: "${esc(h.clue)}"<br><small>${esc(CARDS[h.card][0])} ↔ ${esc(CARDS[h.card][1])}</small></div>`).join('');
  $('endHost').style.display = isHost ? '' : 'none';
  $('endHint').textContent = isHost ? '' : '방장이 다시 시작하거나 대기실로 돌아가면 같이 넘어가요';
  if (was !== 'end') { if (mine === g.winner) { confetti(); Sound.play('win'); } else Sound.play('lose'); }
}
function howtoHtml() {
  return `
  <div class="step"><div class="no">1</div><div><h4>사이킥만 목표를 봐요</h4><p>반원 다이얼 어딘가에 숨은 <b>목표</b>가 있어요. 차례인 팀의 🔮 사이킥(돌아가며 맡음)만 목표 위치를 봐요.</p></div></div>
  <div class="step"><div class="no">2</div><div><h4>단서는 딱 하나</h4><p>카드 양 끝(예: 차가운 ↔ 뜨거운)을 보고 목표 위치를 떠올리게 하는 말을 줘요. 예) 목표가 뜨거운 쪽 끝이면 "용암", 가운데쯤이면 "미지근한 커피".</p></div></div>
  <div class="step"><div class="no">3</div><div><h4>팀이 바늘을 맞춰요</h4><p>나머지 팀원이 의논해서 바늘을 끌어 확정해요. 가운데 정중앙 <b>4점</b>, 옆으로 3점, 2점.</p></div></div>
  <div class="step"><div class="no">4</div><div><h4>상대 팀은 왼쪽? 오른쪽?</h4><p>상대 팀은 목표가 바늘보다 왼쪽인지 오른쪽인지 걸어요. 맞히면 <b>+1점</b> (상대가 정중앙이면 무효).</p></div></div>
  <div class="step"><div class="no">🏁</div><div><h4>먼저 목표 점수!</h4><p>정해 둔 점수(기본 10점)를 먼저 내는 팀이 이겨요. 정중앙을 냈는데도 지고 있으면 한 번 더 할 수 있어요.</p></div></div>`;
}
$('btnRules').onclick = () => $('rulesModal').classList.add('show');
$('rulesClose').onclick = () => $('rulesModal').classList.remove('show');
$('rulesModal').onclick = e => { if (e.target === $('rulesModal')) $('rulesModal').classList.remove('show'); };
window.wavelength = { get room() { return room; }, get me() { return myKey; }, CARDS, scoreOf, ZONE };
</script>
