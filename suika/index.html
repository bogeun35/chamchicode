<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수박게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #c8874a;
    font-family: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; user-select: none; -webkit-user-select: none;
  }
  #gameBox { position: relative; }
  #game { display: block; cursor: crosshair; touch-action: none; }
  #menuBtn {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    padding: 5px 14px; border: 3px solid #fff; border-radius: 999px;
    background: #ffefd0; color: #8a5a2a; font-size: 15px; font-family: inherit;
    cursor: pointer; box-shadow: 0 3px 0 #9c6532;
  }
  #menuBtn:hover { background: #fff; }
  #menuBtn:active { transform: translate(-50%, 2px); box-shadow: 0 1px 0 #9c6532; }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(90,50,20,.6); color: #fff;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px;
    text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { font-size: 44px; text-shadow: 3px 3px 0 #9a5a2a; }
  .overlay h2 { font-size: 26px; text-shadow: 2px 2px 0 #9a5a2a; }
  .overlay p { font-size: 18px; text-shadow: 2px 2px 0 #9a5a2a; line-height: 1.5; }
  .overlay .small { font-size: 14px; opacity: .9; }
  .btn {
    padding: 12px 34px; border: 3px solid #fff; border-radius: 999px;
    background: #ff7b5e; color: #fff; font-size: 20px; font-family: inherit;
    cursor: pointer; box-shadow: 0 5px 0 #c9502e;
  }
  .btn.alt { background: #6fbf73; box-shadow: 0 5px 0 #3e8a42; }
  .btn.ghost { background: rgba(255,255,255,.2); box-shadow: 0 5px 0 rgba(0,0,0,.25); font-size: 16px; padding: 8px 22px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .modes { display: flex; gap: 16px; }
  .mode {
    width: 170px; padding: 16px 12px; border-radius: 20px; cursor: pointer;
    background: #fff3d6; color: #6a4a2a; border: 4px solid #fff; box-shadow: 0 6px 0 #b8834a;
  }
  .mode:hover { background: #fff; }
  .mode:active { transform: translateY(3px); box-shadow: 0 3px 0 #b8834a; }
  .mode .ic { font-size: 40px; }
  .mode .nm { font-size: 22px; margin-top: 4px; }
  .mode .ds { font-size: 13px; color: #9a7a5a; margin-top: 6px; line-height: 1.4; }

  .cards { display: flex; gap: 12px; }
  .card {
    width: 128px; padding: 14px 10px; border-radius: 18px; cursor: pointer;
    background: #fff3d6; color: #6a4a2a; border: 4px solid #fff; box-shadow: 0 6px 0 #b8834a;
    transition: transform .08s;
  }
  .card:hover { transform: translateY(-4px); background: #fff; }
  .card .ic { font-size: 38px; }
  .card .nm { font-size: 17px; margin-top: 4px; }
  .card .ds { font-size: 12px; color: #9a7a5a; margin-top: 6px; line-height: 1.4; }
  .card .key { font-size: 11px; color: #c9a06a; margin-top: 6px; }
</style>
</head>
<body>
<div id="gameBox">
  <canvas id="game"></canvas>
  <button id="menuBtn">메뉴</button>

  <div id="start" class="overlay">
    <h1>🍉 수박게임</h1>
    <div class="modes">
      <div class="mode" id="modeClassic">
        <div class="ic">🍒</div>
        <div class="nm">클래식</div>
        <div class="ds">끝없이 쌓기<br>최고 점수 도전</div>
      </div>
      <div class="mode" id="modeRogue">
        <div class="ic">🎲</div>
        <div class="nm">로그라이크</div>
        <div class="ds">점수마다 유물 3택1<br>대신 저주가 쌓임</div>
      </div>
    </div>
    <p class="small" id="records"></p>
  </div>

  <div id="cards" class="overlay" hidden>
    <h2 id="cardsTitle">🎁 유물 획득!</h2>
    <p class="small">유물 하나를 고르세요 (1 / 2 / 3)</p>
    <div class="cards" id="cardList"></div>
    <p class="small" id="cardsCurse"></p>
  </div>

  <div id="over" class="overlay" hidden>
    <h1>게임 오버</h1>
    <p id="overText"></p>
    <button class="btn" id="retry">다시 하기</button>
    <button class="btn ghost" id="toMenu">메뉴로</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="fruit-art.js"></script>
<script>
(() => {
  const { Engine, Bodies, Body, Composite, Events } = Matter;

  // ── 설정 ─────────────────────────────────────────────
  const W = 460, H = 850;                       // 게임 좌표계
  const BOX_W = 416, BOX_CX = 230;              // 상자 기본 폭 / 중심
  const BOX = { l: 22, r: 438, t: 260, b: 765 };  // 상자 안쪽 영역 (l/r 은 상자 폭에 따라 바뀜)
  const RIM = 26;                               // 상자 윗테두리 원근 높이
  const WALL = 120;                             // 벽 두께 — 얇으면 빠른 과일이 뚫고 나감 (실측)
  const DROP_Y = 185;                           // 손에 든 과일 중심 높이
  const deadY = () => BOX.t + 4 - cfg.ceilingOffset;   // 이 선 위에 과일이 머물면 게임 오버 (천장 유물/저주로 오르내림)
  const DROP_COOLDOWN = 250;                    // ms — 클릭 후 다음 과일까지
  const MAX_SPEED = 18;                         // px/step 상한 — 과일끼리 뚫고 지나가는 것 방지

  const SHAKE_TIME = 700;                       // ms

  const FRUITS = [
    { name: '체리',     r: 14,  color: '#e0313f', score: 1 },
    { name: '딸기',     r: 20,  color: '#ff5a5a', score: 3 },
    { name: '포도',     r: 27,  color: '#9b5de5', score: 6 },
    { name: '한라봉',   r: 34,  color: '#ffb02e', score: 10 },
    { name: '감',       r: 41,  color: '#ff8c2e', score: 15 },
    { name: '사과',     r: 49,  color: '#e63946', score: 21 },
    { name: '배',       r: 58,  color: '#f6e58d', score: 28 },
    { name: '복숭아',   r: 67,  color: '#ffb6b9', score: 36 },
    { name: '파인애플', r: 77,  color: '#ffd43b', score: 45 },
    { name: '멜론',     r: 88,  color: '#b8e994', score: 55 },
    { name: '수박',     r: 100, color: '#4caf50', score: 66 },
  ];
  const ART = window.FRUIT_ART;
  const artBroken = [];   // 그리다 에러난 과일은 폴백으로 (아트 파일 수정 중이어도 게임은 돌아가게)

  // ── 로그라이크: 규칙 묶음(cfg) — 유물/저주가 이 값을 바꾼다 ──
  const BASE_CFG = {
    minDrop: 0, maxDrop: 4,     // 손에 쥐는 과일 단계 범위
    nextCount: 3,               // 미리보기 개수
    gravity: 2.0,
    restitution: 0.05,
    friction: 0.3,              // 과일 마찰 (높으면 덜 굴러 안정적으로 쌓임)
    inertiaMul: 0.15,           // 낮을수록 잘 돈다
    scoreMul: 1,
    deadTime: 1000,             // 게임오버 유예 ms
    boxScale: 1,                // 상자 폭 배율
    ceilingOffset: 0,           // 게임오버 선 이동 (+ 위로 = 여유, − 아래로 = 압박)
    melonBonus: 0,              // 수박 만들 때 추가 점수
    combo: false,               // 3초 안에 연속 합체 시 점수 ×1.5
    chainPop: 0,                // 합체 시 근처 작은 과일 하나 펑 확률
    rainbowEvery: 0,            // 합체 N번마다 무지개 (0=없음)
    cleanupEvery: 0,            // 합체 N번마다 체리·딸기 전부 삭제 (0=없음)
    magnet: false,              // 같은 과일끼리 끌림
    insurance: false,           // 게임오버 1회 방어
    quakeEvery: 0,              // ms 마다 지진 (0=없음)
    cherryRainEvery: 0,         // ms 마다 체리 3개 낙하 (0=없음)
    hurryMs: 0,                 // 이 시간 안에 안 떨어뜨리면 자동 낙하 (0=없음)
    dropJitter: 0,              // 떨어뜨릴 때 좌우 오차 px
    fogNext: false,             // Next 가림
  };
  // 유물: 전부 "더 오래 버티기 / 수박 더 만들기" 에 직접 도움되는 것만
  const RELICS = [
    { key: 'noCherry',  icon: '🍓', name: '체리 졸업',    desc: '체리가 안 나옴 → 자잘한 과일이 줄어듦',        apply: c => { c.minDrop = Math.max(c.minDrop, 1); } },
    { key: 'next5',     icon: '🔮', name: '미리보기 5개',  desc: 'Next 를 5개까지 보고 자리 계획',               apply: c => { c.nextCount = 5; } },
    { key: 'wideBox',   icon: '📏', name: '넓은 상자',     desc: '상자 폭 +10% → 더 많이 쌓임',                  apply: c => { c.boxScale += 0.10; } },
    { key: 'ceiling',   icon: '⬆️', name: '높은 천장',     desc: '게임오버 선이 40px 위로 올라감',               apply: c => { c.ceilingOffset += 40; } },
    { key: 'insurance', icon: '🛡️', name: '보험',          desc: '게임오버 1번 막아줌 (위쪽 과일 전부 삭제)',    apply: c => { c.insurance = true; } },
    { key: 'cleanup',   icon: '🧹', name: '청소',          desc: '합체 20번마다 체리·딸기가 전부 사라짐',        apply: c => { c.cleanupEvery = 20; } },
    { key: 'chainPop',  icon: '💣', name: '연쇄 폭발',     desc: '합체할 때 15% 확률로 옆의 작은 과일 펑',       apply: c => { c.chainPop += 0.15; } },
    { key: 'rainbow',   icon: '🌈', name: '무지개 주기',   desc: '합체 12번마다 아무 과일과 합쳐지는 무지개',    apply: c => { c.rainbowEvery = 12; } },
    { key: 'magnet',    icon: '🧲', name: '자석',          desc: '같은 과일끼리 가까우면 서로 끌려 합쳐짐',      apply: c => { c.magnet = true; } },
    { key: 'antiSlip',  icon: '🧱', name: '미끄럼 방지',   desc: '과일이 덜 굴러 무너지지 않고 쌓임',            apply: c => { c.friction = 0.7; c.inertiaMul *= 2; } },
    { key: 'melonBonus',icon: '🍉', name: '수박 보너스',   desc: '수박 만들 때마다 +200점 (유물이 빨리 옴)',     apply: c => { c.melonBonus += 200; } },
    { key: 'combo',     icon: '🔥', name: '콤보',          desc: '3초 안에 연속 합체하면 점수 ×1.5',             apply: c => { c.combo = true; } },
  ];
  // 저주: 전부 눈에 보이는 불이익
  const CURSES = [
    { key: 'narrow',     icon: '📐', name: '좁은 상자',    desc: '상자 폭 −15%',                          apply: c => { c.boxScale -= 0.15; } },
    { key: 'lowCeiling', icon: '⬇️', name: '낮은 천장',    desc: '게임오버 선이 40px 내려옴',              apply: c => { c.ceilingOffset -= 40; } },
    { key: 'bigOnly',    icon: '🍊', name: '큰 과일만',    desc: '포도~사과만 나와서 금방 참',             apply: c => { c.minDrop = Math.max(c.minDrop, 2); c.maxDrop = 5; } },
    { key: 'cherryRain', icon: '🍒', name: '체리 비',      desc: '15초마다 체리 3개가 떨어짐',             apply: c => { c.cherryRainEvery = 15000; } },
    { key: 'hurry',      icon: '⏱', name: '재촉',         desc: '4초 안에 안 떨어뜨리면 자동 낙하',       apply: c => { c.hurryMs = 4000; } },
    { key: 'shakyHand',  icon: '🫨', name: '떨리는 손',    desc: '떨어뜨릴 때 좌우로 ±25px 빗나감',        apply: c => { c.dropJitter = 25; } },
    { key: 'quake',      icon: '🌋', name: '지진',         desc: '20초마다 상자가 흔들림',                 apply: c => { c.quakeEvery = 20000; } },
    { key: 'fog',        icon: '🌫️', name: '안개',         desc: 'Next 가 안 보임',                        apply: c => { c.fogNext = true; } },
  ];
  // 유물 지급 점수: 500, 750, 1050, 1500, 2200, 3200, 4650, ... (×1.45)
  const milestoneTarget = i => Math.round(500 * Math.pow(1.45, i) / 50) * 50;
  const WATERMELON_BONUS = 100;     // 수박 두 개가 닿아 사라질 때 보너스

  // ── DOM ──────────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startEl = document.getElementById('start');
  const cardsEl = document.getElementById('cards');
  const overEl = document.getElementById('over');

  let scale = 1;
  function resize() {
    const maxH = window.innerHeight - 16;
    const maxW = window.innerWidth - 16;
    scale = Math.min(1, maxH / H, maxW / W);
    canvas.width = W * devicePixelRatio * scale;
    canvas.height = H * devicePixelRatio * scale;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ── 물리 ─────────────────────────────────────────────
  const engine = Engine.create({ gravity: { x: 0, y: 2.0 } });
  const world = engine.world;
  engine.positionIterations = 10;   // 높을수록 덜 물렁하게 쌓임
  engine.velocityIterations = 8;

  let walls = [];
  function buildWalls() {
    Composite.remove(world, walls);
    const wallOpt = { isStatic: true, friction: 0.3, restitution: 0, label: 'wall' };
    walls = [
      Bodies.rectangle((BOX.l + BOX.r) / 2, BOX.b + WALL / 2, BOX.r - BOX.l + WALL * 2, WALL, wallOpt),
      Bodies.rectangle(BOX.l - WALL / 2, H / 2, WALL, H * 3, wallOpt),
      Bodies.rectangle(BOX.r + WALL / 2, H / 2, WALL, H * 3, wallOpt),
    ];
    Composite.add(world, walls);
  }

  function makeFruit(x, y, level) {
    const f = FRUITS[level];
    const b = Bodies.circle(x, y, f.r, {
      label: 'fruit',
      restitution: cfg.restitution,   // 튕김 최소 (고무 느낌 제거)
      friction: cfg.friction,         // 마찰이 있어야 굴러간다
      frictionStatic: 0.5,
      frictionAir: 0.002,             // 각속도에도 적용 — 낮을수록 오래 돈다 (속도 상한은 MAX_SPEED가 담당)
      density: 0.0012,
    });
    Body.setInertia(b, b.inertia * cfg.inertiaMul);        // 관성↓ → 살짝만 닿아도 돈다
    Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.3); // 떨굴 때부터 회전
    b.level = level;
    b.born = performance.now();
    b.deadSince = 0;
    return b;
  }

  // ── 게임 상태 ────────────────────────────────────────
  let mode = 'classic';
  let cfg = { ...BASE_CFG };
  let score = 0, best = +(localStorage.getItem('suika_best') || 0);
  let rogueBest = JSON.parse(localStorage.getItem('suika_rogue_best') || '{"score":0,"melons":0}');
  if (rogueBest.melons === undefined) rogueBest = { score: 0, melons: 0 };
  let current = null;       // 손에 쥐고 있는 과일 level
  let nextQueue = [];       // 다음 과일들
  let mouseX = W / 2, mouseY = 0;
  let canDrop = true;
  let gameOver = false;
  let paused = true;        // 오버레이 떠 있을 때 물리 정지
  let mergeQueue = [];
  let effects = [];
  let shakeUntil = 0;                     // 흔들기(지진) 진행 중
  let mergeCount = 0;                     // 무지개 주기 카운터
  let lastMergeAt = 0;                    // 콤보 판정용
  let toast = null;                       // { text, t } 화면 안내
  let holdWild = false;                   // 손에 든 과일이 무지개
  // 런 상태 (클래식도 시간/수박 수는 셈)
  let relics = [], curses = [], milestoneIdx = 0;
  let melons = 0, runTime = 0, lastQuake = 0, lastRain = 0;
  let insuranceUsed = false;
  let holdSince = 0;                      // 손에 든 과일을 잡은 시각 (재촉 저주용)

  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const randLevel = () => cfg.minDrop + Math.floor(Math.random() * (cfg.maxDrop - cfg.minDrop + 1));
  const fruitsInBox = () => Composite.allBodies(world).filter(b => b.label === 'fruit');

  function clampX(x, level) {
    const r = FRUITS[level].r;
    return Math.max(BOX.l + r + 2, Math.min(BOX.r - r - 2, x));
  }

  function addScore(gain) {
    score += gain;
    if (mode === 'classic' && score > best) { best = score; localStorage.setItem('suika_best', best); }
  }

  function computeCfg() {
    const c = { ...BASE_CFG };
    for (const r of relics) r.apply(c);
    for (const r of curses) r.apply(c);
    c.boxScale = Math.max(0.6, Math.min(1.3, c.boxScale));
    return c;
  }
  function applyCfg() {
    cfg = computeCfg();
    const w = BOX_W * cfg.boxScale;
    BOX.l = Math.round(BOX_CX - w / 2);
    BOX.r = Math.round(BOX_CX + w / 2);
    buildWalls();
    engine.gravity.y = cfg.gravity;
    for (const b of fruitsInBox()) {   // 상자가 좁아졌으면 벽 안으로
      const r = FRUITS[b.level].r;
      const x = Math.max(BOX.l + r + 1, Math.min(BOX.r - r - 1, b.position.x));
      if (x !== b.position.x) Body.setPosition(b, { x, y: b.position.y });
    }
    while (nextQueue.length < cfg.nextCount) nextQueue.push(randLevel());
    if (nextQueue.length > cfg.nextCount) nextQueue.length = cfg.nextCount;
  }

  function clearBoard() {
    fruitsInBox().forEach(b => Composite.remove(world, b));
    mergeQueue = [];
    effects = [];
    shakeUntil = 0;
    holdWild = false;
    canDrop = true;
    current = randLevel();
    nextQueue = Array.from({ length: cfg.nextCount }, randLevel);
  }

  function newGame(m) {
    mode = m;
    score = 0; gameOver = false;
    mergeCount = 0; lastMergeAt = 0; toast = null;
    relics = []; curses = []; milestoneIdx = 0;
    melons = 0; runTime = 0; lastQuake = lastRain = performance.now();
    insuranceUsed = false; holdSince = 0;
    applyCfg();
    clearBoard();
    if (mode === 'rogue') showToast(`${milestoneTarget(0)}점에서 첫 유물!`, 2500);
    startEl.hidden = true; cardsEl.hidden = true; overEl.hidden = true;
    paused = false;
  }

  function showToast(text, ms = 1800) { toast = { text, t: performance.now(), ms }; }

  // ── 로그라이크: 점수 마일스톤마다 유물 3택1, 두 번째부터는 저주도 하나 ──
  function checkMilestone() {
    if (mode !== 'rogue' || paused || gameOver) return;
    if (score >= milestoneTarget(milestoneIdx)) offerRelics();
  }

  function offerRelics() {
    paused = true;
    const pool = RELICS.filter(r => !relics.includes(r));
    const offer = [];
    while (offer.length < 3 && pool.length) offer.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    const cursePool = CURSES.filter(c => !curses.includes(c));
    const pendingCurse = milestoneIdx >= 1 && cursePool.length ? pick(cursePool) : null;
    if (!offer.length) { takeRelic(null, pendingCurse); return; }
    document.getElementById('cardsTitle').textContent = `🎁 ${milestoneTarget(milestoneIdx)}점 달성 — 유물 획득!`;
    document.getElementById('cardsCurse').innerHTML = pendingCurse
      ? `⚠️ 대신 저주가 붙습니다: <b>${pendingCurse.icon} ${pendingCurse.name}</b> — ${pendingCurse.desc}`
      : '첫 유물은 저주 없이!';
    const list = document.getElementById('cardList');
    list.innerHTML = '';
    offer.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `<div class="ic">${r.icon}</div><div class="nm">${r.name}</div><div class="ds">${r.desc}</div><div class="key">[${i + 1}]</div>`;
      el.onclick = () => takeRelic(r, pendingCurse);
      list.appendChild(el);
    });
    cardsEl.hidden = false;
    cardsEl._offer = offer;
    cardsEl._curse = pendingCurse;
  }

  function takeRelic(relic, pendingCurse) {
    cardsEl.hidden = true;
    if (relic) relics.push(relic);
    if (pendingCurse) curses.push(pendingCurse);
    milestoneIdx++;
    applyCfg();                      // 상자는 그대로, 규칙만 갱신
    const parts = [];
    if (relic) parts.push(`${relic.icon} ${relic.name}`);
    if (pendingCurse) parts.push(`${pendingCurse.icon} ${pendingCurse.name}`);
    showToast(parts.join('  +  ') + `  · 다음 유물 ${milestoneTarget(milestoneIdx)}점`, 3000);
    paused = false;
  }


  function drop() {
    if (!canDrop || gameOver || paused || current === null) return;
    const jitter = cfg.dropJitter ? (Math.random() * 2 - 1) * cfg.dropJitter : 0;
    const x = clampX(mouseX + jitter, current);
    const b = makeFruit(x, DROP_Y, current);
    if (holdWild) { b.wild = true; holdWild = false; }
    holdSince = 0;
    Body.setVelocity(b, { x: 0, y: 4 });   // 바로 떨어지기 시작 (반응 빠르게)
    Composite.add(world, b);
    current = null;
    canDrop = false;
    setTimeout(() => {
      current = nextQueue.shift();
      nextQueue.push(randLevel());
      canDrop = true;
    }, DROP_COOLDOWN);
  }

  function useInsurance() {
    insuranceUsed = true;
    const now = performance.now();
    for (const b of fruitsInBox()) {
      if (b.position.y < BOX.t + 220) {
        Composite.remove(world, b);
        effects.push({ x: b.position.x, y: b.position.y, r: FRUITS[b.level].r, t: now, pop: true });
      } else b.deadSince = 0;
    }
    showToast('🛡️ 보험 발동! 위쪽 과일 삭제', 2500);
  }

  function rainCherries(n) {
    for (let i = 0; i < n; i++) {
      const x = BOX.l + 40 + Math.random() * (BOX.r - BOX.l - 80);
      const b = makeFruit(x, DROP_Y - 30 - i * 30, 0);
      Body.setVelocity(b, { x: (Math.random() - 0.5) * 2, y: 3 });
      Composite.add(world, b);
    }
    showToast('🍒 체리 비!');
  }

  function endGame() {
    gameOver = true;
    let text = `점수 ${score} · 🍉 ${melons}개 · ⏱ ${fmtTime(runTime)}`;
    if (mode === 'rogue') {
      text += `<br><span class="small">유물: ${relics.map(r => r.icon).join(' ') || '없음'}   저주: ${curses.map(c => c.icon).join(' ') || '없음'}</span>`;
      if (score > rogueBest.score) {
        rogueBest = { score, melons };
        localStorage.setItem('suika_rogue_best', JSON.stringify(rogueBest));
        text += '<br><span class="small">🏅 최고 기록 갱신!</span>';
      }
    }
    document.getElementById('overText').innerHTML = text;
    overEl.hidden = false;
  }

  // ── 충돌 → 합치기 ────────────────────────────────────
  Events.on(engine, 'collisionStart', ev => {
    for (const { bodyA: a, bodyB: b } of ev.pairs) {
      if (a.label !== 'fruit' || b.label !== 'fruit') continue;
      if (a.merging || b.merging) continue;
      if (a.wild || b.wild) {                       // 무지개: 닿은 과일의 다음 단계로
        const other = a.wild ? b : a;
        if (other.wild || other.level >= FRUITS.length - 1) continue;
        a.merging = b.merging = true;
        mergeQueue.push([a, b, other.level + 1]);
        continue;
      }
      if (a.level !== b.level) continue;
      a.merging = b.merging = true;
      mergeQueue.push([a, b, a.level >= FRUITS.length - 1 ? -1 : a.level + 1]);   // -1 = 수박 둘 소멸
    }
  });

  Events.on(engine, 'beforeUpdate', () => {
    const now = performance.now();
    const shaking = now < shakeUntil;
    const kick = shaking ? Math.sin((shakeUntil - now) / SHAKE_TIME * Math.PI * 6) * 1.6 : 0;
    const list = fruitsInBox();
    // 자석: 같은 과일끼리 가까우면 살짝 끌림
    if (cfg.magnet) {
      for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        if (a.level !== b.level || a.wild || b.wild) continue;
        const dx = b.position.x - a.position.x, dy = b.position.y - a.position.y;
        const d = Math.hypot(dx, dy), reach = FRUITS[a.level].r * 2 + 90;
        if (d < 1 || d > reach) continue;
        const k = 0.00015 / d;
        Body.applyForce(a, a.position, { x: dx * k * a.mass, y: dy * k * a.mass });
        Body.applyForce(b, b.position, { x: -dx * k * b.mass, y: -dy * k * b.mass });
      }
    }
    for (const b of list) {
      if (shaking) Body.setVelocity(b, { x: b.velocity.x + kick, y: b.velocity.y - 0.6 });
      if (b.speed > MAX_SPEED) {   // 속도 상한 (터널링 방지)
        const k = MAX_SPEED / b.speed;
        Body.setVelocity(b, { x: b.velocity.x * k, y: b.velocity.y * k });
      }
    }
  });

  Events.on(engine, 'afterUpdate', () => {
    for (const [a, b, lv] of mergeQueue) {
      const x = (a.position.x + b.position.x) / 2;
      const y = (a.position.y + b.position.y) / 2;
      Composite.remove(world, a);
      Composite.remove(world, b);
      if (lv < 0) {   // 수박 + 수박 → 펑, 보너스
        for (const o of [a, b]) effects.push({ x: o.position.x, y: o.position.y, r: FRUITS[10].r, t: performance.now(), pop: true });
        addScore(Math.round(WATERMELON_BONUS * cfg.scoreMul));
        showToast(`🍉🍉 수박 소멸! +${Math.round(WATERMELON_BONUS * cfg.scoreMul)}`);
        continue;
      }
      const nb = makeFruit(x, y, lv);
      Body.setVelocity(nb, { x: (a.velocity.x + b.velocity.x) / 2, y: (a.velocity.y + b.velocity.y) / 2 });
      Body.setAngularVelocity(nb, (a.angularVelocity + b.angularVelocity) / 2 + (Math.random() - 0.5) * 0.2);
      Composite.add(world, nb);
      const now = performance.now();
      let gain = FRUITS[lv].score * cfg.scoreMul;
      if (cfg.combo && now - lastMergeAt < 3000) { gain *= 1.5; effects.push({ x, y, r: FRUITS[lv].r * 1.3, t: now }); }
      lastMergeAt = now;
      addScore(Math.round(gain));
      effects.push({ x, y, r: FRUITS[lv].r, t: now });
      if (lv === FRUITS.length - 1) {
        melons++;
        if (cfg.melonBonus) addScore(Math.round(cfg.melonBonus * cfg.scoreMul));
        showToast(`🍉 수박 완성! (${melons}개)` + (cfg.melonBonus ? ` +${cfg.melonBonus}` : ''));
      }
      mergeCount++;
      if (cfg.cleanupEvery && mergeCount % cfg.cleanupEvery === 0) {   // 청소: 체리·딸기 전부 삭제
        let n = 0;
        for (const o of fruitsInBox()) if (o.level <= 1 && !o.wild) {
          Composite.remove(world, o); n++;
          effects.push({ x: o.position.x, y: o.position.y, r: FRUITS[o.level].r, t: now, pop: true });
        }
        if (n) showToast(`🧹 청소! 작은 과일 ${n}개 삭제`);
      }
      if (cfg.rainbowEvery && mergeCount % cfg.rainbowEvery === 0) { holdWild = true; showToast('🌈 무지개 과일!'); }
      if (cfg.chainPop && Math.random() < cfg.chainPop) {   // 연쇄 폭발: 근처 작은 과일 하나 펑
        const near = fruitsInBox().filter(o => o !== nb && o.level <= 4 && Math.hypot(o.position.x - x, o.position.y - y) < 130);
        if (near.length) {
          const o = pick(near);
          Composite.remove(world, o);
          effects.push({ x: o.position.x, y: o.position.y, r: FRUITS[o.level].r, t: performance.now(), pop: true });
        }
      }
    }
    mergeQueue = [];

    if (gameOver) return;
    const now = performance.now();
    for (const b of fruitsInBox()) {
      const top = b.position.y - FRUITS[b.level].r;
      const settled = b.speed < 0.8 && now - b.born > 600;
      if (top < deadY() && settled) {
        if (!b.deadSince) b.deadSince = now;
        else if (now - b.deadSince > cfg.deadTime) {
          if (cfg.insurance && !insuranceUsed) useInsurance(); else endGame();
          break;
        }
      } else {
        b.deadSince = 0;
      }
    }
  });

  // ── 입력 ─────────────────────────────────────────────
  function toGame(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / rect.width * W, y: (e.clientY - rect.top) / rect.height * H };
  }
  canvas.addEventListener('pointermove', e => { const g = toGame(e); mouseX = g.x; mouseY = g.y; });
  canvas.addEventListener('pointerdown', e => {
    const g = toGame(e); mouseX = g.x; mouseY = g.y;
    if (g.y < BOX.b) drop();
  });
  window.addEventListener('keydown', e => {
    if (!cardsEl.hidden) {   // 유물 고르기: 1/2/3
      const i = ['Digit1', 'Digit2', 'Digit3'].indexOf(e.code);
      if (i >= 0 && cardsEl._offer && cardsEl._offer[i]) takeRelic(cardsEl._offer[i], cardsEl._curse);
      return;
    }
    if (e.code === 'Space') { e.preventDefault(); drop(); }
    if (e.code === 'ArrowLeft') mouseX -= 12;
    if (e.code === 'ArrowRight') mouseX += 12;
    if (e.code === 'ArrowDown' || e.code === 'Enter') drop();
  });
  function showMenu() {
    paused = true;
    document.getElementById('records').innerHTML =
      `클래식 최고 ${best}점 · 로그라이크 최고 ${rogueBest.score}점 (🍉 ${rogueBest.melons}개)`;
    overEl.hidden = true; cardsEl.hidden = true; startEl.hidden = false;
  }
  document.getElementById('menuBtn').onclick = showMenu;
  document.getElementById('toMenu').onclick = showMenu;
  document.getElementById('retry').onclick = () => newGame(mode);
  document.getElementById('modeClassic').onclick = () => newGame('classic');
  document.getElementById('modeRogue').onclick = () => newGame('rogue');

  // ── 렌더 ─────────────────────────────────────────────
  function darken(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, (n >> 16) - 255 * amt);
    const g = Math.max(0, ((n >> 8) & 255) - 255 * amt);
    const b = Math.max(0, (n & 255) - 255 * amt);
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }

  // 과일 그리기: fruit-art.js 가 있으면 그걸로, 없으면 단순 SD 폴백
  function drawFruit(c, x, y, level, angle = 0, k = 1, wild = false) {
    const f = FRUITS[level];
    c.save();
    c.translate(x, y);
    c.rotate(angle);
    c.scale(k, k);
    if (wild) {   // 무지개: 색이 계속 돌고 반짝이 테두리
      c.filter = `hue-rotate(${(performance.now() / 6) % 360}deg) saturate(1.6)`;
      c.beginPath(); c.arc(0, 0, f.r + 5, 0, Math.PI * 2);
      c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; c.setLineDash([6, 5]); c.stroke(); c.setLineDash([]);
    }
    let drawn = false;
    if (!artBroken[level] && ART && ART[level] && typeof ART[level].draw === 'function') {
      try {
        ART[level].draw(c, f.r);
        drawn = true;
      } catch (err) {
        artBroken[level] = true;
        console.warn('fruit-art draw error (level ' + level + '):', err);
        for (let i = 0; i < 32; i++) c.restore();   // 중간에 던져져 남은 save 스택 정리
        c.save(); c.translate(x, y); c.rotate(angle); c.scale(k, k);
      }
    }
    if (!drawn) {
      const r = f.r;
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2);
      c.fillStyle = f.color; c.fill();
      c.lineWidth = Math.max(1.5, r * 0.07); c.strokeStyle = darken(f.color, 0.25); c.stroke();
      c.fillStyle = '#4a2a1a';
      c.beginPath(); c.arc(-r * 0.25, r * 0.05, r * 0.07, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(r * 0.25, r * 0.05, r * 0.07, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(0, r * 0.2, r * 0.045, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#4a2a1a'; c.lineWidth = Math.max(1, r * 0.04); c.lineCap = 'round';
      c.beginPath(); c.arc(0, r * 0.3, r * 0.1, 0.3, Math.PI - 0.3); c.stroke();
    }
    c.restore();
  }

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }

  function outlinedText(text, x, y, size, align = 'center') {
    ctx.font = `${size}px Jua, "Malgun Gothic", sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.22;
    ctx.strokeStyle = '#8a5a2a';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, x, y);
  }

  function pill(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
  }

  function bubble(x, y, r) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x - r * 0.35, y - r * 0.4, r * 0.25, r * 0.14, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill();
  }

  function drawCloud(x, y) {
    ctx.save();
    ctx.translate(x, y);
    // 구름: 외곽선색 원들을 먼저 크게, 그 위에 흰 원들 (겹침선 없이 윤곽만 남음)
    const puffs = [[-22, 4, 15], [0, -5, 21], [22, 4, 15], [-10, 10, 13], [11, 10, 13]];
    for (const pass of [['#e8d9b8', 2.5], ['#fffdf5', 0]]) {
      ctx.fillStyle = pass[0];
      for (const [px, py, pr] of puffs) {
        ctx.beginPath(); ctx.arc(px, py, pr + pass[1], 0, Math.PI * 2); ctx.fill();
      }
    }
    // 얼굴
    ctx.fillStyle = '#6a4a3a';
    ctx.beginPath(); ctx.arc(-7, 2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, 2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6a4a3a'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 6, 4, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.restore();
  }

  function drawBox() {
    const { l, r, t, b } = BOX;
    // 바닥/안쪽
    ctx.fillStyle = '#ffdca6';
    ctx.fillRect(l, t, r - l, b - t);
    // 안쪽 벽면 (살짝 어둡게)
    ctx.fillStyle = '#efc98c';
    ctx.fillRect(l, t, 10, b - t);
    ctx.fillRect(r - 10, t, 10, b - t);
    ctx.fillRect(l, b - 10, r - l, 10);
    // 윗테두리 원근
    ctx.fillStyle = '#ffefd0';
    ctx.beginPath();
    ctx.moveTo(l, t); ctx.lineTo(l + 18, t - RIM); ctx.lineTo(r - 18, t - RIM); ctx.lineTo(r, t);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#d8ab66'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.stroke();
    // 바깥 테두리
    ctx.strokeStyle = '#d8ab66'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(l, t); ctx.lineTo(l, b); ctx.lineTo(r, b); ctx.lineTo(r, t); ctx.stroke();
  }

  function render() {
    ctx.setTransform(devicePixelRatio * scale, 0, 0, devicePixelRatio * scale, 0, 0);
    ctx.fillStyle = '#c8874a';
    ctx.fillRect(0, 0, W, H);

    // HUD
    outlinedText('Score', 75, 24, 20);
    bubble(75, 68, 34);
    outlinedText(String(score), 75, 70, 26);
    outlinedText('Best ' + (mode === 'rogue' ? rogueBest.score : best), 75, 113, 14);
    outlinedText('Next', 375, 24, 20);
    pill(300, 42, 150, 52, 26);
    // 다음 과일들: 앞쪽일수록 크게 (5개면 촘촘하게)
    const n = nextQueue.length;
    const nx = n > 3 ? [318, 348, 378, 406, 432] : [328, 378, 424];
    const nk = n > 3 ? [18, 13, 11, 10, 9] : [22, 16, 13];
    for (let i = 0; i < n; i++) {
      const lv = nextQueue[i];
      if (cfg.fogNext) {
        ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `${nk[i] + 6}px Jua, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', nx[i], 68);
      } else {
        drawFruit(ctx, nx[i], 68, lv, 0, Math.min(1, nk[i] / FRUITS[lv].r));
      }
      if (i < n - 1 && n <= 3) {
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('›', (nx[i] + nx[i + 1]) / 2, 68);
      }
    }
    // 가운데 상단: 시간 · 수박 수 / 로그라이크는 다음 유물까지
    outlinedText(`⏱ ${fmtTime(runTime)}   🍉 ${melons}`, 230, 22, 15);
    if (mode === 'rogue') {
      const t = milestoneTarget(milestoneIdx);
      outlinedText(`🎁 다음 유물 ${Math.min(score, t)}/${t}`, 230, 44, 13);
      // 진행 바
      const gw = 120, gx = 230 - gw / 2, gy = 54;
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(gx, gy, gw, 6);
      ctx.fillStyle = '#ffd36b'; ctx.fillRect(gx, gy, gw * Math.min(1, score / t), 6);
      if (curses.length) {
        ctx.font = '14px "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('저주 ' + curses.map(c => c.icon).join(' '), 230, 72);
      }
      if (relics.length) {
        ctx.font = '15px "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        const rx = 450 - relics.length * 17;
        relics.forEach((r, i) => ctx.fillText(r.icon, Math.max(300, rx) + i * 17, 112));
      }
    }

    // 흔들기 중이면 상자째로 살짝 흔들림
    const shakeNow = performance.now();
    const shakeOff = shakeNow < shakeUntil ? Math.sin((shakeUntil - shakeNow) / SHAKE_TIME * Math.PI * 6) * 6 : 0;
    ctx.save();
    ctx.translate(shakeOff, 0);
    drawBox();

    // 게임오버 선 (아주 연하게)
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = cfg.ceilingOffset ? 'rgba(220,60,60,.75)' : 'rgba(220,90,60,.35)';
    ctx.lineWidth = cfg.ceilingOffset ? 3 : 2;
    ctx.beginPath(); ctx.moveTo(BOX.l, deadY()); ctx.lineTo(BOX.r, deadY()); ctx.stroke();
    ctx.setLineDash([]);

    // 손에 쥔 과일 + 구름 + 가이드
    if (current !== null && !gameOver) {
      const x = clampX(mouseX, current);
      const r = FRUITS[current].r;
      ctx.strokeStyle = 'rgba(160,110,60,.25)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, DROP_Y + r); ctx.lineTo(x, BOX.b - 10); ctx.stroke();
      drawCloud(x, DROP_Y - r - 16);
      drawFruit(ctx, x, DROP_Y, current, 0, 1, holdWild);
      if (cfg.hurryMs && holdSince) {   // 재촉: 남은 시간 링
        const f = Math.min(1, (performance.now() - holdSince) / cfg.hurryMs);
        ctx.beginPath(); ctx.arc(x, DROP_Y, r + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - f));
        ctx.strokeStyle = f > 0.7 ? 'rgba(255,80,80,.9)' : 'rgba(255,255,255,.8)'; ctx.lineWidth = 4; ctx.stroke();
      }
    } else if (!gameOver) {
      drawCloud(clampX(mouseX, 2), DROP_Y - FRUITS[2].r - 16);
    }

    // 과일들 (상자 안쪽으로 클립)
    ctx.save();
    ctx.beginPath(); ctx.rect(BOX.l, BOX.t - RIM - 60, BOX.r - BOX.l, BOX.b - BOX.t + RIM + 60); ctx.clip();
    const tNow = performance.now();
    for (const b of fruitsInBox()) {
      const age = tNow - b.born;
      const k = age < 120 ? 0.85 + 0.15 * (age / 120) : 1;   // 짧게 커지기만 (출렁임 없음)
      drawFruit(ctx, b.position.x, b.position.y, b.level, b.angle, k, !!b.wild);
    }
    // 합치기 이펙트
    effects = effects.filter(e => tNow - e.t < 250);
    for (const e of effects) {
      const p = (tNow - e.t) / 250;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * (1 + p * 0.4), 0, Math.PI * 2);
      ctx.strokeStyle = e.pop ? `rgba(255,120,120,${1 - p})` : `rgba(255,255,255,${1 - p})`;
      ctx.lineWidth = (e.pop ? 8 : 5) * (1 - p);
      ctx.stroke();
      if (e.pop) {   // 터뜨리기: 조각 튀는 점들
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * Math.PI * 2, d = e.r * (0.6 + p * 1.2);
          ctx.beginPath(); ctx.arc(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, 4 * (1 - p), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${1 - p})`; ctx.fill();
        }
      }
    }
    ctx.restore();
    ctx.restore();   // shake offset
    // 안내 토스트
    if (toast && performance.now() - toast.t < toast.ms) {
      const p = (performance.now() - toast.t) / toast.ms;
      ctx.globalAlpha = p < 0.8 ? 1 : (1 - p) / 0.2;
      outlinedText(toast.text, W / 2, BOX.t - RIM - 16, 17);
      ctx.globalAlpha = 1;
    }

    // 진화 순서
    let ex = 34;
    for (let i = 0; i < FRUITS.length; i++) {
      drawFruit(ctx, ex, 796, i, 0, 12 / FRUITS[i].r);
      if (i < FRUITS.length - 1) {
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('›', ex + 20, 796);
      }
      ex += 40;
    }
  }

  // ── 루프: 고정 스텝, 실제 경과시간만큼 따라잡기 (탭 상태와 무관하게 일정한 속도) ──
  const STEP = 1000 / 60;
  let acc = 0, last = performance.now();
  window.suika = { engine, FRUITS, get state() { return { mode, cfg, relics, curses, milestoneIdx, score, melons, runTime, paused, gameOver }; }, newGame, offerRelics, takeRelic };   // 디버그/튜닝용
  applyCfg();
  clearBoard();
  showMenu();
  setInterval(() => {
    const now = performance.now();
    acc += Math.min(now - last, 100);
    last = now;
    const running = !paused && !gameOver;
    while (acc >= STEP) {
      if (running) { Engine.update(engine, STEP); runTime += STEP; }
      acc -= STEP;
    }
    if (running) {
      if (cfg.quakeEvery && now - lastQuake > cfg.quakeEvery) { lastQuake = now; shakeUntil = now + SHAKE_TIME; showToast('🌋 지진!'); }
      if (cfg.cherryRainEvery && now - lastRain > cfg.cherryRainEvery) { lastRain = now; rainCherries(3); }
      if (current !== null && !holdSince) holdSince = now;
      if (cfg.hurryMs && current !== null && holdSince && now - holdSince > cfg.hurryMs) { showToast('⏱ 재촉!'); drop(); }
      checkMilestone();
    }
    render();
  }, STEP);
})();
</script>
