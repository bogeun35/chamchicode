<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>배그 지도</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14; --panel:rgba(14,19,26,.88); --border:rgba(255,255,255,.12);
  --fg:#EAF0F7; --dim:#93A1B3; --accent:#F59E0B; --accent2:#06B6D4;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:'Rajdhani',-apple-system,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}

#stage{position:fixed;inset:0;cursor:grab;touch-action:none;overscroll-behavior:none}
#stage.drag{cursor:grabbing}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#canvas img{display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
/* canvas 는 width/height 속성(버퍼)이 고유크기라 inset:0 만으로는 화면에 안 맞는다.
   배율(devicePixelRatio)이 1이 아닌 모니터에서 마커가 지도 밖으로 퍼지므로 CSS 크기를 못박는다. */
#ov{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:5}

/* ── top ── */
#top{position:fixed;top:0;left:0;right:0;z-index:10;padding:13px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.8),rgba(0,0,0,0))}
#title{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:900;text-shadow:0 2px 12px #000}
#title small{font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:600;color:var(--dim);margin-left:8px}
#meta{margin-left:auto;font-size:.76rem;font-weight:600;color:var(--dim);background:var(--panel);
  border:1px solid var(--border);padding:5px 10px;border-radius:7px;backdrop-filter:blur(8px)}

/* ── layer panel ── */
#layers{position:fixed;left:16px;top:60px;z-index:12;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:12px;backdrop-filter:blur(12px);min-width:186px;transition:opacity .3s}
#layers h4{font-size:.7rem;font-weight:700;color:var(--dim);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:9px;font-family:'Rajdhani',sans-serif}
.ly{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:7px;cursor:pointer;
  font-size:.9rem;font-weight:600;color:var(--dim);transition:.12s;user-select:none}
.ly:hover{background:rgba(255,255,255,.06);color:var(--fg)}
.ly.on{color:var(--fg)}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;border:2px solid currentColor;opacity:.35}
.ly.on .dot{opacity:1;background:currentColor}
.ly .ct{margin-left:auto;font-size:.74rem;color:#5c6875;font-variant-numeric:tabular-nums}
.ly.off{opacity:.4;cursor:not-allowed}
#note{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);
  font-size:.68rem;line-height:1.45;color:#7b8794;max-width:180px}
#note b{color:#aab4c0}
#unver{margin-top:6px;font-size:.7rem;line-height:1.4;color:#d9a441}

/* ── mode + maps ── */
#modes{position:fixed;left:16px;top:14px;z-index:12;display:flex;gap:5px}
.md{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--dim);
  padding:6px 12px;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:.85rem;
  font-weight:700;backdrop-filter:blur(8px);transition:.13s}
.md:hover{color:var(--fg)} .md.on{background:var(--accent2);border-color:var(--accent2);color:#04222a}

#tabs{position:fixed;bottom:0;left:0;right:0;z-index:11;display:flex;justify-content:center;
  align-items:center;gap:5px;flex-wrap:wrap;padding:13px 16px 15px;
  background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,0))}
.tab{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--dim);
  padding:7px 13px;border-radius:9px;font-family:'Rajdhani',sans-serif;font-size:.9rem;
  font-weight:700;transition:.13s;backdrop-filter:blur(8px)}
.tab:hover{color:var(--fg);border-color:rgba(255,255,255,.34)}
.tab.on{background:linear-gradient(135deg,var(--accent),#f7b955);border-color:var(--accent);color:#1a1205}
.tab .n{font-size:.7rem;opacity:.6;margin-right:4px}

.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:12;width:46px;height:66px;
  border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:12px;
  cursor:pointer;font-size:1.5rem;display:grid;place-items:center;backdrop-filter:blur(10px);transition:.15s}
.arrow:hover{background:var(--accent);color:#1a1205;border-color:var(--accent)}
#prev{left:auto;right:74px;top:auto;bottom:70px;transform:none} #next{right:16px;top:auto;bottom:70px;transform:none}

#zoombox{position:fixed;right:16px;top:60px;z-index:10;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.zbtn{width:30px;height:30px;border:1px solid var(--border);background:var(--panel);color:var(--fg);
  border-radius:8px;cursor:pointer;font-size:1rem;font-weight:700;backdrop-filter:blur(8px);
  display:grid;place-items:center;transition:.13s}
.zbtn:hover{background:var(--accent);color:#1a1205;border-color:var(--accent)}
#zoom{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 8px;
  font-size:.74rem;font-weight:700;color:var(--dim);backdrop-filter:blur(8px);font-variant-numeric:tabular-nums}

#credit{position:fixed;right:16px;bottom:74px;z-index:9;max-width:min(340px,44vw);font-size:.66rem;
  line-height:1.55;font-weight:500;color:#6b7885;text-align:right;text-shadow:0 1px 6px #000}
#credit a{color:#8c97a5}
.hidden{opacity:0!important;pointer-events:none}
#load{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);
  color:var(--dim);font-weight:600;transition:opacity .35s}

@media(max-width:820px){
  #layers{top:auto;bottom:118px;left:12px;padding:9px;min-width:0}
  .ly{font-size:.82rem;padding:4px 5px} .ly .ct{display:none} #layers h4{display:none}
  #top{padding-left:60px} #modes{left:60px}
  #credit{position:static;display:none}
  .arrow{display:none}
  #zoombox{display:none}
  #title{font-size:.98rem}
}
</style>
</head>
<body>

<div id="stage"><div id="canvas"></div></div>
<canvas id="ov"></canvas>

<div id="modes">
  <button class="md on" data-m="live">공식 지도 + 레이어</button>
  <button class="md" data-m="static">커뮤니티 비밀창고 지도</button>
</div>

<div id="top">
  <div id="title"></div>
  <div id="meta"></div>
</div>

<div id="layers"><h4>레이어</h4><div id="lyList"></div>
  <div id="note">숫자는 <b>배치된 스폰 자리</b> 수입니다. 매 판 이 중 일부만 실제로 뽑힙니다.</div>
  <div id="unver" style="display:none">⚠ 이 맵은 차량 좌표가 미검증입니다</div>
</div>

<div id="zoombox">
  <button class="zbtn" id="zin">+</button>
  <div id="zoom">100%</div>
  <button class="zbtn" id="zout">−</button>
  <button class="zbtn" id="zfit">⤢</button>
</div>

<button class="arrow" id="prev">‹</button>
<button class="arrow" id="next">›</button>

<div id="tabs"></div>

<div id="credit">
  기본 지도 · 스폰 좌표: <a href="https://www.pubgintel.com/pubg-maps" target="_blank" rel="noopener">pubgintel.com</a> (게임 파일 추출) ·
  커뮤니티 비밀창고 지도: ErikVN, Ochkodrive 외 / <a href="https://pubgsecretroom.com/" target="_blank" rel="noopener">pubgsecretroom.com</a> ·
  PUBG는 KRAFTON의 상표입니다. 비영리 팬 페이지.
</div>

<div id="load">지도 불러오는 중…</div>

<script src="pubg-spawns.js"></script>
<script>
/* 커뮤니티 정적 지도 (마커가 이미지에 박혀 있음) */
const STATIC=[
 {key:"erangel",ko:"에란겔",file:"pubg-maps/erangel.webp",w:5334,h:5328,desc:"비밀 지하실 15곳"},
 {key:"taego",ko:"테이고",file:"pubg-maps/taego.webp",w:1440,h:1440,desc:"비밀의 방"},
 {key:"vikendi",ko:"비켄디",file:"pubg-maps/vikendi.jpg",w:1437,h:1440,desc:"비밀창고 + 보안키 창고"},
 {key:"deston",ko:"데스턴",file:"pubg-maps/deston.png",w:2048,h:2048,desc:"빨강=보안 키카드 / 파랑=보안실"},
 {key:"rondo",ko:"론도",file:"pubg-maps/rondo.webp",w:2000,h:2000,desc:"빨강 점선원 = 비밀방"},
 {key:"paramo",ko:"파라모",file:"pubg-maps/paramo.jpg",w:2400,h:2400,desc:"빨강 삼각형 = 비밀창고"},
];
const LDEF=[
 {k:'cars',        ko:'차량',          c:'#38bdf8', r:3.2, on:true},
 {k:'secretRooms', ko:'비밀의 방',     c:'#ef4444', r:7,   on:true, ring:true, feat:true},
 {k:'gliders',     ko:'모터글라이더',  c:'#fbbf24', r:4.5, on:false},
 {k:'boats',       ko:'보트',          c:'#22d3ee', r:3.2, on:false},
 {k:'esports',     ko:'확정 스폰',      c:'#a78bfa', r:3.2, on:false,
  tip:'대회(이스포츠)용 확정 차량 스폰. 100% 나오지만 일반 매치에는 적용되지 않습니다.'},
 {k:'esportsBoat', ko:'확정 보트',      c:'#c084fc', r:3.2, on:false,
  tip:'대회(이스포츠)용 확정 보트 스폰. 일반 매치에는 적용되지 않습니다.'},
 // 원 사이트가 공개하지 않는 데이터 키. 무엇인지 확인되지 않아 이름을 단정하지 않는다.
 {k:'special',     ko:'미확인 스폰 ⚠', c:'#34d399', r:5,   on:false,
  tip:'원본 데이터에는 있으나 출처가 의미를 공개하지 않은 항목입니다. 무엇인지 확인되지 않았습니다.'},
];
const ORDER=['erangel','miramar','taego','vikendi','deston','rondo','sanhok','paramo','karakin'];

const $=id=>document.getElementById(id);
const stage=$('stage'),canvas=$('canvas'),ov=$('ov'),ctx=ov.getContext('2d');
let mode='live', idx=0, s=1, tx=0, ty=0, cur=null;
const active={}; LDEF.forEach(l=>active[l.k]=l.on);
const imgCache={};

function list(){ return mode==='live'
  ? ORDER.filter(k=>SPAWNS[k]).map(k=>({key:k,ko:SPAWNS[k].ko,en:SPAWNS[k].en,
      file:`pubg-base/${k}.jpg`,w:SPAWNS[k].w,h:SPAWNS[k].h}))
  : STATIC; }

function getImg(m){
  if(!imgCache[m.file]){ const i=new Image(); i.src=m.file; i.alt=m.ko+' 지도'; imgCache[m.file]=i; }
  return imgCache[m.file];
}

const fitScale=()=>Math.min(innerWidth/cur.w,innerHeight/cur.h);
function fit(){s=fitScale()*0.97;tx=(innerWidth-cur.w*s)/2;ty=(innerHeight-cur.h*s)/2;apply();}
const clampScale=v=>Math.max(fitScale()*0.5,Math.min(4,v));
function apply(){
  canvas.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
  $('zoom').textContent=Math.round(s*100)+'%';
  draw();
}
function zoomAt(cx,cy,f){const ns=clampScale(s*f),k=ns/s;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;s=ns;apply();}

/* ── 마커 오버레이 (화면 좌표로 매 프레임 다시 그림 → 줌해도 크기 일정) ── */
function sizeOv(){
  const d=devicePixelRatio||1;
  ov.width=Math.round(innerWidth*d); ov.height=Math.round(innerHeight*d);
  // 버퍼는 배율만큼 크게, 화면 크기는 CSS 픽셀로 못박는다 (안 하면 마커가 지도 밖으로 퍼짐)
  ov.style.width=innerWidth+'px'; ov.style.height=innerHeight+'px';
  ctx.setTransform(d,0,0,d,0,0);
}
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  if(mode!=='live') return;
  const D=SPAWNS[cur.key]; if(!D) return;
  const W=cur.w*s, H=cur.h*s;
  for(const L of LDEF){
    if(!active[L.k]) continue;
    const pts=D.L[L.k]; if(!pts) continue;
    ctx.strokeStyle=L.c; ctx.fillStyle=L.c; ctx.lineWidth=2;
    for(const [nx,ny] of pts){
      const x=tx+nx*W, y=ty+ny*H;
      if(x<-20||y<-20||x>innerWidth+20||y>innerHeight+20) continue;
      ctx.beginPath();
      if(L.ring){ ctx.arc(x,y,L.r,0,6.284); ctx.stroke();
                  ctx.beginPath(); ctx.arc(x,y,1.6,0,6.284); ctx.fill(); }
      else { ctx.arc(x,y,L.r,0,6.284); ctx.fill();
             ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=1; ctx.stroke(); ctx.strokeStyle=L.c; ctx.lineWidth=2; }
    }
  }
}

/* ── 레이어 UI ── */
function renderLayers(){
  const D=mode==='live'?SPAWNS[cur.key]:null;
  $('layers').style.display = mode==='live' ? '' : 'none';
  $('lyList').innerHTML=LDEF.map(L=>{
    const n=D&&D.L[L.k]?D.L[L.k].length:0;
    // 맵마다 이 항목의 의미가 다르다 (데스턴은 비밀의 방이 아니라 기둥 보급 트럭)
    const label=(L.feat&&D&&D.feat)?D.feat:L.ko;
    const tip=L.tip?` title="${L.tip}"`:'';
    return `<div class="ly ${n?'':'off'} ${active[L.k]&&n?'on':''}" data-k="${L.k}"${tip} style="color:${active[L.k]&&n?L.c:''}">
      <span class="dot" style="color:${L.c}"></span><span>${label}</span><span class="ct">${n||'-'}</span></div>`;
  }).join('');
  // 차량 좌표가 검증되지 않은 맵은 표시해준다
  $('unver').style.display=(D&&D.L.cars&&!D.vv)?'':'none';
  $('lyList').querySelectorAll('.ly').forEach(e=>{
    if(e.classList.contains('off')) return;
    e.onclick=()=>{ active[e.dataset.k]=!active[e.dataset.k]; renderLayers(); draw(); };
  });
}

function show(i){
  const L=list(); idx=(i+L.length)%L.length; cur=L[idx];
  const im=getImg(cur);
  canvas.replaceChildren(im);
  const D=mode==='live'?SPAWNS[cur.key]:null;
  $('title').innerHTML=`${cur.ko}<small>${D?D.en:(cur.desc||'')}</small>`;
  $('meta').textContent=`${idx+1} / ${L.length}  ·  ${cur.w}×${cur.h}`;
  $('tabs').querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',j===idx));
  renderLayers();
  if(im.complete) fit(); else im.onload=()=>fit();
}
function renderTabs(){
  const L=list();
  $('tabs').innerHTML=L.map((m,i)=>`<button class="tab"><span class="n">${i+1}</span>${m.ko}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach((b,i)=>b.onclick=()=>{show(i);focus();});
}

document.querySelectorAll('.md').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.md').forEach(x=>x.classList.toggle('on',x===b));
  mode=b.dataset.m; renderTabs(); show(0); focus();
});

$('prev').onclick=()=>{show(idx-1);focus();};
$('next').onclick=()=>{show(idx+1);focus();};
$('zin').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.35);
$('zout').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.35);
$('zfit').onclick=()=>fit();
function focus(){try{window.focus();}catch(e){}}

stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.16:1/1.16);},{passive:false});
stage.addEventListener('dblclick',e=>zoomAt(e.clientX,e.clientY,2));
const pts=new Map(); let pinch=0;
stage.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  stage.setPointerCapture(e.pointerId);stage.classList.add('drag');focus();});
stage.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
  if(pts.size===1){tx+=e.clientX-p.x;ty+=e.clientY-p.y;apply();}
  p.x=e.clientX;p.y=e.clientY;
  if(pts.size===2){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch)zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch); pinch=d;}});
const rel=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=0;if(!pts.size)stage.classList.remove('drag');};
stage.addEventListener('pointerup',rel); stage.addEventListener('pointercancel',rel);

addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();show(idx+1);}
  else if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();show(idx-1);}
  else if(k>='1'&&k<='9'){const i=+k-1; if(i<list().length) show(i);}
  else if(k==='0'||k==='Home'){fit();}
  else if(k==='h'||k==='H'){document.querySelectorAll('#top,#tabs,#layers,#zoombox,#credit,#modes,.arrow')
    .forEach(n=>n.classList.toggle('hidden'));}
  else if(k==='m'||k==='M'){document.querySelector('.md:not(.on)').click();}
});
addEventListener('resize',()=>{sizeOv();fit();});

sizeOv(); renderTabs(); show(0);
$('load').style.opacity=0; setTimeout(()=>$('load').remove(),380);
</script>
</body>
</html>
