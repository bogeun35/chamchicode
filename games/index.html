<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101320">
  <title>참스코드 아케이드</title>
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <main class="hub">
    <header class="hero">
      <div class="eyebrow"><span class="pulse"></span> CHARMS CODE · ARCADE</div>
      <h1>참스코드<span> ARCADE</span></h1>
      <p>한 판 더. 오늘의 스테이지를 골라.</p>
    </header>
    <section class="games" aria-label="게임 선택">
      <a class="game-card rhythm" href="rhythm.html">
        <div class="card-art"><div class="beat-ring ring-one"></div><div class="beat-ring ring-two"></div><div class="beat-core">♫</div><span class="art-label">2 TRACKS · 120 / 150 BPM</span></div>
        <div class="card-copy"><div class="tag">RHYTHM · 4 LANES</div><h2>NEON//PULSE</h2><p>비트를 쳐라. 콤보를 지켜라.</p><div class="card-bottom"><span>D · F · J · K / TOUCH</span><span class="play">PLAY <b>↗</b></span></div></div>
      </a>
      <a class="game-card survivors" href="survivors.html">
        <div class="card-art"><div class="moon"></div><div class="pixel-hero">✦</div><div class="mob mob-a">◆</div><div class="mob mob-b">◆</div><div class="mob mob-c">◆</div><span class="art-label">SURVIVE THE NIGHT</span></div>
        <div class="card-copy"><div class="tag">SURVIVORS · 5 MIN RUN</div><h2>잔광</h2><p>움직여라. 모아라. 밤을 버텨라.</p><div class="card-bottom"><span>WASD / TOUCH</span><span class="play">PLAY <b>↗</b></span></div></div>
      </a>
    </section>
    <footer>MADE FOR THE NEXT ROUND <span>✳</span></footer>
  </main>
</body>
</html>
