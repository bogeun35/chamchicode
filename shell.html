<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 쉘다이버</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --ink: #fff9ef; --dim: #e6d6b8; --brown: #976152; --brown2: #5f443d; --gold: #e2c655; --gold2: #a9943e; --ol: #2e111a; --green: #45c07c; --red: #e84a5a; --teal: #33a08a; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #2e111a; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; touch-action: none; }
button { font-family: inherit; color: inherit; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: crosshair; }
/* 원작 UI 판: 갈색 바탕 + 금색 테두리 + 진한 외곽선 */
.pnl { background: var(--brown); border: 3px solid var(--gold); box-shadow: 0 0 0 3px var(--ol), inset 0 -4px 0 rgba(0,0,0,.18); border-radius: 12px; }
.btn { background: var(--brown); border: 3px solid var(--gold); box-shadow: 0 0 0 3px var(--ol), inset 0 -4px 0 rgba(0,0,0,.2); border-radius: 10px; padding: 7px 16px; font-size: 17px; cursor: pointer; text-shadow: 0 2px 0 var(--ol); }
.btn:active { transform: translateY(2px); }
.btn.ok { background: #2f8a55; } .btn.no { background: #8a3a3a; } .btn:disabled { opacity: .45; }
.ov { position: fixed; inset: 0; display: none; z-index: 20; }
.ov.on { display: block; }
.ov:not(.on) { display: none !important; }
.ov.on.center { display: flex; }
.dim { background: rgba(20,8,14,.62); }
.center { display: flex; align-items: center; justify-content: center; }
.toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 60; padding: 6px 16px; font-size: 16px; opacity: 0; transition: opacity .2s; pointer-events: none; text-shadow: 0 2px 0 var(--ol); white-space: nowrap; }
.toast.show { opacity: 1; }
/* 스킬 트리 설명창 */
#skTip { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(560px, calc(100vw - 24px)); padding: 10px 14px; z-index: 31; display: none; }
#skTip.on { display: block; }
#skTip .hd { display: flex; align-items: center; gap: 10px; }
#skTip .nm { font-size: 19px; text-shadow: 0 2px 0 var(--ol); flex: 1; }
#skTip .lv { font-size: 14px; color: var(--dim); }
#skTip .ds { font-size: 14.5px; line-height: 1.45; margin: 6px 0 8px; color: #fff3df; }
#skTip .ft { display: flex; align-items: center; gap: 10px; }
#skTip .pr { font-size: 18px; display: flex; align-items: center; gap: 6px; flex: 1; text-shadow: 0 2px 0 var(--ol); }
#skTip .pr.no { color: #ffb0a8; }
#skTip .pr canvas { width: 20px; height: 20px; image-rendering: pixelated; }
.c-green { color: #7dff9e; } .c-rain { background: linear-gradient(90deg,#ff8a8a,#ffd36b,#8aff9e,#7fd4ff,#c79bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-bb { color: #ffd2b0; } .c-pl { color: #8ae9ff; } .c-ox { color: #8aff9e; } .c-jl { color: #ffb0ef; } .c-st { color: #8ae9ff; } .c-rs { color: #ffd36b; } .c-red { color: #ff8a8a; } .c-gold { color: #ffd84a; } .c-silver { color: #e6ecf5; }
/* 화면 버튼 (터치) */
#touch { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
#touch.on { display: block; }
.tb { position: absolute; pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; background: rgba(151,97,82,.85); border: 3px solid var(--gold); box-shadow: 0 0 0 3px var(--ol); display: grid; place-items: center; font-size: 15px; text-shadow: 0 2px 0 var(--ol); }
.tb.on { background: rgba(69,192,124,.9); }
#stickL, #stickR { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 3px dashed rgba(255,249,239,.35); display: none; pointer-events: none; }
#stickL i, #stickR i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: rgba(255,249,239,.45); border: 3px solid var(--ol); }
#sndBtn { width: 40px !important; height: 40px !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="toast pnl" id="toast"></div>
<div id="touch">
  <div id="stickL"><i></i></div><div id="stickR"><i></i></div>
  <button class="tb" id="tbAct" style="right:18px;bottom:150px">상호<br>작용</button>
  <button class="tb" id="tbJump" style="right:92px;bottom:96px">점프</button>
  <button class="tb" id="tbTool" style="right:18px;bottom:76px">도구</button>
  <button class="tb" id="tbInv" style="right:22px;bottom:226px;width:54px;height:54px">가방</button>
</div>
<div class="ov" id="ovSkill"></div>
<div class="pnl" id="skTip"></div>
<div class="ov dim center" id="ovModal"><div class="pnl" id="modal" style="padding:16px;max-width:min(520px,94vw);width:100%;max-height:90vh;overflow:auto"></div></div>

<script src="party-sound.js"></script>
<script src="shell/rooms.js?v=1018c"></script>
<script src="shell/skills.js?v=1018c"></script>
<script src="shell/art.js?v=1018c"></script>
<script src="shell/core.js?v=1018c"></script>
<script src="shell/game.js?v=1018c"></script>
</body>
</html>
