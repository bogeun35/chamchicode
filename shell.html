<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 쉘다이버</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --bg: #07243a; --panel: #0e3550; --panel2: #134563; --line: #1f5f80; --ink: #eafaff; --dim: #8fc2d8; --shell: #ffe1a8; --gold: #ffd36b; --green: #7ce3a0; --pink: #ff9fc7; --purple: #c2a8ff; --cyan: #7fe3ff; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
button { font-family: inherit; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%) translateY(-24px); z-index: 90; background: var(--panel2); border: 2px solid var(--cyan); padding: 8px 16px; border-radius: 9px; font-size: 14px; opacity: 0; transition: all .22s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* 상단 */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 10px; background: linear-gradient(180deg, #0a2d47, rgba(10,45,71,0)); z-index: 6; }
#app.diving .top { background: linear-gradient(180deg, #0a2d47, #07243a); }   /* 캔버스가 상단바 밑까지 깔리므로 기존에 보이던 색 그대로 */
.tl { display: flex; flex-direction: column; gap: 5px; }
.cur { background: rgba(14,53,80,.94); border: 2px solid var(--line); border-radius: 9px; padding: 3px 12px; font-size: 13px; color: var(--dim); white-space: nowrap; display: inline-block; }
.cur b { font-size: 25px; color: var(--shell); letter-spacing: -.5px; }
.cur.bump { animation: bump .3s ease; } @keyframes bump { 45% { transform: scale(1.12); } }
.mats { display: flex; gap: 4px; flex-wrap: wrap; }
.mat { font-size: 11.5px; background: rgba(14,53,80,.9); border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; color: var(--dim); }
.mat b { color: var(--ink); font-size: 14px; }
.menu { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.mb { width: 52px; height: 48px; border: 2px solid var(--line); border-radius: 11px; background: rgba(14,53,80,.94); color: var(--ink); cursor: pointer; position: relative; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.mb i { font-style: normal; font-size: 19px; } .mb em { font-style: normal; font-size: 9.5px; color: var(--dim); margin-top: 2px; }
.mb.on { border-color: var(--gold); background: #17557a; } .mb.on em { color: var(--gold); }
.mb .dot { position: absolute; top: -5px; right: -5px; width: 11px; height: 11px; border-radius: 50%; background: var(--pink); display: none; }
.mb.alert .dot { display: block; animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .25; } }
/* 화면 */
.sea { position: absolute; inset: 0; z-index: 1; overflow: hidden; display: none; }   /* 캔버스 = 뷰포트 전체, 상단바는 위에 겹치는 HUD */
.sea.on { display: block; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.panel { flex: 1; min-height: 0; background: rgba(14,53,80,.96); overflow: auto; padding: 10px 10px 72px; position: relative; }
.panel.off { display: none; }
.oxy { position: absolute; top: calc(var(--topH, 0px) + 8px); left: 10px; right: 10px; z-index: 3; pointer-events: none; }
.oxy .bar { height: 18px; background: rgba(0,0,0,.5); border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
.oxy .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff6b8a, #ffd36b, #7fe3ff); transition: width .1s; }
.oxy .lb { font-size: 11.5px; color: var(--dim); margin-top: 2px; display: flex; justify-content: space-between; text-shadow: 0 0 2px rgba(0,20,40,.95), 0 1px 2px rgba(0,20,40,.9), 1px 0 1px rgba(0,20,40,.8), -1px 0 1px rgba(0,20,40,.8); }
.bag { position: absolute; left: 58px; bottom: 12px; z-index: 3; display: flex; gap: 5px; pointer-events: none; }
.slot { width: 44px; height: 44px; border: 2px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.45); display: grid; place-items: center; font-size: 12px; color: var(--dim); position: relative; }
.slot.full { border-color: var(--gold); }
.slot .n { position: absolute; bottom: 1px; right: 3px; font-size: 10px; color: var(--ink); }
.ammo { position: absolute; right: 10px; bottom: 62px; z-index: 3; font-size: 12px; color: var(--dim); background: rgba(0,0,0,.45); border: 2px solid var(--line); border-radius: 9px; padding: 3px 10px; pointer-events: none; }
.divebtn { position: fixed; right: 10px; bottom: 11px; z-index: 12; border: 3px solid var(--cyan); border-radius: 13px; background: linear-gradient(180deg, #1d7fa8, #0e4a6e); color: #eaffff; font-size: 19px; padding: 12px 24px; cursor: pointer; animation: gl 1.5s ease-in-out infinite alternate; }
@keyframes gl { from { box-shadow: 0 0 0 0 rgba(127,227,255,.6); } to { box-shadow: 0 0 0 13px rgba(127,227,255,0); } }
.divebtn:active { transform: translateY(3px); animation: none; }
.divebtn.hide { display: none; }
.backbtn { position: fixed; right: 10px; bottom: 11px; z-index: 12; border: 2px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font-size: 14px; padding: 10px 16px; cursor: pointer; display: none; }
.backbtn.on { display: block; }
.backbtn.far { opacity: .75; border-style: dashed; } .backbtn:not(.far) { border-color: #6cf09a; color: #6cf09a; box-shadow: 0 0 0 3px rgba(108,240,154,.25); }
.oxy .bar.warn { animation: oxywarn .5s ease-in-out infinite alternate; } @keyframes oxywarn { from { border-color: #ff6b8a; box-shadow: 0 0 0 0 rgba(255,107,138,.6); } to { border-color: #ffd36b; box-shadow: 0 0 0 6px rgba(255,107,138,0); } }
h3 { font-size: 14px; color: var(--cyan); margin: 3px 0 9px; display: flex; gap: 6px; align-items: center; }
h3 small { margin-left: auto; font-weight: normal; font-size: 11.5px; color: var(--dim); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; }
.cd { background: var(--panel2); border: 2px solid var(--line); border-radius: 11px; padding: 9px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; position: relative; }
.cd .ic { font-size: 24px; } .cd .nm { font-size: 14.5px; line-height: 1.2; } .cd .ds { font-size: 12px; color: var(--dim); flex: 1; } .cd .cost { font-size: 12.5px; color: var(--dim); }
.cd.ok { border-color: var(--green); } .cd.ok .cost { color: var(--green); }
.cd.ok::after { content: '👆👆'; position: absolute; right: 6px; bottom: 5px; font-size: 10px; }
.cd.max { border-color: var(--purple); } .cd.lock { opacity: .45; } .cd.on { border-color: var(--gold); }
.shake { animation: shk .3s; } @keyframes shk { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.treewrap { position: relative; overflow: auto; height: 100%; margin: -10px -10px -72px; background: radial-gradient(ellipse at 50% 50%, #12496b, #07243a 78%); }
.tree { position: relative; }
.tree svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.tn { position: absolute; width: 50px; height: 50px; border-radius: 11px; background: #124260; border: 2px solid var(--line); display: grid; place-items: center; font-size: 21px; cursor: pointer; }
.tn.key { width: 58px; height: 58px; font-size: 25px; }
.tn.own { background: #1c6b45; border-color: var(--green); }
.tn.avail { border-color: var(--gold); }
.tn.ok { animation: pulse 1s ease-in-out infinite alternate; } @keyframes pulse { to { transform: scale(1.07); } }
.tn .pr { position: absolute; left: 50%; transform: translateX(-50%); bottom: -14px; font-size: 10px; background: rgba(0,0,0,.7); color: var(--shell); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.tn .lvb { position: absolute; top: -7px; right: -7px; font-size: 9px; background: var(--green); color: #05230f; border-radius: 6px; padding: 0 4px; }
.tn.own .pr { display: none; } .tn.sel { outline: 2px solid #fff; }
.sheet { position: fixed; left: 56px; right: 178px; bottom: 11px; background: var(--panel2); border: 2px solid var(--gold); border-radius: 11px; padding: 8px 11px; display: none; align-items: center; gap: 9px; z-index: 11; }
.sheet.show { display: flex; }
.sheet .ic { font-size: 25px; } .sheet .t { flex: 1; min-width: 0; } .sheet .nm { font-size: 15px; } .sheet .ds { font-size: 12px; color: var(--dim); }
.sheet .pz { text-align: right; font-size: 13.5px; color: var(--shell); white-space: nowrap; } .sheet .pz.no { color: var(--pink); } .sheet .pz small { display: block; font-size: 10.5px; color: var(--dim); }
.btn { border: 2px solid var(--line); border-radius: 10px; padding: 8px 15px; font-size: 14px; cursor: pointer; background: var(--panel2); color: var(--ink); }
.btn.go { border-color: var(--green); color: var(--green); } .btn.hot { border-color: var(--gold); color: var(--gold); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; align-items: center; }
.card { background: var(--panel2); border: 2px solid var(--line); border-radius: 11px; padding: 11px; margin-bottom: 9px; font-size: 13.5px; line-height: 1.55; }
.stat { display: flex; justify-content: space-between; font-size: 13.5px; padding: 3px 0; border-bottom: 1px dashed var(--line); } .stat:last-child { border-bottom: none; }
.step { display: flex; gap: 9px; background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 9px; margin-bottom: 7px; }
.step .no { flex: none; width: 23px; height: 23px; border-radius: 50%; background: var(--cyan); color: #06304a; display: grid; place-items: center; font-size: 12px; }
.step p { font-size: 13px; line-height: 1.5; }
.storeRow { display: flex; gap: 6px; flex-wrap: wrap; }
.sslot { width: 62px; height: 62px; border: 2px solid var(--line); border-radius: 10px; background: var(--panel2); display: grid; place-items: center; position: relative; }
.sslot .n { position: absolute; bottom: 2px; right: 4px; font-size: 11px; }
.sslot .pg { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 3px; background: #0a2d47; border-radius: 2px; overflow: hidden; }
.sslot .pg i { display: block; height: 100%; background: var(--gold); }
.modal { position: fixed; inset: 0; background: rgba(2,14,24,.86); display: none; align-items: center; justify-content: center; z-index: 95; padding: 12px; }
.modal.show { display: flex; }
.modal .box { background: var(--panel); border: 2px solid var(--cyan); border-radius: 15px; padding: 16px; max-width: 460px; width: 100%; text-align: center; max-height: 93vh; overflow: auto; }
.modal h2 { font-size: 20px; margin-bottom: 7px; color: var(--cyan); }
.modal p { font-size: 13.5px; color: var(--dim); line-height: 1.55; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 9px 0; }
.res div { background: #0a2d47; border-radius: 8px; padding: 7px; font-size: 12.5px; color: var(--dim); } .res b { display: block; font-size: 18px; color: var(--ink); }
@media (max-width: 620px) { .top { flex-direction: column; align-items: stretch; gap: 6px; } .menu { justify-content: space-between; flex-wrap: nowrap; } .mb { width: 46px; height: 44px; } .cur b { font-size: 21px; } .sheet { right: 8px; bottom: 76px; } }
/* 폰 가로: 다이빙 중 HUD 축소 (메뉴는 패널이 가려져 효과가 없으므로 숨김) */
@media (max-height: 500px) { #app.diving .menu { display: none; } #app.diving .top { padding: 4px 10px; } #app.diving .tl { flex-direction: row; align-items: center; } #app.diving .cur b { font-size: 17px; } .oxy .bar { height: 12px; } .slot { width: 36px; height: 36px; } .bag { bottom: 6px; } .ammo { bottom: 52px; } .backbtn { bottom: 6px; min-height: 40px; padding: 8px 16px; } }
#sndBtn { width: 40px !important; height: 40px !important; }   /* 터치 대상 40px */
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="app">
  <div class="top">
    <div class="tl">
      <div><span class="cur" id="curShell">🐚 <b id="shell">0</b></span></div>
      <div class="mats" id="mats"></div>
    </div>
    <div class="menu">
      <button class="mb on" data-tab="tree"><i>🌳</i><em>스킬</em><span class="dot"></span></button>
      <button class="mb" data-tab="store"><i>🏪</i><em>상점</em><span class="dot"></span></button>
      <button class="mb" data-tab="dex"><i>🪼</i><em>도감</em><span class="dot"></span></button>
      <button class="mb" data-tab="biome"><i>🗺️</i><em>바다</em><span class="dot"></span></button>
      <button class="mb" data-tab="cfg"><i>⚙️</i><em>기록</em><span class="dot"></span></button>
    </div>
  </div>
  <div class="sea" id="seaView">
    <canvas id="cv"></canvas>
    <div class="oxy"><div class="bar"><i id="oxyFill"></i></div><div class="lb"><span id="oxyTxt"></span><span id="biomeTxt"></span></div></div>
    <div class="bag" id="bag"></div>
    <div class="ammo" id="ammoTxt"></div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="sheet" id="sheet"></div>
  <button class="divebtn" id="btnDive">🤿 다이빙</button>
  <button class="backbtn" id="btnBack">⏹ 귀항</button>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script src="party-sound.js"></script>
<script>
'use strict';
Sound.theme('lounge'); Sound.scene('game');
const $ = id => document.getElementById(id);
const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구'];
// 디버그: 콘솔에서 shelldiver.speed(4) — 게임 시간만 배속 (테스트용)
let __spd = 1, __spReal = performance.now(), __spGame = __spReal;
const __now = () => { const t = performance.now(); return __spGame + (t - __spReal) * __spd; };
function setSpeed(n) {
  __spGame = __now(); __spReal = performance.now(); __spd = Math.max(.25, Math.min(30, +n || 1));
  let b = document.getElementById('spdBadge');
  if (!b) { b = document.createElement('div'); b.id = 'spdBadge'; b.style.cssText = 'position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9999;padding:3px 11px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font:15px sans-serif;pointer-events:none'; document.body.appendChild(b); }
  b.textContent = '⏩ ×' + __spd + '  ( [ ] 키 )'; b.style.display = __spd === 1 ? 'none' : '';
  return '⏩ 배속 ×' + __spd;
}
// [ ] 키로 1→2→4→8→16 배속 (새로고침하면 1배로 돌아옴)
function stepSpeed(dir) { const L = [1, 2, 4, 8, 16]; let i = L.indexOf(__spd); if (i < 0) i = 0; return setSpeed(L[Math.max(0, Math.min(L.length - 1, i + dir))]); }
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test((e.target && e.target.tagName) || '')) return;
  if (e.code === 'BracketRight') stepSpeed(1); else if (e.code === 'BracketLeft') stepSpeed(-1);
});
window.__gameSpeed = { set: setSpeed, step: stepSpeed, get: () => __spd };
function fmt(n) {
  if (!isFinite(n)) return '∞'; if (n < 0) return '-' + fmt(-n);
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString();
  const u = Math.floor(Math.log10(n) / 4); if (u >= UNITS.length) return n.toExponential(2).replace('+', '');
  const p = Math.pow(10, u * 4), head = Math.floor(n / p), rest = Math.floor((n % p) / Math.pow(10, (u - 1) * 4));
  if (head >= 1000 || rest === 0) return head.toLocaleString() + UNITS[u];
  return head + UNITS[u] + ' ' + rest.toLocaleString() + (u >= 2 ? UNITS[u - 1] : '');
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2300); }
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ═══ 바이옴 · 해파리 · 자원 (원작 구성) ═══
const BIOMES = [
  { id: 'shallows', n: '얕은 바다', ic: '🏝️', bg: ['#8fe0ff', '#2f9fd0', '#146b96'], need: 0 },
  { id: 'glacial', n: '빙하 속 심해', ic: '🧊', bg: ['#cfefff', '#5fb0d8', '#1e5f88'], need: 150 },
  { id: 'swamp', n: '늪지대 수역', ic: '🌿', bg: ['#a8d89a', '#4a8f5c', '#1e4a38'], need: 3500 },
  { id: 'magma', n: '용암 심연', ic: '🌋', bg: ['#ffb08a', '#d0552f', '#5a1a12'], need: 50000 },
];
// 해파리 등급 — 일반/은/황금/에메랄드/무지개
const GRADE = [
  { n: '일반', c: '#bfe9ff', m: 1, w: 100 },
  { n: '은', c: '#e8eef8', m: 4, w: 14, k: 'silver' },
  { n: '황금', c: '#ffd36b', m: 18, w: 4, k: 'gold' },
  { n: '에메랄드', c: '#6cf09a', m: 80, w: 1, k: 'emerald' },
  { n: '무지개', c: '#ff9fc7', m: 400, w: .2, k: 'rainbow' },
];
const JELLY = [
  { id: 'moon', n: '달해파리', b: 0, hp: 3, v: 1, c: '#bfe9ff' },
  { id: 'blue', n: '푸른물결', b: 0, hp: 6, v: 3, c: '#7fc9ff' },
  { id: 'pink', n: '분홍갓', b: 0, hp: 12, v: 8, c: '#ff9fc7' },
  { id: 'frost', n: '서리해파리', b: 1, hp: 26, v: 25, c: '#cfefff' },
  { id: 'crystal', n: '수정해파리', b: 1, hp: 55, v: 70, c: '#9fe9ff' },
  { id: 'moss', n: '이끼해파리', b: 2, hp: 130, v: 220, c: '#a8d89a' },
  { id: 'toxic', n: '독기해파리', b: 2, hp: 300, v: 700, c: '#7ce3a0' },
  { id: 'ember', n: '잉걸해파리', b: 3, hp: 800, v: 2600, c: '#ffb08a' },
  { id: 'lava', n: '용암해파리', b: 3, hp: 2000, v: 9000, c: '#ff6b4a', shock: 1 },
];
const jellyById = Object.fromEntries(JELLY.map(j => [j.id, j]));
// 자원 블록 (플라즈마로 파괴)
const MATS = [
  { id: 'scrap', n: '고철', ic: '🔩', c: '#b8b8c4', b: 0 },
  { id: 'crystal', n: '수정', ic: '💎', c: '#9fe9ff', b: 1 },
  { id: 'mushroom', n: '버섯', ic: '🍄', c: '#ff9f9f', b: 2 },
  { id: 'obsidian', n: '흑요석', ic: '🪨', c: '#b58cff', b: 3 },
];
const matById = Object.fromEntries(MATS.map(m => [m.id, m]));
// ═══ 스킬 트리 (원작 스킬명) ═══
const K = (n, ic, k, v, max, ds, mat) => ({ n, ic, k, v, max: max || 1, ds, mat });
const BRANCH = [
  { id: 'oxy', d: [0, -1], nodes: [
    K('산소 탱크', '🫁', 'oxy', 8, 8, '최대 산소가 +8 증가합니다'),
    K('심호흡', '😮‍💨', 'oxyburn', .06, 5, '산소 소비량이 6% 감소합니다'),
    K('산소 포집', '🫧', 'oxycatch', .4, 5, '해파리를 잡을 때마다 산소를 0.4 회복합니다'),
    K('산소 탱크 효율', '🫁', 'oxy', 20, 6, '최대 산소량이 +20 증가합니다'),
    K('해파리 동화', '🧬', 'oxyjelly', .02, 5, '해파리를 수집할 때마다 최대 산소량이 영구적으로 +0.02'),
    K('산소 회복량', '♻️', 'oxyregen', .5, 5, '잠수함 근처에서 산소 회복 속도 +1/초 (잠수함 산소 공급 필요)'),
    K('산소 탱크 II', '🫁', 'oxy', 60, 6, '최대 산소량이 +60 증가합니다'),
  ] },

  const sp = sellSpeed();
  for (let i = S.store.length - 1; i >= 0; i--) {
    const it = S.store[i]; it.p += dt * sp;

    bindBuy._el = el; bindBuy._t = now; clearTimeout(bindBuy._h); bindBuy._h = setTimeout(() => { Sound.play('tap'); infoFn && infoFn(); }, 170);
  });
  el.addEventListener('dblclick', e => e.preventDefault());
}

  } else if (t === 'dex') {

      <div class="step"><div class="no">1</div><p><b>🤿 다이빙</b>하면 🚤 <b>잠수함</b>에서 출발해 넓은 바다를 헤엄쳐요. <b>산소</b>가 줄어드니 <b>질식하기 전에 잠수함으로 돌아와 귀항</b>하세요 — 0이 되면 배낭의 해파리 일부를 잃습니다. 화면 밖 잠수함은 화살표와 작은 지도로 보여요.</p></div>
      <div class="step"><div class="no">2</div><p>거북이는 커서(손가락)를 따라갑니다. <b>버블 건은 가장 가까운 해파리에게 자동 발사</b>되고, 탄창이 비면 재장전해요.</p></div>

    $('btnExport').onclick = () => { save(); const x = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(x).then(() => toast('저장 코드를 복사했어요')).catch(() => prompt('복사해 주세요', x)); };

function selNode(id) {

  document.querySelectorAll('.tn').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  const l = lv(n.id);
  showSheet(n.ic, n.n + (n.max > 1 ? ` ${l}/${n.max}` : ''), n.ds || '', n.root || l >= n.max ? null : n);
}
function buyNode(id) {

  S.shell -= nodeCost(n); if (n.mat) S.mats[n.mat] -= matNeed(n);
  S.lv[id] = lv(id) + 1; Sound.play('correct');
  const wrap = $('treewrap'), sl = wrap ? wrap.scrollLeft : 0, st = wrap ? wrap.scrollTop : 0;
  renderAll(); if ($('treewrap')) { $('treewrap').scrollLeft = sl; $('treewrap').scrollTop = st; }
  selNode(id); save();
}
