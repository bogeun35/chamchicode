<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 바위 밑바닥</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --bg: #120d18; --panel: #22192c; --panel2: #2c2138; --line: #4a3a5c; --ink: #f5ecff; --dim: #b7a6c9; --gold: #ffd36b; --green: #7ce3a0; --pink: #ff8fc7; --cyan: #7fd8ff; --purple: #b58cff; --red: #ff6b7a; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; touch-action: none; }
button { font-family: inherit; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%) translateY(-16px); z-index: 95; background: var(--panel); border: 2px solid var(--gold); color: var(--ink); padding: 8px 18px; border-radius: 12px; font-size: 15px; opacity: 0; transition: all .25s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* HUD */
.hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.hud > * { pointer-events: auto; }
.topbar { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.lvbox { display: flex; align-items: center; gap: 7px; background: rgba(34,25,44,.92); border: 2px solid var(--line); border-radius: 12px; padding: 4px 9px 4px 4px; }
.lvbox .lv { width: 32px; height: 32px; border-radius: 9px; background: var(--purple); color: #24123a; display: grid; place-items: center; font-size: 15px; }
.xpbar { width: 120px; height: 14px; background: #150e1d; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; position: relative; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--purple), var(--pink)); transition: width .25s; }
.xpbar span { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 10px; color: #f0e4ff; text-shadow: 0 1px 0 #000; }
.curs { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
.cur { display: flex; align-items: center; gap: 4px; background: rgba(34,25,44,.92); border: 2px solid var(--line); border-radius: 10px; padding: 3px 8px 3px 5px; font-size: 14px; white-space: nowrap; }
.cur .ic { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 12px; }
.cur.pop { animation: pop .3s ease; } @keyframes pop { 45% { transform: scale(1.15); } }
.btns { display: flex; gap: 6px; }
.hb { border: 2px solid var(--line); border-radius: 11px; background: rgba(34,25,44,.94); color: var(--ink); font-size: 14px; padding: 7px 11px; cursor: pointer; white-space: nowrap; }
.hb:active { transform: translateY(2px); }
.hb.gold { border-color: var(--gold); color: var(--gold); }
.energy { position: absolute; left: 10px; bottom: 12px; display: flex; align-items: flex-end; gap: 8px; pointer-events: none; }
.face { width: 54px; height: 54px; border-radius: 14px; background: rgba(34,25,44,.92); border: 2px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.ebar { width: 170px; }
.ebar .bar { height: 16px; background: #150e1d; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
.ebar .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4fd38a, #b8f56a); transition: width .1s; }
.ebar.low .bar i { background: linear-gradient(90deg, #ff6b7a, #ffb35e); }
.ebar .t { font-size: 13px; color: var(--dim); margin-bottom: 3px; white-space: nowrap; }
.ebar .t b { color: var(--ink); font-size: 16px; }
.goals { position: absolute; left: 10px; bottom: 84px; font-size: 13px; color: var(--dim); line-height: 1.6; pointer-events: none; text-shadow: 0 1px 2px #000; }
.goals b { color: var(--ink); } .goals .ok { color: var(--green); }
.bag { position: absolute; left: 196px; bottom: 12px; display: flex; gap: 5px; pointer-events: none; }
.bag .slot { min-width: 54px; height: 38px; border-radius: 9px; background: rgba(34,25,44,.92); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; padding: 0 6px; }
.bag .slot.full { border-color: var(--red); }
.retbtn { position: absolute; right: 10px; bottom: 12px; }
.prompt { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); background: rgba(34,25,44,.95); border: 2px solid var(--gold); border-radius: 12px; padding: 8px 16px; font-size: 16px; display: none; cursor: pointer; }
.prompt.on { display: block; animation: bob 1s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateX(-50%) translateY(-4px); } }
.banner { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%); z-index: 20; font-size: 34px; color: var(--gold); text-shadow: 0 3px 0 #000, 0 0 20px rgba(255,211,107,.5); pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
.banner.on { opacity: 1; }
/* 터치 버튼 */
.touch { position: fixed; inset: 0; pointer-events: none; z-index: 6; display: none; }
body.tch .touch { display: block; }
.tb { position: absolute; width: 66px; height: 66px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); color: #fff; font-size: 26px; display: grid; place-items: center; pointer-events: auto; touch-action: none; }
.tb.on { background: rgba(255,211,107,.35); border-color: var(--gold); }
body.tch .energy { bottom: 96px; } body.tch .bag { left: 10px; bottom: 160px; } body.tch .goals { bottom: 210px; } body.tch .retbtn { bottom: auto; top: 54px; }
/* 오버레이 */
.ov { position: fixed; inset: 0; z-index: 30; background: rgba(8,5,12,.82); display: none; align-items: center; justify-content: center; padding: 10px; }
.ov.on { display: flex; }
.box { width: min(560px, 96vw); max-height: 92vh; overflow: auto; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.box h2 { font-size: 22px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.box h2 .x { margin-left: auto; }
.box .sub { color: var(--dim); font-size: 13px; margin-bottom: 10px; line-height: 1.5; }
.btn { border: 2px solid var(--gold); border-radius: 12px; background: linear-gradient(180deg, #4a3566, #2c1f3c); color: var(--ink); font-size: 16px; padding: 9px 16px; cursor: pointer; }
.btn:disabled { opacity: .4; cursor: default; border-color: var(--line); }
.btn.sm { font-size: 13px; padding: 6px 10px; border-radius: 9px; }
.btn.ghost { border-color: var(--line); background: var(--panel2); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card { background: var(--panel2); border: 2px solid var(--line); border-radius: 13px; padding: 10px 12px; margin-top: 8px; }
.card.lock { opacity: .55; }
.card h3 { font-size: 16px; display: flex; align-items: center; gap: 6px; }
.card p { font-size: 13px; color: var(--dim); line-height: 1.5; margin-top: 3px; }
.prog { height: 10px; background: #150e1d; border-radius: 999px; overflow: hidden; margin-top: 6px; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ff9f43); }
/* 스킬트리 */
#treeOv { padding: 0; }
#treeOv .tw { position: absolute; inset: 0; }
#tcv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.ttop { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; z-index: 2; }
.ttop .ttl { font-size: 20px; margin-right: 6px; }
.ttop .x { margin-left: auto; }
.tip { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(460px, 94vw); background: rgba(34,25,44,.97); border: 2px solid var(--gold); border-radius: 15px; padding: 12px 14px; z-index: 2; display: none; }
.tip.on { display: block; }
.tip h3 { font-size: 19px; display: flex; gap: 8px; align-items: center; }
.tip .d { font-size: 14px; color: var(--dim); margin: 5px 0 6px; line-height: 1.5; }
.tip .l { font-size: 13px; color: var(--cyan); }
.tip .c { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.tip .c .need { font-size: 14px; } .tip .c .need.no { color: var(--red); }
.tip .c .btn { margin-left: auto; }
.tip .lk { color: var(--red); font-size: 13px; margin-top: 4px; }
/* 결과 */
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.res div { background: var(--panel2); border: 2px solid var(--line); border-radius: 11px; padding: 8px 10px; font-size: 13px; color: var(--dim); }
.res b { display: block; font-size: 20px; color: var(--ink); }
.layer { display: flex; gap: 10px; align-items: center; }
.layer .sw { width: 42px; height: 42px; border-radius: 11px; flex: none; display: grid; place-items: center; font-size: 22px; border: 2px solid rgba(255,255,255,.2); }
.ml { display: flex; align-items: center; gap: 8px; }
.ml .nm { flex: 1; min-width: 0; }
.ml .nm small { display: block; color: var(--dim); font-size: 12px; }
#sndBtn { left: auto !important; right: 12px !important; bottom: 60px !important; }
#sndPanel { left: auto !important; right: 10px !important; bottom: 106px !important; }
body.tch #sndBtn { bottom: 96px !important; } body.tch #sndPanel { bottom: 142px !important; }
@media (max-width: 560px) { .xpbar { width: 84px; } .ebar { width: 120px; } .ebar .t b { font-size: 14px; } .bag { left: 150px; } .banner { font-size: 26px; } .cur { font-size: 12px; padding: 2px 6px 2px 4px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="toast" id="toast"></div>
<div class="banner" id="banner"></div>
<div class="hud" id="hud">
  <div class="topbar">
    <div class="lvbox"><div class="lv" id="lv">1</div><div><div style="font-size:11px;color:var(--dim)" id="lvName">고블린 광부</div><div class="xpbar"><i id="xpI"></i><span id="xpT"></span></div></div></div>
    <div class="curs" id="curs"></div>

  </div>
  <div class="goals" id="goals"></div>
  <div class="energy" id="energyBox" style="display:none"><div class="face" id="face"></div><div class="ebar" id="ebar"><div class="t">⚡ 에너지 <b id="eT">0</b></div><div class="bar"><i id="eI"></i></div></div></div>
  <div class="bag" id="bag" style="display:none"></div>
  <button class="hb gold retbtn" id="bReturn" style="display:none">⬆ 지상으로 귀환</button>
  <div class="prompt" id="prompt"></div>
</div>
<div class="touch" id="touch">
  <div class="tb" data-k="left" style="left:14px;bottom:16px">◀</div>
  <div class="tb" data-k="right" style="left:92px;bottom:16px">▶</div>
  <div class="tb" data-k="dash" style="left:170px;bottom:24px;width:52px;height:52px;font-size:20px">💨</div>
  <div class="tb" data-k="dig" style="right:92px;bottom:16px">⛏</div>
  <div class="tb" data-k="jump" style="right:14px;bottom:16px">⤒</div>
</div>

<div class="ov" id="treeOv"><div class="tw">
  <canvas id="tcv"></canvas>
  <div class="ttop" id="ttop"></div>
  <div class="tip" id="tip"></div>
</div></div>
<div class="ov" id="panelOv"><div class="box" id="panel"></div></div>

<script src="party-sound.js"></script><script>Sound.theme('mystery'); Sound.scene('game');</script>
<script src="bottom/data.js"></script>
<script>

// ════════════ 루프 ════════════
let last = performance.now(), SPEED = 1, saveT = 0;
function frame(ts) {
  let dt = Math.min(.05, (ts - last) / 1000) * SPEED; last = ts;
  if (!anyOverlay()) { if (scene === 'mine' && R) updateMine(dt); else if (scene === 'hub') updateHub(dt); }
  else { tickSmelt(); tickFoundry(); if (panelKind === 'foundry' && S.foundry.length && Math.random() < .2) renderFoundry(); }
  if (scene === 'mine' && R) drawMine(); else drawHub();
  saveT += dt; if (saveT > 5) { saveT = 0; save(); if (scene === 'hub') $('goals').innerHTML = goalsHtml(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else last = performance.now(); });
addEventListener('pagehide', save);

function stepSim(sec, dt = 1 / 60) {   // 창이 숨겨져 rAF 가 멈춰도 테스트할 수 있게 고정 간격으로 진행
  for (let t = 0; t < sec; t += dt) { if (!anyOverlay()) { if (scene === 'mine' && R) updateMine(dt); else if (scene === 'hub') updateHub(dt); } else { tickSmelt(); tickFoundry(); } }
  if (scene === 'mine' && R) drawMine(); else drawHub();
}
