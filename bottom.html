<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 바위 밑바닥</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --bg: #07080c; --panel: rgba(16,14,20,.94); --panel2: #221c26; --line: #5a4632; --line2: #8a6a44; --ink: #f4ead8; --dim: #b4a48c; --gold: #ffd36b; --green: #7ce38a; --red: #ff6b6b; --blue: #6ab4ff; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; touch-action: none; }
button { font-family: inherit; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-12px); z-index: 95; background: var(--panel); border: 2px solid var(--line2); color: var(--ink); padding: 8px 16px; border-radius: 6px; font-size: 15px; opacity: 0; transition: .25s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* ── 원작 HUD 배치: 좌상단 가방·자원, 상단 가운데 XP, 왼쪽 퀘스트, 좌하단 에너지·초상화, 우하단 지상으로 귀환 ── */
.hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.inv { position: absolute; left: 8px; top: 8px; display: flex; gap: 3px; flex-wrap: wrap; max-width: 46vw; }
.slot { width: 30px; height: 30px; border: 2px solid #9a7a52; background: rgba(10,8,8,.55); position: relative; image-rendering: pixelated; }
.slot canvas { width: 22px; height: 22px; position: absolute; left: 2px; top: 2px; image-rendering: pixelated; }
.slot b { position: absolute; right: 1px; bottom: -1px; font-size: 10px; text-shadow: 0 0 2px #000, 0 0 2px #000; font-weight: normal; }
.slot.full { border-color: var(--red); animation: shk .3s; }
@keyframes shk { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
.res { position: absolute; left: 10px; top: 48px; display: flex; flex-direction: column; gap: 2px; }
.rrow { display: flex; align-items: center; gap: 6px; height: 20px; font-size: 13px; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
.rrow canvas { width: 16px; height: 16px; image-rendering: pixelated; }
.xp { position: absolute; left: 25%; right: 25%; top: 8px; }
.xpbar { height: 14px; background: #1a1612; border: 2px solid #8a6a44; border-radius: 3px; position: relative; overflow: hidden; }
.xpbar::before, .xpbar::after { content: ''; position: absolute; top: -2px; width: 6px; height: 14px; background: #c9a46a; }
.xpbar::before { left: -2px; } .xpbar::after { right: -2px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(180deg, #5aa0f2, #2a5ab4); transition: width .25s; }
.xpbar.max i { background: linear-gradient(180deg, #fff060, #8c5c06); }
.xplv { margin: 2px auto 0; width: 130px; text-align: center; font-size: 12px; background: #1a1612; border: 1px solid #8a6a44; border-top: 0; border-radius: 0 0 4px 4px; }
.quests { position: absolute; left: 10px; top: 42%; font-size: 14px; line-height: 1.8; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
.quests .q.done { color: var(--green); text-decoration: line-through; }
.energy { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: flex-end; gap: 0; }
.ebat { width: 14px; height: 54px; border: 2px solid #c9a46a; border-radius: 3px; background: #14100c; margin: 0 4px 22px 0; position: relative; }
.ebat i { position: absolute; left: 1px; right: 1px; bottom: 1px; background: #5ae06a; transition: height .12s; }
.ebat.mid i { background: #f2d23a; } .ebat.low i { background: #ff4a3a; }
.portrait { width: 64px; height: 64px; image-rendering: pixelated; }
.etxt { position: absolute; left: 0; bottom: -2px; width: 92px; height: 18px; background: #1a1612; border: 1px solid #8a6a44; font-size: 12px; text-align: center; line-height: 16px; }
.ret { position: absolute; right: 12px; bottom: 12px; pointer-events: auto; background: rgba(12,10,10,.82); color: var(--ink); border: 2px solid #8a6a44; border-radius: 3px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
.ret:hover { border-color: var(--gold); }
.vig { position: fixed; inset: 0; pointer-events: none; z-index: 4; box-shadow: inset 0 0 140px 40px rgba(220,20,10,.0); transition: box-shadow .3s; }
.vig.on { box-shadow: inset 0 0 160px 60px rgba(220,20,10,.55); }
.chunkpop { position: fixed; top: 18%; left: 50%; transform: translate(-50%, -10px) scale(.8); background: var(--panel); border: 2px solid var(--line2); border-radius: 6px; padding: 10px 16px; text-align: center; z-index: 30; opacity: 0; transition: .3s; pointer-events: none; }
.chunkpop.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
.chunkpop .sl { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
.chunkpop canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.lvup { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(.6); font-size: 40px; color: var(--gold); text-shadow: 0 3px 0 #6a3a0a, 0 0 18px rgba(255,200,80,.6); z-index: 25; opacity: 0; transition: .3s; pointer-events: none; white-space: nowrap; }
.lvup.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.areaname { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 30px; z-index: 24; opacity: 0; transition: opacity .6s; pointer-events: none; text-shadow: 0 2px 6px #000; text-align: center; }
.areaname small { display: block; font-size: 15px; color: var(--dim); }
.areaname.on { opacity: 1; }
.fade { position: fixed; inset: 0; background: #000; z-index: 90; opacity: 0; pointer-events: none; transition: opacity .3s; }
.fade.on { opacity: 1; }
/* 터치 */
.touch { position: fixed; inset: 0; pointer-events: none; z-index: 6; display: none; }
body.tch .touch { display: block; }
.tb { position: absolute; width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.3); color: #fff; font-size: 24px; display: grid; place-items: center; pointer-events: auto; touch-action: none; }
.tb.on { background: rgba(255,211,107,.35); border-color: var(--gold); }
body.tch .energy { bottom: 86px; } body.tch .ret { bottom: auto; top: 50px; } body.tch .quests { top: 34%; }
/* 패널 (원작의 어두운 반투명 판 + 나무색 테두리) */
.ov { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 10px; }
.ov.on { display: flex; }
.box { width: min(620px, 96vw); max-height: 92vh; overflow: auto; background: var(--panel); border: 2px solid var(--line2); border-radius: 6px; padding: 14px; box-shadow: 0 16px 50px rgba(0,0,0,.6); }
.box h2 { font-size: 21px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.box h2 .x { margin-left: auto; }
.sub { color: var(--dim); font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
.btn { border: 2px solid #8a6a44; border-radius: 4px; background: linear-gradient(180deg, #4a3a2a, #2a2018); color: var(--ink); font-size: 15px; padding: 7px 14px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.sm { font-size: 13px; padding: 5px 10px; }
.btn.go { background: linear-gradient(180deg, #3e6a2e, #22401a); border-color: #7cc35a; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card { background: rgba(40,32,28,.7); border: 2px solid #4a3a2a; border-radius: 4px; padding: 9px 11px; margin-top: 7px; }
.card.sel { border-color: var(--gold); }
.card.lock { opacity: .6; }
.card h3 { font-size: 16px; display: flex; align-items: center; gap: 6px; }
.card p { font-size: 13px; color: var(--dim); line-height: 1.5; margin-top: 3px; }
.prog { height: 9px; background: #14100c; border: 1px solid #4a3a2a; overflow: hidden; margin-top: 5px; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, #ffd36b, #ff9f43); }
.ic16 { width: 16px; height: 16px; image-rendering: pixelated; vertical-align: -3px; }
.ok { color: var(--green); } .no { color: var(--red); }
/* 승강기 지역 선택: 오른쪽에서 밀려 나오는 판 */
#liftOv { justify-content: flex-end; padding: 0; }
#liftOv .box { height: 100vh; max-height: none; width: min(720px, 100vw); border-radius: 0; border-width: 0 0 0 2px; display: flex; flex-direction: column; }
.lgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.lcard { border: 2px solid #4a3a2a; border-radius: 4px; padding: 6px 4px; text-align: center; cursor: pointer; background: rgba(30,24,20,.8); font-size: 12px; min-height: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.lcard.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.lcard.lock { opacity: .45; }
.lcard .sw { width: 34px; height: 24px; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); }
.linfo { flex: 1; overflow: auto; margin-top: 10px; }
/* 결과 */
.rlist { margin-top: 6px; }
.rli { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px solid #3a2e24; font-size: 15px; }
.rli b { margin-left: auto; }
/* 스킬트리 */
#treeOv { padding: 0; background: #0a0806; }
#tcv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.ttop { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; z-index: 2; pointer-events: none; }
.ttop > * { pointer-events: auto; }
.ttop .ttl { font-size: 20px; margin-right: 6px; text-shadow: 0 2px 4px #000; }
.ttop .x { margin-left: auto; }
.chip { display: flex; align-items: center; gap: 4px; background: rgba(16,14,20,.85); border: 1px solid #5a4632; border-radius: 3px; padding: 2px 7px 2px 4px; font-size: 13px; }
.tip { position: absolute; z-index: 3; width: min(320px, 92vw); background: rgba(14,12,16,.97); border: 2px solid #8a6a44; border-radius: 5px; padding: 10px 12px; display: none; pointer-events: auto; }
#treeOv.gold .tip { border-color: #ffd36b; box-shadow: 0 0 18px rgba(255,200,80,.35); }
.tip.on { display: block; }
.tip h3 { font-size: 17px; }
.tip .d { font-size: 13px; color: var(--dim); margin: 4px 0; line-height: 1.5; }
.tip .l { font-size: 12px; color: #9fd0ff; }
.tip .eff { font-size: 13px; color: var(--gold); margin-top: 3px; }
.tip .c { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 7px; font-size: 14px; }
.tip .c .btn { margin-left: auto; }
.tip .lk { color: var(--red); font-size: 13px; margin-top: 4px; }
@media (max-width: 600px) { .xp { left: 30%; right: 4%; } .quests { font-size: 12px; } .lgrid { grid-template-columns: repeat(3, 1fr); } .lvup { font-size: 30px; } .inv { max-width: 60vw; } }
#sndBtn { left: auto !important; right: 12px !important; bottom: 56px !important; }
#sndPanel { left: auto !important; right: 10px !important; bottom: 102px !important; }
body.tch #sndBtn { bottom: auto !important; top: 96px !important; } body.tch #sndPanel { bottom: auto !important; top: 142px !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="vig" id="vig"></div>
<div class="toast" id="toast"></div>
<div class="lvup" id="lvup">레벨 업!</div>
<div class="areaname" id="areaname"></div>
<div class="chunkpop" id="chunkpop"></div>
<div class="fade" id="fade"></div>
<div class="hud" id="hud">
  <div class="inv" id="inv"></div>
  <div class="res" id="res"></div>
  <div class="xp"><div class="xpbar" id="xpbar"><i id="xpI"></i></div><div class="xplv" id="xpLv">Lv 1</div></div>
  <div class="quests" id="quests"></div>
  <div class="energy" id="energyBox"><div class="ebat" id="ebat"><i id="eI"></i></div><div style="position:relative"><canvas class="portrait" id="portrait" width="32" height="32"></canvas><div class="etxt" id="eT">⚡ 0/0</div></div></div>
  <button class="ret" id="bReturn">지상으로 귀환</button>
</div>
<div class="touch" id="touch">
  <div class="tb" data-k="left" style="left:12px;bottom:14px">◀</div>
  <div class="tb" data-k="right" style="left:84px;bottom:14px">▶</div>
  <div class="tb" data-k="dash" style="left:160px;bottom:20px;width:50px;height:50px;font-size:18px">💨</div>
  <div class="tb" data-k="act" style="right:84px;bottom:84px;width:50px;height:50px;font-size:18px">E</div>
  <div class="tb" data-k="jump" style="right:12px;bottom:14px">⤒</div>
  <div class="tb" data-k="down" style="right:84px;bottom:14px;width:50px;height:50px;font-size:18px">⤓</div>
</div>
<div class="ov" id="panelOv"><div class="box" id="panel"></div></div>
<div class="ov" id="liftOv"><div class="box" id="lift"></div></div>
<div class="ov" id="treeOv"><canvas id="tcv"></canvas><div class="ttop" id="ttop"></div><div class="tip" id="tip"></div></div>

<script src="party-sound.js"></script><script>Sound.theme('mystery'); Sound.scene('game');</script>
<script src="bottom/data.js"></script>
<script src="bottom/noise.js"></script>
<script src="bottom/world.js"></script>
<script src="bottom/art.js"></script>
<script src="bottom/game.js"></script>
<script src="bottom/draw.js"></script>
<script src="bottom/ui.js"></script>
</body>
</html>
