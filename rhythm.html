<script src="party-sound.js"></script>
<script>
'use strict';
/* 쿵짝항구 대소동 — 한 버튼 리듬 미니게임. 음악·효과음은 이 파일의 Web Audio 엔진이 박에 맞춰 예약한다.
   시계: 곡 시각 s ↔ 오디오 시각 ctxT = t0 + s. 화면·판정은 '들리는 시각'(getOutputTimestamp) 기준. sim 모드는 결정적 시계. */

// ===== CFG =====
const CFG = { P: .0405, G: .0905, CAP: .1505, RP: .0605, RG: .1205, LEAD: .3, AHEAD: .1, VOICES: 48, STRAY: .5, PERF_STRAY: 3, ECHO: .2, ECHO_CAP: .2 };   // 따라해 콜 마디에서 삑을 같이 누른 헛누름(메아리)은 0.2, 합계는 총 무게의 20%까지만  // 판정 창은 경계 포함 + 0.5ms 여유. 헛누름 1회 = 무게 0.5 감점(상한 없음), 완벽 도전은 헛누름 3번이면 끝
const COL = { sea: '#7fd3e8', deep: '#3b8fb5', sand: '#ffe9b8', coral: '#ff8a70', ink: '#2a2118', cream: '#fff3d6', gold: '#f6c945', navy: '#24365c' };
const BGC = { sushi: '#ffe2c2', salute: '#8fd0ec', puffer: '#3a2f5c', gull: '#bfe6f5', remix: '#7fd3e8', menu: '#7fd3e8', title: '#7fd3e8', calib: '#8fd0ec', calibAsk: '#7fd3e8' };
const GAMES = [
  { id: 'sushi', name: '초밥 한 점!', order: 1, bpm: 100, bars: 28, place: '초밥집', ready: true, who: '무니', line: '…밥.', sub: '정박 탭 · 톡 하면 한 박 뒤에 척!' },
  { id: 'salute', name: '선장님 따라해!', order: 2, bpm: 112, bars: 36, place: '갑판', ready: true, who: '냥선장', line: '내가 불면 너도 분다냥. 하품은 빼고.', sub: '따라하기 · 삑 소리를 다음 마디에 그대로 넵!' },
  { id: 'puffer', name: '복어 나팔대', order: 3, bpm: 88, bars: 28, place: '축제 무대', ready: true, who: '빵이', line: '뿌… 살살 불어 줘.', sub: '길게 누르기 · 틱 두 박 뒤 꾹, 물방울이 다 터지면 떼기' },
  { id: 'gull', name: '끼룩단 퇴치', order: 4, bpm: 128, bars: 36, place: '생선 좌판', ready: true, who: '말순냥', line: '까악 말고 칭에 때려. 비둘기는 손님이야.', sub: '엇박 탭 · 까악 반 박 뒤 칭에 대파! 비둘기는 참기' },
  { id: 'remix', name: '쿵짝항구 대축제', order: 5, bpm: 116, bars: 65, place: '축제 배', ready: true, who: '냥선장', line: '오늘은 축제다냥! 다 섞는다냥!', sub: '리믹스 · 가게 규칙 그대로, 뱃고동이 울리면 가게가 바뀐다' },
];
const GBY = Object.fromEntries(GAMES.map(g => [g.id, g]));
const FONT = px => `${px}px Jua, "Malgun Gothic", sans-serif`;
// Google Fonts 의 한글은 글자 범위별 조각 파일이라, 캔버스에만 쓰는 글자(얹·헛·뼈·셰·됐 …)는 조각이 안 받아져 기본 글꼴로 섞인다 → 이 스크립트에 나오는 한글 전부를 미리 요청
const KO_CHARS = (() => { try { return [...new Set(document.currentScript.textContent.match(/[ㄱ-ㆎ가-힣]/g) || [])].join(''); } catch (e) { return ''; } })();
function loadFonts() { try { if (document.fonts && document.fonts.load) document.fonts.load('30px Jua', KO_CHARS + '0123456789…·!?×+-ms점').catch(() => {}); } catch (e) {} }
loadFonts(); addEventListener('load', loadFonts);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);

// ===== SAVE =====
const SKEY = 'chams_rhythm_v1';
const blankGame = () => ({ best: 0, grade: null, plays: 0, fails: 0, cleared: false, mercy: false, medal: false, stamp: false, practiced: false });
function blankSave() { const g = {}; GAMES.forEach(x => g[x.id] = blankGame()); return { v: 1, offset: 0, calibrated: false, askedCalib: false, games: g, seenFarts: [], last: 'sushi' }; }
let SV = blankSave();
function loadSave() {
  try { const r = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (r && r.v === 1) { const b = Object.assign(blankSave(), r); b.games = {}; GAMES.forEach(x => b.games[x.id] = Object.assign(blankGame(), (r.games || {})[x.id] || {})); SV = b; } } catch (e) {}
}
function save() { try { localStorage.setItem(SKEY, JSON.stringify(SV)); } catch (e) {} }
loadSave();
function isUnlocked(id) {
  const i = GAMES.findIndex(g => g.id === id); if (i < 0) return false; if (i === 0) return true;
  if (id === 'remix') return GAMES.slice(0, 4).every(g => SV.games[g.id].cleared);
  return SV.games[GAMES[i - 1].id].cleared || SV.games[id].mercy;
}
const stampCount = () => GAMES.filter(g => SV.games[g.id].stamp).length;
// 완벽 도전: 메달 받은 게임만. 리믹스는 앞 4게임 메달이 다 모이면
const perfectOpen = id => id === 'remix' ? GAMES.slice(0, 4).every(g => SV.games[g.id].medal) : !!(SV.games[id] && SV.games[id].medal);

// ===== AU (자체 오디오 엔진) =====
const AU = { ctx: null, bgmVol: .6, sfxVol: .8, ends: [] };
function readVol() {
  try { const b = parseFloat(localStorage.getItem('party_bgmvol')), f = parseFloat(localStorage.getItem('party_sfxvol')); if (!isNaN(b)) AU.bgmVol = clamp(b, 0, 1); if (!isNaN(f)) AU.sfxVol = clamp(f, 0, 1); } catch (e) {}
  if (window.Sound && typeof Sound.bgmVolume === 'number') { AU.bgmVol = Sound.bgmVolume; AU.sfxVol = Sound.sfxVolume; }
}
function applyVol() {
  readVol(); if (!AU.ctx) return; const t = AU.ctx.currentTime;
  AU.bgm.gain.setTargetAtTime(AU.bgmVol * .9, t, .02);
  AU.cue.gain.setTargetAtTime(Math.max(AU.bgmVol, AU.sfxVol) * .9, t, .02);   // 큐는 음악을 꺼도 들려야 함(음악 0 → 효과음 음량)
  AU.sfx.gain.setTargetAtTime(AU.sfxVol, t, .02);
}
function auInit() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  if (!AU.ctx) {
    try { AU.ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { AU.ctx = new AC(); }
    const c = AU.ctx;
    AU.comp = c.createDynamicsCompressor(); AU.comp.threshold.value = -10; AU.comp.knee.value = 10; AU.comp.ratio.value = 4; AU.comp.attack.value = .003; AU.comp.release.value = .12;
    AU.master = c.createGain(); AU.master.gain.value = .9; AU.comp.connect(AU.master); AU.master.connect(c.destination);
    AU.bgm = c.createGain(); AU.cue = c.createGain(); AU.sfx = c.createGain(); [AU.bgm, AU.cue, AU.sfx].forEach(g => { g.gain.value = 0; g.connect(AU.comp); });
    const len = Math.floor(c.sampleRate * 1.5), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; AU.noise = buf;
    applyVol();
  }
  if (AU.ctx.state === 'suspended' && !docHidden() && !paused) AU.ctx.resume().catch(() => {});
  return true;
}
// 원음 합성: {f, f1, bend, type, vol, a, hold, d, lp/bp/hp, lp1, q, vib, vibD}
function osc(dest, t, o) {
  const c = AU.ctx, n = c.createOscillator(), g = c.createGain(); n.type = o.type || 'sine';
  const a = o.a == null ? .003 : o.a, h = o.hold || 0, d = o.d || .1, v = o.vol == null ? .3 : o.vol, end = t + a + h + d;
  n.frequency.setValueAtTime(o.f, t); if (o.f1) n.frequency.exponentialRampToValueAtTime(o.f1, t + (o.bend || a + h + d));
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); if (h) g.gain.setValueAtTime(v, t + a + h); g.gain.exponentialRampToValueAtTime(.0001, end);
  if (o.lp || o.bp || o.hp) { const fl = c.createBiquadFilter(); fl.type = o.lp ? 'lowpass' : o.bp ? 'bandpass' : 'highpass'; fl.frequency.setValueAtTime(o.lp || o.bp || o.hp, t); if (o.lp1) fl.frequency.exponentialRampToValueAtTime(o.lp1, end); fl.Q.value = o.q || .8; n.connect(fl); fl.connect(g); } else n.connect(g);
  if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibD || 10; l.connect(lg); lg.connect(n.frequency); l.start(t); l.stop(end + .02); }
  g.connect(dest); n.start(t); n.stop(end + .02); AU.ends.push(end); return end;
}
function nz(dest, t, o) {
  const c = AU.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); s.buffer = AU.noise; s.loop = true;
  const a = o.a == null ? .002 : o.a, h = o.hold || 0, d = o.d || .08, v = o.vol == null ? .3 : o.vol, end = t + a + h + d;
  fl.type = o.type || 'bandpass'; fl.frequency.setValueAtTime(o.f || 1000, t); if (o.f1) fl.frequency.exponentialRampToValueAtTime(o.f1, t + (o.bend || a + h + d)); fl.Q.value = o.q == null ? 1 : o.q;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); if (h) g.gain.setValueAtTime(v, t + a + h); g.gain.exponentialRampToValueAtTime(.0001, end);
  s.connect(fl); fl.connect(g); g.connect(dest); s.start(t, Math.random() * 1.2); s.stop(end + .02); AU.ends.push(end); return end;
}
// 악기·효과음 (dest, 시각, 인자)
const I = {
  kick: (d, t, a = {}) => osc(d, t, { f: a.f0 || 150, f1: a.f || 55, bend: .07, vol: a.vol == null ? .9 : a.vol, d: a.d || .28, a: .002 }),
  snare: (d, t, a = {}) => { const v = a.vol == null ? .5 : a.vol; nz(d, t, { f: 1900, q: .7, vol: v, d: .13 }); osc(d, t, { type: 'triangle', f: 200, f1: 160, vol: v * .6, d: .06 }); },
  rim: (d, t, a = {}) => { const v = a.vol == null ? .4 : a.vol; nz(d, t, { f: 2600, q: 4, vol: v, d: .03 }); osc(d, t, { type: 'square', f: 820, vol: v * .25, d: .02 }); },
  hat: (d, t, a = {}) => nz(d, t, { type: 'highpass', f: 7000, vol: a.vol == null ? .18 : a.vol, d: a.d || .035 }),
  crash: (d, t, a = {}) => nz(d, t, { type: 'highpass', f: 5000, vol: a.vol || .3, d: a.d || .9 }),
  bass: (d, t, a) => { const du = a.dur || .2, v = a.vol || .5; osc(d, t, { type: 'triangle', f: a.f, vol: v, a: .005, hold: du * .6, d: du * .5 }); osc(d, t, { type: 'sine', f: a.f * 2, vol: v * .28, a: .005, hold: du * .4, d: du * .4 }); },
  pluck: (d, t, a) => { const v = a.vol || .15, dd = a.d || .35; osc(d, t, { type: 'sawtooth', f: a.f, vol: v, a: .002, d: dd, lp: 3400, lp1: 600, q: 1.2 }); osc(d, t, { type: 'triangle', f: a.f, vol: v * .8, a: .002, d: dd * 1.4 }); },
  strum: (d, t, a) => { (a.ns || []).forEach((m, i) => I.pluck(d, t + i * .012, { f: mtof(m), vol: a.vol || .07, d: a.d || .25 })); },
  bell: (d, t, a) => { osc(d, t, { f: a.f, vol: a.vol || .15, d: a.d || .3 }); osc(d, t, { f: a.f * 2.76, vol: (a.vol || .15) * .3, d: (a.d || .3) * .5 }); },
  clap: (d, t, a = {}) => { const n = a.n || 6; for (let i = 0; i < n; i++) nz(d, t + Math.random() * (a.spread || .5), { f: 1300 + Math.random() * 900, q: 1.5, vol: (a.vol || .25) * (.6 + Math.random() * .4), d: .05 }); },
  tick: (d, t) => { osc(d, t, { type: 'square', f: 1500, vol: .16, d: .03 }); },
  thump: (d, t, a = {}) => { I.kick(d, t, { vol: a.vol || .9, f: 58, d: .3 }); nz(d, t, { type: 'lowpass', f: 400, vol: .3, d: .08 }); },
  // 초밥 한 점!
  tok: (d, t) => { osc(d, t, { type: 'square', f: 1800, vol: .2, d: .025 }); nz(d, t, { f: 3000, q: 2, vol: .45, d: .015 }); osc(d, t, { type: 'triangle', f: 950, vol: .3, d: .04 }); },
  knife: (d, t) => { osc(d, t, { type: 'square', f: 2500, vol: .13, d: .02 }); nz(d, t, { type: 'highpass', f: 5000, vol: .35, d: .012 }); osc(d, t, { type: 'triangle', f: 1300, vol: .2, d: .03 }); },
  yeong: (d, t) => { osc(d, t, { type: 'sawtooth', f: 180, f1: 150, bend: .45, vol: .5, a: .03, hold: .32, d: .12, bp: 700, q: 3 }); osc(d, t, { type: 'sine', f: 180, f1: 150, bend: .45, vol: .2, a: .03, hold: .32, d: .1 }); },
  cha: (d, t) => { osc(d, t, { type: 'sawtooth', f: 260, vol: .5, a: .005, d: .12, bp: 900, q: 2 }); nz(d, t, { f: 2500, vol: .25, d: .05 }); },
  chuck: (d, t) => { nz(d, t, { f: 2000, q: 1, vol: .75, d: .08 }); osc(d, t, { type: 'triangle', f: 220, f1: 170, vol: .5, d: .05 }); nz(d, t + .02, { type: 'highpass', f: 6000, vol: .18, d: .04 }); },
  chuck_big: (d, t) => { I.kick(d, t, { vol: .95, f: 50, d: .4 }); I.chuck(d, t); I.crash(d, t, { vol: .28, d: .6 }); },
  sparkle: (d, t) => { osc(d, t, { f: 1318.5, vol: .15, d: .15 }); osc(d, t, { f: 1318.5 * 2.76, vol: .05, d: .08 }); },
  splat: (d, t) => { nz(d, t, { type: 'lowpass', f: 600, vol: .8, d: .15 }); osc(d, t, { f: 300, f1: 120, vol: .45, d: .15 }); },
  huh: (d, t) => { osc(d, t, { f: 900, vol: .22, d: .06 }); osc(d, t + .1, { f: 1100, vol: .22, d: .08 }); },
  squash: (d, t) => { I.kick(d, t, { f: 70, d: .3 }); osc(d, t + .05, { f: 1200, f1: 600, bend: .2, vol: .2, d: .2 }); },
  whiff: (d, t) => nz(d, t, { f: 1200, f1: 400, vol: .22, d: .09 }),
  stamp: (d, t) => { I.kick(d, t, { vol: .9, f: 60 }); nz(d, t, { type: 'lowpass', f: 900, vol: .5, d: .1 }); },
  fanfare: (d, t, a = {}) => { const ns = a.ns || [72, 76, 79, 84]; ns.forEach((m, i) => I.pluck(d, t + i * .09, { f: mtof(m), vol: .12, d: .4 })); },
  blip: (d, t, a = {}) => osc(d, t, { type: 'triangle', f: a.f || 880, vol: .18, d: .06 }),
  bonk: (d, t) => { osc(d, t, { type: 'triangle', f: 420, f1: 300, vol: .3, d: .08 }); },
  // 공통 반주 악기
  tuba: (d, t, a) => { const du = a.dur || .3, v = a.vol || .3; osc(d, t, { type: 'sawtooth', f: a.f, vol: v, a: .02, hold: du * .55, d: du * .5, lp: 520, q: 1.4 }); osc(d, t, { f: a.f * 2, vol: v * .35, a: .02, hold: du * .5, d: du * .4 }); },
  acc: (d, t, a) => { const du = a.dur || .15, v = a.vol || .045; (a.ns || []).forEach(m => osc(d, t, { type: 'sawtooth', f: mtof(m), vol: v, a: .012, hold: du * .8, d: .07, lp: 1700, q: .7, vib: 5.5, vibD: 2 })); },
  brass: (d, t, a) => { const v = a.vol || .07; (a.ns || []).forEach((m, i) => osc(d, t + i * .004, { type: 'sawtooth', f: mtof(m), vol: v, a: .006, hold: .07, d: .08, lp: 1800, q: .9 })); },
  pulse: (d, t, a) => { const du = a.dur || .3; osc(d, t, { type: 'square', f: a.f, vol: a.vol || .07, a: .01, hold: du * .6, d: du * .35, lp: 2500, q: .7 }); },
  // 선장님 따라해!
  whistle: (d, t) => { osc(d, t, { f: 2600, vol: .2, a: .005, hold: .07, d: .035, vib: 28, vibD: 120 }); osc(d, t, { type: 'triangle', f: 5200, vol: .025, a: .005, hold: .06, d: .03 }); },
  yawn: (d, t) => { osc(d, t, { type: 'sawtooth', f: 300, f1: 220, bend: .9, vol: .32, a: .09, hold: .5, d: .32, bp: 600, lp1: 400, q: 2 }); nz(d, t, { f: 900, q: .7, vol: .09, a: .12, hold: .4, d: .3 }); },
  ahem: (d, t) => { nz(d, t, { f: 500, q: 2, vol: .4, d: .12 }); osc(d, t, { f: 180, vol: .25, d: .12 }); },
  nep_senior: (d, t) => { for (const f of [349.23, 440]) osc(d, t, { type: 'square', f, vol: .1, a: .008, hold: .08, d: .05, bp: 1100, q: 2 }); nz(d, t, { f: 2500, q: 1, vol: .12, d: .012 }); },
  nep: (d, t) => { osc(d, t, { type: 'square', f: 523.25, vol: .19, a: .008, hold: .08, d: .06, bp: 1100, q: 2 }); osc(d, t, { type: 'triangle', f: 523.25, vol: .12, a: .008, hold: .07, d: .05 }); nz(d, t, { f: 2800, q: 1, vol: .16, d: .012 }); },
  nep_crack: (d, t) => { osc(d, t, { type: 'square', f: 523.25, f1: 466, bend: .25, vol: .2, a: .008, hold: .13, d: .12, bp: 1100, q: 2, vib: 14, vibD: 30 }); },
  caw: (d, t) => { osc(d, t, { type: 'sawtooth', f: 1500, f1: 900, bend: .14, vol: .22, a: .006, d: .14, bp: 1400, q: 3 }); },
  gull_pass: (d, t) => { I.caw(d, t); I.caw(d, t + .22); },

// ===== party-sound 연결: 🔊 패널 음량을 우리 버스에도 즉시 반영, 그 파일의 BGM 은 끔 =====

// ===== API (window.rhythm) =====
window.rhythm = {
  games: () => GAMES.map(g => { const s = SV.games[g.id]; return { id: g.id, name: g.name, order: g.order, bpm: g.bpm, bars: g.bars, lengthSec: +(g.bars * 240 / g.bpm).toFixed(4), ready: !!g.ready, unlocked: isUnlocked(g.id), best: s.best, grade: s.grade, medal: s.medal, stamp: s.stamp, mercy: s.mercy, cleared: s.cleared, perfectOpen: perfectOpen(g.id) }; }),
  stamps: () => stampCount(),
  chart(id) {
    const G = GBY[id]; if (!G) return null; const c = buildChart(id);
    const pub = n => { const o = { id: n.id, kind: n.kind, cue: n.cue, beat: n.beat, t: n.t, w: n.w, cueBeat: n.cueBeat }; if (n.relBeat != null) { o.relBeat = n.relBeat; o.relT = n.relT; } if (n.win) o.win = n.win; if (n.zone) o.zone = n.zone; if (n.type) o.type = n.type; if (n.drops) o.drops = n.drops; if (n.cell != null) { o.cell = n.cell; o.grp = n.grp; } return o; };
    return { id, bpm: c.bpm, beatSec: c.beatSec, bars: c.bars, lengthSec: c.lengthSec, totalWeight: c.totalWeight, taps: c.taps, holds: c.holds, judgements: c.taps + c.holds * 2, fakes: c.fakes, ready: c.ready, notes: c.notes.map(pub), cues: c.cues.map(x => ({ beat: x.beat, t: x.t, cue: x.cue, sfx: x.sfx })),
