<style>

}

/* 카드 목록 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
@media (min-width: 1100px) { .cards { grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); } .panel { padding: 16px 16px 70px; } .panel h3 { font-size: 17px; } }
.cd { background: var(--paper); border: 3px solid #fff; border-radius: 16px; padding: 10px; box-shadow: 0 3px 0 var(--line); display: flex; flex-direction: column; gap: 4px; cursor: pointer; position: relative; }
.cd .ic { font-size: 28px; } .cd .nm { font-size: 15px; line-height: 1.15; } .cd .ds { font-size: 12px; color: var(--brown); flex: 1; } .cd .cost { font-size: 13px; color: #6a6a6a; }

@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.btn { border: 3px solid #fff; border-radius: 999px; padding: 10px 18px; font-size: 16px; cursor: pointer; background: #ff7b5e; color: #fff; box-shadow: 0 4px 0 #c9502e; transition: transform .08s; white-space: nowrap; }

.btn.green { background: var(--green); box-shadow: 0 4px 0 #3a7f3a; } .btn.green:active { box-shadow: 0 1px 0 #3a7f3a; }

.btn.light { background: #fff; color: var(--brown); box-shadow: 0 4px 0 #b8834a; font-size: 14px; padding: 8px 14px; } .btn.light:active { box-shadow: 0 1px 0 #b8834a; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }

.stat { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; border-bottom: 1px dashed var(--line); } .stat:last-child { border-bottom: none; }
.bar { height: 10px; background: #eadfc6; border-radius: 999px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--sky); }

/* 능력 카드 */
.pw { background: var(--paper); border: 3px solid #fff; border-radius: 16px; padding: 10px; margin-bottom: 10px; box-shadow: 0 3px 0 var(--line); }
.pw h4 { font-size: 16px; display: flex; gap: 8px; align-items: center; } .pw h4 small { margin-left: auto; font-size: 12px; color: var(--brown); font-weight: normal; }

.powers { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: start; }

@media (min-width: 620px) and (max-width: 899px) { .powers { grid-template-columns: repeat(2, 1fr); } }
.sktree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 460px; margin: 0 auto; }
.sk { position: relative; background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 7px 6px; font-size: 11px; text-align: center; cursor: pointer; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }

/* ── 항해 ── */
#voyage { background: #1a4f8a; touch-action: none; overscroll-behavior: none; }

#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }

.cap { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); width: 54px; height: 54px; border-radius: 50%; background: var(--cream); border: 3px solid var(--gold); box-shadow: 0 3px 0 var(--gold-dark); display: grid; place-items: center; z-index: 3; pointer-events: none; overflow: hidden; }

.pbar { position: absolute; left: 56px; bottom: 12px; display: flex; gap: 6px; z-index: 3; pointer-events: none; }
.ps { width: 46px; height: 46px; border-radius: 12px; background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.6); display: grid; place-items: center; font-size: 22px; position: relative; overflow: hidden; }
.ps.lock { opacity: .4; } .ps .cd { position: absolute; inset: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; display: grid; place-items: center; }
.endbtn { position: absolute; right: 12px; bottom: 12px; z-index: 3; border: 3px solid #fff; border-radius: 999px; background: rgba(255,248,236,.9); color: var(--ink); font-size: 14px; padding: 9px 14px; cursor: pointer; box-shadow: 0 4px 0 var(--brown-dark); }
.relicpop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
.relicpop.show { display: flex; }
.relicpop .in { text-align: center; animation: popin .5s ease; }
.relicpop .ic { font-size: 80px; filter: drop-shadow(0 0 20px #fff); animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.relicpop .nm { font-size: 24px; color: #fff; text-shadow: 2px 2px 0 var(--brown-dark); margin-top: 6px; }
.relicpop .rays { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.25) 0 10deg, transparent 10deg 20deg); animation: spin 8s linear infinite; z-index: -1; }
@keyframes popin { from { transform: scale(0); } 60% { transform: scale(1.25); } to { transform: scale(1); } }
/* 모달 */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 95; padding: 16px; }
.modal.show { display: flex; }

/* ── 모바일(세로 화면) ── */
@media (max-width: 620px) {
  #port .top { flex-direction: column; align-items: stretch; gap: 5px; padding: 7px 6px; }
  #port .menu { max-width: none; justify-content: space-between; flex-wrap: nowrap; }
  #port .mb { width: 46px; height: 46px; font-size: 21px; }
  #port .lvhint { max-width: none; }
  #port .xpbar { width: 90px; }
}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="screen active" id="port">
  <div class="stars"></div>
  <div class="top">
    <div class="tl">
      <div class="lvl"><div class="n" id="lv">1</div><div class="xpbar"><i id="xpFill"></i><span id="xpTxt">0 / 50</span></div></div>
      <div class="money"><div class="cur gold" id="curGold">💰 <b id="gold">0</b></div><div class="cur dia" id="curDia">💎 <b id="dia">0</b></div></div>
      <div class="lvhint" id="lvHint"></div>
    </div>
    <div class="menu" id="menu">
      <button class="mb on" data-tab="tree" title="특성">⭐<span class="dot"></span></button>
      <button class="mb" data-tab="captain" title="선장">🎩<span class="dot"></span></button>
      <button class="mb" data-tab="dex" title="도감">📖<span class="dot"></span></button>
      <button class="mb" data-tab="mastery" title="어종 숙련">🐟<span class="dot"></span></button>

      <button class="mb" data-tab="power" title="능력·스킬">⚡<span class="dot"></span></button>
    </div>
  </div>

// 한국식: 소수점 없이 만·억·조 (1만 8,500 · 4200만 · 34억 · 1조 2,300억)
function fmt(n) {
  if (!isFinite(n)) return '∞'; if (n < 0) return '-' + fmt(-n);
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString();
  const u = Math.floor(Math.log10(n) / 4); if (u >= UNITS.length) return n.toExponential(2).replace('+', '');
  const p = Math.pow(10, u * 4), head = Math.floor(n / p), rest = Math.floor((n % p) / Math.pow(10, (u - 1) * 4));
  if (head >= 1000 || rest === 0) return head.toLocaleString() + UNITS[u];
  return head + UNITS[u] + ' ' + rest.toLocaleString() + (u >= 2 ? UNITS[u - 1] : '');
}

    Pn.innerHTML = `<h3>🐟 어종 숙련<small>레벨 ${3}마다 하나씩 열려요 · 골드 +5%/단계 (최대 10)</small></h3><div class="cards">` + FISH.map((f, i) => { const need = 1 + i * 3, lv = S.mastery[f.id] || 0, c = masteryCost(f), lock = S.lv < need; return `<div class="cd ${lock ? 'lock' : lv >= 10 ? 'max' : canPay(c) ? 'ok' : ''}" data-m="${f.id}"><span class="badge">Lv.${need}</span>${fishArt(f, 64)}<div class="nm">${f.name} 숙련 ${lv}/10</div><div class="ds">${f.name} 골드 +${lv * 5}% → +${(lv + 1) * 5}%</div><div class="cost">${lock ? `🔒 레벨 ${need}` : lv >= 10 ? 'MAX' : costTxt(c)}</div></div>`; }).join('') + '</div>';
    Pn.querySelectorAll('.cd[data-m]').forEach(el => { const f = fishById[el.dataset.m];
      const info = () => { const lv = S.mastery[f.id] || 0; showSheet(fishArt(f, 50), `${f.name} 숙련 ${lv}/10`, S.lv < 1 + f.i * 3 ? `🔒 레벨 ${1 + f.i * 3}부터` : `${f.name} 골드 +${lv * 5}% → +${(lv + 1) * 5}% · ${BEH[f.beh].n}`, lv >= 10 || S.lv < 1 + f.i * 3 ? null : masteryCost(f)); };
      bindBuy(el, () => S.lv >= 1 + f.i * 3 && (S.mastery[f.id] || 0) < 10 && canPay(masteryCost(f)), () => { pay(masteryCost(f)); S.mastery[f.id] = (S.mastery[f.id] || 0) + 1; Sound.play('correct'); renderPort(); info(); }, info); });
  } else if (t === 'relic') {
    const n = Object.keys(S.relics).length;
    Pn.innerHTML = `<h3>🪸 해양 유물 ${n} / ${RELICS.length}<small>항해 중 물고기가 떨어뜨려요 — 그물로 주우세요</small></h3><div class="cards">` + RELICS.map(r => { const lv = S.relics[r.id] || 0, c = relicUpCost(r.id); return `<div class="cd ${!lv ? 'lock' : lv >= 10 ? 'max' : canPay(c) ? 'ok' : ''}" data-r="${r.id}"><div class="ic">${lv ? r.icon : '❔'}</div><div class="nm">${lv ? r.name : '???'} ${lv ? lv + '/10' : ''}</div><div class="ds">${lv ? r.u + ' ×' + lv : '아직 발견 못 함'}</div><div class="cost">${!lv ? '' : lv >= 10 ? 'MAX' : costTxt(c)}</div></div>`; }).join('') + '</div>';
    Pn.querySelectorAll('.cd[data-r]').forEach(el => { const id = el.dataset.r, r = relicById[id];
      const info = () => { const lv = S.relics[id] || 0; showSheet(lv ? r.icon : '❔', lv ? `${r.name} ${lv}/10` : '??? 아직 발견 못 함', lv ? `${r.u} — 지금 ×${lv}` : '항해 중 물고기가 떨어뜨려요. 그물로 주우세요', !lv || lv >= 10 ? null : relicUpCost(id)); };
      bindBuy(el, () => { const lv = S.relics[id] || 0; return lv > 0 && lv < 10 && canPay(relicUpCost(id)); }, () => { pay(relicUpCost(id)); S.relics[id]++; refreshEff(); Sound.play('correct'); renderPort(); info(); }, info); });
  } else if (t === 'etc') {
    Pn.innerHTML = `<h3>📊 기록</h3><div class="card">${[['💾 마지막 저장', S.savedAt ? new Date(S.savedAt).toLocaleTimeString('ko', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '-'], ['항해 횟수', S.voyages], ['최고 수확', '💰' + fmt(Math.floor(S.best))], ['누적 골드', '💰' + fmt(Math.floor(S.totalGold))], ['잡은 물고기', fmt(Object.values(S.counts).reduce((a, b) => a + b, 0))], ['해금한 특성', `${Object.keys(S.tree).length - 1}개`], ['스킬', `${skDone()}개`], ['플레이 시간', Math.floor(S.playTime / 60) + '분']].map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
      <h3>💾 저장</h3><div class="card">자동 저장돼요. 다른 기기로 옮기려면 내보내기 → 가져오기.<div class="row"><button class="btn light" id="btnExport">📤 내보내기</button><button class="btn light" id="btnImport">📥 가져오기</button><button class="btn light" id="btnReset" style="margin-left:auto;color:#c0392b">🗑 초기화</button></div></div>
      <h3>❓ 어떻게 하나요?</h3><div class="howto">
        <div class="step"><div class="no">1</div><p><b>🎣 출항</b>을 누르면 20초 항해가 시작돼요. <b>그물(원)</b>이 손가락·마우스를 따라다녀요 — 물고기 떼 위에 올려두면 저절로 잡혀요.</p></div>
        <div class="step"><div class="no">2</div><p>물고기마다 <b>체력</b>이 있어요. 그물 안에 오래 둘수록 체력이 닳고, 잡히면 💰골드·📗경험치, 가끔 💎다이아·🪸유물.</p></div>
        <div class="step"><div class="no">3</div><p>항구에서 <b>⭐ 특성 트리</b>를 골드로 해금해요 (배에서 8방향으로 뻗어요): 새 어종, 새 지도, 능력, 골드/그물/낚시력 보너스…</p></div>
        <div class="step"><div class="no">4</div><p><b>⚡ 능력</b> 4종(번개·폭탄·물대포·전기 그물)은 항해 중 자동으로 터져요. <b>낚시력</b>과 <b>그물 크기</b>도 여기서 강화.</p></div>
        <div class="step"><div class="no">5</div><p><b>🎩 선장</b> 10마리 고양이 — 레벨이 오르면 영입, 한 마리 배정하면 항해 보너스. <b>🐟 숙련</b>은 어종별 골드 보너스, <b>🪸 유물</b>은 주운 걸 강화.</p></div>
        <div class="step"><div class="no">6</div><p>📍 지도를 바꾸면 다른 물고기가 나와요. 깊은 바다일수록 비싸고 튼튼해요. 심연의 <b>리바이어던</b>을 찾아보세요!</p></div>
      </div>`;
    $('btnExport').onclick = () => { save(); const s = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(s).then(() => toast('저장 코드를 복사했어요')).catch(() => prompt('복사해 주세요', s)); };
    $('btnImport').onclick = () => { const s = prompt('저장 코드를 붙여넣어 주세요'); if (!s) return; try { const v = JSON.parse(decodeURIComponent(escape(atob(s.trim())))); if (!v || typeof v.gold !== 'number') throw 0; S = Object.assign(fresh(), v); save(); location.reload(); } catch (e) { toast('코드가 올바르지 않아요'); } };
    $('btnReset').onclick = () => { if (confirm('정말 처음부터? 전부 사라져요.') && confirm('진짜로요?')) { localStorage.removeItem(SAVE_KEY); S = fresh(); location.reload(); } };
  }
}
function vis(n) { return own(n.id) || n.link.some(own); }   // 내가 찍은 것 + 바로 옆 = 그 너머는 아예 안 보임
function selectNode(id) {
  sel = id; const n = TREE_BY[id]; document.querySelectorAll('.tn').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  const av = !own(id) && n.link.some(l => own(l));
  const desc = n.t === 'fish' ? `${FISH[n.fish].name} — 💰${fmt(FISH[n.fish].gold)} · ❤️${fmt(FISH[n.fish].hp)} · ${BEH[FISH[n.fish].beh].n}` : n.t === 'map' ? `${MAPS[n.map].note} — ${MAPS[n.map].fish.map(i => FISH[i].name).join(', ')}` : n.t === 'power' ? POWERS[n.power].d : n.t === 'root' ? '모든 특성의 시작' : n.name;
  showSheet(n.t === 'fish' ? fishArt(FISH[n.fish], 54) : n.icon, n.name, desc, own(id) || !av ? null : { gold: n.cost }, own(id) ? '<span style="color:var(--green)">✅ 해금</span>' : av ? '' : '<span style="color:#999">🔒 연결된 특성 먼저</span>');
}
function buyNode(id) {
  const n = TREE_BY[id]; if (own(id) || S.gold < n.cost) return Sound.play('error');
  S.gold -= n.cost; S.tree[id] = 1; refreshEff(); Sound.play('correct');
  if (n.t === 'map') { toast(`🗺️ ${MAPS[n.map].name} 해금! ${MAPS[n.map].note}`); confetti(16); }
  else if (n.t === 'fish') toast(`🐟 ${FISH[n.fish].name} 해금 — ${BEH[FISH[n.fish].beh].n}`);
  else if (n.t === 'power') { toast(`⚡ ${POWERS[n.power].name} 해금! 능력 탭에서 스킬을 올려요`); confetti(14); }
  const wrap = $('treewrap'), sl = wrap ? wrap.scrollLeft : 0, st = wrap ? wrap.scrollTop : 0;
  renderPort(); if ($('treewrap')) { $('treewrap').scrollLeft = sl; $('treewrap').scrollTop = st; }
  selectNode(id);
}
$('btnMap').onclick = () => { Sound.play('click'); showModal(`<h2>📍 어장 선택</h2><div style="display:flex;flex-direction:column;gap:8px">${MAPS.map((m, i) => `<button class="btn ${mapUnlocked(i) ? (S.map === i ? 'green' : 'blue') : 'light'}" data-map="${i}" ${mapUnlocked(i) ? '' : 'disabled'} style="text-align:left">${m.icon} ${m.name}${mapUnlocked(i) ? '' : ' 🔒 특성 트리 "지도" 갈래'}<br><small style="font-size:12px;opacity:.85">${m.fish.map(k => FISH[k].name).join(' · ')}</small></button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn light" onclick="hideModal()">닫기</button></div>`); document.querySelectorAll('[data-map]').forEach(b => b.onclick = () => { S.map = +b.dataset.map; hideModal(); renderTop(); Sound.play('tap'); }); };
$('btnSail').onclick = () => { Sound.play('click'); startVoyage(); };
$('btnCfg').onclick = () => { Sound.play('click'); setTab(S.tab === 'etc' ? 'tree' : 'etc'); };
const fitTop = () => { const t = document.querySelector('#port .top'); if (t) document.documentElement.style.setProperty('--topH', (t.offsetHeight + 6) + 'px'); };
fitTop(); window.addEventListener('resize', fitTop); setTimeout(fitTop, 300);
document.querySelector('#port .lvl').onclick = () => { Sound.play('tap'); levelInfo(); };
$('lvHint').onclick = () => { Sound.play('tap'); levelInfo(); };
$('btnEnd').onclick = () => endVoyage();
function showModal(html) { $('modalBox').innerHTML = html; $('modal').classList.add('show'); }
function hideModal() { $('modal').classList.remove('show'); }
function confetti(n = 40) { const em = ['🐟', '✨', '🎉', '⭐', '💙']; for (let i = 0; i < n; i++) { const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length]; s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = 1.8 + Math.random() * 1.5 + 's'; s.style.animationDelay = Math.random() * .5 + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 4000); } }

// 그물 조작: 마우스 hover / 터치 드래그
const TOUCH_LIFT = 78;   // 터치일 때 그물을 손끝보다 위로 (손가락에 안 가리게)
const onMove = e => {
  if (!V) return; const r = cv.getBoundingClientRect(), lift = e.pointerType === 'touch' ? TOUCH_LIFT : 0;
  V.net.x = e.clientX - r.left; V.net.y = Math.max(90, e.clientY - r.top - lift);
  if (lift) V.touch = 1;
};
cv.addEventListener('pointermove', onMove); cv.addEventListener('pointerdown', e => { onMove(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
document.addEventListener('keydown', e => { if (e.code === 'Escape' && V) endVoyage(); });

// ═══════════ 시작 ═══════════
load(); refreshEff(); if (!mapUnlocked(S.map)) S.map = 0; setTab(S.tab || 'tree');
// 저장: 5초마다 · 창 닫을 때 · 화면 숨길 때 · 허브에서 다른 페이지로 갈 때(iframe 언로드)
setInterval(() => { save(); if (!V) renderTop(); }, 5000);
window.addEventListener('beforeunload', save);
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.tuna = { get S() { return S; }, get V() { return V; }, castPower, TREE, TREE_BY, FISH, MAPS, power, netR, eff, fishArt, catArt, save, startVoyage, endVoyage, renderPort, buyNode, own, vis, cheat: (g, d, xp) => { S.gold += g || 0; S.dia += d || 0; if (xp) addXp(xp); renderPort(); } };
</script>
</body>
