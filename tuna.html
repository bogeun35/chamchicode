<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 참치 타이쿤 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --ink: #2a2118; --cream: #fff8ec; --paper: #fffdf7; --line: #e6d9bd; --brown: #8a5a2a; --brown-dark: #5c3a1a; --gold: #ffd36b; --gold-dark: #c9a13d; --green: #5cb85c; --sky: #4aa3df; --sky-dark: #2b6f9e; --coral: #ff8fab; --purple: #9b7bd8; --dia: #6fd3f7; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; background: #1c2a5a; }
button { font-family: inherit; }
.toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-24px); z-index: 90; background: var(--cream); color: var(--ink); padding: 10px 20px; border-radius: 999px; font-size: 15px; box-shadow: 0 5px 0 var(--brown-dark), 0 10px 20px rgba(0,0,0,.25); opacity: 0; transition: all .25s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast { z-index: 96; }   /* 마감 B3: 항해 끝 정산 창과 동시에 오는 합류 토스트(레코드 선장)가 모달(95) 어둠막 뒤에 묻히지 않게. pointer-events:none 이라 클릭은 막지 않음 */
.toast.voy { top: auto; transform: translateX(-50%) translateY(20px); font-size: 14px; padding: 8px 16px; } .toast.voy.show { transform: translateX(-50%) translateY(0); }   /* 마감 B3: 항해 중에는 HUD·콤보 배지를 가리지 않게 하단 능력바 위(bottom 은 toastPos 가 실제 위치로 계산) */
.screen { position: fixed; inset: 0; display: none; }
.screen.active { display: block; }

/* ── 항구 ── */
#port { background: radial-gradient(ellipse at 50% 110%, #ffd1a3 0%, #f9a8c9 22%, #9b7bd8 48%, #2b3f8a 75%, #16224f 100%); overflow: hidden; }
#port .stars { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 12% 18%, #fff 0 1.5px, transparent 2px), radial-gradient(circle at 78% 10%, #fff 0 1.2px, transparent 2px), radial-gradient(circle at 60% 26%, #fff 0 1px, transparent 2px), radial-gradient(circle at 30% 8%, #fff 0 1.3px, transparent 2px), radial-gradient(circle at 90% 32%, #fff 0 1px, transparent 2px), radial-gradient(circle at 45% 14%, #fff 0 1px, transparent 2px); opacity: .8; }
.top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 10px; }
.tl { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.money { display: flex; gap: 6px; }
.lvhint { font-size: 12px; color: #fff; background: rgba(0,0,0,.35); border-radius: 999px; padding: 3px 10px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lvl { cursor: pointer; }
.lvl { display: flex; align-items: center; gap: 6px; background: var(--cream); border: 3px solid #fff; border-radius: 999px; padding: 4px 10px 4px 4px; box-shadow: 0 3px 0 var(--brown-dark); }
.lvl .n { width: 34px; height: 34px; border-radius: 50%; background: #ff6b6b; color: #fff; display: grid; place-items: center; font-size: 15px; border: 2px solid #fff; }
.xpbar { width: 120px; height: 16px; background: #eadfc6; border-radius: 999px; overflow: hidden; position: relative; }
.xpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #8fe0c0, #5cb85c); border-radius: 999px; transition: width .3s; }
.xpbar span { position: absolute; inset: 0; font-size: 11px; text-align: center; line-height: 16px; color: var(--ink); }
.cur { background: var(--cream); border: 3px solid #fff; border-radius: 999px; padding: 5px 14px; font-size: 16px; box-shadow: 0 3px 0 var(--brown-dark); white-space: nowrap; }
.cur b { font-size: 28px; letter-spacing: -.5px; }
.cur.gold { padding: 4px 18px; }
.gain { color: #2e7d32; font-size: 15px; margin-left: 4px; }
.cur.gold { background: linear-gradient(180deg, #fff7d9, #ffe8a3); }
.cur.dia { background: linear-gradient(180deg, #eaf8ff, #c9ecff); }
.cur.bump { animation: bump .4s ease; }
@keyframes bump { 40% { transform: scale(1.14); } }
@media (max-width: 620px) {
  .top { flex-direction: column; align-items: stretch; gap: 6px; }
  .menu { max-width: none; justify-content: space-between; }
  .lvhint { max-width: none; }
  .mapbtn { font-size: 14px; padding: 9px 12px; }
  .sail { font-size: 19px; padding: 12px 18px; }
}
@media (max-width: 560px) { .top { gap: 5px; padding: 7px 5px; } .xpbar { width: 54px; } .xpbar span { font-size: 10px; } .lvl { padding: 3px 6px 3px 3px; } .lvl .n { width: 26px; height: 26px; font-size: 12px; } .cur { padding: 3px 9px; font-size: 12px; } .cur b { font-size: 22px; } }
.menu { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.mb { flex: none; width: 46px; height: 46px; border: 3px solid #fff; border-radius: 50%; background: linear-gradient(180deg, #ffe9a8, #f0b429); color: var(--ink); font-size: 22px; cursor: pointer; box-shadow: 0 4px 0 #a8791a; position: relative; padding: 0; line-height: 1; }
.mb.on { background: linear-gradient(180deg, #fff, #ffd36b); box-shadow: 0 4px 0 #a8791a, 0 0 0 3px rgba(255,255,255,.9); }
.mb:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8791a; }
.cfg { position: absolute; left: 10px; bottom: 16px; z-index: 6; width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff; background: var(--cream); font-size: 20px; cursor: pointer; box-shadow: 0 4px 0 var(--brown-dark); padding: 0; }
.cfg:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brown-dark); }
.mb .dot { position: absolute; top: -6px; right: -5px; width: 13px; height: 13px; border-radius: 50%; background: var(--coral); border: 2px solid #fff; display: none; }
.mb.alert .dot { display: block; animation: pulse .8s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.15); } }
.panel { position: absolute; top: var(--topH, 104px); left: 6px; right: 6px; bottom: 74px; background: rgba(255,248,236,.94); border: 4px solid #fff; border-radius: 20px; box-shadow: 0 6px 0 var(--brown-dark), 0 12px 24px rgba(0,0,0,.3); overflow: auto; padding: 12px 12px 64px; }
.sail { position: absolute; right: 10px; bottom: 12px; z-index: 6; border: 4px solid #fff; border-radius: 999px; background: linear-gradient(180deg, #5cc6ff, #2f8fdc); color: #fff; font-size: 22px; padding: 13px 28px; cursor: pointer; box-shadow: 0 6px 0 #1f5f9a, 0 10px 20px rgba(0,0,0,.35); animation: sailglow 1.5s ease-in-out infinite alternate; }
@keyframes sailglow { from { box-shadow: 0 6px 0 #1f5f9a, 0 0 0 0 rgba(140,230,255,.75); } to { box-shadow: 0 6px 0 #1f5f9a, 0 0 0 14px rgba(140,230,255,0); } }
.sail:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f5f9a; animation: none; }
.mapbtn { position: absolute; left: 62px; bottom: 16px; z-index: 6; border: 3px solid #fff; border-radius: 999px; background: var(--cream); color: var(--ink); font-size: 15px; padding: 10px 16px; cursor: pointer; box-shadow: 0 4px 0 var(--brown-dark); max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mapbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brown-dark); }
.panel h3 { font-size: 15px; color: var(--brown); margin: 4px 0 8px; display: flex; align-items: center; gap: 6px; }
.panel h3 small { margin-left: auto; font-weight: normal; font-size: 12px; }
/* 특성 트리 */
.treewrap { position: relative; overflow: auto; height: 100%; margin: -12px; border-radius: 16px; background: radial-gradient(ellipse at 50% 50%, #3b57a8, #1c2a5a 70%); }
.tree { position: relative; }
.tree svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.tn { position: absolute; width: 50px; height: 50px; border-radius: 12px; background: #3d5fb8; border: 3px solid #2a4a9a; display: grid; place-items: center; font-size: 22px; cursor: pointer; transition: transform .1s; box-shadow: 0 3px 0 #1a2f6e; }
.tn.key { width: 58px; height: 58px; border-radius: 14px; font-size: 26px; }
.tn.lock { filter: grayscale(.8) brightness(.55); cursor: default; }
.tn .pr { position: absolute; left: 50%; transform: translateX(-50%); bottom: -16px; font-size: 11px; background: rgba(0,0,0,.6); color: #ffe9a8; border-radius: 999px; padding: 1px 6px; white-space: nowrap; }
.tn.max .pr { display: none; }
.tn .lv { position: absolute; left: -7px; top: -9px; font-size: 10px; line-height: 14px; background: #2a4a9a; color: #fff; border-radius: 8px; padding: 0 4px; border: 2px solid #fff; }
.tn.max .lv { background: var(--green); }
.tn.avail { background: #4a78d8; border-color: #8fc0ff; }
.tn.avail::after { content: '+'; position: absolute; right: -6px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; line-height: 16px; text-align: center; border: 2px solid #fff; }
.tn.ok { animation: pulse .9s ease-in-out infinite alternate; box-shadow: 0 0 0 3px rgba(255,211,107,.6), 0 3px 0 #1a2f6e; }
.tn.own { background: linear-gradient(180deg, #ffe29a, #f0b429); border-color: #fff3c4; box-shadow: 0 3px 0 #a8791a; }
.tn.sel { outline: 3px solid #fff; }
.sheet { position: absolute; left: 6px; right: 6px; bottom: 76px; background: var(--cream); border: 3px solid #fff; border-radius: 16px; padding: 10px 12px; box-shadow: 0 4px 0 var(--brown-dark), 0 8px 16px rgba(0,0,0,.3); display: none; align-items: center; gap: 10px; z-index: 7; }
.sheet .pz { text-align: right; white-space: nowrap; font-size: 15px; }
.sheet .pz small { display: block; font-size: 11px; color: var(--brown); font-weight: normal; }
.sheet .pz.ok { color: #2e7d32; } .sheet .pz.no { color: #c0392b; }
.sheet.show { display: flex; }
.sheet .ic { font-size: 30px; } .sheet .t { flex: 1; min-width: 0; } .sheet .nm { font-size: 16px; } .sheet .ds { font-size: 12px; color: var(--brown); }
/* 카드 목록 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
@media (min-width: 1100px) { .cards { grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); } .panel { padding: 16px 16px 70px; } .panel h3 { font-size: 17px; } }
.cd { background: var(--paper); border: 3px solid #fff; border-radius: 16px; padding: 10px; box-shadow: 0 3px 0 var(--line); display: flex; flex-direction: column; gap: 4px; cursor: pointer; position: relative; }
.cd .ic { font-size: 28px; } .cd .nm { font-size: 15px; line-height: 1.15; } .cd .ds { font-size: 12px; color: var(--brown); flex: 1; } .cd .cost { font-size: 13px; color: #6a6a6a; }
.cd.ok { border-color: var(--green); box-shadow: 0 3px 0 #3a7f3a; background: #f4fff0; } .cd.ok .cost { color: #2e7d32; }
.cd.ok::after, .sk.ok::after { content: '👆👆 더블클릭'; position: absolute; right: 6px; bottom: 6px; font-size: 10px; background: var(--green); color: #fff; border-radius: 999px; padding: 1px 7px; }
.cd .cost.no { color: #c0392b; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.cd.lock { opacity: .55; } .cd.max { border-color: var(--purple); background: #f6f0ff; }
.cd.on { border-color: var(--green); background: #f0fbe8; }
.cd svg { display: block; margin: 0 auto; }
.cd .stars { font-size: 12px; color: var(--gold-dark); letter-spacing: 1px; }
.cd .badge { position: absolute; top: 6px; right: 8px; font-size: 11px; background: var(--sky); color: #fff; border-radius: 999px; padding: 1px 7px; }
.cd .btn { padding: 6px 10px; font-size: 13px; }
.btn { border: 3px solid #fff; border-radius: 999px; padding: 10px 18px; font-size: 16px; cursor: pointer; background: #ff7b5e; color: #fff; box-shadow: 0 4px 0 #c9502e; transition: transform .08s; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9502e; }
.btn.green { background: var(--green); box-shadow: 0 4px 0 #3a7f3a; } .btn.green:active { box-shadow: 0 1px 0 #3a7f3a; }
.btn.blue { background: var(--sky); box-shadow: 0 4px 0 var(--sky-dark); } .btn.blue:active { box-shadow: 0 1px 0 var(--sky-dark); }
.btn.light { background: #fff; color: var(--brown); box-shadow: 0 4px 0 #b8834a; font-size: 14px; padding: 8px 14px; } .btn.light:active { box-shadow: 0 1px 0 #b8834a; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.card { background: var(--paper); border: 3px solid #fff; border-radius: 16px; padding: 12px; margin-bottom: 10px; box-shadow: 0 3px 0 var(--line); font-size: 14px; line-height: 1.5; }
.stat { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; border-bottom: 1px dashed var(--line); } .stat:last-child { border-bottom: none; }
.bar { height: 10px; background: #eadfc6; border-radius: 999px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--sky); }
.howto { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; gap: 10px; align-items: flex-start; background: var(--paper); border-radius: 14px; padding: 10px; border: 3px solid #fff; }
.step .no { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--sky); color: #fff; display: grid; place-items: center; font-size: 14px; }
.step p { font-size: 14px; line-height: 1.45; }
/* 능력 카드 */
.pw { background: var(--paper); border: 3px solid #fff; border-radius: 16px; padding: 10px; margin-bottom: 10px; box-shadow: 0 3px 0 var(--line); }
.pw h4 { font-size: 16px; display: flex; gap: 8px; align-items: center; } .pw h4 small { margin-left: auto; font-size: 12px; color: var(--brown); font-weight: normal; }
.pw p { font-size: 12px; color: var(--brown); margin: 4px 0 8px; }
.pw .ups { display: flex; gap: 6px; flex-wrap: wrap; }
.powers { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: start; }
@media (min-width: 900px) { .powers { grid-template-columns: repeat(4, 1fr); } .powers .pw { margin-bottom: 0; } }
@media (min-width: 620px) and (max-width: 899px) { .powers { grid-template-columns: repeat(2, 1fr); } }
.sktree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 460px; margin: 0 auto; }
.sk { position: relative; background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 7px 6px; font-size: 11px; text-align: center; cursor: pointer; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.sk .ic { font-size: 20px; } .sk .nm { font-size: 13px; line-height: 1.1; } .sk .lv { font-size: 11px; color: var(--sky-dark); } .sk .c { font-size: 11px; color: #6a6a6a; }
.sk.pl { grid-column: 1; grid-row: 2; } .sk.pt { grid-column: 2; grid-row: 1; } .sk.pm { grid-column: 2; grid-row: 2; background: linear-gradient(180deg,#fff,#f3ecff); } .sk.pr { grid-column: 3; grid-row: 2; } .sk.pb { grid-column: 2; grid-row: 3; }
.sk.ok { border-color: var(--green); background: #f4fff0; } .sk.ok .c { color: #2e7d32; }

.sk.hid .ic { filter: grayscale(1) opacity(.5); }
.sk.maxed { border-color: var(--purple); background: #f6f0ff; }
.sk .dot2 { position: absolute; left: 6px; top: 6px; font-size: 10px; color: var(--purple); }

/* ── 항해 ── */
#voyage { background: #1a4f8a; touch-action: none; overscroll-behavior: none; }
body { overscroll-behavior: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
.vhud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 3; }
.vhud .lvl, .vhud .cur { pointer-events: none; }
.vhud .cur.gold { animation: none; } .vhud .cur.pop { animation: bump .25s ease; }
.vhud .timer { margin-left: auto; background: var(--cream); border: 3px solid #fff; border-radius: 999px; padding: 6px 14px; font-size: 20px; box-shadow: 0 3px 0 var(--brown-dark); min-width: 92px; text-align: center; }
.vhud .timer.low { background: #ff6b6b; color: #fff; animation: pulse .5s ease-in-out infinite alternate; }
@media (max-width: 520px) { .vhud { gap: 5px; } .vhud .xpbar { width: 58px; } .vhud .cur { padding: 4px 8px; font-size: 13px; } .vhud .timer { min-width: 64px; font-size: 16px; padding: 5px 8px; } .vhud .lvl .n { width: 28px; height: 28px; font-size: 13px; } .cap { top: 56px !important; width: 48px !important; height: 48px !important; } .cap svg { width: 42px !important; height: 42px !important; } }
.cap { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); width: 54px; height: 54px; border-radius: 50%; background: var(--cream); border: 3px solid var(--gold); box-shadow: 0 3px 0 var(--gold-dark); display: grid; place-items: center; z-index: 3; pointer-events: none; overflow: hidden; }
.cap svg { width: 48px; height: 48px; }
.pbar { position: absolute; left: 56px; bottom: 12px; display: flex; gap: 6px; z-index: 3; pointer-events: none; }
.ps { width: 46px; height: 46px; border-radius: 12px; background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.6); display: grid; place-items: center; font-size: 22px; position: relative; overflow: hidden; }
.ps.lock { opacity: .4; } .ps .cd { position: absolute; inset: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; display: grid; place-items: center; }
.endbtn { position: absolute; right: 12px; bottom: 12px; z-index: 3; border: 3px solid #fff; border-radius: 999px; background: rgba(255,248,236,.9); color: var(--ink); font-size: 14px; padding: 9px 14px; cursor: pointer; box-shadow: 0 4px 0 var(--brown-dark); }
.relicpop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
.relicpop.show { display: flex; }
.relicpop .in { text-align: center; animation: popin .5s ease; }
.relicpop .ic { font-size: 80px; filter: drop-shadow(0 0 20px #fff); animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.relicpop .nm { font-size: 24px; color: #fff; text-shadow: 2px 2px 0 var(--brown-dark); margin-top: 6px; }
.relicpop .rays { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.25) 0 10deg, transparent 10deg 20deg); animation: spin 8s linear infinite; z-index: -1; }
@keyframes popin { from { transform: scale(0); } 60% { transform: scale(1.25); } to { transform: scale(1); } }
/* 모달 */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 95; padding: 16px; }
.modal.show { display: flex; }
.modal .box { background: var(--cream); border: 4px solid #fff; border-radius: 22px; padding: 18px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 8px 0 var(--brown-dark), 0 16px 32px rgba(0,0,0,.3); animation: popin .35s ease; max-height: 90vh; overflow: auto; }
.modal .box h2 { font-size: 22px; margin-bottom: 8px; } .modal .box p { font-size: 14px; color: var(--brown); line-height: 1.5; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
.maplist { display: flex; flex-direction: column; gap: 8px; } .maplist .btn { white-space: normal; }   /* 마감 B7: 어장 선택. 설명이 긴 버튼이 nowrap 으로 상자 밖으로 밀리지 않게 줄바꿈 */
@media (max-height: 500px) { .modal .box:has(.maplist) { max-width: 700px; padding: 10px 14px; } .modal .box:has(.maplist) h2 { font-size: 18px; margin-bottom: 4px; }
  .maplist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .maplist .btn { padding: 5px 10px; font-size: 14px; line-height: 1.25; } .maplist .btn small { font-size: 11px !important; } .modal .box:has(.maplist) .row { margin-top: 6px; } }   /* 폰 가로(844×390): 2열로 6개가 한 화면에. 그래도 넘치면 .box 의 overflow:auto 로 스크롤 */
.res div { background: var(--paper); border-radius: 12px; padding: 8px; font-size: 14px; } .res b { display: block; font-size: 20px; }
.confetti { position: fixed; top: -30px; font-size: 22px; animation: fall linear forwards; pointer-events: none; z-index: 96; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

<script>
'use strict';
const VERSION = '2.0';
Sound.theme('lounge'); Sound.scene('game');
// 단계 F 2회차 성능: 같은 효과음은 실시간 45ms 에 한 번만. 후반엔 한 항해 수천 마리(초당 100마리 가까이)라 치명타·빙결·폭발음이 수십 겹 동시에 합성돼
// 모바일 오디오 스레드가 밀리고, 배속 시뮬(측정 도구)에서는 수천 개가 한꺼번에 예약돼 점점 느려졌다. 사람 귀로는 45ms 안의 같은 소리는 구분이 안 됨
{ const raw = Sound.play.bind(Sound), last = {}; Sound.play = (n, o) => { const t = performance.now(); if (t - (last[n] || -1e9) < 45) return false; last[n] = t; return raw(n, o); }; }
const reflowOk = (k, ms) => { const t = performance.now(); if (t - (reflowOk[k] || -1e9) < ms) return false; reflowOk[k] = t; return true; };   // 강제 리플로(void offsetWidth)로 CSS 애니메이션을 다시 거는 곳의 실시간 간격 제한
const $ = id => document.getElementById(id);
const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구'];
// 한국식: 소수점 없이 만·억·조 (1만 8,500 · 4200만 · 34억 · 1조 2,300억)
// 디버그: 콘솔에서 tuna.speed(4) — 게임 시간만 배속 (테스트용)
let __spd = 1, __spReal = performance.now(), __spGame = __spReal;
const __now = () => { const t = performance.now(); return __spGame + (t - __spReal) * __spd; };
function setSpeed(n) {
  __spGame = __now(); __spReal = performance.now(); __spd = Math.max(.25, Math.min(30, +n || 1));
  let b = document.getElementById('spdBadge');
  if (!b) { b = document.createElement('div'); b.id = 'spdBadge'; b.style.cssText = 'position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9999;padding:3px 11px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font:15px sans-serif;pointer-events:none'; document.body.appendChild(b); }
  b.textContent = '⏩ ×' + __spd + '  ( [ ] 키 )'; b.style.display = __spd === 1 ? 'none' : '';
  return '⏩ 배속 ×' + __spd;
}
// [ ] 키로 1→2→4→8→16 배속 (새로고침하면 1배로 돌아옴)
function stepSpeed(dir) { const L = [1, 2, 4, 8, 16]; let i = L.indexOf(__spd); if (i < 0) i = 0; return setSpeed(L[Math.max(0, Math.min(L.length - 1, i + dir))]); }
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test((e.target && e.target.tagName) || '')) return;
  if (e.code === 'BracketRight') stepSpeed(1); else if (e.code === 'BracketLeft') stepSpeed(-1);
