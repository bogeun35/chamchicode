<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참스코드 루미큐브</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --cream: #fff3d6; --ink: #2a2118; --wood: #8a5a2b; --wood-dark: #5c3a1a; --gold: #ffd36b; --felt: #1f6e8c; --felt-dark: #154a5e; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: #fff; -webkit-user-select: none; user-select: none; min-height: 100vh; overflow-x: hidden;
  background: radial-gradient(ellipse at 50% 20%, #2d8db0 0%, var(--felt) 45%, var(--felt-dark) 100%); }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .2; background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 6px 6px; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px); z-index: 60; background: var(--cream); color: var(--ink); padding: 10px 22px; border-radius: 999px; font-size: 15px; box-shadow: 0 6px 0 var(--wood-dark), 0 10px 20px rgba(0,0,0,.3); opacity: 0; transition: all .25s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.screen { display: none; max-width: 560px; margin: 0 auto; padding: 14px 12px 40px; position: relative; }
.screen.active { display: block; }
.title { text-align: center; margin: 26px 0 4px; font-size: 38px; text-shadow: 3px 3px 0 var(--felt-dark); }
.sub { text-align: center; opacity: .9; font-size: 15px; margin-bottom: 20px; }
.card { background: var(--cream); color: var(--ink); border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 4px solid #fff; box-shadow: 0 6px 0 var(--wood-dark), 0 12px 24px rgba(0,0,0,.25); }
.card h3 { font-size: 15px; color: #8a5a2a; margin-bottom: 10px; }
.input { width: 100%; padding: 12px 14px; border: 3px solid #e6c58f; border-radius: 12px; font-size: 18px; font-family: inherit; color: var(--ink); background: #fff; outline: none; }
.input:focus { border-color: var(--wood); }
.row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { padding: 11px 18px; border: 3px solid #fff; border-radius: 999px; font-family: inherit; font-size: 16px; cursor: pointer; background: #ff7b5e; color: #fff; box-shadow: 0 4px 0 #c9502e; transition: transform .08s; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9502e; }
.btn.green { background: #5cb85c; box-shadow: 0 4px 0 #3a7f3a; } .btn.green:active { box-shadow: 0 1px 0 #3a7f3a; }
.btn.blue { background: #4aa3df; box-shadow: 0 4px 0 #2b6f9e; } .btn.blue:active { box-shadow: 0 1px 0 #2b6f9e; }
.btn.ghost { background: rgba(255,255,255,.15); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); font-size: 14px; padding: 8px 14px; } .btn.ghost:active { box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.light { background: #fff; color: #8a5a2a; box-shadow: 0 4px 0 #b8834a; font-size: 14px; padding: 8px 14px; } .btn.light:active { box-shadow: 0 1px 0 #b8834a; }
.btn.wide { width: 100%; } .btn:disabled { opacity: .45; cursor: default; transform: none; }
.code-big { font-family: monospace; font-size: 34px; letter-spacing: .25em; text-align: center; color: var(--wood-dark); margin: 6px 0; font-weight: bold; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.pitem { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 17px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; background: #ffe0b3; flex: none; }
.tag { font-size: 12px; background: var(--wood); color: #fff; border-radius: 8px; padding: 2px 8px; margin-left: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 999px; background: #fff; border: 2px solid #e6c58f; font-size: 14px; cursor: pointer; color: var(--ink); }
.chip.on { background: var(--felt); color: #fff; border-color: #fff; }

/* 게임 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-bottom: 8px; flex-wrap: nowrap; }
.top .btn.ghost { padding: 6px 10px; font-size: 13px; }
.pill { background: rgba(0,0,0,.3); border-radius: 999px; padding: 5px 10px; font-size: 13px; white-space: nowrap; }
.banner { text-align: center; font-size: 17px; padding: 9px 12px; border-radius: 14px; margin: 4px 0 10px; background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.15); }
.banner.hot { background: var(--gold); color: var(--ink); border-color: #fff; animation: glow 1.2s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 0 3px rgba(255,211,107,.25); } to { box-shadow: 0 0 0 8px rgba(255,211,107,.55); } }
.players { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.pchip { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.25); border-radius: 999px; padding: 4px 10px 4px 4px; font-size: 13px; border: 2px solid transparent; }
.pchip.turn { border-color: var(--gold); background: rgba(255,211,107,.18); }
.pchip .n { background: #fff; color: var(--ink); border-radius: 999px; padding: 0 7px; font-size: 12px; }
.pchip .m { font-size: 11px; opacity: .8; }

.table { background: rgba(0,0,0,.22); border-radius: 18px; padding: 10px; min-height: 120px; margin-bottom: 8px; }
.set { display: inline-flex; gap: 3px; padding: 6px; margin: 4px; border-radius: 12px; background: rgba(255,255,255,.12); border: 2px solid transparent; vertical-align: top; cursor: pointer; }
.set.ok { border-color: rgba(120,220,140,.5); } .set.bad { border-color: #ff6b6b; background: rgba(255,80,80,.18); }
.set.target { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,211,107,.4); }
.newset { display: inline-flex; align-items: center; justify-content: center; margin: 4px; padding: 6px 12px; min-height: 58px; border-radius: 12px; border: 2px dashed rgba(255,255,255,.55); font-size: 14px; cursor: pointer; vertical-align: top; }
.newset:hover, .newset.target { background: rgba(255,211,107,.25); border-color: var(--gold); }
.tile { width: 36px; height: 50px; border-radius: 7px; background: linear-gradient(180deg, #fffdf7, #efe6d2); box-shadow: 0 3px 0 #b9ad93, inset 0 1px 0 #fff; display: grid; place-items: center; font-size: 22px; font-weight: bold; font-family: 'Jua', sans-serif; position: relative; cursor: pointer; transition: transform .1s; flex: none; }
.tile.r { color: #d62828; } .tile.b { color: #1d4ed8; } .tile.y { color: #d98e04; } .tile.k { color: #222; }
.tile.J { color: #7c3aed; font-size: 24px; }
.tile.sel { transform: translateY(-8px); outline: 3px solid var(--gold); }
.tile.moved::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: #5cb85c; box-shadow: 0 0 0 2px #fff; }
.tile.dim { opacity: .55; cursor: default; }
.tile.pick { touch-action: none; }
.tile.dragging { opacity: .25; }
.dragghost { position: fixed; z-index: 70; pointer-events: none; display: flex; gap: 3px; transform: translate(-50%, -60%) scale(1.15); filter: drop-shadow(0 10px 12px rgba(0,0,0,.45)); }
.dragghost .tile { cursor: grabbing; }
.set.drop, .newset.drop { border-color: var(--gold); background: rgba(255,211,107,.35); box-shadow: 0 0 0 4px rgba(255,211,107,.5); }
.table.drop { box-shadow: inset 0 0 0 3px var(--gold); }
.rack.drop { box-shadow: inset 0 0 0 3px var(--gold); }
.rack.no { box-shadow: inset 0 0 0 3px #ff6b6b; }
.rack { background: rgba(0,0,0,.28); border-radius: 18px; padding: 10px; }
.rack .tiles { display: flex; flex-wrap: wrap; gap: 5px; min-height: 58px; }
.rack .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
.rack .hdr .btn { padding: 4px 10px; font-size: 12px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.actions .btn { flex: 1; font-size: 15px; padding: 10px 8px; }
.hint { font-size: 13px; opacity: .9; text-align: center; margin-top: 8px; min-height: 18px; }
.log { background: rgba(0,0,0,.22); border-radius: 12px; padding: 6px 10px; font-size: 12.5px; margin-bottom: 8px; line-height: 1.4; }
.log div:first-child { color: var(--gold); }
.timer { font-size: 18px; white-space: nowrap; min-width: 52px; text-align: center; }
.timer.low { color: #ff6b6b; animation: blink .5s steps(2) infinite; }
@keyframes blink { to { opacity: .4; } }
.winbox { text-align: center; }
.winbox h1 { font-size: 34px; margin-bottom: 8px; }
.score { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
.score .s { background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--ink); }

/* 규칙 */
.howto { display: flex; flex-direction: column; gap: 12px; }
.step { background: #fff; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.step .no { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--felt); color: #fff; display: grid; place-items: center; font-size: 16px; }
.step h4 { font-size: 16px; color: var(--wood-dark); margin-bottom: 4px; }
.step p { font-size: 13.5px; line-height: 1.55; color: #5a4a3a; } .step p b { color: #c0392b; }
.demo { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin: 8px 0 2px; }
.demo .tile { width: 30px; height: 42px; font-size: 18px; cursor: default; }
.demo .arrow { color: var(--wood); font-size: 18px; padding: 0 3px; }
.demo .lbl { font-size: 12px; color: #8a5a2a; background: #fff3d6; border-radius: 8px; padding: 2px 8px; }
.demo .x { color: #c0392b; font-size: 13px; } .demo .o { color: #2e7a58; font-size: 13px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 40; padding: 14px; }
.modal.show { display: flex; }
.modal .card { width: 100%; max-width: 460px; margin: 0; max-height: 88vh; overflow-y: auto; }
.confetti { position: fixed; top: -20px; font-size: 22px; animation: fall linear forwards; pointer-events: none; z-index: 45; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }

#joinCode::placeholder, #nick::placeholder { font-family: 'Jua', 'Malgun Gothic', sans-serif; letter-spacing: normal; text-transform: none; color: #b8a58a; }
#joinCode { font-family: monospace; letter-spacing: .2em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<section class="screen active" id="home">
  <div class="title">🔢 루미큐브</div>
  <div class="sub">같은 숫자 3개 · 연속 숫자 3개 · 2~4명</div>
  <div class="card"><h3>닉네임</h3><input class="input" id="nick" placeholder="닉네임 (2~8자)" maxlength="8"><div class="row"><button class="btn green wide" id="btnCreate">방 만들기</button></div></div>
  <div class="card"><h3>코드로 참가</h3><input class="input" id="joinCode" placeholder="6자리 코드" maxlength="6" style="text-transform:uppercase;letter-spacing:.2em;font-family:monospace"><div class="row"><button class="btn blue wide" id="btnJoin">참가하기</button></div></div>
  <div class="card"><h3>❓ 어떻게 하나요?</h3><div class="howto" id="howtoHome"></div></div>

<section class="screen" id="lobby">
  <div class="title" style="font-size:28px;margin-top:10px">대기실</div>
  <div class="card" style="text-align:center"><h3>방 코드 — 친구에게 알려주세요</h3><div class="code-big" id="lobbyCode">------</div>
    <div class="row" style="justify-content:center"><button class="btn blue" id="btnCopyLink">🔗 링크 복사</button><button class="btn light" id="btnCopyCode">코드 복사</button></div></div>
  <div class="card"><h3>참가자 <span id="lobbyCount"></span></h3><div class="plist" id="lobbyList"></div></div>
  <div class="card" id="settingsCard"><h3>설정 <span style="opacity:.6;font-size:12px" id="settingsWho"></span></h3>
    <div style="font-size:13px;color:#8a5a2a;margin-bottom:6px">턴 제한 시간</div><div class="chips" id="timerChips"></div></div>
  <div class="row"><button class="btn green wide" id="btnStart" disabled>게임 시작 (2~4명)</button></div>
  <div class="row"><button class="btn ghost wide" id="btnLeaveLobby">나가기</button></div>
</section>

<section class="screen" id="game">
  <div class="top">
    <div class="pill">방 <b id="gameCode"></b></div>
    <div class="pill">더미 <b id="poolCnt">0</b></div>
    <div class="timer" id="timer"></div>
    <button class="btn ghost" id="btnRules">❓</button>
    <button class="btn ghost" id="btnLeaveGame">나가기</button>
  </div>
  <div class="banner" id="banner"></div>
  <div class="players" id="players"></div>
  <div class="log" id="log"></div>
  <div class="table" id="table"></div>
  <div class="rack">
    <div class="hdr"><span>🎴 내 타일 <b id="rackCnt"></b></span><span><button class="btn light" id="btnSortNum">숫자순</button> <button class="btn light" id="btnSortCol">색깔순</button></span></div>
    <div class="tiles" id="rack"></div>
    <div class="actions" id="actions"></div>
    <div class="hint" id="hint"></div>
  </div>
</section>

<section class="screen" id="end">
  <div class="card winbox"><h1 id="winTitle">🏆</h1><p id="winText" style="font-size:18px;color:#5a4a3a"></p><div class="score" id="endScore"></div></div>
  <div class="row"><button class="btn green wide" id="btnAgain">다시 하기</button></div>
  <div class="row"><button class="btn ghost wide" id="btnLeaveEnd">나가기</button></div>
</section>

<div class="modal" id="rulesModal"><div class="card"><h3>❓ 어떻게 하나요?</h3><div class="howto" id="howtoModal"></div><button class="btn green wide" style="margin-top:12px" id="rulesClose">알겠어요!</button></div></div>

<script src="party-ux.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyD8_pSiOVOWmCitHl_nWcgSZobMFI5NgXM",authDomain:"rolling2-17a8f.firebaseapp.com",databaseURL:"https://rolling2-17a8f-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"rolling2-17a8f",storageBucket:"rolling2-17a8f.firebasestorage.app",messagingSenderId:"936512265515",appId:"1:936512265515:web:c9cb05f341267af81a796e"});
const db = firebase.database();
const rpath = c => `games/rk_${c}`;   // 규칙상 열린 경로(games/) 아래, rk_ 접두

// ── 유틸 ──
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const sanitizeKey = s => s.replace(/[.#$/\[\]]/g, '_');
const genCode = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r = ''; for (let i = 0; i < 6; i++) r += c[Math.floor(Math.random() * c.length)]; return r; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); window.scrollTo(0, 0); }
const AVATARS = ['🐱', '🐶', '🦊', '🐼', '🐸', '🐧', '🦁', '🐙'];
const avatarOf = k => AVATARS[[...k].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 100003, 7) % AVATARS.length];
const nickOf = k => (room && room.players && room.players[k] ? room.players[k].nick : k);
const TIMER_OPTS = [{ v: 0, l: '없음' }, { v: 60, l: '60초' }, { v: 90, l: '90초' }, { v: 120, l: '2분' }];

// ── 타일: id = 색(r/b/y/k) + 숫자 + 복사본(a/b), 조커 = 'J1','J2' ──
const COLORS = ['r', 'b', 'y', 'k'];
const isJ = id => id[0] === 'J';
const col = id => isJ(id) ? 'J' : id[0];
const num = id => isJ(id) ? 0 : parseInt(id.slice(1), 10);
const label = id => isJ(id) ? '☺' : String(num(id));
function fullDeck() { const d = []; for (const c of COLORS) for (let n = 1; n <= 13; n++) { d.push(`${c}${n}a`); d.push(`${c}${n}b`); } d.push('J1', 'J2'); return d; }

// 묶음 판정: 그룹(같은 숫자, 다른 색, 3~4) 또는 런(같은 색, 연속, 3+). 조커는 만능
function setInfo(ids) {
  const n = ids.length; if (n < 3) return null;
  const real = ids.filter(t => !isJ(t)), jokers = n - real.length;
  if (!real.length) return null;
  // 그룹
  const nums = new Set(real.map(num)), cols = new Set(real.map(col));
  if (nums.size === 1 && cols.size === real.length && n <= 4) return { type: 'group', value: num(real[0]) * n, order: [...real, ...ids.filter(isJ)] };
  // 런
  if (cols.size === 1) {
    const sorted = [...real].sort((a, b) => num(a) - num(b));
    const ns = sorted.map(num);
    if (new Set(ns).size !== ns.length) return null;
    const span = ns[ns.length - 1] - ns[0] + 1;
    const gaps = span - ns.length;
    if (gaps > jokers) return null;
    const extra = jokers - gaps;
    let start = ns[0], end = ns[ns.length - 1];
    // 남는 조커는 뒤로, 13 넘으면 앞으로
    let after = Math.min(extra, 13 - end), before = extra - after;
    if (start - before < 1) return null;
    start -= before; end += after;
    if (end - start + 1 !== n) return null;
    let value = 0; for (let v = start; v <= end; v++) value += v;
    // 표시 순서: start..end 자리에 실제 타일, 빈 자리는 조커
    const js = ids.filter(isJ); const order = [];
    for (let v = start; v <= end; v++) { const t = sorted.find(x => num(x) === v); order.push(t || js.pop()); }
    return { type: 'run', value, order };
  }
  return null;
}

// ── 상태 ──
let myNick = '', myKey = '', code = '', isHost = false, room = null, listeners = [], tick = null;
let work = null;          // 내 턴 작업본 { table:[[ids]], rack:[ids], moved:Set(rack→table 로 간 타일) }
let workTurnId = '';      // 어느 턴의 작업본인지
let selected = new Set(); // 선택된 타일 id
let sortMode = localStorage.getItem('rk_sort') || 'num';
function offAll() { listeners.forEach(f => f()); listeners = []; }
const roomRef = () => db.ref(rpath(code));

// ── 홈 ──
(function init() { const saved = localStorage.getItem('rk_nick'); if (saved) $('nick').value = saved; const p = new URLSearchParams(location.search); if (p.get('room')) $('joinCode').value = p.get('room').toUpperCase(); })();
UX.nick('nick', 'joinCode', 'btnCreate', 'btnJoin');
UX.emphasizeJoin(document.getElementById('joinCode').closest('.card'), 'home');
UX.resumeCard('rk', 'home', c => db.ref(rpath(c)).once('value').then(sn => { const r = sn.val(); return !!r && !(r.expiresAt && Date.now() > r.expiresAt); }), v => { $('nick').value = v.nick; $('joinCode').value = v.code; $('btnJoin').click(); });

function getNick() {
  let n = $('nick').value.trim();
  if (n.length < 2) { n = UX.randomNick(); $('nick').value = n; toast('닉네임을 자동으로 정했어요: ' + n); } localStorage.setItem('rk_nick', n); return n; }
$('btnCreate').onclick = async () => {
  const n = getNick(); if (!n) return;
  myNick = n; myKey = sanitizeKey(n); code = genCode(); isHost = true;
  await roomRef().set({ host: myKey, createdAt: Date.now(), expiresAt: Date.now() + 3 * 3600e3, status: 'lobby', players: { [myKey]: { nick: n, joinedAt: Date.now() } }, settings: { timer: 90 } });
  enterRoom();
};
$('btnJoin').onclick = async () => {
  const n = getNick(); if (!n) return;
  const c = $('joinCode').value.trim().toUpperCase();
  if (c.length !== 6) return toast('6자리 코드를 입력해 주세요');
  const snap = await db.ref(rpath(c)).once('value'); const r = snap.val();
  if (!r) return toast('방을 찾을 수 없어요');
  if (r.expiresAt && Date.now() > r.expiresAt) { db.ref(rpath(c)).remove(); return toast('만료된 방이에요'); }
  const k = sanitizeKey(n); const already = r.players && r.players[k];
  if (r.status !== 'lobby' && !already) return toast('이미 시작된 방이에요 (같은 닉네임이면 재접속 가능)');
