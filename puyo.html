};
// 연쇄 보너스 (표준 뿌요뿌요 통)
const CHAIN_POWER = [0, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256, 288, 320, 352, 384, 416, 448, 480, 512];
const COLOR_BONUS = [0, 3, 6, 12, 24];        // 동시에 터진 색 수 1~5
const GROUP_BONUS = [0, 2, 3, 4, 5, 6, 7, 10];// 한 덩어리 크기 4~11+

/* ═══════════ 연출 타이밍 (규칙·점수와 무관) ═══════════ */
const POP_MS    = 350;   // 깜빡 → 부풀기 → 터짐
const FALL_BASE = 92;    // 낙하 기본 시간
const FALL_PER  = 42;    // 한 칸당 추가
const FALL_MAX  = 300;

const GWARN_MS  = 440;   // 방해뿌요 경고 표시
const GFALL_MS  = 430;   // 방해뿌요 낙하
const TRAIL_MS  = 190;   // 하드드롭 잔상
const DAS_MS    = 170;   // 좌우 자동반복 대기

// 연쇄가 깊어지면 각 단계를 조금씩 빠르게 — 리듬이 생긴다
const chainSpd = ch => Math.max(0.62, Math.pow(0.94, Math.max(0, ch - 1)));

/* ═══════════ 소리 — Web Audio 합성 (음원 파일 없음) ═══════════ */
const SFX = (() => {
  let ac = null, mg = null;
  let muted = localStorage.getItem('pp_mute') === '1';
  function ensure() {
    if (muted) return null;                       // 음소거면 AudioContext 자체를 안 만든다
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ac = new AC(); } catch (e) { return null; }
      mg = ac.createGain(); mg.gain.value = 0.5; mg.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  }
  function tone(o) {
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + (o.at || 0), d = o.d;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + d);
    const v = o.v == null ? 0.2 : o.v;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + Math.min(0.02, d * 0.35));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    osc.connect(g); g.connect(mg);
    osc.start(t0); osc.stop(t0 + d + 0.03);
  }
  function noise(o) {
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + (o.at || 0), d = Math.max(0.03, o.d);
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * d), c.sampleRate);
    const a = buf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / a.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const bq = c.createBiquadFilter(); bq.type = o.type || 'lowpass';
    bq.frequency.setValueAtTime(o.f || 500, t0);
    if (o.f2) bq.frequency.exponentialRampToValueAtTime(Math.max(40, o.f2), t0 + d);
    const g = c.createGain();
    g.gain.setValueAtTime(o.v == null ? 0.16 : o.v, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(bq); bq.connect(g); g.connect(mg);
    src.start(t0); src.stop(t0 + d + 0.03);
  }
  let lastMove = 0;
  const api = {
    get muted() { return muted; },
    unlock() { ensure(); },
    toggle() {
      muted = !muted;
      localStorage.setItem('pp_mute', muted ? '1' : '0');
      if (!muted) { ensure(); api.rot(); }
      return muted;
    },
    move() { const n = performance.now(); if (n - lastMove < 38) return; lastMove = n; tone({ type: 'square', f: 470, f2: 560, d: 0.04, v: 0.055 }); },
    rot()  { tone({ type: 'triangle', f: 620, f2: 900, d: 0.07, v: 0.09 }); },
    land() { tone({ type: 'sine', f: 185, f2: 92, d: 0.10, v: 0.17 }); noise({ f: 900, f2: 180, d: 0.07, v: 0.09 }); },
    tick() { tone({ type: 'sine', f: 250, f2: 155, d: 0.06, v: 0.07 }); },
    drop() { noise({ f: 1900, f2: 300, d: 0.12, v: 0.11 }); },
    // 연쇄마다 반음씩 올라가는 터지는 소리 (도-레-미-…)
    pop(ch) {
      const f = 523.25 * Math.pow(2, (ch - 1) / 12);
      tone({ type: 'triangle', f: f,     d: 0.22, v: 0.19 });
      tone({ type: 'sine',     f: f * 2, d: 0.16, v: 0.09, at: 0.005 });
      tone({ type: 'sine',     f: f * 3, d: 0.10, v: 0.045, at: 0.012 });
      noise({ f: 2600, f2: 700, d: 0.09, v: 0.06 });
      if (ch >= 5) tone({ type: 'square', f: f * 1.5, d: 0.12, v: 0.05, at: 0.045 });
    },

    lose()  { [0, -2, -5, -9].forEach((n, i) => tone({ type: 'sawtooth', f: 392 * Math.pow(2, n / 12), d: 0.40, v: 0.11, at: i * 0.13 })); noise({ f: 500, f2: 80, d: 0.6, v: 0.09, at: 0.1 }); },

/* ═══════════ 상태 ═══════════ */
let myNick = '', myKey = '', code = '', isHost = false, room = null, listeners = [];
let players = {}, status = 'lobby', colors = 4, soloMode = false;
let board = [], cur = null, nextQ = [], bag = [];
let score = 0, chainNow = 0, bestChain = 0, leftover = 0;
let pending = 0;                              // 내려올 방해뿌요
let incSeen = 0;                              // 내가 받은 공격 누적(중복 방지)
let alive = true, playing = false, allClear = false;
let dropTimer = 0, lockTimer = 0;
let lastSync = 0;

/* ── 연출 상태머신 ── */
const PH_PLAY = 'play', PH_FALL = 'fall', PH_POP = 'pop', PH_GWARN = 'gwarn', PH_GFALL = 'gfall';
let phase = PH_PLAY, phT = 0, phDur = 0;
let fallers = [], fallG = 0, fallMotion = 1, fallSnd = false;
let popCells = [], pendCommit = null;
let gcells = [], gcols = [], gfallMotion = 1;
let chainN = 0, chainTotal = 0;
let landFx = [], landT = 1e9;
let banner = null, trails = [], deadT = 0;
let shake = { m: 0, t: 0, d: 1 };
let hardFlag = false;

const cv = $('cv'), ctx = cv.getContext('2d');
const nextCv = $('nextCv'), nctx = nextCv.getContext('2d');
let CELL = 30;

/* ═══════════ 보드 ═══════════ */
function newBoard() { return Array.from({ length: ROWS }, () => new Array(COLS).fill(EMPTY)); }
const at = (r, c) => (r >= 0 && r < ROWS && c >= 0 && c < COLS) ? board[r][c] : -1;

function refillBag() {
  // 색이 고르게 나오도록 가방에서 뽑는다
  const b = [];
  for (let i = 0; i < 4; i++) for (let c = 1; c <= colors; c++) b.push(c);
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  bag.push(...b);
}
function drawPair() { if (bag.length < 2) refillBag(); return [bag.shift(), bag.shift()]; }

function spawnPiece() {
  while (nextQ.length < 3) nextQ.push(drawPair());
  const p = nextQ.shift();
  nextQ.push(drawPair());
  cur = { c: SPAWN_C, r: HIDDEN - 1, rot: 0, a: p[0], b: p[1] };   // a=축, b=자식
  dropTimer = 0; lockTimer = 0;
  if (at(HIDDEN, SPAWN_C) !== EMPTY) { die(); return false; }
  return true;
}
// 자식 뿌요의 위치
function childPos(p) {
  const d = [[-1, 0], [0, 1], [1, 0], [0, -1]][p.rot];   // 위 오 아 왼
  return { r: p.r + d[0], c: p.c + d[1] };
}
function canPlace(p) {
  const ch = childPos(p);
  for (const [r, c] of [[p.r, p.c], [ch.r, ch.c]]) {
    if (c < 0 || c >= COLS || r >= ROWS) return false;
    if (r >= 0 && board[r][c] !== EMPTY) return false;
  }
  return true;
}
function move(dc) {
  if (!cur || phase !== PH_PLAY) return;
  const t = { ...cur, c: cur.c + dc };
  if (canPlace(t)) { cur = t; lockTimer = 0; SFX.move(); }
}
function rotate(dir) {
  if (!cur || phase !== PH_PLAY) return;
  const t = { ...cur, rot: (cur.rot + dir + 4) % 4 };
  if (canPlace(t)) { cur = t; lockTimer = 0; SFX.rot(); return; }
  // 벽 차기: 좌우로 한 칸 밀어본다
  for (const dc of [-1, 1, -2, 2]) {
    const k = { ...t, c: t.c + dc };
    if (canPlace(k)) { cur = k; lockTimer = 0; SFX.rot(); return; }
  }
  // 바닥에 걸리면 한 칸 올려본다
  const up = { ...t, r: t.r - 1 };

}
function softDrop() { if (!cur || phase !== PH_PLAY) return; const t = { ...cur, r: cur.r + 1 }; if (canPlace(t)) { cur = t; dropTimer = 0; } else lockTimer = LOCK_MS; }

  if (!cur || phase !== PH_PLAY) return;

  const ch = childPos(cur);

    trails.push({ c: cur.c, r0: r0, r1: cur.r, v: cur.a, t: 0 });
    trails.push({ c: ch.c, r0: rc0, r1: ch.r, v: cur.b, t: 0 });

}
function lockPiece() {

  const ch = childPos(cur);

  if (ch.r >= 0) board[ch.r][ch.c] = cur.b;
  landFx = [{ r: cur.r, c: cur.c }, { r: ch.r, c: ch.c }].filter(q => q.r >= HIDDEN);
  landT = 0;
  cur = null;
  SFX.land();
  shakeBoard(hardFlag ? 4.5 : 1.8, hardFlag ? 230 : 130);
  hardFlag = false;
  beginResolve();
}

/* ═══════════ 중력 · 연쇄 ═══════════ */
function applyGravity() {
  let moved = false;
  for (let c = 0; c < COLS; c++) {
    let w = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] !== EMPTY) {
        if (w !== r) { board[w][c] = board[r][c]; board[r][c] = EMPTY; moved = true; }
        w--;
      }
    }
  }
  return moved;
}
// 떨어진 칸을 기록하는 중력 (낙하 애니메이션용)
function applyGravityTracked() {
  const moved = [];
  for (let c = 0; c < COLS; c++) {
    let w = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] !== EMPTY) {
        if (w !== r) { board[w][c] = board[r][c]; board[r][c] = EMPTY; moved.push({ r: w, c: c, dist: w - r }); }
        w--;
      }
    }
  }
  return moved;
}
function findGroups() {
  const seen = Array.from({ length: ROWS }, () => new Array(COLS).fill(false));
  const groups = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const v = board[r][c];
    if (v === EMPTY || v === GARBAGE || seen[r][c]) continue;
    const cells = [], st = [[r, c]];
    seen[r][c] = true;
    while (st.length) {
      const [y, x] = st.pop();
      cells.push([y, x]);
      for (const [dy, dx] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ny = y + dy, nx = x + dx;
        if (ny < 0 || ny >= ROWS || nx < 0 || nx >= COLS || seen[ny][nx]) continue;
        if (board[ny][nx] !== v) continue;
        seen[ny][nx] = true; st.push([ny, nx]);
      }
    }
    // 숨은 줄에만 있는 덩어리는 터지지 않는다
    if (cells.length >= 4 && cells.some(([y]) => y >= HIDDEN)) groups.push({ color: v, cells });
  }
  return groups;
}
// 한 단계 터뜨릴 것을 계산만 한다 (보드는 안 건드림). 터질 게 없으면 null
// ⚠️ 점수 공식은 표준 뿌요뿌요 통 수치 — 건드리지 말 것
function computePop(chain) {
  const groups = findGroups();
  if (!groups.length) return null;
  let cleared = 0, groupBonus = 0;
  const colorSet = new Set();
  const cells = [];
  const garbageHit = new Set();
  for (const g of groups) {
    cleared += g.cells.length;
    colorSet.add(g.color);
    groupBonus += GROUP_BONUS[Math.min(g.cells.length - 4, GROUP_BONUS.length - 1)];
    for (const [r, c] of g.cells) {
      cells.push([r, c, g.color]);
      for (const [dy, dx] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ny = r + dy, nx = c + dx;
        if (at(ny, nx) === GARBAGE) garbageHit.add(ny * COLS + nx);
      }
    }
  }
  for (const k of garbageHit) cells.push([Math.floor(k / COLS), k % COLS, GARBAGE]);
  const cp = CHAIN_POWER[Math.min(chain - 1, CHAIN_POWER.length - 1)];
  const cb = COLOR_BONUS[Math.min(colorSet.size - 1, COLOR_BONUS.length - 1)];
  let mult = cp + cb + groupBonus;
  if (mult < 1) mult = 1;
  if (mult > 999) mult = 999;

// 계산 결과를 보드에 반영 (터짐 연출이 끝난 뒤)
function commitPop(st) { for (const [r, c] of st.cells) board[r][c] = EMPTY; }
// 기존 동작 그대로의 즉시판 — 디버그/검증용
function popStep(chain) { const st = computePop(chain); if (st) commitPop(st); return st; }
function boardEmpty() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (board[r][c] !== EMPTY) return false;
  return true;
}

/* ═══════════ 방해뿌요 ═══════════ */
// 어디에 쌓일지 먼저 계산한다 (보드는 안 건드림). 열 분배 규칙은 기존과 동일
function planGarbage(n) {
  n = Math.min(n, MAX_GARBAGE_WAVE);
  // 열마다 고르게, 남는 건 랜덤 열에
  const per = Math.floor(n / COLS), extra = n % COLS;
  const cols = [...Array(COLS).keys()];
  for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
  const cnt = new Array(COLS).fill(0);
  for (let i = 0; i < COLS; i++) cnt[cols[i]] = per + (i < extra ? 1 : 0);
  const cells = [];
  for (let c = 0; c < COLS; c++) {
    let top = ROWS;                              // 그 열에서 가장 위에 있는 뿌요
    for (let r = 0; r < ROWS; r++) if (board[r][c] !== EMPTY) { top = r; break; }
    for (let k = 0; k < cnt[c]; k++) {
      const r = top - 1 - k;
      if (r < 0) break;                          // 넘치면 버린다 (기존과 동일)
      cells.push({ r: r, c: c, idx: k });
    }
  }
  return { cells: cells, cnt: cnt };
}
function dropGarbage(n) {                        // 즉시판 — 디버그/검증용
  const p = planGarbage(n);
  for (const g of p.cells) board[g.r][g.c] = GARBAGE;
  applyGravity();
}
// 공격 보내기 — 살아있는 상대에게 고르게 나눈다
function sendGarbage(n) {
  if (n <= 0) return;
  const targets = Object.keys(players).filter(k => k !== myKey && players[k] && players[k].alive !== false);
  if (!targets.length) return;
  const per = Math.floor(n / targets.length), extra = n % targets.length;
  targets.forEach((k, i) => {
    const amt = per + (i < extra ? 1 : 0);
    if (amt > 0) db.ref(`${rpath(code)}/players/${k}/inc`).transaction(v => (v || 0) + amt);
  });
}

/* ═══════════ 진행 — 연쇄 상태머신 ═══════════ */
/*
  한 프레임에 전부 계산하던 걸 단계로 쪼갰다. 흐름:
    lockPiece → beginResolve
      settleStep : 중력 → 떨어질 게 있으면 FALL, 없으면 바로 POP 검사
      FALL  : 위 뿌요가 가속하며 떨어지고 착지에서 찌그러진다
      POP   : 깜빡 → 부풀기 → 터짐 (보드 반영은 연출이 끝난 뒤)
      → 다시 settleStep … 터질 게 없으면 finishChain
      finishChain : 점수/상쇄/공격 정산 (규칙 그대로) → 방해뿌요 있으면 GWARN→GFALL
      → PH_PLAY 로 돌아가면 step() 이 다음 조각을 만든다
  이 동안 phase !== PH_PLAY 이므로 move/rotate/drop 입력이 모두 막힌다.
*/
function inputLocked() { return !playing || !alive || phase !== PH_PLAY; }

function beginResolve() { chainN = 0; chainTotal = 0; settleStep(); }

function settleStep() {
  const moved = applyGravityTracked();
  if (moved.length) startFall(moved);
  else popPhase();
}

function startFall(list) {
  let maxD = 1;
  for (const f of list) if (f.dist > maxD) maxD = f.dist;
  // 거리에 비례한 시간 · 중력 가속(ease-in)으로 떨어뜨린다
  fallMotion = clamp(FALL_BASE + FALL_PER * maxD, 110, FALL_MAX) * chainSpd(chainN);
  fallG = 2 * maxD / (fallMotion * fallMotion);
  fallers = list.map(f => ({ r: f.r, c: f.c, dist: f.dist, landT: fallMotion * Math.sqrt(f.dist / maxD), snd: false }));
  fallSnd = false;
  landFx = [];
  phase = PH_FALL; phT = 0; phDur = fallMotion + SQUASH_MS;
}

function popPhase() {
  const st = computePop(chainN + 1);
  if (!st) { finishChain(); return; }
  chainN++;
  chainTotal += st.gain;
  score += st.gain;                              // 합계는 기존과 동일, 단계마다 올려준다
  chainNow = chainN;
  bestChain = Math.max(bestChain, chainN);
  pendCommit = st;
  popCells = st.cells.map(x => [x[0], x[1]]);
  phase = PH_POP; phT = 0; phDur = POP_MS * chainSpd(chainN);
  SFX.pop(chainN);
  showBanner(chainN);
  shakeBoard(1.5 + Math.min(9, chainN * 1.1), 240);
}

function finishChain() {
  fallers = []; popCells = []; pendCommit = null;
  if (chainN > 0) {
    // ⚠️ 상쇄·공격 규칙 그대로
    const raw = chainTotal + leftover;
    let n = Math.floor(raw / GARBAGE_RATE);
    leftover = raw % GARBAGE_RATE;
    if (allClear) { n += ALL_CLEAR_BONUS; allClear = false; toast('✨ 전체 지우기! +' + ALL_CLEAR_BONUS); SFX.allClear(); }
    const cancel = Math.min(pending, n);
    pending -= cancel; n -= cancel;
    if (n > 0) sendGarbage(n);
    if (boardEmpty()) allClear = true;
  } else chainNow = 0;
  if (pending > 0) { startGarbage(); return; }
  backToPlay();
}

function backToPlay() { phase = PH_PLAY; phT = 0; dasT = 0; arrT = 0; }

/* ── 방해뿌요: 경고 → 우르르 낙하 ── */
function startGarbage() {
  const n = Math.min(pending, MAX_GARBAGE_WAVE);
  pending -= n;
  const p = planGarbage(n);
  gcells = p.cells.map(g => ({ r: g.r, c: g.c, start: HIDDEN - 2 - g.idx, delay: g.c * 26 + g.idx * 16 }));
  gcols = p.cnt;
  phase = PH_GWARN; phT = 0; phDur = GWARN_MS;
  SFX.warn();
}
function commitGarbage() {
  let last = 0;
  for (const g of gcells) {
    board[g.r][g.c] = GARBAGE;                   // 보드엔 바로 들어간다 (동기화 일관성)
    g.dist = g.r - g.start;                      // 화면에선 위에서 내려오는 것처럼 보인다
    if (g.delay > last) last = g.delay;
  }
  gfallMotion = GFALL_MS;
  phase = PH_GFALL; phT = 0; phDur = GFALL_MS + last + SQUASH_MS;
}
function endGarbage() {
  gcells = []; gcols = [];
  SFX.garbageLand();
  shakeBoard(5, 260);
  // 방해뿌요로 연쇄가 터질 수도 있다
  if (findGroups().length) { beginResolve(); return; }
  backToPlay();
}

/* ── 연출 보조 ── */
function showBanner(ch) { banner = { ch: ch, t: 0, dur: 720 + Math.min(ch, 10) * 45 }; }
function shakeBoard(m, d) { if (shake.t <= 0 || m >= shake.m) { shake.m = m; shake.d = d; shake.t = d; } }

// 애니메이션 없이 연쇄 전체를 즉시 계산 — 검증/디버그용 (점수 공식은 애니메이션 경로와 공유)
function resolveInstant() {
  let chain = 0, total = 0;
  while (true) {
    applyGravity();
    const st = popStep(chain + 1);
    if (!st) break;
    chain++; total += st.gain;
  }
  if (chain > 0) { score += total; chainNow = chain; bestChain = Math.max(bestChain, chain); }
  return { chain: chain, total: total };
}

function die() {
  if (!alive) return;
  alive = false; playing = false; cur = null;
  phase = PH_PLAY; fallers = []; popCells = []; gcells = []; gcols = []; pendCommit = null;
  banner = null; deadT = 0;
  SFX.lose(); shakeBoard(7, 420);
  if (soloMode) { showResult(); return; }
  meRef().update({ alive: false, score, best: bestChain, b: encodeBoard() });
  checkEnd();
}

/* ═══════════ 루프 ═══════════ */
let lastT = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(120, now - lastT); lastT = now;
  tick(dt);
  render();
  requestAnimationFrame(frame);
}
// 연출 타이머는 게임이 멈춰 있어도 돌아간다 (창이 숨겨졌을 때 pp.tick 으로 직접 돌릴 수도 있다)
function tick(dt) {
  if (shake.t > 0) shake.t -= dt;
  if (landT < 1e9) landT += dt;
  if (banner) { banner.t += dt; if (banner.t >= banner.dur) banner = null; }
  for (let i = trails.length - 1; i >= 0; i--) { trails[i].t += dt; if (trails[i].t >= TRAIL_MS) trails.splice(i, 1); }
  if (!alive) deadT += dt;
  if (playing) step(dt);
}
function step(dt) {
  // 받은 공격 반영 — 상대가 올린 inc 누적에서 증분만 가져온다 (동기화 규칙 그대로)
  if (!soloMode) {
    const me = players[myKey];
    if (me && typeof me.inc === 'number' && me.inc > incSeen) { pending += me.inc - incSeen; incSeen = me.inc; }
  }
  phT += dt;
  // ── 연출 단계들: 여기 있는 동안 입력은 막힌다 ──
  if (phase === PH_FALL) {
    for (const f of fallers) if (!f.snd && phT >= f.landT) { f.snd = true; if (!fallSnd) { fallSnd = true; SFX.tick(); } }
    if (phT >= phDur) { fallers = []; popPhase(); }
    if (!soloMode) sync();
    return;
  }
  if (phase === PH_POP) {
    if (phT >= phDur) { if (pendCommit) commitPop(pendCommit); pendCommit = null; popCells = []; settleStep(); }
    if (!soloMode) sync();
    return;
  }
  if (phase === PH_GWARN) { if (phT >= phDur) commitGarbage(); if (!soloMode) sync(); return; }
  if (phase === PH_GFALL) { if (phT >= phDur) endGarbage(); if (!soloMode) sync(); return; }
  // ── 조작 ──
  if (!cur) { if (!spawnPiece()) return; }
  autoShift(dt);
  const soft = keys.ArrowDown || padDown;
  dropTimer += dt;
  const iv = soft ? SOFT_MS : DROP_MS;
  if (dropTimer >= iv) {
    dropTimer = 0;
    const t = { ...cur, r: cur.r + 1 };
    if (canPlace(t)) { cur = t; lockTimer = 0; if (soft) score += 1; }
    else {
      lockTimer += iv;
      if (lockTimer >= LOCK_MS || soft) lockPiece();
    }
  }
  if (!soloMode) sync();
}
function sync() {
  const now = Date.now();
  if (now - lastSync < 220) return;
  lastSync = now;
  meRef().update({ b: encodeBoard(), score, best: bestChain, pend: pending, alive, t: now });
}

/* ═══════════ 보드 직렬화 ═══════════ */
function encodeBoard() {
  let s = '';
  for (let r = HIDDEN; r < ROWS; r++) for (let c = 0; c < COLS; c++) s += board[r][c];
  return s;
}
function decodeBoard(s) {
  const g = Array.from({ length: VIS }, () => new Array(COLS).fill(0));
  if (!s) return g;
  for (let i = 0; i < Math.min(s.length, VIS * COLS); i++) g[Math.floor(i / COLS)][i % COLS] = +s[i];
  return g;
}

/* ═══════════ 그리기 ═══════════ */
function fitCanvas() {
  const h = $('arena').clientHeight - 4;
  CELL = Math.max(16, Math.floor(Math.min(h / VIS, (innerWidth * 0.42) / COLS)));
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = COLS * CELL * dpr; cv.height = VIS * CELL * dpr;
  cv.style.width = (COLS * CELL) + 'px'; cv.style.height = (VIS * CELL) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', () => { fitCanvas(); });

// 콩눈 뿌요 — 같은 색끼리 붙으면 이어진 것처럼
const ART = window.PUYO_ART || null;
function drawPuyo(c, x, y, size, v, grid, gr, gc, o) {
  if (ART && ART.drawPuyo) {
    const u = ART.util || {};
    ART.drawPuyo(c, x, y, size, v, Object.assign({
      conn: (grid && u.conn) ? u.conn(grid, gr, gc) : null,
      face: u.face ? u.face(gr || 0, gc || 0) : 0,
    }, o || {}));
    return;
  }
  const P = PUYO[v]; if (!P) return;
  const r = size * 0.46, cx = x + size / 2, cy = y + size / 2;
  if (v !== GARBAGE && grid) {        // 이음새
    c.fillStyle = P.fill;
    for (const [dy, dx] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const ny = gr + dy, nx = gc + dx;
      if (ny < 0 || ny >= grid.length || nx < 0 || nx >= COLS) continue;
      if (grid[ny][nx] !== v) continue;
      c.fillRect(cx - r * 0.55 + dx * size * 0.4, cy - r * 0.55 + dy * size * 0.4, r * 1.1, r * 1.1);
    }
  }
  c.fillStyle = P.fill;
  c.beginPath(); c.arc(cx, cy, r, 0, 6.283); c.fill();
  c.lineWidth = Math.max(1.4, size * 0.055); c.strokeStyle = P.line; c.stroke();
  if (v === GARBAGE) {                // 방해뿌요는 찌그러진 표정
    c.strokeStyle = P.line; c.lineWidth = Math.max(1.2, size * 0.05);
    c.beginPath(); c.moveTo(cx - r * 0.4, cy - r * 0.1); c.lineTo(cx - r * 0.05, cy - r * 0.1);
    c.moveTo(cx + r * 0.05, cy - r * 0.1); c.lineTo(cx + r * 0.4, cy - r * 0.1); c.stroke();
    return;
  }
  // 콩눈
  const er = r * 0.30, ex = r * 0.33, ey = -r * 0.10;
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(cx - ex, cy + ey, er, er * 1.12, 0, 0, 6.283); c.fill();
  c.beginPath(); c.ellipse(cx + ex, cy + ey, er, er * 1.12, 0, 0, 6.283); c.fill();
  c.fillStyle = '#3b2a22';
  c.beginPath(); c.arc(cx - ex, cy + ey + er * 0.12, er * 0.52, 0, 6.283); c.fill();
  c.beginPath(); c.arc(cx + ex, cy + ey + er * 0.12, er * 0.52, 0, 6.283); c.fill();
}

function render() {
  if (!$('game').classList.contains('active')) return;
  const W = COLS * CELL, H = VIS * CELL;
  ctx.clearRect(0, 0, W, H);
  if (ART && ART.drawBoardBg) ART.drawBoardBg(ctx, W, H, performance.now() / 1000, COLS);
  else {
  ctx.fillStyle = '#2b2438'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#3a3049'; ctx.lineWidth = 1;
  for (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, H); ctx.stroke(); }
  for (let r = 1; r < VIS; r++) { ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(W, r * CELL); ctx.stroke(); }
  }
  // 패배 지점 표시
  ctx.strokeStyle = '#6b5a7a'; ctx.setLineDash([4, 4]);
  ctx.strokeRect(SPAWN_C * CELL + 2, 2, CELL - 4, CELL - 4); ctx.setLineDash([]);
  // 보드
  const grid = [];
  for (let r = HIDDEN; r < ROWS; r++) grid.push(board[r]);
  const popT = (phase === PH_POP && phDur) ? Math.min(1, phT / phDur) : 0;
  const popping = {};
  if (popT) for (const [pr, pc] of popCells) popping[(pr - HIDDEN) * COLS + pc] = 1;
  for (let r = 0; r < VIS; r++) for (let c = 0; c < COLS; c++) {
    const v = grid[r][c];
    if (!v) continue;
    const isPop = popping[r * COLS + c];
    drawPuyo(ctx, c * CELL, r * CELL, CELL, v, grid, r, c,
      isPop ? { state: 'pop', t: popT } : null);
  }
  // 조작 중인 뿌요 (+ 착지 안내)
  if (cur) {
    let gh = { ...cur };
    while (true) { const t = { ...gh, r: gh.r + 1 }; if (canPlace(t)) gh = t; else break; }
    const gch = childPos(gh);
    ctx.globalAlpha = 0.22;
    for (const [r, c] of [[gh.r, gh.c], [gch.r, gch.c]]) {
      if (r < HIDDEN) continue;
      ctx.fillStyle = '#fff';
      ctx.fillRect(c * CELL + CELL * 0.12, (r - HIDDEN) * CELL + CELL * 0.12, CELL * 0.76, CELL * 0.76);
    }
    ctx.globalAlpha = 1;
    const ch = childPos(cur);
    for (const [r, c, v] of [[cur.r, cur.c, cur.a], [ch.r, ch.c, cur.b]]) {
      if (r < HIDDEN) continue;
      drawPuyo(ctx, c * CELL, (r - HIDDEN) * CELL, CELL, v, null);
    }
  }
  // 다음
  nctx.clearRect(0, 0, 56, 112);
  nctx.fillStyle = '#2b2438'; nctx.fillRect(0, 0, 56, 112);
  for (let i = 0; i < Math.min(2, nextQ.length); i++) {
    const [a, b] = nextQ[i];
    const y = 6 + i * 54, s = 24;
    drawPuyo(nctx, 16, y, s, b, null);
    drawPuyo(nctx, 16, y + s, s, a, null);
  }
  // 연쇄 배너 (2연쇄! 같은 큰 글자)
  if (banner && ART && ART.drawChainBanner) {
    ART.drawChainBanner(ctx, W, H, banner.ch, performance.now() / 1000, Math.min(1, banner.t / banner.dur));
  }
  $('pChain').textContent = chainNow || 0;
  $('pScore').textContent = score.toLocaleString();
  $('tScore').textContent = score.toLocaleString() + '점';
  $('tChain').textContent = '최고 ' + bestChain + '연쇄';
  const w = $('tWarn');
  if (pending > 0) { w.style.display = ''; w.textContent = '⚠️ 방해뿌요 ' + pending + '개'; } else w.style.display = 'none';
  if (!soloMode) renderPeers();
}

function renderPeers() {
  const box = $('peers');
  const ks = Object.keys(players).filter(k => k !== myKey).sort();
  if (box._sig !== ks.join(',')) {
    box._sig = ks.join(',');
    box.innerHTML = '';
    box._els = {};
    for (const k of ks) {
      const d = document.createElement('div');
      d.className = 'peer';
      d.innerHTML = `<canvas width="60" height="120"></canvas><div class="nm"></div><div class="st"></div>`;
      box.appendChild(d);
      box._els[k] = { wrap: d, cv: d.querySelector('canvas'), nm: d.querySelector('.nm'), st: d.querySelector('.st') };
    }
  }
  for (const k of ks) {
    const el = box._els[k], p = players[k] || {};
    el.nm.textContent = p.nick || k;
    el.st.textContent = (p.alive === false ? '💀 ' : '') + (p.score || 0).toLocaleString() + (p.pend ? ' ⚠️' + p.pend : '');
    el.wrap.classList.toggle('dead', p.alive === false);
    const sig = (p.b || '') + '|' + p.alive;
    if (el._sig === sig) continue;
    el._sig = sig;
    const c = el.cv.getContext('2d');
    const cw = el.cv.width, chh = el.cv.height, cs = Math.floor(Math.min(cw / COLS, chh / VIS));
    c.clearRect(0, 0, cw, chh); c.fillStyle = '#2b2438'; c.fillRect(0, 0, cw, chh);
    const g = decodeBoard(p.b);
    for (let r = 0; r < VIS; r++) for (let cc = 0; cc < COLS; cc++) if (g[r][cc]) drawPuyo(c, cc * cs, r * cs, cs, g[r][cc], g, r, cc);
  }
}

/* ═══════════ 입력 ═══════════ */
const keys = {};
let padDown = false;
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', 'Space'].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return;
  keys[e.code] = true;
  if (!playing) return;
  if (e.code === 'ArrowLeft') move(-1);
  if (e.code === 'ArrowRight') move(1);
  if (e.code === 'ArrowUp' || e.code === 'KeyX') rotate(1);
  if (e.code === 'KeyZ' || e.code === 'ControlLeft') rotate(-1);
  if (e.code === 'Space') hardDrop();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; padDown = false; });
// 좌우 자동반복(DAS/ARR) — 누르고 있으면 DAS_MS 뒤부터 ARR_MS 간격으로 이동
let shiftDir = 0, shiftT = 0;
function autoShift(dt) {
  const d = (keys.ArrowLeft ? -1 : 0) + (keys.ArrowRight ? 1 : 0);
  if (!d || !cur) { shiftDir = 0; shiftT = 0; return; }
  if (d !== shiftDir) { shiftDir = d; shiftT = -DAS_MS; return; }   // 첫 한 칸은 keydown 이 이미 옮겼다
  shiftT += dt;
  let guard = 8;
  while (shiftT >= 0 && guard--) { move(shiftDir); shiftT -= ARR_MS; }
}
// 모바일 패드
function hold(el, fn, rep) {
  let iv = null, t0 = null;
  const on = e => { e.preventDefault(); if (!playing) return; fn(); if (rep) { t0 = setTimeout(() => { iv = setInterval(fn, 90); }, 220); } };
  const off = () => { clearTimeout(t0); clearInterval(iv); iv = null; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
}
hold($('padL'), () => move(-1), true);
hold($('padR'), () => move(1), true);
hold($('padCW'), () => rotate(1), false);
hold($('padCCW'), () => rotate(-1), false);
$('padDrop').addEventListener('pointerdown', e => { e.preventDefault(); if (playing) padDown = true; });
$('padDrop').addEventListener('pointerup', () => { padDown = false; });
$('padDrop').addEventListener('pointerleave', () => { padDown = false; });
// 캔버스 스와이프
let sw = null;
cv.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY, t: Date.now(), moved: 0 }; });
cv.addEventListener('pointermove', e => {
  if (!sw || !playing) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.abs(dx) > CELL * 0.8 && Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 1 : -1); sw.x = e.clientX; sw.moved++;
  } else if (dy > CELL * 1.6) { padDown = true; sw.moved++; }
});
cv.addEventListener('pointerup', () => {
  if (sw && playing && !sw.moved && Date.now() - sw.t < 260) rotate(1);
  sw = null; padDown = false;
});

function startGame() {

function checkEnd() {
  if (!isHost || !room || room.status !== 'playing') return;
  const ps = Object.entries(players);
  const liveN = ps.filter(([, p]) => p.alive !== false).length;
  if (ps.length >= 2 && liveN <= 1) {
    const winner = ps.find(([, p]) => p.alive !== false);
    roomRef().update({ status: 'ended', winner: winner ? winner[0] : null });
  } else if (ps.length === 1 && liveN === 0) {

  }
}

function publishRoom() {

function enterRoom() {
  offAll();

  $('roomCode').textContent = code;
  const ref = roomRef();
  const cb = ref.on('value', snap => {

    players = room.players || {};
    if (!players[myKey]) { toast('방에서 나갔어요'); goHome(); return; }
    if (!players[room.host]) {
      const first = Object.entries(players).sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0))[0];
      if (first && first[0] === myKey) { roomRef().update({ host: myKey }); toast('방장을 이어받았어요'); }
    }
    isHost = room.host === myKey;
    colors = room.colors || 4;
    status = room.status;
    if (isHost) { const sig = `${status}|${Object.keys(players).length}|${colors}`; if (publishRoom._s !== sig) { publishRoom._s = sig; publishRoom(); } }

    if (status === 'lobby') { show('lobby'); renderLobby(); playing = false; $('resultOv').hidden = true; return; }

    if (isHost && status === 'playing') checkEnd();
  });

}
