<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참스코드 허브</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #EFF6FF;
  --bg-surface: #FFFFFF;
  --bg-glass: rgba(255,255,255,0.72);
  --border-glass: rgba(148,187,233,0.35);
  --accent-blue: #2563EB;
  --accent-cyan: #06B6D4;
  --accent-sky: #0EA5E9;
  --accent-indigo: #4F46E5;
  --accent-orange: #F59E0B;
  --accent-rose: #F43F5E;
  --accent-green: #10B981;
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-dim: #94A3B8;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
  --shadow-md: 0 4px 16px rgba(15,23,42,0.08);
  --shadow-lg: 0 12px 40px rgba(15,23,42,0.12);
  --radius: 14px;
  --lnb-width: 260px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
}

/* Ambient background blobs */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 0;
  pointer-events: none;
}
body::before {
  width: 500px; height: 500px;
  top: -120px; right: -80px;
  background: radial-gradient(circle, rgba(6,182,212,0.12), transparent 70%);
}
body::after {
  width: 600px; height: 600px;
  bottom: -150px; left: 20%;
  background: radial-gradient(circle, rgba(37,99,235,0.08), transparent 70%);
}

/* LNB Sidebar */
.lnb {
  position: fixed;
  top: 0; left: 0;
  width: var(--lnb-width);
  height: 100vh;
  background: var(--bg-glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-right: 1px solid var(--border-glass);
  z-index: 100;
  display: flex;
  flex-direction: column;
  padding: 0;
  transition: transform .3s ease;
}

.lnb-header {
  position: relative;
  padding: 28px 22px 20px;
  border-bottom: 1px solid var(--border-glass);
}
.lnb-logo {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: .05em;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.lnb-subtitle {
  font-size: .78rem;
  color: var(--text-dim);
  margin-top: 3px;
  letter-spacing: .1em;
  font-weight: 500;
}

.lnb-nav {
  flex: 1;
  padding: 12px 12px 20px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;                 /* 항목이 많아 스크롤 필요 */
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.22) transparent;
  cursor: grab;                     /* 드래그로도 스크롤 */
}
.lnb-nav.dragging { cursor: grabbing; scroll-behavior: auto; }
.lnb-nav::-webkit-scrollbar { width: 8px; }
.lnb-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
.lnb-nav::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.3); }
.lnb-nav::-webkit-scrollbar-track { background: transparent; }

.nav-search {
  width: calc(100% - 4px); margin: 0 2px 8px; padding: 9px 12px;
  border: 1px solid var(--border-glass); border-radius: 10px;
  background: rgba(255,255,255,.06); color: var(--text-primary);
  font-family: inherit; font-size: .82rem; outline: none;
}
.nav-search::placeholder { color: var(--text-dim); }
.nav-search:focus { border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.1); }
.nav-noresult { font-size: .8rem; color: var(--text-dim); padding: 10px 12px; }
body.searching .nav-group-head { display: none; }
body.searching .nav-group.closed .nav-group-body { display: flex; }
.nav-item.hide { display: none; }
/* 아코디언 대분류 */
.nav-group { display: flex; flex-direction: column; }
.nav-group-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; margin-top: 6px;
  border-radius: 10px; cursor: pointer; user-select: none;
  font-size: .78rem; font-weight: 700; letter-spacing: .03em;
  color: var(--text-dim); transition: background .15s, color .15s;
}
.nav-group-head:hover { background: rgba(255,255,255,.06); color: var(--text-primary); }
.nav-group-head .arrow { margin-left: auto; font-size: .7rem; transition: transform .2s; opacity: .7; }
.nav-group.closed .arrow { transform: rotate(-90deg); }
.nav-group-head .cnt { font-size: .68rem; opacity: .6; }
.nav-group-body { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.nav-group.closed .nav-group-body { display: none; }
.nav-group.has-active .nav-group-head { color: var(--text-primary); }

/* LNB 닫기 / 열기 */
.lnb-close {
  position: absolute; top: 18px; right: 14px;
  width: 30px; height: 30px; border: 0; border-radius: 9px;
  background: rgba(255,255,255,.08); color: var(--text-dim);
  font-size: 15px; cursor: pointer; line-height: 1;
}
.lnb-close:hover { background: rgba(255,255,255,.18); color: var(--text-primary); }
body.lnb-hidden .lnb { transform: translateX(-100%); }
body.lnb-hidden .main { margin-left: 0; }
body.lnb-hidden .lnb-open-btn { display: flex; }
.lnb-open-btn {
  display: none; position: fixed; top: 16px; left: 16px; z-index: 120;
  width: 42px; height: 42px; border: 0; border-radius: 12px;
  background: var(--bg-glass); backdrop-filter: blur(12px);
  border: 1px solid var(--border-glass); color: var(--text-primary);
  font-size: 18px; cursor: pointer; align-items: center; justify-content: center;
}

.nav-section-label {
  font-family: 'Orbitron', sans-serif;
  font-size: .65rem;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 12px 12px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: all .2s ease;
  text-decoration: none;
  color: var(--text-secondary);
  font-weight: 600;
  font-size: .92rem;
  position: relative;
  border: 1px solid transparent;
}
.nav-item:hover {
  background: rgba(37,99,235,0.06);
  color: var(--accent-blue);
}
.nav-item.active {
  background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(6,182,212,0.08));
  color: var(--accent-blue);
  border-color: rgba(37,99,235,0.15);
  box-shadow: 0 2px 8px rgba(37,99,235,0.08);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 20px;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, var(--accent-blue), var(--accent-cyan));
}
.nav-icon {
  font-size: 1.2rem;
  width: 28px;
  text-align: center;
}
.nav-badge {
  margin-left: auto;
  font-family: 'Orbitron', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  color: white;
  letter-spacing: .5px;
}

.lnb-footer {
  padding: 16px 22px;
  border-top: 1px solid var(--border-glass);
  font-size: .72rem;
  color: var(--text-dim);
  text-align: center;
}

/* Mobile hamburger */
.mobile-toggle {
  display: none;
  position: fixed;
  top: 14px; left: 14px;
  z-index: 200;
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  cursor: pointer;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  box-shadow: var(--shadow-md);
}

/* Overlay for mobile */
.lnb-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.3);
  z-index: 99;
}
.lnb-overlay.show { display: block; }

/* Main Content */
.main {
  margin-left: var(--lnb-width);
  flex: 1;
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

/* Landing page */
.landing {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px;
}
.landing-content {
  text-align: center;
  max-width: 600px;
  animation: fadeUp .6s ease;
}
.landing-icon {
  font-size: 4rem;
  margin-bottom: 20px;
  filter: drop-shadow(0 4px 12px rgba(37,99,235,0.2));
}
.landing-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 2.4rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan), var(--accent-indigo));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
  margin-bottom: 12px;
}
.landing-desc {
  font-size: 1.05rem;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 36px;
}
.landing-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.landing-sec {
  grid-column: 1 / -1; text-align: left; margin: 26px 0 2px;
  font-size: .95rem; font-weight: 700; color: var(--text-primary);
  display: flex; align-items: center; gap: 8px;
}
.landing-sec::after { content: ''; flex: 1; height: 1px; background: var(--border-glass); }
#recentWrap .landing-sec { margin-top: 4px; }
@media (max-width: 640px) { .landing-cards { grid-template-columns: 1fr; } }
.landing-card {
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius);
  padding: 28px 20px;
  cursor: pointer;
  transition: all .25s ease;
  text-align: center;
}
.landing-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: rgba(37,99,235,0.3);
}
.landing-card-icon { font-size: 2.4rem; margin-bottom: 12px; }
.landing-card-title {
  font-family: 'Orbitron', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.landing-card-desc {
  font-size: .8rem;
  color: var(--text-dim);
  line-height: 1.5;
}
/* 카드마다 직접 링크 (추천·공유용) */
.card-link {
  display: flex; align-items: center; gap: 6px; justify-content: center;
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-glass);
  font-size: .68rem; color: var(--text-dim);
}
.card-link .u { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .75; }
.card-link button {
  flex: none; border: 1px solid var(--border-glass); background: rgba(255,255,255,.08);
  color: var(--text-primary); border-radius: 999px; padding: 3px 9px; font-size: .68rem;
  cursor: pointer; font-family: inherit;
}
.card-link button:hover { background: rgba(255,255,255,.18); }
#linkToast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(16px);
  background: rgba(20,20,28,.92); color: #fff; padding: 9px 16px; border-radius: 999px;
  font-size: .8rem; opacity: 0; transition: .25s; pointer-events: none; z-index: 9999;
}
#linkToast.show { opacity: 1; transform: translateX(-50%); }

/* iframe container */
.page-frame {
  display: none;
  width: 100%;
  height: 100vh;
  height: 100dvh;   /* 폰 주소창을 뺀 실제 높이 — 100vh 면 아래가 잘림 */
}
.page-frame.active {
  display: block;
}
.page-frame iframe {
  width: 100%;
  height: 100%;
  border: none;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}

/* Mobile */
@media (max-width: 768px) {
  :root { --lnb-width: 260px; }
  .mobile-toggle { display: flex; }
  .lnb { transform: translateX(-100%); }
  .lnb.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .landing-cards { grid-template-columns: 1fr; }
  .landing-title { font-size: 1.8rem; }
  .landing { padding: 24px 16px; }
}
</style>
</head>

<!-- Mobile Toggle -->
<div class="mobile-toggle" id="mobileToggle" onclick="toggleLNB()">☰</div>
<div class="lnb-overlay" id="lnbOverlay" onclick="toggleLNB()"></div>
<button class="lnb-open-btn" id="lnbOpen" title="메뉴 열기">☰</button>

<!-- LNB -->
<nav class="lnb" id="lnb">

    <div class="nav-item active" data-page="home" onclick="navigate('home')">
      <span class="nav-icon">🏠</span>
      <span>홈</span>
    </div>

  </div>

  <div class="lnb-footer">
    ⚡ Charms Code Program v2.0
  </div>
</nav>

<!-- Main -->
<div class="main" id="main">
  <!-- Home Landing -->
  <div class="landing" id="page-home">
    <div class="landing-content">
      <div class="landing-icon">⚡</div>
      <div class="landing-title">참스코드 프로그램</div>
      <div class="landing-desc">
        팀 경매 시스템과 게임 투표 룰렛을 한 곳에서.<br>
        왼쪽 메뉴에서 원하는 기능을 선택하세요.

      <div id="recentWrap" hidden>

        <div class="landing-cards" id="recentCards"></div>
      </div>
      <div id="landingCards"></div>
    </div>
  </div>

</div>

function cardOf(g, box) {
  const card = document.createElement('div');
  card.className = 'landing-card';
  card.dataset.page = g.k;
  card.onclick = () => navigate(g.k);
  card.innerHTML = `<div class="landing-card-icon">${g.ic}</div>`
    + `<div class="landing-card-title">${g.tt}</div>`
    + `<div class="landing-card-desc">${g.ds}</div>`;
  box.appendChild(card);
  return card;
}
(function buildHub() {
  const nav = document.querySelector('.lnb-nav');
  const main = document.querySelector('.main');
  const root = document.getElementById('landingCards');
  // 분류마다 제목 + 카드 묶음
  const boxOf = {};
  for (const gr of GROUPS) {
    const sec = document.createElement('div');
    sec.className = 'landing-cards';
    sec.innerHTML = `<div class="landing-sec">${gr.label}</div>`;
    root.appendChild(sec);
    boxOf[gr.key] = sec;
  }
  for (const g of GAMES) {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.dataset.page = g.k;
    item.dataset.find = (g.nm + ' ' + g.tt + ' ' + g.ds).toLowerCase();
    item.onclick = () => navigate(g.k);
    item.innerHTML = `<span class="nav-icon">${g.ic}</span><span>${g.nm}</span>`
      + (g.bd ? `<span class="nav-badge">${g.bd}</span>` : '');
    nav.appendChild(item);

    cardOf(g, boxOf[g.g]);

    const fr = document.createElement('div');
    fr.className = 'page-frame';
    fr.id = 'page-' + g.k;
    const ifr = document.createElement('iframe');
    ifr.id = 'iframe-' + g.k;
    ifr.dataset.src = g.src;
    if (g.allow) ifr.setAttribute('allow', g.allow);
    fr.appendChild(ifr);
    main.appendChild(fr);
  }
})();
</script>
<script>
let currentPage = 'home';
// 테스트용 배속: 게임은 iframe 안이라 허브 콘솔에선 tuna 가 안 보임 → 열린 게임으로 연결
const activeGameWin = () => { const fr = document.getElementById(`iframe-${currentPage}`); try { return fr && fr.getAttribute('src') ? fr.contentWindow : null; } catch (e) { return null; } };
['tuna', 'rock', 'mine', 'shelldiver', 'rhythm', 'o2jam', 'bottom'].forEach(k => Object.defineProperty(window, k, { configurable: true, get: () => { const w = activeGameWin(); return w && w[k]; } }));
window.speed = n => { const w = activeGameWin(); return w && w.__gameSpeed ? w.__gameSpeed.set(n) : '배속은 참치 타이쿤·스페이스 록·킵 온 마이닝·쉘다이버 화면에서만 돼요'; };
addEventListener('keydown', e => {
  if (e.code !== 'BracketRight' && e.code !== 'BracketLeft') return;
  if (/INPUT|TEXTAREA/.test((e.target && e.target.tagName) || '')) return;
  const w = activeGameWin(); if (w && w.__gameSpeed) w.__gameSpeed.step(e.code === 'BracketRight' ? 1 : -1);
});

// ── 각 게임의 직접 링크: 카드에 주소 + 복사 버튼 (추천할 때 쓰라고) ──
(function addCardLinks() {
  const toast = document.createElement('div');
  toast.id = 'linkToast';
  document.body.appendChild(toast);
  window.__linkToast = m => { toast.textContent = m; toast.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2000); };
  document.querySelectorAll('.landing-card').forEach(card => {
    const m = (card.getAttribute('onclick') || '').match(/navigate\('([^']+)'\)/);
    if (!m) return;
    if (!document.getElementById('page-' + m[1])) return;
    const url = gameUrl(m[1]);
    const bar = document.createElement('div');
    bar.className = 'card-link';
    bar.innerHTML = '<span class="u">' + url.replace(/^https?:\/\//, '') + '</span>';
    const btn = document.createElement('button');
    btn.textContent = '🔗 복사';
    btn.title = '이 게임 주소 복사';
    btn.onclick = e => {
      e.stopPropagation();
      navigator.clipboard.writeText(url).then(() => window.__linkToast('링크를 복사했어요: ' + url))
        .catch(() => window.__linkToast(url));
    };
    bar.appendChild(btn);
    bar.onclick = e => e.stopPropagation();
    card.appendChild(bar);
  });
})();

// 허브 주소 하나로 각 게임을 열 수 있게: /chamchicode/?game=suika
function hubBase() { return location.pathname.replace(/index\.html$/, ''); }   // .../chamchicode/ 형태로 (const 로 두면 위쪽 IIFE 에서 TDZ 에러)
function gameUrl(page) { return location.origin + hubBase() + '?game=' + page; }

// ── LNB: 대분류 아코디언 + 드래그 스크롤 + 접기 ──
const NAV_GROUPS = GROUPS.map(g => ({ key: g.key, label: g.label, pages: GAMES.filter(x => x.g === g.key).map(x => x.k) }));
(function buildNavGroups() {
  const nav = document.querySelector('.lnb-nav');
  if (!nav) return;
  const itemOf = {};
  nav.querySelectorAll('.nav-item').forEach(el => { if (el.dataset.page) itemOf[el.dataset.page] = el; });
  const used = new Set(['home']);
  const open = (() => { try { return JSON.parse(localStorage.getItem('hub_nav_open') || 'null'); } catch (e) { return null; } })();
  NAV_GROUPS.forEach(g => {
    const items = g.pages.map(k => itemOf[k]).filter(Boolean);
    if (!items.length) return;
    items.forEach(el => used.add(el.dataset.page));
    const box = document.createElement('div');
    box.className = 'nav-group';
    box.dataset.key = g.key;
    const head = document.createElement('div');
    head.className = 'nav-group-head';
    head.innerHTML = `<span>${g.label}</span><span class="cnt">${items.length}</span><span class="arrow">▼</span>`;
    const body = document.createElement('div');
    body.className = 'nav-group-body';
    items.forEach(el => body.appendChild(el));
    box.appendChild(head); box.appendChild(body);
    nav.appendChild(box);
    const closed = open ? open[g.key] === false : false;
    if (closed) box.classList.add('closed');
    head.onclick = () => {
      box.classList.toggle('closed');
      const st = {};
      document.querySelectorAll('.nav-group').forEach(b => { st[b.dataset.key] = !b.classList.contains('closed'); });
      try { localStorage.setItem('hub_nav_open', JSON.stringify(st)); } catch (e) {}
    };
  });
  // 분류에 없는 항목은 '기타' 로 (나중에 추가된 게임도 안 사라지게)
  const rest = [...nav.querySelectorAll(':scope > .nav-item')].filter(el => el.dataset.page && !used.has(el.dataset.page));
  if (rest.length) {
    const box = document.createElement('div');
    box.className = 'nav-group'; box.dataset.key = 'rest';
    box.innerHTML = `<div class="nav-group-head"><span>✨ 그 밖에</span><span class="cnt">${rest.length}</span><span class="arrow">▼</span></div>`;
    const body = document.createElement('div');
    body.className = 'nav-group-body';
    rest.forEach(el => body.appendChild(el));
    box.appendChild(body);
    nav.appendChild(box);
    box.querySelector('.nav-group-head').onclick = () => box.classList.toggle('closed');
  }
  // 드래그로 스크롤
  let down = false, sy = 0, st0 = 0, moved = 0;
  nav.addEventListener('pointerdown', e => {
    if (e.target.closest('.nav-group-head')) return;
    down = true; moved = 0; sy = e.clientY; st0 = nav.scrollTop;
  });
  nav.addEventListener('pointermove', e => {
    if (!down) return;
    const dy = e.clientY - sy;
    if (Math.abs(dy) > 4) { nav.classList.add('dragging'); moved = Math.abs(dy); nav.scrollTop = st0 - dy; }
  });
  const end = () => { down = false; nav.classList.remove('dragging'); setTimeout(() => { moved = 0; }, 0); };
  nav.addEventListener('pointerup', end);
  nav.addEventListener('pointercancel', end);
  nav.addEventListener('pointerleave', end);
  nav.addEventListener('click', e => { if (moved > 6) { e.stopPropagation(); e.preventDefault(); } }, true);
})();
// 현재 페이지가 든 그룹은 펼쳐 둔다
function revealNavGroup(page) {
  const el = document.querySelector(`.nav-item[data-page="${page}"]`);
  const box = el && el.closest('.nav-group');
  document.querySelectorAll('.nav-group').forEach(b => b.classList.toggle('has-active', b === box));
  if (box && box.classList.contains('closed')) box.classList.remove('closed');
}
function setLnbHidden(on) {
  document.body.classList.toggle('lnb-hidden', on);
  try { localStorage.setItem('hub_lnb_hidden', on ? '1' : '0'); } catch (e) {}
}
// 접어둔 상태를 기억한다 (좁은 화면은 원래 오버레이 방식이라 제외)
try { if (localStorage.getItem('hub_lnb_hidden') === '1' && innerWidth > 768) document.body.classList.add('lnb-hidden'); } catch (e) {}
// \ 또는 Ctrl+B 로 메뉴 접기/펼치기
addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
  if (typing) return;
  if (e.key === '\\' || (e.key.toLowerCase() === 'b' && (e.ctrlKey || e.metaKey))) {
    e.preventDefault();
    if (innerWidth <= 768) toggleLNB();
    else setLnbHidden(!document.body.classList.contains('lnb-hidden'));
  }
});
document.getElementById('lnbClose').onclick = () => {
  if (window.innerWidth <= 768) toggleLNB();
  else setLnbHidden(true);
};
document.getElementById('lnbOpen').onclick = () => {
  setLnbHidden(false);
  if (window.innerWidth <= 768) toggleLNB();
};

function navigate(page, fromHistory) {
  currentPage = page;
  // 주소 갱신 (뒤로가기도 동작)
  try {
    const url = page === 'home' ? hubBase() : hubBase() + '?game=' + page;
    if (!fromHistory) history.pushState({ page }, '', url);
  } catch (e) {}

  // Hide all pages
  document.getElementById('page-home').style.display = 'none';
  document.querySelectorAll('.page-frame').forEach(f => f.classList.remove('active'));

  // 다른 페이지의 iframe 은 내려서(언로드) 음악/타이머/접속이 남지 않게 한다. 필요한 페이지만 그때 로드
  document.querySelectorAll('.page-frame iframe').forEach(fr => {
    const mine = fr.id === `iframe-${page}`;
    if (!mine && fr.getAttribute('src')) fr.removeAttribute('src'), fr.contentWindow && fr.contentWindow.location.replace('about:blank');
    // 배포 직후에도 GitHub Pages 10분 캐시 말고 새 파일을 받도록 (초대 링크는 모두 ?를 잘라서 만들므로 영향 없음)
    if (mine && !fr.getAttribute('src')) fr.src = fr.dataset.src + (fr.dataset.src.includes('?') ? '&' : '?') + 'v=' + Date.now();
  });

  // Show target
  if (page === 'home') {
    document.getElementById('page-home').style.display = 'flex';
  } else {
    document.getElementById(`page-${page}`).classList.add('active');
    // iframe 안에서 키보드(←/→ 등)가 바로 먹도록 포커스를 넘겨준다
    const fr = document.getElementById(`iframe-${page}`);
    if (fr) setTimeout(() => { try { fr.contentWindow.focus(); } catch (e) {} }, 50);
  }

  // Update nav
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === page);
  });
  revealNavGroup(page);
  pushRecent(page);

  // Close mobile LNB
  if (window.innerWidth <= 768) {
    document.getElementById('lnb').classList.remove('open');
    document.getElementById('lnbOverlay').classList.remove('show');
  }
}

// 첫 로드: ?game=키 가 있으면 그 게임으로
(function routeOnLoad() {
  const p = new URLSearchParams(location.search).get('game');
  if (p && document.getElementById('page-' + p)) navigate(p, true);
  history.replaceState({ page: p || 'home' }, '', p ? hubBase() + '?game=' + p : hubBase());
})();
addEventListener('popstate', e => {
  const page = (e.state && e.state.page) || new URLSearchParams(location.search).get('game') || 'home';
  if (document.getElementById('page-' + page) || page === 'home') navigate(page, true);
});

// ── 검색: 메뉴에서 이름·설명으로 바로 거르기 ──
(function navSearchInit() {
  const box = document.getElementById('navSearch');
  const none = document.getElementById('navNoResult');
  const apply = () => {
    const q = box.value.trim().toLowerCase();
    document.body.classList.toggle('searching', !!q);
    let hit = 0;
    document.querySelectorAll('.nav-item[data-find]').forEach(el => {
      const ok = !q || el.dataset.find.includes(q);
      el.classList.toggle('hide', !ok);
      if (ok) hit++;
    });
    // 결과가 없는 분류는 통째로 숨긴다
    document.querySelectorAll('.nav-group').forEach(g => {
      const any = [...g.querySelectorAll('.nav-item')].some(el => !el.classList.contains('hide'));
      g.style.display = (q && !any) ? 'none' : '';
    });
    none.hidden = !q || hit > 0;
  };
  box.addEventListener('input', apply);
  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
    if (e.key === 'Enter') {
      const first = [...document.querySelectorAll('.nav-item[data-find]')].find(el => !el.classList.contains('hide'));
      if (first) { navigate(first.dataset.page); box.value = ''; apply(); box.blur(); }
    }
  });
  // / 키로 검색창에 바로 포커스
  addEventListener('keydown', e => {
    if (e.key !== '/' || /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) return;
    e.preventDefault();
    if (innerWidth <= 768) document.getElementById('lnb').classList.add('open');
    else document.body.classList.remove('lnb-hidden');
    box.focus(); box.select();
  });
})();

// ── 최근 플레이 (많아질수록 찾기 쉬우라고) ──
const RECENT_MAX = 4;
function recentList() { try { return JSON.parse(localStorage.getItem('hub_recent') || '[]'); } catch (e) { return []; } }
function pushRecent(page) {
  if (page === 'home' || !GAMES.some(g => g.k === page)) return;
  const l = recentList().filter(k => k !== page);
  l.unshift(page);
  try { localStorage.setItem('hub_recent', JSON.stringify(l.slice(0, RECENT_MAX))); } catch (e) {}
  renderRecent();
}
function renderRecent() {
  const wrap = document.getElementById('recentWrap'), box = document.getElementById('recentCards');
  const l = recentList().filter(k => GAMES.some(g => g.k === k));
  wrap.hidden = l.length === 0;
  box.querySelectorAll('.landing-card').forEach(e => e.remove());
  l.forEach(k => cardOf(GAMES.find(g => g.k === k), box));
}
renderRecent();

function toggleLNB() {
  const lnb = document.getElementById('lnb');
  const overlay = document.getElementById('lnbOverlay');
  lnb.classList.toggle('open');
  overlay.classList.toggle('show');
}
</script>
