<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 킵 온 마이닝</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --k: 1; --mk: 1; --ink: #fff; --out: #14121c; --navy: #262b45; --navy2: #1b1f36; --navy3: #343a5c; --purple: #8a5ae0; --gold: #ffd23c; --green: #6fdc3a; --red: #ff5a4a; --dim: #b9bfd8; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); background: #1360c8; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; }
/* 글자 외곽선 (원작 TMP 외곽선 느낌) */
.ol { text-shadow: -2px -2px 0 var(--out), 2px -2px 0 var(--out), -2px 2px 0 var(--out), 2px 2px 0 var(--out), 0 3px 0 var(--out), 0 -2px 0 var(--out), -2px 0 0 var(--out), 2px 0 0 var(--out); }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
body.mining #cv { cursor: none; }
.hide { display: none !important; }

/* ── 채굴 HUD ── */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.hbox { position: absolute; background: var(--navy); border: calc(var(--k) * 5px) solid var(--out); border-radius: calc(var(--k) * 18px); box-shadow: inset 0 calc(var(--k) * -6px) 0 rgba(0,0,0,.25); }
#oreHud { left: calc(var(--k) * 28px); top: calc(var(--k) * 26px); padding: calc(var(--k) * 10px) calc(var(--k) * 16px); min-width: calc(var(--k) * 330px); }
#oreHud .gold { display: flex; align-items: center; gap: calc(var(--k) * 10px); font-size: calc(var(--k) * 54px); line-height: 1; }
#oreHud .gold img { width: calc(var(--k) * 66px); height: calc(var(--k) * 66px); }
#oreHud .grid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--k) * 4px) calc(var(--k) * 18px); margin-top: calc(var(--k) * 6px); }
#oreHud .grid:empty { display: none; }
#oreHud .og { display: flex; align-items: center; gap: calc(var(--k) * 6px); font-size: calc(var(--k) * 30px); line-height: 1; }
#oreHud .og img { width: calc(var(--k) * 38px); height: calc(var(--k) * 38px); }
.pop { animation: pop .16s ease; } @keyframes pop { 50% { transform: scale(1.3); } }
#timerHud { right: calc(var(--k) * 28px); top: calc(var(--k) * 26px); padding: calc(var(--k) * 6px) calc(var(--k) * 22px); display: flex; align-items: center; gap: calc(var(--k) * 12px); font-size: calc(var(--k) * 66px); line-height: 1.05; }
#timerHud img { width: calc(var(--k) * 64px); height: calc(var(--k) * 64px); }
#timerHud.red b { color: var(--red); }
#potHud { position: absolute; right: calc(var(--k) * 28px); top: calc(var(--k) * 128px); display: flex; gap: calc(var(--k) * 8px); pointer-events: auto; }
#potHud img { width: calc(var(--k) * 58px); height: calc(var(--k) * 58px); background: var(--navy); border: calc(var(--k) * 4px) solid var(--out); border-radius: calc(var(--k) * 12px); }
#lvHud { left: calc(var(--k) * 28px + 46px); bottom: calc(var(--k) * 24px); padding: calc(var(--k) * 8px) calc(var(--k) * 12px); display: flex; align-items: center; gap: calc(var(--k) * 12px); }
#lvHud .lv { width: calc(var(--k) * 70px); height: calc(var(--k) * 70px); border-radius: calc(var(--k) * 14px); background: var(--purple); border: calc(var(--k) * 4px) solid var(--out); display: grid; place-items: center; font-size: calc(var(--k) * 42px); }
.xpb { position: relative; width: calc(var(--k) * 330px); height: calc(var(--k) * 40px); background: var(--navy2); border: calc(var(--k) * 4px) solid var(--out); border-radius: 999px; overflow: hidden; }
.xpb i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #c47aff, #8a3ae0); }
.xpb span { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--k) * 24px); }
#flowerHud { position: absolute; left: calc(var(--k) * 130px); bottom: calc(var(--k) * 118px); font-size: calc(var(--k) * 30px); display: flex; align-items: center; gap: calc(var(--k) * 4px); }
#flowerHud img { width: calc(var(--k) * 44px); }
#lvPop { position: absolute; left: calc(var(--k) * 150px); bottom: calc(var(--k) * 120px); font-size: calc(var(--k) * 44px); color: #fff; animation: lvp 2.08s ease forwards; }
@keyframes lvp { 0% { transform: scale(.3); opacity: 0; } 12% { transform: scale(1.15); opacity: 1; } 22% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(calc(var(--k) * -30px)); } }
#endSess { position: absolute; right: calc(var(--k) * 28px); bottom: calc(var(--k) * 24px); pointer-events: auto; }
#bigText { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); font-size: calc(var(--k) * 120px); white-space: nowrap; pointer-events: none; }
#bigText.show { animation: bigIn .3s cubic-bezier(.2,1.6,.4,1) both; }
#bigText.out { animation: bigOut .25s ease-in both; }
@keyframes bigIn { from { transform: translate(-50%, -50%) scale(0); } to { transform: translate(-50%, -50%) scale(1); } }
@keyframes bigOut { to { transform: translate(-50%, -50%) scale(0); opacity: 0; } }
.bounce span { display: inline-block; animation: bnc .7s ease-in-out infinite; }
@keyframes bnc { 50% { transform: translateY(-14%); } }

/* ── 버튼 (원작: 주황/초록/빨강 + 검정 외곽 + 아래 그림자) ── */
.b { pointer-events: auto; cursor: pointer; border: calc(var(--mk) * 5px) solid var(--out); border-radius: calc(var(--mk) * 16px); padding: calc(var(--mk) * 10px) calc(var(--mk) * 26px); font-size: calc(var(--mk) * 34px); color: #fff; background: #f28a1c; box-shadow: inset 0 calc(var(--mk) * -7px) 0 rgba(0,0,0,.22), 0 calc(var(--mk) * 5px) 0 var(--out); touch-action: manipulation; transition: transform .06s; }
.b:active { transform: translateY(calc(var(--mk) * 4px)); box-shadow: inset 0 calc(var(--mk) * -4px) 0 rgba(0,0,0,.22), 0 calc(var(--mk) * 1px) 0 var(--out); }
.b.green { background: #4cc22a; } .b.red { background: #e6402c; } .b.grey { background: #7a8296; } .b.blue { background: #3a7ae0; } .b.purple { background: #9a5ae8; }
.b:disabled { filter: grayscale(.7) brightness(.75); cursor: default; }
#hud .b { --mk: var(--k); }

/* ── 시간 종료 정산 창 ── */
#timeUp { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(8,10,24,.45); }
#timeUp .frame { --mk: var(--rk); position: relative; width: calc(var(--rk) * 1180px); background: var(--navy); border: calc(var(--rk) * 7px) solid var(--out); border-radius: calc(var(--rk) * 30px); padding: calc(var(--rk) * 30px) calc(var(--rk) * 40px) calc(var(--rk) * 34px); box-shadow: inset 0 0 0 calc(var(--rk) * 6px) var(--navy3); animation: frIn .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes frIn { from { transform: scale(.6); opacity: 0; } }
#timeUp h2 { text-align: center; font-size: calc(var(--rk) * 70px); font-weight: normal; margin-bottom: calc(var(--rk) * 12px); }
#timeUp .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: calc(var(--rk) * 20px); }
#timeUp .col h3 { text-align: center; font-weight: normal; font-size: calc(var(--rk) * 38px); color: var(--gold); margin-bottom: calc(var(--rk) * 8px); }
#timeUp .row { display: flex; align-items: center; justify-content: center; gap: calc(var(--rk) * 10px); font-size: calc(var(--rk) * var(--rowF, 44px)); line-height: 1.15; }
#timeUp .row img { width: calc(var(--rk) * var(--rowI, 54px)); height: calc(var(--rk) * var(--rowI, 54px)); }
#timeUp .xprow { display: flex; justify-content: center; gap: calc(var(--rk) * 120px); margin-top: calc(var(--rk) * 18px); }
#timeUp .xprow > div { text-align: center; }
#timeUp .xprow h3 { font-weight: normal; font-size: calc(var(--rk) * 38px); color: var(--gold); }
#timeUp .xprow b { font-size: calc(var(--rk) * 54px); font-weight: normal; }
#timeUp .btns { display: flex; justify-content: center; gap: calc(var(--rk) * 60px); margin-top: calc(var(--rk) * 26px); }
#timeUp .btns .b { font-size: calc(var(--rk) * 44px); min-width: calc(var(--rk) * 380px); }
#timeUp .d100 { position: absolute; left: 50%; top: calc(var(--rk) * -70px); transform: translateX(-50%) rotate(-8deg); background: #e3221c; border: calc(var(--rk) * 6px) solid var(--out); border-radius: calc(var(--rk) * 20px); padding: calc(var(--rk) * 8px) calc(var(--rk) * 22px); font-size: calc(var(--rk) * 36px); text-align: center; white-space: pre; }
.popin { animation: popin .18s cubic-bezier(.2,1.8,.4,1) both; } @keyframes popin { from { transform: scale(0); } }

/* ── 메인 메뉴 ── */
#menu { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 45%, #2b3a78, #141a3c 72%); }
#menu .topbar { display: flex; align-items: center; justify-content: center; gap: calc(var(--mk) * 10px); padding: calc(var(--mk) * 14px) calc(var(--mk) * 12px) calc(var(--mk) * 6px); flex-wrap: wrap; position: relative; z-index: 3; }
.tab { cursor: pointer; border: calc(var(--mk) * 5px) solid var(--out); border-radius: calc(var(--mk) * 16px); padding: calc(var(--mk) * 8px) calc(var(--mk) * 24px); font-size: calc(var(--mk) * 34px); background: var(--navy3); color: #dfe4ff; box-shadow: inset 0 calc(var(--mk) * -6px) 0 rgba(0,0,0,.25); position: relative; touch-action: manipulation; }
.tab.on { background: #ffbe1c; color: #fff; }
.tab .dot { position: absolute; right: calc(var(--mk) * -8px); top: calc(var(--mk) * -8px); width: calc(var(--mk) * 22px); height: calc(var(--mk) * 22px); border-radius: 50%; background: var(--red); border: calc(var(--mk) * 4px) solid var(--out); display: none; }
.tab.alert .dot { display: block; animation: blink 1s infinite; } @keyframes blink { 50% { transform: scale(.7); } }
#menu .tools { position: absolute; right: calc(var(--mk) * 16px); top: calc(var(--mk) * 14px); display: flex; gap: calc(var(--mk) * 10px); }
.ib { width: calc(var(--mk) * 64px); height: calc(var(--mk) * 64px); border: calc(var(--mk) * 5px) solid var(--out); border-radius: calc(var(--mk) * 16px); background: var(--navy3); font-size: calc(var(--mk) * 32px); cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
#menu .body { flex: 1; min-height: 0; display: flex; position: relative; }
#side { position: relative; z-index: 2; padding: calc(var(--mk) * 12px) 0 calc(var(--mk) * 12px) calc(var(--mk) * 18px); display: flex; flex-direction: column; gap: calc(var(--mk) * 8px); pointer-events: none; }
.tot { display: flex; align-items: center; gap: calc(var(--mk) * 8px); background: var(--navy); border: calc(var(--mk) * 5px) solid var(--out); border-radius: calc(var(--mk) * 16px); padding: calc(var(--mk) * 4px) calc(var(--mk) * 16px) calc(var(--mk) * 4px) calc(var(--mk) * 6px); font-size: calc(var(--mk) * 34px); width: fit-content; position: relative; }
.tot img { width: calc(var(--mk) * 48px); height: calc(var(--mk) * 48px); }
.tot.big { font-size: calc(var(--mk) * 48px); } .tot.big img { width: calc(var(--mk) * 70px); height: calc(var(--mk) * 70px); }
.tot .pc { position: absolute; left: 100%; margin-left: calc(var(--mk) * 8px); font-size: calc(var(--mk) * 26px); color: var(--gold); white-space: nowrap; }
.tot.tp { background: #4a2a7a; }
#main { position: absolute; inset: 0; z-index: 1; }
.pane { position: absolute; inset: 0; display: none; }
.pane.on { display: block; }
#goBtn { position: absolute; right: calc(var(--mk) * 24px); bottom: calc(var(--mk) * 22px); z-index: 4; font-size: calc(var(--mk) * 40px); padding: calc(var(--mk) * 14px) calc(var(--mk) * 34px); animation: glow 1.4s ease-in-out infinite alternate; }
@keyframes glow { to { filter: brightness(1.15); } }
#endBtn { position: absolute; right: calc(var(--mk) * 24px); bottom: calc(var(--mk) * 128px); z-index: 4; font-size: calc(var(--mk) * 34px); }

/* 스킬 트리 */
#treeVP { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#treeIn { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#treeIn svg { position: absolute; overflow: visible; pointer-events: none; }
.nd { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border: 5px solid var(--out); border-radius: 18px; background: #3a4166; box-shadow: inset 0 -7px 0 rgba(0,0,0,.25); cursor: pointer; }
.nd img { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); pointer-events: none; }
.nd .c { position: absolute; right: -8px; top: -12px; font-size: 22px; background: var(--navy2); border: 3px solid var(--out); border-radius: 10px; padding: 0 6px; line-height: 1.2; }
.nd .p { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 3px; display: flex; align-items: center; gap: 2px; font-size: 22px; white-space: nowrap; }
.nd .p img { position: static; width: 26px; height: 26px; }
.nd.own { background: #4f63b8; }
.nd.max { background: #e8a81c; }
.nd.max .p { display: none; }
.nd.no .p span { color: #ff8a7a; }
.nd.can { animation: canb 1s ease-in-out infinite alternate; } @keyframes canb { to { box-shadow: inset 0 -7px 0 rgba(0,0,0,.25), 0 0 0 5px #7dff6a; } }
.nd.endless { background: #6a3aa8; }
#tip { position: fixed; z-index: 30; pointer-events: none; width: min(92vw, calc(var(--mk) * 560px)); background: var(--navy); border: calc(var(--mk) * 5px) solid var(--out); border-radius: calc(var(--mk) * 18px); padding: calc(var(--mk) * 14px) calc(var(--mk) * 18px); box-shadow: inset 0 0 0 calc(var(--mk) * 4px) var(--navy3), 0 10px 30px rgba(0,0,0,.4); }
#tip h4 { font-weight: normal; font-size: calc(var(--mk) * 38px); text-align: center; color: var(--gold); }
#tip p { font-size: calc(var(--mk) * 26px); text-align: center; white-space: pre-line; margin: calc(var(--mk) * 6px) 0; line-height: 1.3; }
#tip .pr { display: flex; align-items: center; justify-content: center; gap: calc(var(--mk) * 6px); font-size: calc(var(--mk) * 30px); }
#tip .pr img { width: calc(var(--mk) * 40px); }
#tip .cnt { text-align: center; color: var(--dim); font-size: calc(var(--mk) * 24px); }
#tip .act { display: flex; justify-content: center; gap: calc(var(--mk) * 12px); margin-top: calc(var(--mk) * 10px); }
#tip.touch { pointer-events: auto; left: 50% !important; top: auto !important; bottom: calc(var(--mk) * 20px); transform: translateX(-50%); }
#tip .b { font-size: calc(var(--mk) * 30px); padding: calc(var(--mk) * 6px) calc(var(--mk) * 22px); }

/* 특성 */
#pTal { display: none; flex-direction: column; align-items: center; padding-top: calc(var(--mk) * 10px); }
#pTal.on { display: flex; }
#pTal, #pAnv, #pArt, #pMine { overflow-y: auto; overflow-x: hidden; }
#pTal > *, #pAnv > *, #pArt > *, #pMine > * { flex-shrink: 0; }
.tlv { font-size: calc(var(--mk) * 48px); cursor: help; pointer-events: auto; }
.cards { display: flex; gap: calc(var(--mk) * 26px); margin-top: calc(var(--mk) * 16px); justify-content: center; flex-wrap: wrap; min-height: calc(var(--mk) * 420px); align-items: center; }
.card { width: calc(var(--mk) * 300px); min-height: calc(var(--mk) * 410px); background: linear-gradient(180deg, #4a3a8c, #2a2058); border: calc(var(--mk) * 6px) solid var(--out); border-radius: calc(var(--mk) * 22px); padding: calc(var(--mk) * 14px); display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; box-shadow: inset 0 0 0 calc(var(--mk) * 4px) #8a6ae8; transition: transform .12s; animation: cardIn .35s cubic-bezier(.2,1.4,.4,1) both; }
.card:nth-child(2) { animation-delay: .1s; } .card:nth-child(3) { animation-delay: .2s; }
@keyframes cardIn { from { transform: translateY(40px) rotateY(90deg); opacity: 0; } }
@media (hover: hover) { .card:hover { transform: translateY(calc(var(--mk) * -10px)) scale(1.04); } }
.card img { width: calc(var(--mk) * 150px); height: calc(var(--mk) * 150px); }
.card h4 { font-weight: normal; font-size: calc(var(--mk) * 36px); color: var(--gold); margin: calc(var(--mk) * 6px) 0; }
.card p { font-size: calc(var(--mk) * 23px); line-height: 1.3; color: #e8e4ff; }
.card.back { background: repeating-linear-gradient(45deg, #2a2058, #2a2058 14px, #33286a 14px, #33286a 28px); cursor: default; }
.card.back::after { content: '?'; font-size: calc(var(--mk) * 140px); margin: auto; color: #8a6ae8; }
.tals { display: flex; flex-wrap: wrap; gap: calc(var(--mk) * 10px); justify-content: center; max-width: calc(var(--mk) * 1100px); margin-top: calc(var(--mk) * 16px); }
.tsm { width: calc(var(--mk) * 92px); height: calc(var(--mk) * 92px); background: #4a3a8c; border: calc(var(--mk) * 5px) solid var(--out); border-radius: calc(var(--mk) * 14px); pointer-events: auto; cursor: help; }
.tsm img { width: 100%; height: 100%; }
.cleft { font-size: calc(var(--mk) * 28px); color: var(--dim); margin-top: calc(var(--mk) * 8px); }

/* 모루 */
#pAnv { display: none; flex-direction: column; align-items: center; padding-top: calc(var(--mk) * 6px); }
#pAnv.on { display: flex; }
.carousel { display: flex; align-items: center; gap: calc(var(--mk) * 18px); background: var(--anvbg) no-repeat center 85% / calc(var(--mk) * 420px) auto; padding-bottom: calc(var(--mk) * 40px); }
.carousel .pk { width: calc(var(--mk) * 150px); height: calc(var(--mk) * 150px); opacity: .55; }
.carousel .pk.mid { width: calc(var(--mk) * 260px); height: calc(var(--mk) * 260px); opacity: 1; }
.carousel .pk.dark { filter: brightness(0) opacity(.55); }
.pkname { font-size: calc(var(--mk) * 46px); }
.stats4 { display: grid; grid-template-columns: auto auto; gap: calc(var(--mk) * 2px) calc(var(--mk) * 22px); font-size: calc(var(--mk) * 28px); background: var(--navy); border: calc(var(--mk) * 5px) solid var(--out); border-radius: calc(var(--mk) * 16px); padding: calc(var(--mk) * 10px) calc(var(--mk) * 20px); }
.stats4 .up { color: var(--green); } .stats4 .dn { color: var(--red); }
.costs { display: flex; gap: calc(var(--mk) * 16px); margin: calc(var(--mk) * 10px) 0; font-size: calc(var(--mk) * 32px); }
.costs span { display: flex; align-items: center; gap: calc(var(--mk) * 4px); }
.costs img { width: calc(var(--mk) * 46px); }
.costs .no { color: var(--red); } .costs .ok { color: var(--green); }
.holdbtn { position: relative; overflow: hidden; }
.holdbtn i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.35); width: 0; }
.equip { position: absolute; right: calc(var(--mk) * 30px); top: 50%; transform: translateY(-50%); background: var(--navy); border: calc(var(--mk) * 5px) solid var(--out); border-radius: calc(var(--mk) * 18px); padding: calc(var(--mk) * 12px) calc(var(--mk) * 18px); text-align: center; font-size: calc(var(--mk) * 26px); }
.equip img { width: calc(var(--mk) * 120px); }
.equip h4 { font-weight: normal; color: var(--gold); font-size: calc(var(--mk) * 32px); }

/* 광산 */
#pMine { display: none; flex-direction: column; align-items: center; justify-content: center; }
#pMine.on { display: flex; }
.mineBar { width: calc(var(--mk) * 560px); height: calc(var(--mk) * 46px); background: var(--navy2); border: calc(var(--mk) * 5px) solid var(--out); border-radius: 999px; overflow: hidden; position: relative; }
.mineBar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #ffd23c, #e88a1c); }
.mineBtns { display: flex; gap: calc(var(--mk) * 30px); margin-top: calc(var(--mk) * 12px); flex-wrap: wrap; justify-content: center; }
.mineBtns .b { font-size: calc(var(--mk) * 26px); text-align: center; line-height: 1.25; min-width: calc(var(--mk) * 330px); }
.sign { position: absolute; right: 12%; top: 34%; background: #c98a4b; border: calc(var(--mk) * 6px) solid var(--out); border-radius: calc(var(--mk) * 12px); padding: calc(var(--mk) * 10px) calc(var(--mk) * 14px); font-size: calc(var(--mk) * 26px); max-width: calc(var(--mk) * 260px); text-align: center; color: #fff; box-shadow: 0 calc(var(--mk) * 5px) 0 var(--out); }
.mineFly { position: fixed; z-index: 40; pointer-events: none; transition: left .4s ease-in, top .4s ease-in, transform .4s; }

/* 유물 */
#pArt { display: none; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--mk) * 16px); }
#pArt.on { display: flex; }
.arow { display: flex; gap: calc(var(--mk) * 34px); justify-content: center; }

// 원작 FormatNumbers.FormatPoints 스타일 (1.25K 등)

  if (!isFinite(n)) return '∞'; n = Math.floor(n + 1e-9);
  if (n < 1000) return String(n);
  const U = ['K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  let i = -1, v = n; while (v >= 1000 && i < U.length - 1) { v /= 1000; i++; }
  return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/\.?0+$/, '') + U[i];
}
const f2 = v => (Math.round(v * 100) / 100).toFixed(2);

// ═══════════ 배속(테스트용): mine.speed(4), [ ] 키 ═══════════

  if (!b) { b = document.createElement('div'); b.id = 'spdBadge'; b.style.cssText = 'position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:9999;padding:3px 11px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font:15px sans-serif;pointer-events:none'; document.body.appendChild(b); }
  b.textContent = '⏩ ×' + SPD + '  ( [ ] 키 )'; b.style.display = SPD === 1 ? 'none' : '';
  return '⏩ 배속 ×' + SPD;
}
function stepSpeed(d) { const L = [1, 2, 4, 8, 16]; let i = L.indexOf(SPD); if (i < 0) i = 0; return setSpeed(L[clamp(i + d, 0, L.length - 1)]); }

  if (v === 2 && L > 5 && !tal('potionDrinker')) return false;
  if ((v === 5 || v === 7) && L > 7 && !mine) return false;
  if (v === 6 && L > 7 && !anv) return false;
  if (v === 12 && !(has('lightningBeamChancePH_1') || has('lightningBeamChanceS_1')) && L > 6) return false;
  if ((v === 14 || v === 16) && L > 7 && !af) return false;

}

}

  talent: ['레벨업과 탈렌트 카드!', '채굴한 바위마다 XP를 얻습니다.\n레벨업 시 1개의 탈렌트 포인트를 획득합니다.\n탈렌트 포인트로 카드를 열어 3장 중 1장을 선택할 수 있습니다.\n탈렌트 카드는 강력하고 영구적인 버프를 제공합니다. 선택하면 탈렌트 레벨이 오르고, 바위 내구도가 2 증가합니다. 탈렌트 레벨에 마우스를 올리면 현재 내구도를 볼 수 있습니다.'],
  anvil: ['모루!', '여기서 새로운 곡괭이를 제작할 수 있습니다!\n각 곡괭이는 제작에 필요한 특정 자원이 있습니다.\n새 곡괭이는 각기 다른 스탯을 가지고 있으며, 스킬 트리 업그레이드로 강화할 수 있습니다.'],
  mine: ['마인!', '마인을 구매하면 자동으로 바위를 채굴합니다.\n마인은 광석 대신 바를 채굴합니다.\n왼쪽의 바 총량 위에 있는 확률은 마인이 해당 자원을 채굴할 확률입니다.'],
  art: ['유물!', '여기서 발견한 모든 유물을 확인할 수 있습니다.\n유물은 바위에 붙어 있을 확률이 작게 있습니다.\n모든 유물은 영구적인 버프를 제공합니다.'],
};
function tutorial(k, then) {
  S.tut[k] = true; save();
  dlgClose.after = then || null;
  const body = typeof TUT[k][1] === 'function' ? TUT[k][1]() : TUT[k][1];
  dlg(`<h2>${TUT[k][0]}</h2><p>${body}</p><button class="b green ol" onclick="dlgClose()">OK</button>`);
}
$('statsBtn').onclick = () => {
  const s = S.stats, L = [['채굴 세션', 'miningSessions'], ['채굴한 시간', 'timeSpentMining'], ['총 생성된 바위', 'totalRocksSpawned'], ['총 채굴한 바위', 'totalRockMined'], ['생성된 곡괭이', 'pickaxesSpawned'], ['곡괭이 히트 수', 'pickaxeHits'], ['채굴한 광석', 'oresMined'], ['제작한 바', 'barsCrafted'], ['채굴한 바 (마인)', 'barsMinedTheMine'], ['획득한 XP', 'experienceGained', 100], ['총 레벨 업', 'totalLevelUps'], ['획득한 2배 XP', 'doubleXPGained'], ['획득한 2배 광석', 'doubleOreGained'], ['2배 곡괭이 파워 히트', 'doublePickaxePowerHits'], ['인스턴트 채굴 히트', 'instaMinePickaxeHits'], ['번개 발동', 'lightningStrikes'], ['다이너마이트 폭발', 'dynamiteExplosions'], ['생성된 플라즈마 볼', 'plazmaBallsSpawned'], ['마신 물약', 'potionsDrank'], ['연 일반 상자', 'chestsOpened'], ['연 황금 상자', 'goldenChestsOpened'], ['생성된 망치', 'hammersSpawned'], ['제우스 발동', 'zeusTriggers'], ['D100 1·10·100', 'd100Rolls']];
  for (let o = 0; o < 8; o++) L.push([ORE_NM[o] + ' 덩어리 바위', 'chunk' + o], ['완전 ' + ORE_NM[o] + ' 바위', 'full' + o]);
  dlg(`<h2>통계</h2><div class="stats">${L.map(([n, k, m]) => `<div>${n}: <b>${fmt((s[k] || 0) * (m || 1))}</b></div>`).join('')}</div><button class="b green ol" onclick="dlgClose()">닫기</button>`);
};
$('setBtn').onclick = () => {
  dlg(`<h2>설정</h2><p>소리는 왼쪽 아래 🔊 버튼에서 조절합니다.</p><button class="b red ol" id="rstBtn">게임 초기화</button><button class="b grey ol" onclick="dlgClose()">닫기</button>`);
  $('rstBtn').onclick = () => dlg(`<h2>정말로 게임을 초기화하시겠습니까?</h2><p>이것은 프레스티지 시스템이 아닙니다!\n예를 누르면 게임이 처음부터 초기화됩니다.</p><button class="b red ol" id="rstYes">예</button><button class="b grey ol" onclick="dlgClose()">아니오</button>`) || ($('rstYes').onclick = () => { localStorage.removeItem(SAVE_KEY); location.reload(); });
};

// ═══════════ 입력 ═══════════
function aim(e) {
  cursor.touch = e.pointerType === 'touch'; cursor.on = true;
  const p = s2w(e.clientX, e.clientY - (cursor.touch ? 70 : 0)); cursor.x = p[0]; cursor.y = p[1];
}
cv.addEventListener('pointermove', aim); cv.addEventListener('pointerdown', e => { aim(e); Sound.init(); });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') cursor.on = false; });
$('endSess').onclick = endSessionNow;
$('playBtn').onclick = () => {
  Sound.init(); Sound.play('click');
  $('start').classList.add('hide');
  if (S.firstPlay || !S.stats.miningSessions) startSession(); else toMenu('tree');
};
document.addEventListener('visibilitychange', () => { lastT = performance.now(); });

// ═══════════ 루프 ═══════════
let lastT = performance.now(), menuRefreshT = 0, PAUSED = false;
function frame() {
  const t = performance.now(); let dt = Math.min(.25, (t - lastT) / 1000) * SPD; lastT = t;
  if (PAUSED) dt = 0;
  while (dt > 0) { const d = Math.min(dt, 1 / 60); step(d); dt -= d; }
  draw();
  if (mode === 'menu' && (menuRefreshT += 1) % 20 === 0) { if (curTab === 'mine') renderMine(true); }
  requestAnimationFrame(frame);
}
resize(); hudXP();
requestAnimationFrame(frame);
setInterval(() => { if (mode === 'menu') save(); }, 5000);

// ═══════════ 디버그·봇 훅 ═══════════
window.mine = {
  speed: setSpeed, get S() { return S; }, get R() { return R; }, get P() { return P; }, get mode() { return mode; }, NODES, PICKS, TAL, ARTI,
  step(sec) { let s = sec; while (s > 0) { const d = Math.min(s, 1 / 60); step(d); s -= d; } return R.time; },
  aim(x, y) { cursor.x = x; cursor.y = y; cursor.on = true; },
  pause(v) { PAUSED = v !== false; return PAUSED; },
  start: startSession, endNow: endSessionNow, toMenu, buy: f => buyNode(NODE[f]), setTab, save,
  cheat(n) { for (let o = 0; o < 8; o++) S.bars[o] += n || 1e6; S.tp += 10; refreshSide(); },
  chooseTalent, dealCards, craftOres, calcPick, mineChances, revealed, treePrice, canCraft,
  craftNow(i) { if (S.crafted[i] || !PICKS[i].cost || !canCraft(i)) return false; for (const [o, n] of craftCost(i)) S.bars[o] -= n; S.crafted[i] = true; return true; },
  equip(i) { if (S.crafted[i]) { S.equipped = i; refreshPick(); } },
  resetSave() { S = fresh(); mineCur = null; refreshPick(); return S; },
  revealTal() { if (S.choosing || S.tp < S.newTalentsPrice || S.cardsLeft <= 0) return false; S.tp -= S.newTalentsPrice; S.newTalentsPrice++; S.choosing = dealCards(); return true; },
  mineUnlock() { const M = S.mine; if (M.unlocked || S.bars[0] < M.price) return false; S.bars[0] -= M.price; M.unlocked = true; return true; },
  mineUp(kind) { const M = S.mine; if (kind === 'time') { if (S.bars[0] < M.timePrice) return false; S.bars[0] -= M.timePrice; M.timePrice *= 1.42; M.time -= M.time / 18; } else { if (S.bars[0] < M.matPrice) return false; M.bars += M.barsInc; S.bars[0] -= M.matPrice; M.matPrice *= 1.9; M.barsInc = 2; } return true; },
  // 봇: 화면 연출 없이 한 판을 동기 실행. speed = 커서 최대 이동속도(월드/초)
  simSession(opt) {
    opt = opt || {}; const V = opt.speed || 1600, dt = 1 / 30;
    SIM = { result: null }; mode = 'mine'; EV = EV.filter(e => e.tag === 'g'); clearBoard(); prepSession(); tileWave();
    let t = 0, retarget = 0, tx = 0, ty = 0; cursor.on = true; cursor.x = 0; cursor.y = 0;
    while (!SIM.result && t < 900) {
      if ((retarget -= dt) <= 0) {
        retarget = .25; const L = R.rocks.filter(r => r.alive && r.typed), hr = handShape().r + 26;
        let best = null, bs = -1;
        for (const a of L) { let c = 0; for (const b of L) if (Math.abs(a.x - b.x) < hr && Math.abs(a.y - b.y) < hr && Math.hypot(a.x - b.x, a.y - b.y) < hr) c++; const sc = c - Math.hypot(a.x - cursor.x, a.y - cursor.y) / 600; if (sc > bs) { bs = sc; best = a; } }
        if (best) { tx = best.x; ty = best.y; }
      }
      const dx = tx - cursor.x, dy = ty - cursor.y, d = Math.hypot(dx, dy), m = V * dt;
      if (d > m) { cursor.x += dx / d * m; cursor.y += dy / d * m; } else { cursor.x = tx; cursor.y = ty; }
      step(dt); t += dt;
    }
    const res = SIM.result; SIM = null; mode = 'menu'; clearBoard(); potionPick = 0; R.potionWorth = 0; refreshPick();
    return { secs: t, ore: R.ore.slice(), res };
  },
};
</script>
