<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>참스코드 킵 온 마이닝</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --bg: #17101f; --bg2: #241733; --panel: #2a1c3c; --line: #46325e; --ink: #f2e9ff; --dim: #b4a0c8; --gold: #ffd36b; --green: #7ce3a0; --pink: #ff8fc7; --cyan: #7fd8ff; --purple: #b58cff; --amber: #ffb35e; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: 'Jua', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; }
button { font-family: inherit; }
.toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-24px); z-index: 90; background: var(--panel); border: 2px solid var(--gold); color: var(--ink); padding: 9px 18px; border-radius: 10px; font-size: 15px; opacity: 0; transition: all .25s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
/* 상단 */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 10px; background: linear-gradient(180deg, #20142e, rgba(32,20,46,0)); z-index: 6; }
.tl { display: flex; flex-direction: column; gap: 6px; }
.lvbox { display: flex; align-items: center; gap: 7px; }
.lv { width: 34px; height: 34px; border-radius: 9px; background: var(--purple); color: #22103a; display: grid; place-items: center; font-size: 15px; }
.xpbar { width: 128px; height: 15px; background: #1a1026; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; position: relative; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--purple), var(--pink)); }
.xpbar span { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 11px; color: var(--dim); }
.bars { display: flex; gap: 5px; flex-wrap: wrap; max-width: 62vw; }
.bar { background: rgba(42,28,60,.92); border: 2px solid var(--line); border-radius: 9px; padding: 3px 9px; font-size: 13px; color: var(--dim); white-space: nowrap; }
.bar b { font-size: 19px; color: var(--ink); margin-left: 2px; }
.bar.pop { animation: pop .3s ease; }
@keyframes pop { 45% { transform: scale(1.14); } }
.menu { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.mb { width: 52px; height: 48px; border: 2px solid var(--line); border-radius: 11px; background: rgba(42,28,60,.92); color: var(--ink); cursor: pointer; position: relative; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1; }
.mb i { font-style: normal; font-size: 19px; } .mb em { font-style: normal; font-size: 9.5px; color: var(--dim); margin-top: 2px; }
.mb.on em { color: var(--gold); }
.mb.on { border-color: var(--gold); background: #3a2750; }
.mb .dot { position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--pink); display: none; }
.mb.alert .dot { display: block; animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .25; } }
/* 채굴장 */
.dig { position: relative; flex: 1; min-height: 0; overflow: hidden; display: none; }
.dig.on { display: block; position: absolute; inset: 0; }   /* 채굴 중엔 캔버스가 상단 HUD 뒤까지 전체 화면 — 월드(1280×720/720×1280)는 JS 에서 contain 배치 */
.top { position: relative; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.depth { position: absolute; left: 58px; bottom: 12px; z-index: 3; background: rgba(42,28,60,.9); border: 2px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 13px; color: var(--dim); }
.depth b { color: var(--amber); font-size: 17px; }
.depth, .smelt, .timer { pointer-events: none; }   /* 정보 상자는 커서를 막지 않음 */
.timer { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--topH, 0px) + 8px); z-index: 4; background: rgba(42,28,60,.92); border: 2px solid var(--gold); border-radius: 10px; padding: 3px 16px; font-size: 12px; color: var(--dim); text-align: center; display: none; }
.timer.show { display: block; }
.timer b { display: block; font-size: 26px; color: var(--gold); line-height: 1.1; }
.timer.low { border-color: var(--pink); } .timer.low b { color: var(--pink); }
.digbtn { position: fixed; right: 10px; bottom: 11px; z-index: 12; border: 3px solid var(--gold); border-radius: 13px; background: linear-gradient(180deg, #4a3566, #2a1c3c); color: var(--ink); font-size: 19px; padding: 12px 24px; cursor: pointer; animation: gl 1.4s ease-in-out infinite alternate; }
@keyframes gl { from { box-shadow: 0 0 0 0 rgba(255,211,107,.6); } to { box-shadow: 0 0 0 14px rgba(255,211,107,0); } }
.digbtn:active { transform: translateY(3px); animation: none; }
.digbtn.hide { display: none; }
.backbtn { position: fixed; right: 10px; bottom: 11px; z-index: 12; border: 2px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font-size: 14px; padding: 10px 16px; cursor: pointer; display: none; }
.backbtn.on { display: block; }
.smelt { position: absolute; right: 108px; bottom: 12px; z-index: 3; background: rgba(42,28,60,.9); border: 2px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 12px; color: var(--dim); min-width: 132px; }
.smelt .q { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.smelt .q span { font-size: 11px; }
/* 하단 패널 */
.panel { flex: 1; min-height: 0; background: rgba(36,23,51,.96); overflow: auto; padding: 10px 10px 70px; position: relative; }
.panel.off { display: none; }
h3 { font-size: 14px; color: var(--gold); margin: 3px 0 8px; display: flex; gap: 6px; align-items: center; }
h3 small { margin-left: auto; font-weight: normal; font-size: 11.5px; color: var(--dim); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; }
.cd { background: var(--panel); border: 2px solid var(--line); border-radius: 11px; padding: 9px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; position: relative; }
.cd .ic { font-size: 24px; } .cd .nm { font-size: 14.5px; } .cd .ds { font-size: 12px; color: var(--dim); flex: 1; } .cd .cost { font-size: 12.5px; color: var(--dim); }
.cd.ok { border-color: var(--green); } .cd.ok .cost { color: var(--green); }
.cd.ok::after { content: '👆👆'; position: absolute; right: 6px; bottom: 5px; font-size: 10px; }
.cd.max { border-color: var(--purple); } .cd.lock { opacity: .48; }
.shake { animation: shk .3s; } @keyframes shk { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
/* 스킬 트리 */
.treewrap { position: relative; overflow: auto; height: 100%; margin: -10px -10px -70px; background: radial-gradient(ellipse at 50% 50%, #33204a, #17101f 75%); }
.tree { position: relative; }
.tree svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.tn { position: absolute; width: 50px; height: 50px; border-radius: 11px; background: #2f2044; border: 2px solid var(--line); display: grid; place-items: center; font-size: 21px; cursor: pointer; }
.tn.key { width: 58px; height: 58px; font-size: 25px; }
.tn.own { background: #2c5a3c; border-color: var(--green); }
.tn.avail { border-color: var(--gold); }
.tn.ok { animation: pulse 1s ease-in-out infinite alternate; } @keyframes pulse { to { transform: scale(1.07); } }
.tn .pr { position: absolute; left: 50%; transform: translateX(-50%); bottom: -15px; font-size: 10px; background: rgba(0,0,0,.65); border-radius: 5px; padding: 1px 5px; white-space: nowrap; color: var(--gold); }
.tn.own .pr { display: none; } .tn.sel { outline: 2px solid #fff; }
.sheet { position: fixed; left: 56px; right: 176px; bottom: 11px; background: var(--panel); border: 2px solid var(--gold); border-radius: 11px; padding: 8px 11px; display: none; align-items: center; gap: 9px; z-index: 8; }
.sheet.show { display: flex; }
.sheet .ic { font-size: 25px; } .sheet .t { flex: 1; min-width: 0; } .sheet .nm { font-size: 15px; } .sheet .ds { font-size: 12px; color: var(--dim); }
.sheet .pz { text-align: right; font-size: 13px; color: var(--gold); white-space: nowrap; } .sheet .pz.no { color: var(--pink); } .sheet .pz small { display: block; font-size: 10.5px; color: var(--dim); }
.btn { border: 2px solid var(--line); border-radius: 10px; padding: 8px 15px; font-size: 14px; cursor: pointer; background: var(--panel); color: var(--ink); }
.btn.go { border-color: var(--green); color: var(--green); } .btn.hot { border-color: var(--gold); color: var(--gold); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; align-items: center; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 11px; padding: 11px; margin-bottom: 9px; font-size: 13.5px; line-height: 1.55; }
.stat { display: flex; justify-content: space-between; font-size: 13.5px; padding: 3px 0; border-bottom: 1px dashed var(--line); } .stat:last-child { border-bottom: none; }
.step { display: flex; gap: 9px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 9px; margin-bottom: 7px; }
.step .no { flex: none; width: 23px; height: 23px; border-radius: 50%; background: var(--gold); color: #3a2400; display: grid; place-items: center; font-size: 12px; }
.step p { font-size: 13px; line-height: 1.5; }
/* 카드 선택 모달 */
.modal { position: fixed; inset: 0; background: rgba(10,5,18,.88); display: none; align-items: center; justify-content: center; z-index: 95; padding: 12px; }
.modal.show { display: flex; }
.modal .box { background: var(--panel); border: 2px solid var(--gold); border-radius: 16px; padding: 16px; max-width: 620px; width: 100%; text-align: center; max-height: 92vh; max-height: 92dvh; overflow: auto; }
.modal h2 { font-size: 20px; color: var(--gold); margin-bottom: 6px; }
.modal p { font-size: 13.5px; color: var(--dim); line-height: 1.55; }
.talents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 12px 0; }
@media (max-width: 520px) { .talents { grid-template-columns: 1fr; } }
.tc { background: #32214a; border: 3px solid var(--line); border-radius: 13px; padding: 13px 9px; cursor: pointer; transition: transform .12s; }
@media (hover: hover) { .tc:hover { transform: translateY(-4px); border-color: var(--gold); } }
.tc .ic { font-size: 34px; } .tc .nm { font-size: 16px; margin: 5px 0; } .tc .ds { font-size: 12.5px; color: var(--dim); }
.tc .rar { font-size: 11px; margin-top: 5px; }
.tc.r1 { border-color: #6b7fa8; } .tc.r2 { border-color: var(--cyan); } .tc.r3 { border-color: var(--purple); box-shadow: 0 0 16px rgba(181,140,255,.35); }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 9px 0; }
.res div { background: #1f1430; border-radius: 8px; padding: 7px; font-size: 12.5px; color: var(--dim); } .res b { display: block; font-size: 18px; color: var(--ink); }
@media (max-width: 620px) {
  .top { flex-direction: column; align-items: stretch; }
  .menu { justify-content: space-between; flex-wrap: nowrap; }
  .bars { max-width: none; }
  .panel { height: 50%; }
  .smelt { right: 10px; bottom: 64px; min-width: 0; }   /* 폰: 깊이 상자와 겹침 → 귀환 버튼 위로 */
  .sheet { left: 8px; right: 8px; bottom: 80px; }       /* 폰: 채굴 시작 버튼 위로 */
}
/* 낮은 화면(가로 폰): 상단 HUD 압축 — 터치 대상 40px 이상 유지 */
@media (max-height: 500px) {
  .top { padding: 5px 10px; } .tl { gap: 4px; }
  .lv { width: 30px; height: 30px; }
  .mb { width: 48px; height: 42px; }
  .bar { padding: 2px 8px; } .bar b { font-size: 16px; }
}
/* 터치: 두 번 탭 확대 방지, 작은 버튼 40px */
.mb, .btn, .cd, .tn, .tc, .digbtn, .backbtn { touch-action: manipulation; }
@media (pointer: coarse) { #btnTalent { min-height: 40px; } #sndBtn { width: 40px !important; height: 40px !important; } }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="app">
  <div class="top">
    <div class="tl">
      <div class="lvbox"><div class="lv" id="lv">1</div><div class="xpbar"><i id="xpFill"></i><span id="xpTxt"></span></div>
        <button class="btn hot" id="btnTalent" style="display:none;padding:5px 10px;font-size:12px">🃏 특성 카드 <b id="tp">0</b></button></div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="menu">
      <button class="mb on" data-tab="tree"><i>🌳</i><em>스킬</em><span class="dot"></span></button>
      <button class="mb" data-tab="pick"><i>⛏️</i><em>곡괭이</em><span class="dot"></span></button>
      <button class="mb" data-tab="talent"><i>🃏</i><em>특성</em><span class="dot"></span></button>
      <button class="mb" data-tab="relic"><i>🏺</i><em>유물</em><span class="dot"></span></button>
      <button class="mb" data-tab="mine"><i>🏚️</i><em>광산</em><span class="dot"></span></button>
      <button class="mb" data-tab="cfg"><i>⚙️</i><em>기록</em><span class="dot"></span></button>
    </div>
  </div>
  <div class="dig" id="digView">
    <canvas id="cv"></canvas>
    <div class="depth">깊이 <b id="depth">1</b>m<span id="depthNext" style="font-size:11px"></span></div>
    <div class="timer" id="timerBox"><b id="timer">20.0</b><span>초</span></div>
    <div class="smelt" id="smeltBox"></div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="sheet" id="sheet"></div>
  <button class="digbtn" id="btnDig">⛏️ 채굴 시작</button>
  <button class="backbtn" id="btnBack">⏹ 귀환</button>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script src="party-sound.js"></script>
<script>
'use strict';
Sound.theme('mystery'); Sound.scene('game');
const $ = id => document.getElementById(id);
const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구'];
// 디버그: 콘솔에서 mine.speed(4) — 게임 시간만 배속 (테스트용)
let __spd = 1, __spReal = performance.now(), __spGame = __spReal;
const __now = () => { const t = performance.now(); return __spGame + (t - __spReal) * __spd; };
function setSpeed(n) {
  __spGame = __now(); __spReal = performance.now(); __spd = Math.max(.25, Math.min(30, +n || 1));
  let b = document.getElementById('spdBadge');
  if (!b) { b = document.createElement('div'); b.id = 'spdBadge'; b.style.cssText = 'position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9999;padding:3px 11px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font:15px sans-serif;pointer-events:none'; document.body.appendChild(b); }
  b.textContent = '⏩ ×' + __spd + '  ( [ ] 키 )'; b.style.display = __spd === 1 ? 'none' : '';
  return '⏩ 배속 ×' + __spd;
}
// [ ] 키로 1→2→4→8→16 배속 (새로고침하면 1배로 돌아옴)
function stepSpeed(dir) { const L = [1, 2, 4, 8, 16]; let i = L.indexOf(__spd); if (i < 0) i = 0; return setSpeed(L[Math.max(0, Math.min(L.length - 1, i + dir))]); }
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test((e.target && e.target.tagName) || '')) return;
  if (e.code === 'BracketRight') stepSpeed(1); else if (e.code === 'BracketLeft') stepSpeed(-1);
});
window.__gameSpeed = { set: setSpeed, step: stepSpeed, get: () => __spd };
function fmt(n) {
  if (!isFinite(n)) return '∞'; if (n < 0) return '-' + fmt(-n);
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString();
  const u = Math.floor(Math.log10(n) / 4); if (u >= UNITS.length) return n.toExponential(2).replace('+', '');
  const p = Math.pow(10, u * 4), head = Math.floor(n / p), rest = Math.floor((n % p) / Math.pow(10, (u - 1) * 4));
  if (head >= 1000 || rest === 0) return head.toLocaleString() + UNITS[u];
  return head + UNITS[u] + ' ' + rest.toLocaleString() + (u >= 2 ? UNITS[u - 1] : '');
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2300); }
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ═══════════ 데이터 ═══════════
// 광석 → 제련 → 주괴
const MATS = [
  { id: 'stone', n: '돌', c: '#8c8598', v: 1, d: 1, smelt: 1.2 },
  { id: 'copper', n: '구리', c: '#e08a4a', v: 5, d: 3, smelt: 1.6 },
  { id: 'iron', n: '철', c: '#b8c2d8', v: 26, d: 7, smelt: 2.2 },
  { id: 'silver', n: '은', c: '#e8eef8', v: 140, d: 12, smelt: 3 },
  { id: 'gold', n: '금', c: '#ffd36b', v: 800, d: 18, smelt: 4 },
  { id: 'mith', n: '미스릴', c: '#7fd8ff', v: 4800, d: 26, smelt: 5.5 },
  { id: 'obsid', n: '흑요석', c: '#b58cff', v: 30000, d: 36, smelt: 7 },
  { id: 'star', n: '별철', c: '#ff8fc7', v: 200000, d: 48, smelt: 9 },
];
const matById = Object.fromEntries(MATS.map(m => [m.id, m]));
// 곡괭이 (재료로 제작)
const PICKS = [
  { id: 'wood', n: '나무 곡괭이', ic: '🪵', dmg: 1.6, spd: 1, area: 1, cost: null },
  { id: 'stone', n: '돌 곡괭이', ic: '🪨', dmg: 2.2, spd: 1.1, area: 1.05, cost: { stone: 30 } },
  { id: 'copper', n: '구리 곡괭이', ic: '🟠', dmg: 5, spd: 1.2, area: 1.1, cost: { stone: 120, copper: 40 } },
  { id: 'iron', n: '철 곡괭이', ic: '⚙️', dmg: 13, spd: 1.35, area: 1.15, cost: { copper: 200, iron: 60 } },
  { id: 'silver', n: '은 곡괭이', ic: '🥈', dmg: 38, spd: 1.5, area: 1.22, cost: { iron: 300, silver: 80 } },
  { id: 'gold', n: '금 곡괭이', ic: '🥇', dmg: 120, spd: 1.7, area: 1.3, cost: { silver: 400, gold: 100 } },
  { id: 'mith', n: '미스릴 곡괭이', ic: '💠', dmg: 420, spd: 1.95, area: 1.4, cost: { gold: 500, mith: 120 } },
  { id: 'obsid', n: '흑요석 곡괭이', ic: '🔮', dmg: 1600, spd: 2.25, area: 1.5, cost: { mith: 700, obsid: 150 } },
  { id: 'star', n: '별철 곡괭이', ic: '⭐', dmg: 7000, spd: 2.6, area: 1.65, cost: { obsid: 900, star: 200 } },
];
// 특성 카드 (레벨업마다 3장 중 1택) — 고를수록 바위 HP 증가
const CARDS = [
  { id: 'dmg', n: '단단한 손아귀', ic: '💪', ds: '곡괭이 피해 +18%', r: 1, k: 'dmg', v: .18 },
  { id: 'spd', n: '빠른 손놀림', ic: '⚡', ds: '채굴 속도 +14%', r: 1, k: 'spd', v: .14 },
  { id: 'area', n: '넓은 시야', ic: '🔦', ds: '채굴 영역 +10%', r: 1, k: 'area', v: .1 },
  { id: 'qty', n: '알뜰한 채굴', ic: '⛏️', ds: '광석 수량 +20%', r: 1, k: 'qty', v: .2 },
  { id: 'smelt', n: '풀무질', ic: '🔥', ds: '제련 속도 +25%', r: 1, k: 'smelt', v: .25 },
  { id: 'crit', n: '급소 타격', ic: '🎯', ds: '치명타 확률 +6% (피해 3배)', r: 2, k: 'crit', v: .06 },

      <h3>⛏️ 현재 능력</h3><div class="card">${[['곡괭이 피해', fmt(Math.round(dmg()))], ['초당 타격', (spd() * 2.4 * picksPer()).toFixed(1) + '회'], ['채굴 영역', Math.round(areaR()) + 'px'], ['바위당 곡괭이', picksPer() + '자루'], ['채굴 시간', digTime() + '초'], ['치명타', Math.round(E.crit * 100) + '%'], ['광석 수량', '+' + Math.round(E.qty * 100) + '%'], ['제련 속도', '×' + smeltSpeed().toFixed(2)], ['바위 체력', fmt(Math.round(rockHp()))]].map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
      <h3>💾 저장</h3><div class="card">자동 저장됩니다.<div class="row"><button class="btn" id="btnExport">📤 내보내기</button><button class="btn" id="btnImport">📥 가져오기</button><button class="btn" id="btnReset" style="margin-left:auto;color:var(--pink)">🗑 초기화</button></div></div>
      <h3>❓ 어떻게 하나요?</h3>
      <div class="step"><div class="no">1</div><p><b>⛏️ 채굴 시작</b>을 누르면 제한 시간이 돌아갑니다. 그 동안 <b>커서(손가락)를 바위 위에 올려두면</b> 자동으로 캐져요. 노란 원이 <b>채굴 영역</b>이고, 영역 안 바위마다 <b>⛏️ 곡괭이가 소환</b>돼서 대신 때립니다.</p></div>
      <div class="step"><div class="no">+</div><p>시간이 끝나면 결과 정산 → 업그레이드 → 다시 내려가기. <b>채굴 시간</b>은 스킬·카드·유물로 늘려요.</p></div>
      <div class="step"><div class="no">2</div><p>바위를 깨면 <b>광석</b>이 나오고 자동으로 <b>🔥 제련소</b>로 들어가 <b>주괴</b>가 됩니다. 주괴가 이 게임의 돈이에요.</p></div>
      <div class="step"><div class="no">3</div><p>주괴로 <b>🌳 스킬 트리</b>를 해금. 갈래마다 <b>필요한 주괴 종류가 달라요</b> (돌·구리·철·은·금·미스릴). 안 가본 곳은 보이지 않아요.</p></div>
      <div class="step"><div class="no">4</div><p><b>⛏️ 곡괭이 제작</b> — 재료를 모아 더 좋은 곡괭이로 갈아타면 피해·속도·영역이 확 올라요.</p></div>
      <div class="step"><div class="no">5</div><p>레벨업하면 <b>🃏 특성 카드</b> 3장 중 1장을 고릅니다. 고를수록 강해지지만 <b>바위 체력도 11%씩</b> 올라요 — 그게 이 게임의 저울입니다.</p></div>
      <div class="step"><div class="no">6</div><p>바위를 계속 깨면 <b>깊이</b>가 내려가고 더 좋은 광석이 나와요. 아주 가끔 <b>🏺 유물</b>도 나옵니다. <b>🏚️ 광산</b>을 해금하면 꺼놔도 알아서 캐요.</p></div>`;
    $('btnExport').onclick = () => { save(); const x = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(x).then(() => toast('저장 코드를 복사했어요')).catch(() => prompt('복사해 주세요', x)); };
    $('btnImport').onclick = () => { const x = prompt('저장 코드를 붙여넣어 주세요'); if (!x) return; try { const v = JSON.parse(decodeURIComponent(escape(atob(x.trim())))); if (!v || typeof v.lv !== 'number') throw 0; S = Object.assign(fresh(), v); save(); location.reload(); } catch (e) { toast('코드가 올바르지 않아요'); } };
    $('btnReset').onclick = () => { if (confirm('정말 처음부터?') && confirm('진짜로요?')) { localStorage.removeItem(SAVE_KEY); S = fresh(); location.reload(); } };
  }
}
function selNode(id) {
  sel = id; const n = TREE_BY[id];
  document.querySelectorAll('.tn').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  showSheet(n.ic, n.n, n.t === 'mine' ? '광산 해금 — 꺼놔도 자동으로 캐고 주괴까지 만들어요' : n.t === 'root' ? '모든 스킬의 시작' : n.n, own(id) ? null : n.cost, own(id) ? '<span style="color:var(--green)">✅ 해금</span>' : '');
}
function buyNode(id) {
  const n = TREE_BY[id]; if (own(id) || !canPay(n.cost)) return Sound.play('error');
  payCost(n.cost); S.tree[id] = 1; if (n.t === 'mine') { S.mineOn = 1; toast('🏚️ 광산 해금! 이제 꺼놔도 캡니다'); }
  refresh(); Sound.play('correct');
  const wrap = $('treewrap'), sl = wrap ? wrap.scrollLeft : 0, st = wrap ? wrap.scrollTop : 0;
  renderPanel(); if ($('treewrap')) { $('treewrap').scrollLeft = sl; $('treewrap').scrollTop = st; }
  selNode(id); save();
}
// 특성 카드 3장 중 1택
function offerCards() {
  if (S.tp < 1) return;
  const roll = () => { const r = Math.random(); const want = r < .55 ? 1 : r < .87 ? 2 : 3; const pool = CARDS.filter(c => c.r === want); return pick(pool.length ? pool : CARDS); };
  const three = []; while (three.length < 3) { const c = roll(); if (!three.some(x => x.id === c.id)) three.push(c); }
  showModal(`<h2>🃏 특성 카드</h2><p>한 장을 고르세요 — 고르면 <b style="color:var(--pink)">바위 체력 +11%</b></p>
    <div class="talents">${three.map((c, i) => `<div class="tc r${c.r}" data-i="${i}"><div class="ic">${c.ic}</div><div class="nm">${c.n}</div><div class="ds">${c.ds}</div><div class="rar" style="color:${c.r === 3 ? 'var(--purple)' : c.r === 2 ? 'var(--cyan)' : 'var(--dim)'}">${'★'.repeat(c.r)}</div></div>`).join('')}</div>
    <p style="font-size:12px">남은 포인트 ${S.tp - 1}</p>`);
  document.querySelectorAll('.tc').forEach(el => el.onclick = () => {
    const c = three[+el.dataset.i];
    S.talents[c.id] = (S.talents[c.id] || 0) + 1; S.talentLv++; S.tp--;
    refresh(); Sound.play('meld'); hideModal(); toast(`🃏 ${c.n} 획득!`);
    if (S.tp > 0) setTimeout(offerCards, 350); else { renderPanel(); save(); }
  });
}
function showModal(h) { $('modalBox').innerHTML = h; $('modal').classList.add('show'); }
function hideModal() { $('modal').classList.remove('show'); }

// ═══════════ 오프라인(광산) ═══════════
function offline() {
  if (!S.mineOn) return;
  const gap = Math.min(Date.now() - (S.last || Date.now()), 8 * 3600e3);
  if (gap < 60000) return;
  const n = mineRate() * gap / 1000 * .6;
  if (n < 1) return;
  const got = {};
  for (let i = 0; i < Math.min(4000, n); i++) { const m = matForDepth(); got[m.id] = (got[m.id] || 0) + oreQty() * barYield() * .55; }
  const scale = n > 4000 ? n / 4000 : 1;
  for (const k in got) { got[k] *= scale; S.bars[k] = (S.bars[k] || 0) + got[k]; }
  showModal(`<h2>🏚️ 광산 보고서</h2><p>${Math.floor(gap / 3600e3)}시간 ${Math.floor(gap % 3600e3 / 60000)}분 동안 일꾼들이 캤어요</p>
    <div class="res">${Object.entries(got).map(([k, v]) => `<div>${matById[k].n}<b style="color:${matById[k].c}">+${fmt(v)}</b></div>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn go" onclick="hideModal()">받기</button></div>`);
}

// ═══════════ 시작 ═══════════
load(); refresh(); resize(); offline(); setTab(S.tab || 'tree'); fillRocks();
$('btnDig').onclick = () => startDig();
$('btnBack').onclick = () => endDig();
requestAnimationFrame(loop);
setInterval(() => { save(); }, 5000);
addEventListener('beforeunload', save); addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.mine = { speed: setSpeed, get S() { return S; }, get rocks() { return rocks; }, get RUN() { return RUN; }, TREE, MATS, PICKS, CARDS, eff, offerCards, save, startDig, endDig, buyNode, vis, canPay, nodeCost: n => n.cost, view: () => ({ W, H, CW, CH, VS, OX, OY, TOPB, ROCK_N, FREE, HUD }), toWorld, cheat: (m, n) => { MATS.forEach(x => S.bars[x.id] = (S.bars[x.id] || 0) + (n || 1000)); S.tp += m || 0; refresh(); renderPanel(); } };
</script>
